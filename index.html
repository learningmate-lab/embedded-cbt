Ip_GetClockFrequency(CM7_CORE_CLK)` → 기준 설정 기대값 **120000000 Hz**(120 MHz).\n- Config Tools Clocks 화면의 **LPUART6_CLK**는 체크(enabled)·30 MHz로 보여요. LPUART6는 이 클럭을 기준으로 115200 bps 박자를 만들기 때문에, **꺼져 있으면 UART 출력이 나오지 않아요.**\n\n```c\nprintf(\"CM7 core clock = %lu Hz\\r\\n\",\n       (unsigned long)Clock_Ip_GetClockFrequency(CM7_CORE_CLK));\n/* 출력: CM7 core clock = 120000000 Hz */\n```\n\n### 부팅 흐름 — 전원부터 main()까지\n\n```svg 부팅 흐름 — 전원부터 main()까지 릴레이 (시험: 순서 배열)\n<svg viewBox=\"0 0 680 168\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"6\" y=\"14\" width=\"100\" height=\"62\" rx=\"10\" class=\"box\"/>\n  <text x=\"56\" y=\"40\" text-anchor=\"middle\" class=\"t-b\" font-size=\"13\">Power-On<\/text>\n  <text x=\"56\" y=\"60\" text-anchor=\"middle\" class=\"t-b\" font-size=\"13\">Reset<\/text>\n  <rect x=\"118\" y=\"14\" width=\"100\" height=\"62\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"168\" y=\"40\" text-anchor=\"middle\" class=\"t-b\">BAF<\/text>\n  <text x=\"168\" y=\"60\" text-anchor=\"middle\" class=\"t-s\">NXP 내장 코드<\/text>\n  <rect x=\"230\" y=\"14\" width=\"100\" height=\"62\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"280\" y=\"40\" text-anchor=\"middle\" class=\"t-b\">IVT 확인<\/text>\n  <text x=\"280\" y=\"60\" text-anchor=\"middle\" class=\"t-s\">진입 정보<\/text>\n  <rect x=\"342\" y=\"14\" width=\"100\" height=\"62\" rx=\"10\" class=\"box-a\"/>\n  <text x=\"392\" y=\"40\" text-anchor=\"middle\" class=\"t-b\" font-size=\"13\">사용자<\/text>\n  <text x=\"392\" y=\"60\" text-anchor=\"middle\" class=\"t-b\" font-size=\"13\">벡터 테이블<\/text>\n  <rect x=\"454\" y=\"14\" width=\"100\" height=\"62\" rx=\"10\" class=\"box-a\"/>\n  <text x=\"504\" y=\"40\" text-anchor=\"middle\" class=\"t-b\">startup<\/text>\n  <text x=\"504\" y=\"60\" text-anchor=\"middle\" class=\"t-s\">C 환경 준비<\/text>\n  <rect x=\"566\" y=\"14\" width=\"108\" height=\"62\" rx=\"10\" class=\"box-c\"/>\n  <text x=\"620\" y=\"40\" text-anchor=\"middle\" class=\"t-b\">main()<\/text>\n  <text x=\"620\" y=\"60\" text-anchor=\"middle\" class=\"t-s\">내 코드<\/text>\n  <line x1=\"107\" y1=\"45\" x2=\"116\" y2=\"45\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"219\" y1=\"45\" x2=\"228\" y2=\"45\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"331\" y1=\"45\" x2=\"340\" y2=\"45\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"443\" y1=\"45\" x2=\"452\" y2=\"45\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"555\" y1=\"45\" x2=\"564\" y2=\"45\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <path d=\"M120,86 L120,94 L328,94 L328,86\" class=\"ln-b\"/>\n  <text x=\"224\" y=\"114\" text-anchor=\"middle\" class=\"t-a\">칩(NXP)이 하는 부팅 단계<\/text>\n  <path d=\"M344,86 L344,94 L672,94 L672,86\" class=\"ln-a\"/>\n  <text x=\"508\" y=\"114\" text-anchor=\"middle\" class=\"t-a\">사용자 코드 = 2절의 리셋 흐름<\/text>\n  <text x=\"340\" y=\"150\" text-anchor=\"middle\" class=\"t-s\">BAF = Boot Assist Flash · IVT = Image Vector Table (부팅 이미지와 사용자 코드 진입 정보)<\/text>\n<\/svg>\n```\n\n1. **Power-On Reset** — 칩이 리셋 상태에서 출발해요.\n2. **BAF**(Boot Assist Flash) — 칩에 들어 있는 **NXP 내장 부팅 코드**예요. 사용자가 작성하는 코드가 아니에요.\n3. **IVT 확인** — **IVT**(Image Vector Table)에서 부팅 이미지와 **사용자 코드 진입 정보**를 찾아요.\n4. **사용자 벡터 테이블** — 0번으로 SP, 1번으로 Reset handler를 정해요(2절).\n5. **startup → main()** — startup 코드가 C 실행 환경을 준비한 뒤 `main()`으로 들어가요.\n\n| 이름 | 누가 보나 | 담긴 것 |\n|---|---|---|\n| IVT | 부팅 단계(BAF) | 부팅 이미지·사용자 코드 진입 정보 → \"무엇으로 부팅할지\" |\n| 벡터 테이블 | Cortex-M7 코어 | 초기 SP, 예외별 핸들러 주소 → \"사건이 나면 어디로 갈지\" |", "tip": "순서 **POR → BAF → IVT → 사용자 벡터 테이블 → startup → main()** 를 외워 두세요. FXOSC = **외부 크리스털**(내부 RC ✗), PLL = **체배**, BAF = **NXP 내장 코드**, IVT ≠ 벡터 테이블."}, {"id": "c1-toolchain", "title": "교차 개발과 S32DS 툴체인·RTD", "sec": ["6. 교차 개발과 S32 Design Studio 툴체인"], "tags": ["교차 개발", "S32 Config Tools", "S32DS IDE", "GCC", "ELF", "OpenSDA/PEmicro", "RTD", "AUTOSAR"], "body": "**교차 개발**(cross development) = \"실행되는 기계가 아닌, **다른 기계**에서 개발한다.\" **호스트 PC**에서 작성·빌드하고, 결과물을 **타깃 보드**에서 실행해요. MCU에는 키보드·화면·컴파일러가 없으니 PC가 대신 만들어 보드에 넣어 줘요.\n\n| 구분 | PC 프로그램 | MCU 프로그램 |\n|---|---|---|\n| 빌드 | 같은 PC | 호스트 PC |\n| 실행 | 같은 PC, **OS 위에서 바로** | 보드 Flash에서 |\n| 실행 전 | 바로 실행 | **ELF를 보드 Flash에 다운로드** |\n\n임베디드 개발 주기에는 일반 앱에 없는 단계(플래시 삭제·타깃 업로드, 디버깅 세션, 원격 디버거 접속, 신호 분석)가 더 붙어요. 그래서 실습은 늘 **Build → Debug(플래시 기록) → Resume** 순서예요.\n\n### 흐름: 소스 코드 → 컴파일/링크 → **ELF** → **OpenSDA/PEmicro** → MCU Flash → 실행\n\n| 도구 | 하는 일 | 결과물 |\n|---|---|---|\n| **S32 Config Tools** | 핀·클럭·주변장치 GUI 설정 | **초기화 코드 생성** (보드에 직접 쓰지 않음) |\n| **RTD** | AUTOSAR 기반 주변장치 드라이버 | `Lpuart_Uart_Ip_*` 같은 API |\n| **S32DS IDE** | 코드 편집·빌드·디버그 | Eclipse 기반 작업 환경 |\n| **Design Studio GCC** | 컴파일·링크 | **ELF** 실행 파일 |\n| **OpenSDA / PEmicro** | 플래시 기록·디버깅 | 보드 Flash 속 프로그램 |\n\n가장 헷갈리는 쌍은 **GCC vs PEmicro**예요. ELF를 **만드는** 건 GCC, 그 ELF를 보드에 **넣고 디버깅**하는 건 OpenSDA/PEmicro예요.\n\n### RTD 함수 이름 읽기\n**RTD**(Real-Time Drivers) = S32K3용 **AUTOSAR 기반** 주변장치 드라이버예요. **AUTOSAR**(AUTomotive Open System ARchitecture)는 차량 소프트웨어 표준 아키텍처이고, RTD 함수 이름은 **`모듈_기능`** 규칙을 따라요.\n\n```svg RTD 함수 이름 읽는 법 — 이름만 봐도 모듈·계층·기능이 보여요\n<svg viewBox=\"0 0 680 150\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"70\" y=\"18\" width=\"232\" height=\"50\" rx=\"8\" class=\"box-a\"/>\n  <text x=\"186\" y=\"50\" text-anchor=\"middle\" class=\"t-b\" font-size=\"18\">Lpuart_Uart<\/text>\n  <rect x=\"302\" y=\"18\" width=\"70\" height=\"50\" rx=\"8\" class=\"box-b\"/>\n  <text x=\"337\" y=\"50\" text-anchor=\"middle\" class=\"t-b\" font-size=\"18\">_Ip<\/text>\n  <rect x=\"372\" y=\"18\" width=\"238\" height=\"50\" rx=\"8\" class=\"box-d\"/>\n  <text x=\"491\" y=\"50\" text-anchor=\"middle\" class=\"t-b\" font-size=\"18\">_SyncSend()<\/text>\n  <text x=\"186\" y=\"94\" text-anchor=\"middle\" class=\"t-a\">모듈<\/text>\n  <text x=\"186\" y=\"112\" text-anchor=\"middle\" class=\"t-s\">LPUART의 UART 드라이버<\/text>\n  <text x=\"337\" y=\"94\" text-anchor=\"middle\" class=\"t-a\">계층<\/text>\n  <text x=\"337\" y=\"112\" text-anchor=\"middle\" class=\"t-s\">IP Layer<\/text>\n  <text x=\"491\" y=\"94\" text-anchor=\"middle\" class=\"t-a\">기능<\/text>\n  <text x=\"491\" y=\"112\" text-anchor=\"middle\" class=\"t-s\">동기(blocking) 송신<\/text>\n  <text x=\"340\" y=\"140\" text-anchor=\"middle\" class=\"t-s\">목적: 모듈·기능·드라이버 계층을 구분해 설정과 코드를 관리 (분해는 이해용 풀이)<\/text>\n<\/svg>\n```\n\n- `Clock_Ip_Init` → Clock 모듈, IP 계층, 초기화\n- `Siul2_Port_Ip_Init` → SIUL2의 Port(핀) 드라이버, IP 계층, 초기화\n- `Lpuart_Uart_Ip_SyncSend` → LPUART의 UART 드라이버, IP 계층, 동기 송신\n\n이름에 `_Ip_`가 들어가면 IP 계층이에요. 3장에서는 같은 일을 하는 **MCAL 계층** 이름(`Port_Init`, `Dio_WriteChannel`)과 비교해요.", "tip": "\"PEmicro가 ELF를 빌드\"(GCC), \"Config Tools가 보드 플래시 기록\"(OpenSDA/PEmicro), \"RTD = 통합 개발 환경\"(드라이버)은 모두 틀린 짝이에요. RTD = **Real-Time Drivers**, 명명 규칙 = **모듈_기능**."}, {"id": "c1-uart", "title": "UART 프레임(8N1)과 전송 시간 계산", "sec": ["7. UART 기초와 프레임 구조"], "tags": ["UART", "비동기", "baud rate", "8N1", "Start bit", "Stop bit", "LSB first"], "body": "**UART**(Universal Asynchronous Receiver/Transmitter) = 가장 기본적인 **비동기 직렬 통신**이에요. **별도의 클럭 선 없이 TX/RX**로 주고받기 때문에, 양쪽이 **같은 보율**(baud rate)을 미리 약속하고 각자 그 간격으로 비트를 잘라 읽어요. 배선은 내 TX ↔ 상대 RX **교차** + **GND 공통**이에요.\n\n### 프레임: Idle(HIGH) → Start(LOW) → D0~D7 → (Parity 선택) → Stop(HIGH)\n\n```wave 'H'(16진 48 = 2진 0100 1000) 한 글자가 TX 선으로 나가는 모양 (8N1, LSB 먼저)\n@mark 1 Start\n@mark 10 Stop\nTX: 1 0 0 0 0 1 0 0 1 0 1 1\n비트: x = = = = = = = = = = x | 시작,0,0,0,1,0,0,1,0,정지\n@span 2-9 D0 → D7 (LSB부터: 0,0,0,1,0,0,1,0)\n```\n\n1. 보낼 게 없을 때 라인은 **Idle = HIGH(1)**.\n2. **Start bit**가 라인을 **LOW(0)**로 떨어뜨려요. 수신 측은 이 **1→0 하강**을 보고 프레임 시작을 알아채요.\n3. 데이터 8비트를 **LSB(D0)부터** 보내요. `'H'` = `0x48` = `0100 1000` → 선 위 순서 `0,0,0,1,0,0,1,0`.\n4. **Stop bit**가 라인을 다시 **HIGH**로 되돌려요.\n\n파형에서 값을 읽을 땐 **시간 순서로 읽은 8비트를 뒤집어야** 원래 값이 돼요. Parity는 D7과 Stop 사이에 넣는 **단순 오류 검출용 선택 비트**이고, 8N1에는 없어요.\n\n### 115200 bps, 8N1\n- **115200 bps** = 초당 115200비트, **8** = 데이터 8비트, **N** = parity 없음, **1** = stop bit 1개\n- 한 문자는 8비트가 아니라 **Start 1 + Data 8 + Stop 1 = 10비트**예요.\n\n| 구하는 값 | 식 | 결과 |\n|---|---|---|\n| 1비트 시간 | 1 ÷ 115200 | ≈ 8.68 µs |\n| 1문자 (10비트) | 10 × 8.68 µs | ≈ **86.8 µs** |\n| 초당 문자 수 | 115200 ÷ 10 | 11,520개 |\n| 35바이트 한 줄 | 35 × 86.8 µs | ≈ 3.04 ms |\n\n35바이트는 1장 출력 `\"Hello S32K3, 20261234 HongGildong\\r\\n\"`(보이는 글자 33개 + `\\r\\n` 2바이트)이에요. `115200 ÷ 8`로 계산한 1문자 69.4 µs는 **Start·Stop을 빠뜨린 오답**이에요. 9600 bps라면 1비트 ≈ 104.2 µs, 1문자 ≈ 1.04 ms예요.\n\n**baud가 다르면** 수신 측 **샘플링 시점이 어긋나** 엉뚱한 비트를 읽어서 **글자가 깨져요**(프레임 해석 오류).", "tip": "1문자 = **10비트**(86.8 µs @115200)로 계산하세요. 레벨은 Idle·Stop = **HIGH**, Start = **LOW**, 데이터는 **LSB 먼저**예요. \"Parity 필수\", \"클럭 선으로 동기화\"는 오답이에요."}, {"id": "c1-vcom", "title": "OpenSDA VCOM과 printf 리다이렉션", "sec": ["8. OpenSDA VCOM과 printf 리다이렉션"], "tags": ["OpenSDA", "VCOM", "LPUART6", "PTA16", "PTA15", "_write", "retargeting"], "body": "보드의 **OpenSDA** 디버거는 ① 프로그램을 **플래시에 기록하고 디버깅**하는 일과 ② **가상 COM 포트(VCOM)** 역할을 함께 해요 → **USB 케이블 하나로 디버깅 + 시리얼 통신**. VCOM은 MCU의 UART 신호를 USB로 바꿔 PC에서 COM 포트처럼 보이게 해요(장치 관리자: **OpenSDA - CDC Serial Port (COMx)**).\n\n```svg 왜 꼭 LPUART6인가 — VCOM은 PTA15/PTA16에만 배선돼 있어요\n<svg viewBox=\"0 0 680 250\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"6\" y=\"6\" width=\"430\" height=\"238\" rx=\"14\" class=\"box-0 dash\"/>\n  <text x=\"20\" y=\"26\" class=\"t-s\">S32K312EVB-Q172 보드<\/text>\n  <rect x=\"20\" y=\"38\" width=\"200\" height=\"196\" rx=\"12\" class=\"box-a\"/>\n  <text x=\"120\" y=\"60\" text-anchor=\"middle\" class=\"t-b\">S32K312<\/text>\n  <rect x=\"34\" y=\"74\" width=\"172\" height=\"66\" rx=\"8\" class=\"box-c\"/>\n  <text x=\"120\" y=\"100\" text-anchor=\"middle\" class=\"t-b\">LPUART6<\/text>\n  <text x=\"120\" y=\"122\" text-anchor=\"middle\" class=\"t-s\">TX=PTA16 · RX=PTA15<\/text>\n  <rect x=\"34\" y=\"154\" width=\"172\" height=\"66\" rx=\"8\" class=\"box dash\"/>\n  <text x=\"120\" y=\"180\" text-anchor=\"middle\" class=\"t-b\">LPUART0 ✕<\/text>\n  <text x=\"120\" y=\"202\" text-anchor=\"middle\" class=\"t-s\">PTA8 / PTA9<\/text>\n  <rect x=\"296\" y=\"60\" width=\"128\" height=\"100\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"360\" y=\"94\" text-anchor=\"middle\" class=\"t-b\">OpenSDA<\/text>\n  <text x=\"360\" y=\"114\" text-anchor=\"middle\" class=\"t-s\">디버거 + VCOM<\/text>\n  <text x=\"360\" y=\"132\" text-anchor=\"middle\" class=\"t-s\">(가상 COM)<\/text>\n  <line x1=\"208\" y1=\"98\" x2=\"292\" y2=\"98\" class=\"ln-c\" marker-end=\"url(#ah-c)\"/>\n  <text x=\"250\" y=\"90\" text-anchor=\"middle\" class=\"t-a\">PTA16 TX<\/text>\n  <line x1=\"292\" y1=\"124\" x2=\"208\" y2=\"124\" class=\"ln-c dash\" marker-end=\"url(#ah-c)\"/>\n  <text x=\"250\" y=\"142\" text-anchor=\"middle\" class=\"t-s\">PTA15 RX<\/text>\n  <line x1=\"208\" y1=\"186\" x2=\"262\" y2=\"186\" class=\"ln-e dash\"/>\n  <text x=\"300\" y=\"186\" class=\"t-a\">배선 없음<\/text>\n  <text x=\"300\" y=\"206\" class=\"t-s\">→ 터미널 무출력<\/text>\n  <line x1=\"426\" y1=\"110\" x2=\"496\" y2=\"110\" class=\"ln-d\" marker-end=\"url(#ah-d)\"/>\n  <text x=\"461\" y=\"102\" text-anchor=\"middle\" class=\"t-a\">USB<\/text>\n  <rect x=\"500\" y=\"50\" width=\"174\" height=\"120\" rx=\"12\" class=\"box-d\"/>\n  <text x=\"587\" y=\"78\" text-anchor=\"middle\" class=\"t-b\">PC<\/text>\n  <text x=\"587\" y=\"100\" text-anchor=\"middle\" class=\"t-s\">COMx (OpenSDA CDC)<\/text>\n  <text x=\"587\" y=\"120\" text-anchor=\"middle\" class=\"t-s\">PuTTY · Tera Term<\/text>\n  <text x=\"587\" y=\"140\" text-anchor=\"middle\" class=\"t-s\">115200 8N1<\/text>\n  <text x=\"587\" y=\"204\" text-anchor=\"middle\" class=\"t-a\">USB 케이블 하나로<\/text>\n  <text x=\"587\" y=\"222\" text-anchor=\"middle\" class=\"t-a\">디버깅 + 시리얼<\/text>\n<\/svg>\n```\n\n이 연결은 **보드 위 고정 배선**이에요. VCOM 선은 S32K312의 **PTA16(LPUART6_TX)**과 **PTA15(LPUART6_RX)**에 연결돼 있어요.\n\n| 설정 | VCOM 연결 | 터미널 |\n|---|---|---|\n| LPUART6, PTA16/PTA15 | 연결됨 | 글자 표시 ✓ |\n| LPUART0, PTA8/PTA9 | 연결 안 됨 | **아무것도 안 보임** ✗ |\n\n코드가 맞아도 신호가 **선이 없는 핀**으로 나가면 PC는 받을 수 없어요(1절의 하드웨어 의존성). 이때 증상은 \"글자 깨짐\"이 아니라 **무출력**이에요. (교재: PTA8/PTA9는 실제로 LPUART2 핀)\n\n### printf 한 줄이 PC 화면까지 가는 길\n\n| 단계 | 하는 일 | 위치 |\n|---|---|---|\n| `printf()` | 문자열 완성 → 저수준 출력 함수 호출 | C 라이브러리 |\n| `_write()` | **직접 구현** — 바이트를 LPUART로 넘김 | main.c |\n| `Lpuart_Uart_Ip_SyncSend()` | 동기 송신 (끝나거나 timeout까지 대기) | RTD IP |\n| LPUART6 TX (**PTA16**) | 바이트를 UART 프레임으로 송신 | S32K312 |\n| PC 시리얼 터미널 | OpenSDA VCOM → USB → 화면 표시 | 보드 밖 |\n\n**printf 리다이렉션(retargeting)**: PC에서는 OS가 `_write()`를 콘솔·파일로 이어 주지만 **MCU에는 기본 화면이 없어요.** 그래서 `_write()`를 직접 구현해 출력 바이트를 LPUART로 보내요. **printf 함수 자체는 고치지 않아요** — 출력 \"콘센트\"를 화면 대신 LPUART에 바꿔 꽂는 것이에요.\n\n```c\nint _write(int file, char *ptr, int len)\n{\n    /* ptr의 len 바이트를 LPUART로 송신 */\n}\n```\n\n`ptr`은 보낼 바이트들의 시작 주소, `len`은 바이트 수예요. 줄별 해석은 11절에 있어요.", "tip": "경로 빈칸: printf → **_write()** → Lpuart_Uart_Ip_SyncSend → **LPUART6** TX(**PTA16**) → OpenSDA VCOM → USB → PC. PTA15를 TX로 바꿔 넣은 보기, LPUART0 설정의 증상을 \"글자 깨짐\"이라 한 보기는 틀려요."}, {"id": "c1-setup", "title": "실습 사양·프로젝트 구조와 Config Tools 설정", "sec": ["9. 실습 준비: 사양·버전·프로젝트 구조", "10. 프로젝트 생성과 Config Tools 설정 (IP Layer)"], "tags": ["chap01_hello_uart", "IP Layer", ".mex", "Update Code", "LPUART6_CLK", "Lpuart_Uart", "NewLib"], "body": "목표: OpenSDA VCOM에 연결된 **LPUART6**를 설정하고 `printf()` 출력이 PC 터미널에 뜨는지 확인해요. 구현은 **IP Layer 방식**(RTD `*_Ip_*` 함수를 직접 호출)이고, MCAL 방식은 3주차에 비교해요.\n\n| 항목 | 값 |\n|---|---|\n| 프로젝트 | `chap01_hello_uart` |\n| 디바이스 / 보드 | S32K312 / S32K312_172HDQFP (172핀 HDQFP), S32K312EVB-Q172 |\n| UART 채널 · 핀 | **LPUART6**, PTA16 = TX, PTA15 = RX |\n| 통신 설정 | 115200 bps, 8N1, flow none |\n| 버전 기준 | S32DS **3.6.7**, S32K3 RTD **7.0.1**, GCC **10.2**, PEmicro **12.7.0**, FreeRTOS 7.0.0(12장 이후) |\n\n설치 버전이 다르면 **강사에게 알리고 그대로 진행하지 않아요.**\n\n### 프로젝트 구조 — 손대는 곳은 `src/main.c` 하나\n\n| 폴더·파일 | 누가 만드나 | 사람이 직접 고치면? |\n|---|---|---|\n| `chap01_hello_uart.mex` | Config Tools 설정 | GUI에서만 수정 |\n| `generate/`, `RTD/`, `board/` | Update Code 때 자동 생성 | 다음 생성 때 **덮어써짐** |\n| `Project_Settings/` | 프로젝트 생성 때 (launch·링커 스크립트·startup·벡터 테이블) | 도구가 다시 생성 |\n| `src/main.c` | 학생 | ✓ 유일한 수정 대상 |\n\n설정은 `.mex`를 **Config Tools에서** 바꾸고 **Update Code**로 재생성해야 **설정과 생성 코드의 일관성**이 유지돼요.\n\n### 새 프로젝트 마법사 (File → New → S32DS Application Project)\n- Device **S32K312**, Core **Cortex-M7**\n- Toolchain **NXP GCC 10.2 for Arm 32-bit Bare-Metal** (OS 없이 도는 Arm 32비트용)\n- Debugger **PEmicro**, Library **NewLib**(`printf` 제공), I/O Support Debugger Console\n- SDKs **PlatformSDK_S32K3_S32K312_M7 (7.0.1)** → RTD 드라이버를 넣어요. 체크를 빠뜨리면 `Clock_Ip`·`Siul2_Port_Ip`·`Lpuart_Uart_Ip`가 없어 Config Tools·빌드에서 막혀요.\n\n### Config Tools (`chap01_hello_uart.mex`)\n1. **Clocks**: 기본 clock 사용, **LPUART6_CLK enabled**(주파수 0 Hz 아님, 화면 30 MHz)\n2. **Pins**: **PTA16 = LPUART6_TX(Output)**, **PTA15 = LPUART6_RX(Input)** — RX는 RX input mux까지 생성\n3. **Peripherals**: Components 창 **Drivers** 그룹에서 **`Lpuart_Uart`** 추가(MCAL 그룹 ✗) → Uart hardware channel **LPUART_6**, Desire Baudrate **LPUART_UART_BAUDRATE_115200**. Parity disabled · One stop bit · 8 bits per char = **8-N-1**, DMA·flow control 없음\n4. **Update Code** → Console에 error 없는지 확인\n\n| 화면 · 설정 | 생성 심볼 (예) | main.c 호출 |\n|---|---|---|\n| Clocks · LPUART6_CLK on | `Clock_Ip_aClockConfig[0]` | `Clock_Ip_Init` |\n| Pins · Functional group = BOARD_InitPeripherals | `NUM_OF_CONFIGURED_PINS_…`, `g_pin_mux_InitConfigArr_…` | `Siul2_Port_Ip_Init` |\n| Drivers · LPUART_6, 115200 | `Lpuart_Uart_Ip_xHwConfigPB_6` | `Lpuart_Uart_Ip_Init` |\n\n**Instance 번호 ≠ 생성 객체 이름**이에요. LPUART6의 instance는 `6`이지만 객체 이름은 **functional group과 configuration variant**에 따라 달라져요. 빌드가 안 되면 이름을 추측하지 말고 **`generate/include` 헤더**에서 실제 이름을 확인해요.", "tip": "학생이 고치는 파일은 **`src/main.c` 하나**, 설정 변경은 **Config Tools + Update Code**예요. Peripherals는 **Drivers** 그룹의 `Lpuart_Uart`, 생성 심볼 이름은 `generate/include`에서 확인해요."}, {"id": "c1-mainc", "title": "main.c 코드 분석 (IP Layer)", "sec": ["11. main.c 코드 분석 (IP Layer)"], "tags": ["Clock_Ip_Init", "Siul2_Port_Ip_Init", "Lpuart_Uart_Ip_Init", "Lpuart_Uart_Ip_SyncSend", "_write", "UART_CHANNEL 6U"], "body": "`main()`은 **박자(클럭) → 길(핀) → 장치(LPUART6) → 사용(printf) → 무한 루프** 순서로 준비해요. 순서를 어기면 **출력이 없거나 HardFault**가 나요.\n\n```c\n#define STUDENT_ID      \"20261234\"\n#define STUDENT_NAME    \"HongGildong\"\n#define UART_CHANNEL    6U          /* 하드웨어 instance 번호 = LPUART6 */\n#define UART_TIMEOUT_US 1000000U    /* 송신 timeout 1초 */\n\nint _write(int file, char *ptr, int len)\n{\n    (void)file;                       /* 안 쓰는 매개변수 경고 제거 */\n    if ((ptr == NULL) || (len <= 0))\n    {\n        return 0;                     /* 보낼 것이 없으면 0 */\n    }\n    if (LPUART_UART_IP_STATUS_SUCCESS !=\n        Lpuart_Uart_Ip_SyncSend(UART_CHANNEL, (const uint8 *)ptr,\n                                (uint32)len, UART_TIMEOUT_US))\n    {\n        return -1;                    /* 실패 */\n    }\n    return len;                       /* 성공: 보낸 바이트 수 */\n}\n\nint main(void)\n{\n    Clock_Ip_Init(&Clock_Ip_aClockConfig[0]);          /* ① 클럭 */\n#if defined(FEATURE_CLOCK_IP_HAS_SPLL_CLK)\n    while (CLOCK_IP_PLL_LOCKED != Clock_Ip_GetPllStatus())\n    {\n    }                                                  /* PLL lock 대기 */\n    Clock_Ip_DistributePll();                          /* PLL 클럭 분배 */\n#endif\n    Siul2_Port_Ip_Init(                                /* ② 핀 */\n        NUM_OF_CONFIGURED_PINS_PortContainer_0_BOARD_InitPeripherals,\n        g_pin_mux_InitConfigArr_PortContainer_0_BOARD_InitPeripherals);\n    Lpuart_Uart_Ip_Init(UART_CHANNEL,\n                        &Lpuart_Uart_Ip_xHwConfigPB_6); /* ③ LPUART6 */\n    printf(\"Hello S32K3, %s %s\\r\\n\",\n           STUDENT_ID, STUDENT_NAME);                   /* ④ 출력 */\n    while (1)                                          /* ⑤ 무한 루프 */\n    {\n    }\n}\n```\n\n1. `Clock_Ip_Init` — 생성된 클럭 설정 0번 적용, PLL이 있으면 **lock될 때까지 기다린 뒤** `Clock_Ip_DistributePll()`.\n2. `Siul2_Port_Ip_Init(개수, 배열)` — PTA16·PTA15를 LPUART6 기능으로 **핀 mux**. 없으면 신호가 핀 밖으로 못 나가요.\n3. `Lpuart_Uart_Ip_Init(6U, …)` — instance 6을 115200·8N1로 초기화.\n4. `printf` → 터미널에 `Hello S32K3, 20261234 HongGildong` **한 줄**. `\\r\\n` = 줄 바꿈 + 커서를 줄 맨 앞으로.\n5. `while (1)` — OS가 없는 MCU는 `main()`이 끝나면 돌아갈 곳이 없어요.\n\n### `_write()` 반환값과 SyncSend\n\n| 상황 | 반환값 |\n|---|---|\n| `ptr`이 NULL 또는 `len ≤ 0` | `0` |\n| SyncSend 실패 | `-1` |\n| 전송 성공 | `len` (보낸 바이트 수) |\n\n`Lpuart_Uart_Ip_SyncSend()`는 **동기(blocking)** 송신이라 다 보내거나 timeout(`1000000U` µs = **1초**)까지 기다려요. 콜백·DMA 없이 간단한 대신 보내는 동안 **CPU가 기다려요**. `CM7 core clock = 120000000 Hz` 줄은 `Clock_Ip_GetClockFrequency(CM7_CORE_CLK)`를 찍는 printf를 **직접 추가해야** 나와요.\n\n### 참고: IP Layer vs MCAL Layer (교재 1.14, 강의는 3주차)\n\n| 구분 | IP Layer (1장 실습) | MCAL Layer |\n|---|---|---|\n| 헤더 | `Clock_Ip.h`, `Siul2_Port_Ip.h`, `Lpuart_Uart_Ip.h` | `Mcu.h`, `Port.h`, `CDD_Uart.h` |\n| 채널 값 | `UART_CHANNEL 6U` = **하드웨어 instance** | `MCAL_UART_CHANNEL 0U` = **논리 채널**(UartChannel 0 → LPUART6) |\n| 초기화 | `Clock_Ip_Init`, `Siul2_Port_Ip_Init`, `Lpuart_Uart_Ip_Init` | `Mcu_Init(NULL_PTR)`, `Mcu_InitClock(0U)`, `Mcu_DistributePllClock()`, `Mcu_SetMode(0U)`, `Port_Init(NULL_PTR)`, `Uart_Init(NULL_PTR)` |\n| 송신·성공 판정 | `Lpuart_Uart_Ip_SyncSend` → `LPUART_UART_IP_STATUS_SUCCESS` | `Uart_SyncSend` → `Std_ReturnType` `E_OK` |\n\nMCAL의 `0`은 LPUART0이 아니라 Config Tools의 **UartChannel 0번**이고, 그 채널이 LPUART6에 연결돼 있어 똑같이 PTA16으로 나가요. 두 버전의 main.c는 `main()`이 겹치므로 **동시에 빌드하지 않고** `src/main.c`를 통째로 교체해요.", "tip": "순서 **클럭 → 핀 → LPUART6 → printf → 무한 루프**, `_write` 반환 **0 / -1 / len**, timeout `1000000U` = **1초**예요. `6U`는 하드웨어 instance, MCAL `0U`는 논리 채널(\"0U = LPUART0\" ✗)."}, {"id": "c1-debug", "title": "빌드·플래시·실행과 문제 해결", "sec": ["12. 빌드·플래시·실행, 확인 기준과 문제 해결"], "tags": ["Build Project", "Debug_FLASH_PNE", "Resume", "COM 포트", "115200 8N1", "글자 깨짐", "무출력"], "body": "### Build → Debug → Resume\n1. **Build Project** — GCC가 컴파일·링크해 **ELF**를 만들어요. Console에 **0 errors**.\n2. **OpenSDA USB 연결 + COM 포트 확인** — 장치 관리자 → 포트(COM & LPT)에 **OpenSDA - CDC Serial Port (COM3)**처럼 보여요. 번호는 PC마다 달라요.\n3. **Debug** — `chap01_hello_uart_Debug_FLASH_PNE` 구성을 실행하면 PEmicro가 ELF를 **보드 Flash에 기록**해요. **FLASH** = Flash에 올려 실행, **PNE** = PEmicro(P&E) 디버거.\n4. **Resume** — 디버거는 `main()`에서 **멈춘 상태**로 시작해요. **Run → Resume**을 눌러야 코드가 계속 실행되고 printf가 나가요. Resume을 안 누르면 터미널은 비어 있어요.\n\n### 시리얼 터미널 (Tera Term / PuTTY)\n\n| 항목 | 값 |\n|---|---|\n| Port | 장치 관리자의 OpenSDA COM 포트 (예: COM3) |\n| Speed | **115200** (보드와 같게) |\n| Data / Parity / Stop | **8 / none / 1** |\n| Flow control | **none** |\n\n성공하면 `Hello S32K3, 20261234 HongGildong`이 한 줄 찍혀요. 본인 학번·이름으로 바꾸려면 `STUDENT_ID`·`STUDENT_NAME`을 고치고 **다시 빌드·플래시**해야 해요. (슬라이드 p.63 캡처는 `HongGilDong`처럼 보이지만, 출력은 **코드의 문자열 그대로** `HongGildong`이에요.)\n\n### 동작 확인 기준 (앞 단계가 실패하면 뒤는 볼 필요 없음)\n\n| 단계 | 기준 |\n|---|---|\n| 빌드 | Console에 0 errors, **ELF 파일 생성** |\n| 플래시 | PEmicro가 보드를 인식하고 다운로드 완료 |\n| 실행 | **HardFault 없이** Run → Resume 후 계속 동작 |\n| UART | IP 예제는 학번·이름 출력 |\n\n### 증상으로 고장 구간 좁히기\n\n| 증상 | 의심 구간·원인 | 조치 |\n|---|---|---|\n| **글자가 깨짐** | 약속(**baud/frame**)이 다름 | 터미널 115200/8N1, flow none으로 재설정 |\n| **아무 출력도 없음** | 경로가 끊김 — **LPUART 채널·핀 설정 오류** | LPUART6, PTA16=TX, PTA15=RX, 6U 확인 |\n| COM 포트가 안 보임 | **충전 전용 케이블**, 드라이버 문제 | 데이터 케이블, CDC 포트 확인 |\n| Debug 연결 실패 | OpenSDA/PEmicro 설정 또는 보드 연결 | Interface·Device 확인, 전원 재연결 |\n| `xHwConfigPB` 심볼 미정의 | 설정 코드 미생성 또는 심볼명 차이 | .mex 확인 후 재생성, 생성 헤더 확인 |\n| `CM7_CORE_CLK` 오류 | clock enum 이름 차이 | `Clock_Ip_Types.h`에서 실제 이름 확인 |\n\n**글자가 깨진다**는 건 신호가 PC까지는 왔다는 뜻이고, **아무것도 없다**면 신호가 VCOM까지 오지 못한 거예요. 이 두 증상의 원인을 바꿔 낸 보기가 가장 흔해요.\n\n다음 차시(2장)에는 포인터로 SIUL2 레지스터 **MSCR·GPDO**를 직접 제어해 LED를 점멸해요. (슬라이드 p.67의 \"SIUL2/PCR\"은 S32K1 계열 이름이 남은 것이에요.)", "tip": "깨짐 = **baud/frame 불일치**, 무출력 = **채널·핀 설정 오류**예요. Debug 후 main()에서 멈추면 **Run → Resume**, COM 포트가 안 보이면 **충전 전용 케이블**을 의심해요."}]}, {"ch": 2, "title": "GPIO — 하드웨어 주소 직접 접근하기", "summary": "드라이버 없이 C 포인터로 SIUL2 레지스터(MSCR29·GPDO29) 주소에 직접 값을 써서 D13 빨간 LED를 점멸시켜요. Memory-mapped I/O·volatile·비트 마스킹, MSCR의 OBE·SSS, GPDO 역순 주소 계산, SDK 헤더 IP_SIUL2와의 비교가 핵심이에요.", "sections": [{"id": "c2-mmio", "title": "Memory-mapped I/O — 레지스터도 그냥 주소예요", "sec": ["1. Memory-Mapped I/O — 같은 문장, 다른 결과"], "tags": ["Memory-mapped I/O", "load/store", "주소 공간", "포인터 역참조", "0x4029131E"], "body": "**Memory-mapped I/O**는 주변장치(GPIO·UART 같은 하드웨어)를 조종하는 **레지스터에 메모리처럼 주소를 붙여 두는 방식**이에요. RAM·Flash·주변장치 레지스터가 **하나의 주소 공간**에 있고, CPU는 변수를 다룰 때와 **같은 load/store 명령**으로 하드웨어도 다뤄요. 그래서 C에서는 **포인터 하나**로 레지스터를 읽고 써요. 하드웨어 전용 명령을 따로 배울 필요가 없는 게 장점이에요.\n\n```svg 같은 *ptr = 1U; 도 주소에 따라 결과가 달라요\n<svg viewBox=\"0 0 680 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"6\" y=\"70\" width=\"112\" height=\"60\" rx=\"10\" class=\"box\"/>\n  <text x=\"62\" y=\"96\" text-anchor=\"middle\" class=\"t-b\">CPU<\/text>\n  <text x=\"62\" y=\"116\" text-anchor=\"middle\" class=\"t-s\">load / store<\/text>\n  <line x1=\"120\" y1=\"100\" x2=\"140\" y2=\"100\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <rect x=\"144\" y=\"80\" width=\"122\" height=\"40\" rx=\"20\" class=\"box-d\"/>\n  <text x=\"205\" y=\"105\" text-anchor=\"middle\" class=\"t-b\">*ptr = 1U;<\/text>\n  <line x1=\"268\" y1=\"96\" x2=\"300\" y2=\"40\" class=\"ln-c\" marker-end=\"url(#ah-c)\"/>\n  <line x1=\"268\" y1=\"100\" x2=\"300\" y2=\"100\" class=\"ln-a\" marker-end=\"url(#ah-a)\"/>\n  <line x1=\"268\" y1=\"104\" x2=\"300\" y2=\"160\" class=\"ln-b\" marker-end=\"url(#ah-b)\"/>\n  <rect x=\"304\" y=\"12\" width=\"370\" height=\"54\" rx=\"10\" class=\"box-c\"/>\n  <text x=\"320\" y=\"35\" class=\"t-b\">SRAM 주소<\/text>\n  <text x=\"320\" y=\"54\" class=\"t-s\">일반 메모리<\/text>\n  <text x=\"664\" y=\"45\" text-anchor=\"end\" class=\"t-a\">변수 값이 바뀜<\/text>\n  <rect x=\"304\" y=\"73\" width=\"370\" height=\"54\" rx=\"10\" class=\"box-a\"/>\n  <text x=\"320\" y=\"96\" class=\"t-b\">Flash 주소<\/text>\n  <text x=\"320\" y=\"115\" class=\"t-s\">프로그램 저장소<\/text>\n  <text x=\"664\" y=\"106\" text-anchor=\"end\" class=\"t-a\">코드·상수 읽기<\/text>\n  <rect x=\"304\" y=\"134\" width=\"370\" height=\"54\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"320\" y=\"157\" class=\"t-b\">Peripheral 주소<\/text>\n  <text x=\"320\" y=\"176\" class=\"t-s\">GPIO 출력 레지스터 등<\/text>\n  <text x=\"664\" y=\"167\" text-anchor=\"end\" class=\"t-a\">⚡ 실제 핀 전압이 바뀜<\/text>\n<\/svg>\n```\n\n| 주소 영역 | 그 주소에 있는 것 | `*ptr = 1U;`의 결과 |\n|---|---|---|\n| SRAM | 전역·지역 변수, 스택 | 변수 값이 1로 바뀜 |\n| Flash | 실행 코드, 상수 | 코드·상수를 읽는 곳 (평소 쓰기 대상 아님) |\n| Peripheral | GPIO·UART 등의 제어 레지스터 | 하드웨어 동작이 바뀜 (예: 핀이 HIGH) |\n\nCPU 입장에서 `*ptr = 1U;`는 어떤 주소든 **store 명령 하나**예요. 그 주소 뒤에 SRAM 칸이 있는지 회로가 있는지는 따지지 않아요. 결과가 달라지는 건 **주소가 가리키는 대상** 때문이에요.\n\n### 2장 실습으로 보면\n`0x4029131E`(SIUL2 BASE `0x40290000` + GPDO29 오프셋 `0x131E`)가 PTA29의 출력 값 레지스터예요. MSCR로 출력 설정을 해 둔 뒤 여기에 1을 쓰면 D13 빨간 LED가 켜져요(Active High).\n\n```c\nvolatile uint8_t *gpdo29 = (volatile uint8_t *)0x4029131EUL; // PTA29 출력 값 레지스터\n*gpdo29 = 1U;   // 변수 대입처럼 보여도 → PTA29 = HIGH → D13 LED ON\n```\n\n- 주소 계산은 **주소 계산 카드**, 출력 설정은 **MSCR 카드**, 포인터에 왜 `volatile`을 붙이는지는 바로 다음 카드에서 이어져요.\n\n### 시험 함정\n- \"주변장치 레지스터는 **전용 I/O 명령**으로만 접근한다\" ✗ → 변수와 같은 load/store(C에서는 포인터).\n- \"`*ptr = 1U;`는 주소와 상관없이 결과가 같다\" ✗ → SRAM이면 **변수 값**, Peripheral이면 **핀 전압**이 바뀌어요.\n- \"영역마다 주소 공간이 따로 있다\" ✗ → **하나의 주소 공간**이에요.", "tip": "정의 빈칸 단골: 주변장치 제어 레지스터를 **메모리 주소처럼** 다루는 구조 = **Memory-mapped I/O**. CPU는 변수와 **같은 load/store 명령**을 써요."}, {"id": "c2-volatile", "title": "volatile — 매번 진짜로 읽고 쓰게 하기", "sec": ["2. volatile — 컴파일러 최적화로부터 하드웨어 접근 지키기"], "tags": ["volatile", "컴파일러 최적화", "STATUS_REG", "busy-wait", "Delay", "ISR 공유 변수"], "body": "컴파일러는 코드를 빠르게 만들려고, **의미가 안 바뀐다고 판단하면** 메모리 읽기·쓰기를 **빼거나 순서를 바꿔요**. 일반 변수에는 좋은 최적화지만, 회로가 값을 바꾸는 **하드웨어 레지스터**에서는 사고가 나요. `volatile`은 \"**이 접근은 매번 실제로 수행하고, 생략·재배치하지 말라**\"는 표시예요.\n\n```svg while (STATUS_REG == 0U) {} — volatile 유무에 따른 차이\n<svg viewBox=\"0 0 680 246\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"6\" y=\"6\" width=\"326\" height=\"234\" rx=\"14\" class=\"box-0 dash\"/>\n  <text x=\"169\" y=\"30\" text-anchor=\"middle\" class=\"t-b\">✗ volatile 없음<\/text>\n  <rect x=\"20\" y=\"44\" width=\"176\" height=\"50\" rx=\"10\" class=\"box-d\"/>\n  <text x=\"108\" y=\"66\" text-anchor=\"middle\" class=\"t-b\">STATUS_REG<\/text>\n  <text x=\"108\" y=\"84\" text-anchor=\"middle\" class=\"t-s\">회로가 0 → 1로 바꿈<\/text>\n  <line x1=\"108\" y1=\"96\" x2=\"108\" y2=\"120\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <text x=\"118\" y=\"113\" class=\"t-s\">처음 한 번만 읽음<\/text>\n  <rect x=\"20\" y=\"124\" width=\"176\" height=\"44\" rx=\"10\" class=\"box\"/>\n  <text x=\"108\" y=\"151\" text-anchor=\"middle\" class=\"t-b\">CPU 안 복사본 = 0<\/text>\n  <path d=\"M198,136 L226,136 L226,158 L202,158\" class=\"ln-e\" marker-end=\"url(#ah-e)\"/>\n  <text x=\"234\" y=\"144\" class=\"t-s\">복사본만<\/text>\n  <text x=\"234\" y=\"160\" class=\"t-s\">계속 비교<\/text>\n  <rect x=\"20\" y=\"184\" width=\"298\" height=\"44\" rx=\"22\" class=\"box-e\"/>\n  <text x=\"169\" y=\"211\" text-anchor=\"middle\" class=\"t-b\">1로 바뀐 걸 못 봄 → 무한 대기<\/text>\n  <rect x=\"348\" y=\"6\" width=\"326\" height=\"234\" rx=\"14\" class=\"box-0 dash\"/>\n  <text x=\"511\" y=\"30\" text-anchor=\"middle\" class=\"t-b\">✓ volatile 있음<\/text>\n  <rect x=\"362\" y=\"44\" width=\"176\" height=\"50\" rx=\"10\" class=\"box-d\"/>\n  <text x=\"450\" y=\"66\" text-anchor=\"middle\" class=\"t-b\">STATUS_REG<\/text>\n  <text x=\"450\" y=\"84\" text-anchor=\"middle\" class=\"t-s\">회로가 0 → 1로 바꿈<\/text>\n  <line x1=\"420\" y1=\"96\" x2=\"420\" y2=\"120\" class=\"ln-c\" marker-end=\"url(#ah-c)\"/>\n  <line x1=\"480\" y1=\"122\" x2=\"480\" y2=\"98\" class=\"ln-c\" marker-end=\"url(#ah-c)\"/>\n  <text x=\"550\" y=\"106\" class=\"t-s\">반복마다<\/text>\n  <text x=\"550\" y=\"122\" class=\"t-s\">실제로 읽기<\/text>\n  <rect x=\"362\" y=\"124\" width=\"176\" height=\"44\" rx=\"10\" class=\"box\"/>\n  <text x=\"450\" y=\"151\" text-anchor=\"middle\" class=\"t-b\">매번 새 값으로 비교<\/text>\n  <rect x=\"362\" y=\"184\" width=\"298\" height=\"44\" rx=\"22\" class=\"box-c\"/>\n  <text x=\"511\" y=\"211\" text-anchor=\"middle\" class=\"t-b\">1이 되는 순간 루프 탈출<\/text>\n<\/svg>\n```\n\n```c\n#define STATUS_REG (*(volatile uint32_t *)0x40000000UL)  // 예시 주소\n/* 0x40000000UL          : 주소 숫자\n   (volatile uint32_t *) : \"volatile 32비트 칸\"을 가리키는 포인터로 변환\n   *( ... )              : 그 칸 자체 → 변수처럼 읽고 쓸 수 있음 */\nwhile (STATUS_REG == 0U) {}   // 회로가 1로 바꿀 때까지 대기\n```\n\n- **volatile 없음**: 루프 안에 STATUS_REG를 바꾸는 코드가 없으니 컴파일러가 **처음 한 번만 읽고** CPU 안 복사본으로 비교해요 → 회로가 1로 바꿔도 **무한 대기**.\n- **volatile 있음**: 반복할 때마다 진짜 주소를 다시 읽어 1이 되는 순간 빠져나와요.\n\n### volatile이 필요한 곳 3가지\n| 대상 | volatile이 없으면 | 보드에서 보이는 증상 |\n|---|---|---|\n| 레지스터 포인터 (`SIUL2_MSCR`·`SIUL2_GPDO`) | 쓰기가 생략·재배치될 수 있음 | 코드는 정상인데 LED가 안 움직임 |\n| `Delay(volatile uint32_t count)` | 빈 루프가 통째로 삭제될 수 있음 | 지연이 사라져 깜빡임이 안 보임 |\n| ISR과 공유하는 변수 (5장) | 인터럽트가 바꾼 값을 못 봄 | 버튼을 눌러도 반응 없음 |\n\n`LedWrite(1U)` → `Delay()` → `LedWrite(0U)`에서 Delay가 사라지면 켜짐·꺼짐이 너무 빨리 바뀌어, 사람 눈엔 **계속 켜진(혹은 꺼진) 것처럼** 보여요.\n\n### 꼭 기억할 성질\n- `volatile`을 빼도 **컴파일 에러는 나지 않아요**. 빌드는 멀쩡히 성공하고, 최적화 결과에 따라 **보드에서만** 이상하게 동작해요 → \"프로그램은 정상으로 보이지만 보드는 동작하지 않음\". 그래서 원인 찾기가 어려워요.\n- `volatile`은 **주소도, 변수 크기도 바꾸지 않아요**. 접근을 생략하지 말라는 지시일 뿐이에요.", "tip": "레지스터 포인터에서 volatile을 빼면? 컴파일 에러 ✗ · 주소가 바뀜 ✗ · 크기가 8비트로 ✗ → **읽기·쓰기가 최적화로 생략될 수 있음** ✓. 필요한 곳: **주변장치 레지스터 · ISR 공유 변수 · busy-wait Delay 카운터**."}, {"id": "c2-mask", "title": "비트 마스킹 — set · clear · toggle · 필드 변경", "sec": ["3. 비트 마스킹 기본 패턴"], "tags": ["비트 마스킹", "set", "clear", "toggle", "필드 변경", "1u << n"], "body": "레지스터 한 워드에는 기능이 다른 비트가 여러 개 들어 있어서, 통째로 덮어쓰면 다른 설정까지 망가져요. 그래서 **마스크**(바꿀 자리만 1인 값)로 **원하는 비트만** 건드려요. `1u << n`이 바로 \"n번 비트만 1\"인 마스크예요.\n\n- **set** — n번 비트를 1로 (OR 1): `reg |= (1u << n);`\n- **clear** — n번 비트를 0으로 (AND 0): `reg &= ~(1u << n);` — 마스크를 `~`로 뒤집어 그 자리만 0으로 만들어요\n- **toggle** — n번 비트를 반전 (XOR 1): `reg ^= (1u << n);`\n- **필드 변경** — 기존 필드를 지우고 새 값을 넣음: `reg = (reg & ~mask) | value;`\n\n마스크가 0인 자리는 세 연산 모두 **원래 값을 그대로** 둬요. 아래 그림에서 색칠된 칸만 바뀐 이유예요.\n\n```svg 예시: reg = 0xA5 (1010 0101)에 각 연산을 적용하면 — 색칠된 칸이 바뀐 비트\n<svg viewBox=\"0 0 680 252\" xmlns=\"http://www.w3.org/2000/svg\">\n  <text x=\"167\" y=\"18\" text-anchor=\"middle\" class=\"t-s\">7<\/text>\n  <text x=\"203\" y=\"18\" text-anchor=\"middle\" class=\"t-s\">6<\/text>\n  <text x=\"239\" y=\"18\" text-anchor=\"middle\" class=\"t-s\">5<\/text>\n  <text x=\"275\" y=\"18\" text-anchor=\"middle\" class=\"t-s\">4<\/text>\n  <text x=\"311\" y=\"18\" text-anchor=\"middle\" class=\"t-s\">3<\/text>\n  <text x=\"347\" y=\"18\" text-anchor=\"middle\" class=\"t-s\">2<\/text>\n  <text x=\"383\" y=\"18\" text-anchor=\"middle\" class=\"t-s\">1<\/text>\n  <text x=\"419\" y=\"18\" text-anchor=\"middle\" class=\"t-s\">0<\/text>\n  <text x=\"10\" y=\"18\" class=\"t-s\">비트 번호 →<\/text>\n  <text x=\"450\" y=\"18\" class=\"t-s\">결과<\/text>\n  <text x=\"510\" y=\"18\" class=\"t-s\">코드<\/text>\n  <text x=\"10\" y=\"50\" class=\"t-b\">원래 값<\/text>\n  <rect x=\"152\" y=\"28\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"167\" y=\"49\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <rect x=\"188\" y=\"28\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"203\" y=\"49\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <rect x=\"224\" y=\"28\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"239\" y=\"49\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <rect x=\"260\" y=\"28\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"275\" y=\"49\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <rect x=\"296\" y=\"28\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"311\" y=\"49\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <rect x=\"332\" y=\"28\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"347\" y=\"49\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <rect x=\"368\" y=\"28\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"383\" y=\"49\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <rect x=\"404\" y=\"28\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"419\" y=\"49\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <text x=\"450\" y=\"49\" class=\"t-a\">0xA5<\/text>\n  <line x1=\"294\" y1=\"24\" x2=\"294\" y2=\"240\" class=\"ln dash\"/>\n  <text x=\"10\" y=\"94\" class=\"t-b\">set bit 3<\/text>\n  <rect x=\"152\" y=\"72\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"167\" y=\"93\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <rect x=\"188\" y=\"72\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"203\" y=\"93\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <rect x=\"224\" y=\"72\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"239\" y=\"93\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <rect x=\"260\" y=\"72\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"275\" y=\"93\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <rect x=\"296\" y=\"72\" width=\"32\" height=\"32\" rx=\"5\" class=\"box-c\"/>\n  <text x=\"311\" y=\"93\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <rect x=\"332\" y=\"72\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"347\" y=\"93\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <rect x=\"368\" y=\"72\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"383\" y=\"93\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <rect x=\"404\" y=\"72\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"419\" y=\"93\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <text x=\"450\" y=\"93\" class=\"t-a\">0xAD<\/text>\n  <text x=\"510\" y=\"93\" class=\"t-s\" font-size=\"11.5\">reg |= (1u &lt;&lt; 3)<\/text>\n  <text x=\"10\" y=\"138\" class=\"t-b\">clear bit 0<\/text>\n  <rect x=\"152\" y=\"116\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"167\" y=\"137\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <rect x=\"188\" y=\"116\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"203\" y=\"137\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <rect x=\"224\" y=\"116\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"239\" y=\"137\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <rect x=\"260\" y=\"116\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"275\" y=\"137\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <rect x=\"296\" y=\"116\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"311\" y=\"137\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <rect x=\"332\" y=\"116\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"347\" y=\"137\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <rect x=\"368\" y=\"116\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"383\" y=\"137\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <rect x=\"404\" y=\"116\" width=\"32\" height=\"32\" rx=\"5\" class=\"box-e\"/>\n  <text x=\"419\" y=\"137\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <text x=\"450\" y=\"137\" class=\"t-a\">0xA4<\/text>\n  <text x=\"510\" y=\"137\" class=\"t-s\" font-size=\"11.5\">reg &amp;= ~(1u &lt;&lt; 0)<\/text>\n  <text x=\"10\" y=\"182\" class=\"t-b\">toggle bit 7<\/text>\n  <rect x=\"152\" y=\"160\" width=\"32\" height=\"32\" rx=\"5\" class=\"box-b\"/>\n  <text x=\"167\" y=\"181\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <rect x=\"188\" y=\"160\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"203\" y=\"181\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <rect x=\"224\" y=\"160\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"239\" y=\"181\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <rect x=\"260\" y=\"160\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"275\" y=\"181\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <rect x=\"296\" y=\"160\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"311\" y=\"181\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <rect x=\"332\" y=\"160\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"347\" y=\"181\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <rect x=\"368\" y=\"160\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"383\" y=\"181\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <rect x=\"404\" y=\"160\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"419\" y=\"181\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <text x=\"450\" y=\"181\" class=\"t-a\">0x25<\/text>\n  <text x=\"510\" y=\"181\" class=\"t-s\" font-size=\"11.5\">reg ^= (1u &lt;&lt; 7)<\/text>\n  <text x=\"10\" y=\"226\" class=\"t-b\">필드 3:0 ← 6<\/text>\n  <rect x=\"152\" y=\"204\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"167\" y=\"225\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <rect x=\"188\" y=\"204\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"203\" y=\"225\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <rect x=\"224\" y=\"204\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"239\" y=\"225\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <rect x=\"260\" y=\"204\" width=\"32\" height=\"32\" rx=\"5\" class=\"box\"/>\n  <text x=\"275\" y=\"225\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <rect x=\"296\" y=\"204\" width=\"32\" height=\"32\" rx=\"5\" class=\"box-d\"/>\n  <text x=\"311\" y=\"225\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <rect x=\"332\" y=\"204\" width=\"32\" height=\"32\" rx=\"5\" class=\"box-d\"/>\n  <text x=\"347\" y=\"225\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <rect x=\"368\" y=\"204\" width=\"32\" height=\"32\" rx=\"5\" class=\"box-d\"/>\n  <text x=\"383\" y=\"225\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <rect x=\"404\" y=\"204\" width=\"32\" height=\"32\" rx=\"5\" class=\"box-d\"/>\n  <text x=\"419\" y=\"225\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <text x=\"450\" y=\"225\" class=\"t-a\">0xA6<\/text>\n  <text x=\"510\" y=\"225\" class=\"t-s\" font-size=\"11.5\">(reg &amp; ~0xF) | 0x6<\/text>\n<\/svg>\n```\n\n| 연산 | 계산 | 결과 |\n|---|---|---|\n| set bit 3 | 0xA5 OR 0x08 | `0xAD` |\n| clear bit 0 | 0xA5 AND 0xFE | `0xA4` |\n| toggle bit 7 | 0xA5 XOR 0x80 | `0x25` |\n| 필드 3:0 ← 6 | 0xA0 OR 0x06 (먼저 하위 4비트 지움) | `0xA6` |\n\n### MSCR에 쓰는 마스크 두 개\n- **OBE** = bit 21 하나 → `1UL << 21` = **`0x00200000`**. 16진수 한 자리가 4비트이니 bit 23~20 자리의 `2`예요.\n- **SSS** = bit 3:0 네 칸 필드 → **`0xF`**.\n\n```c\nuint32_t reg = 0x000000F3UL;  /* ... 1111 0011 */\nreg &= ~(1u << 1);            /* bit 1 clear → 0x000000F1 */\nreg |=  (1u << 21);           /* bit 21 set  → 0x002000F1 */\n```\n\n### 필드 변경은 반드시 두 단계\n\"지우고(`& ~mask`) → 넣기(`| value`)\". SSS가 지금 1(0001)인데 6(0110)으로 바꾸려고 `reg |= 6`만 하면 0111 = **7**이 돼요. 먼저 `& ~0xF`로 0000으로 지운 뒤 `| 6`을 해야 정확히 6이에요.\n\n마스크에는 `1u`·`1UL`처럼 **unsigned 접미사**를 붙이는 습관을 들여요. 부호 있는 `1`을 높은 비트까지 밀면 부호 비트를 건드려 문제가 될 수 있어서예요.", "tip": "연산자 바꿔치기 주의: set `|=` · clear `&= ~` · toggle `^=`. clear를 `reg |= ~(1u << n)`, toggle을 `reg &= (1u << n)`으로 쓴 보기는 ✗. `1u << 13` = **0x2000**, `1u << 21` = **0x00200000**."}, {"id": "c2-siul2", "title": "SIUL2와 주요 레지스터 — MSCR · IMCR · GPDO · GPDI", "sec": ["4. S32K3의 GPIO 블록 — SIUL2와 주요 레지스터"], "tags": ["SIUL2", "MSCR", "IMCR", "GPDO", "GPDI", "PGPDO", "PDO_n"], "body": "**SIUL2**(System Integration Unit Lite2)는 S32K3에서 **핀 기능 다중화(mux), 입력 신호 라우팅, 출력 드라이버 설정, GPIO 입출력**을 담당하는 블록이에요. 핀(**pad**) 하나는 GPIO로도, UART 신호로도, 타이머(eMIOS) 출력으로도 쓸 수 있는데, 그중 무엇을 연결할지 SIUL2에서 골라요.\n\n```svg GPIO 핀 하나의 경로 — MSCR이 설정하고, GPDO/GPDI가 데이터를 나른다\n<svg viewBox=\"0 0 680 272\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"6\" y=\"104\" width=\"92\" height=\"64\" rx=\"10\" class=\"box\"/>\n  <text x=\"52\" y=\"131\" text-anchor=\"middle\" class=\"t-b\">CPU<\/text>\n  <text x=\"52\" y=\"151\" text-anchor=\"middle\" class=\"t-s\">C 코드<\/text>\n  <rect x=\"118\" y=\"6\" width=\"320\" height=\"260\" rx=\"14\" class=\"box-0 dash\"/>\n  <text x=\"132\" y=\"26\" class=\"t-a\">SIUL2<\/text>\n  <rect x=\"134\" y=\"34\" width=\"290\" height=\"76\" rx=\"10\" class=\"box-a\"/>\n  <text x=\"146\" y=\"56\" class=\"t-b\">MSCR29 — 핀 설정<\/text>\n  <rect x=\"146\" y=\"68\" width=\"124\" height=\"30\" rx=\"6\" class=\"box\"/>\n  <text x=\"208\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">SSS=0 (GPIO)<\/text>\n  <rect x=\"280\" y=\"68\" width=\"66\" height=\"30\" rx=\"6\" class=\"box\"/>\n  <text x=\"313\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">OBE=1<\/text>\n  <rect x=\"356\" y=\"68\" width=\"56\" height=\"30\" rx=\"6\" class=\"box\"/>\n  <text x=\"384\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">IBE<\/text>\n  <rect x=\"134\" y=\"130\" width=\"136\" height=\"54\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"202\" y=\"153\" text-anchor=\"middle\" class=\"t-b\">GPDO29<\/text>\n  <text x=\"202\" y=\"172\" text-anchor=\"middle\" class=\"t-s\">출력 값 쓰기<\/text>\n  <rect x=\"134\" y=\"200\" width=\"136\" height=\"54\" rx=\"10\" class=\"box-c\"/>\n  <text x=\"202\" y=\"223\" text-anchor=\"middle\" class=\"t-b\">GPDI<\/text>\n  <text x=\"202\" y=\"242\" text-anchor=\"middle\" class=\"t-s\">입력 값 읽기<\/text>\n  <polygon points=\"300,137 300,177 346,157\" class=\"box-a\"/>\n  <text x=\"372\" y=\"134\" text-anchor=\"middle\" class=\"t-s\">출력 버퍼<\/text>\n  <polygon points=\"346,207 346,247 300,227\" class=\"box-c\"/>\n  <text x=\"372\" y=\"202\" text-anchor=\"middle\" class=\"t-s\">입력 버퍼<\/text>\n  <line x1=\"313\" y1=\"100\" x2=\"313\" y2=\"141\" class=\"ln-a dash\" marker-end=\"url(#ah-a)\"/>\n  <line x1=\"272\" y1=\"157\" x2=\"298\" y2=\"157\" class=\"ln-b\" marker-end=\"url(#ah-b)\"/>\n  <line x1=\"346\" y1=\"157\" x2=\"456\" y2=\"157\" class=\"ln-a\" marker-end=\"url(#ah-a)\"/>\n  <line x1=\"460\" y1=\"227\" x2=\"350\" y2=\"227\" class=\"ln-c\" marker-end=\"url(#ah-c)\"/>\n  <line x1=\"300\" y1=\"227\" x2=\"274\" y2=\"227\" class=\"ln-c\" marker-end=\"url(#ah-c)\"/>\n  <line x1=\"100\" y1=\"122\" x2=\"132\" y2=\"80\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"100\" y1=\"140\" x2=\"132\" y2=\"155\" class=\"ln-b\" marker-end=\"url(#ah-b)\"/>\n  <line x1=\"132\" y1=\"225\" x2=\"100\" y2=\"156\" class=\"ln-c\" marker-end=\"url(#ah-c)\"/>\n  <rect x=\"460\" y=\"134\" width=\"80\" height=\"116\" rx=\"10\" class=\"box-d\"/>\n  <text x=\"500\" y=\"188\" text-anchor=\"middle\" class=\"t-b\">PTA29<\/text>\n  <text x=\"500\" y=\"208\" text-anchor=\"middle\" class=\"t-s\">핀(pad)<\/text>\n  <line x1=\"542\" y1=\"157\" x2=\"584\" y2=\"157\" class=\"ln-e\"/>\n  <circle cx=\"610\" cy=\"157\" r=\"24\" class=\"box-e\"/>\n  <text x=\"610\" y=\"162\" text-anchor=\"middle\" class=\"t-b\">D13<\/text>\n  <text x=\"610\" y=\"202\" text-anchor=\"middle\" class=\"t-s\">빨간 LED<\/text>\n  <text x=\"610\" y=\"220\" text-anchor=\"middle\" class=\"t-s\">Active High<\/text>\n<\/svg>\n```\n\n위쪽 경로: CPU가 **MSCR29**로 \"이 핀은 GPIO 출력\"이라고 정해 두고 **GPDO29**에 값을 쓰면 출력 버퍼를 지나 PTA29 → D13으로 나가요. 아래쪽은 반대로 핀 전압이 입력 버퍼를 지나 **GPDI**로 읽혀요.\n\n| 레지스터 | 풀네임 | 하는 일 | 2장 실습 |\n|---|---|---|---|\n| MSCR[n] | Multiplexed Signal Configuration | 핀 기능, 출력·입력 버퍼, 전기적 속성 | ✓ |\n| IMCR[n] | Input Multiplexed Signal Configuration | 주변장치 입력 신호가 들어올 pad 선택 | — |\n| GPDO[n] | GPIO Pad Data Output | 핀 1개의 출력 값 쓰기 | ✓ |\n| GPDI[n] | GPIO Pad Data Input | 핀 1개의 입력 값 읽기 | — |\n| PGPDO / PGPDI | Parallel GPDO / GPDI | 여러 핀을 병렬로 쓰기 / 읽기 | — |\n\n- **MSCR**: 여러 기능(GPIO·UART·eMIOS) 중 **하나를 골라 패드로** 내보내요 → \"핀 입장\"의 선택.\n- **IMCR**: 여러 패드 중 **하나를 골라 주변장치 입력(EIRQ 등)으로** 넣어요 → \"주변장치 입장\"의 선택. 1장 Config Tools의 \"PTA15와 RX input mux\"(LPUART6 RX 입력 선택)가 이쪽이에요.\n- **P**GPDO/**P**GPDI의 P = **Parallel**.\n- 이번 장 범위: LED 출력에는 **MSCR과 GPDO만** 써요.\n\n```bits GPDO 레지스터 — 8비트, 의미 있는 비트는 bit 0 하나\n@bits 8\n0: PDO_n | 핀 출력 값 (1 = High, 0 = Low) | b\n7-1: 0 | 읽으면 0 (예약)\n```\n\n### GPDO — 핀 하나에 1바이트\n- **8비트** 레지스터이고 의미 있는 비트는 **bit 0 `PDO_n`** 하나예요(bit 7~1은 읽으면 0인 예약 비트). 그래서 실습 코드는 **`volatile uint8_t *`**로 접근하고 **0/1만** 써요.\n- 핀마다 **자기 바이트가 따로** 있어서 GPDO29에 써도 다른 핀은 안 바뀌어요 → MSCR과 달리 읽기-수정-쓰기 없이 **그냥 써요**.\n- GPDO 값은 MSCR에서 **OBE = 1**로 출력 버퍼를 켜야 핀에 나타나요.\n\n| 쓰는 값 | PDO_n | PTA29 (OBE = 1일 때) | D13 |\n|---|---|---|---|\n| `1U` | 1 | High | 켜짐 (Active High) |\n| `0U` | 0 | Low | 꺼짐 |", "tip": "역할 바꾸기 함정: \"IMCR = 핀의 출력 기능 선택\" ✗(그건 MSCR), \"GPDI = 출력 값 쓰기\" ✗. LED 실습은 **MSCR·GPDO만**, GPDO 포인터 형은 **`volatile uint8_t *`**."}, {"id": "c2-mscr", "title": "MSCR — OBE · SSS와 읽기-수정-쓰기", "sec": ["5. MSCR — 핀을 GPIO 출력으로 만들기"], "tags": ["MSCR", "OBE", "SSS", "IBE", "읽기-수정-쓰기", "GpioBare_SetOutput"], "body": "**MSCR**(Multiplexed Signal Configuration Register)은 **핀(pad)마다 하나씩** 있는 **32비트** 설정 레지스터예요. 이름 붙은 칸이 기능 스위치이고, 나머지(0 칸)는 예약 비트예요.\n\n```bits MSCR — pad별 32비트 설정 레지스터 (이번 실습: OBE = 1, SSS = 0)\n@bits 32\n21: OBE | 출력 버퍼 켜기 (1 = 출력) | a\n19: IBE | 입력 버퍼 켜기 | c\n17: INV | 신호 반전 | d\n16: PKE | Pad keeping enable | d\n14: SRC | Slew rate control | d\n13: PUE | Pull enable (풀 저항 켜기) | d\n11: PUS | Pull select (풀업/풀다운 방향) | d\n8: DSE | Drive strength enable | d\n6: IFE | Input filter enable (저역 통과 필터) | d\n5: SMC | Safe mode control | d\n3-0: SSS | 신호 소스 선택, 0 = GPIO | b\n```\n\nLED 출력(GPIO 출력)에 필요한 건 두 필드뿐이에요.\n1. **OBE**(Output Buffer Enable, **bit 21**) → **1**로 set해서 출력 버퍼를 켜요.\n2. **SSS**(Source Signal Select, **bit 3:0**) → **0**으로 만들어 핀 기능을 **GPIO**로 골라요.\n\n| 필드 | 비트 | 마스크 | 이번 값 |\n|---|---|---|---|\n| OBE | 21 | `0x00200000` | 1 (출력 켜기) |\n| IBE | 19 | `0x00080000` | 그대로 둠 |\n| SSS | 3:0 | `0x0000000F` | 0 (GPIO) |\n\n- **SSS 값마다 다른 기능**이 연결돼요. IOMUX 표에서 PTB0은 SSS `0000_0000` = GPIO[32], `0000_0001` = LPI2C0_SDAS예요.\n- 이름이 비슷한 **IBE**(bit 19, 입력 버퍼)와 **OBE**(bit 21, 출력 버퍼)를 헷갈리지 마세요. 나머지 필드(PUE·PUS·DSE 등)는 RM 기준 요약이고, 시험 대비는 OBE·SSS 위주면 돼요.\n\n### GPIO pad 구조 — 비트 이름이 곧 회로 스위치\n- **출력 경로**: DO(= GPDO에 쓴 값) → Output driver → Pad. 드라이버를 켜는 스위치가 **OBE**, SRC(slew rate)·DSE(drive strength)는 출력 변화 속도·구동 세기를 조절해요.\n- **Pull logic**: **PUE**가 풀 저항을 켜고 **PUS**가 풀업/풀다운을 골라, 아무도 구동하지 않을 때 핀이 떠 있지 않게 해요.\n- **입력 경로**: Pad → Low-pass filter(**IFE**) → Input receiver(**IBE**) → IND(= GPDI로 읽는 값).\n- 그래서 **OBE = 0이면 GPDO에 1을 써도 핀이 안 움직여요.** 값은 DO까지 왔는데 출력 드라이버가 꺼져 있어서예요. LED가 안 켜지면 GPDO보다 MSCR을 먼저 의심해요.\n\n### 읽기-수정-쓰기 (GpioBare_SetOutput)\nMSCR은 **통째로 덮어쓰지 않고**, 읽어서 필요한 비트만 고친 뒤 다시 써요(Read-Modify-Write). 현재 MSCR29가 `0x00080001`(IBE = 1, SSS = 1, 설명용 가정 값)이라면 이렇게 돼요.\n\n```c\nvalue  = SIUL2_MSCR(29);         /* ① 읽기        0x00080001 */\nvalue &= ~SIUL2_MSCR_SSS_MASK;   /* ② SSS 지우기  0x00080000 */\nvalue |= SIUL2_MSCR_OBE_MASK;    /* ③ OBE set     0x00280000 */\nvalue |= SIUL2_MSCR_SSS_GPIO;    /* ④ SSS = GPIO  0x00280000 */\nSIUL2_MSCR(29) = value;          /* ⑤ 다시 쓰기 → IBE 보존 ✓ */\n```\n\n`MSCR29 = 0x00200000;`처럼 한 번에 쓰면 결과가 `0x00200000`이라 **IBE(bit 19)가 0으로 지워져요.** 이번 LED엔 티가 안 나도, 풀 저항·입력 설정이 필요한 핀이라면 다른 기능이 망가져요.", "tip": "GPIO 출력을 위해 1로 만드는 비트 = **OBE, bit 21**(`0x00200000`), 함께 **SSS(bit 3:0) = 0**. IBE(bit 19)·`0x00100000`(bit 20)은 오답. RMW 계산 `0x00080001` → **`0x00280000`**."}, {"id": "c2-addr", "title": "SIUL2 주소 계산 — MSCR 배열과 GPDO 역순 배치", "sec": ["6. SIUL2 주소 계산 — MSCR 배열과 GPDO 역순 배치"], "tags": ["MSCR 주소", "GPDO 역순", "0x402902B4", "0x131E", "IOMUX", "MSCR 번호 ≠ GPIO 번호"], "body": "### MSCR 주소 = BASE + 0x240 + 4 × n\nRM의 SIUL2 memory map에서 SIUL2는 **`4029_0000h`**에서 시작하고, MSCR0 = 240h, MSCR1 = 244h, MSCR2 = 248h… **4씩** 늘어나요. MSCR 하나가 32비트 = **4바이트**라서예요.\n\n| n | 4 × n | 오프셋 | 절대 주소 |\n|---|---|---|---|\n| 0 | 0 = `0x00` | `0x240` | `0x40290240` |\n| 1 | 4 = `0x04` | `0x244` | `0x40290244` |\n| 16 | 64 = `0x40` | `0x280` | `0x40290280` |\n| 29 | 116 = `0x74` | `0x2B4` | `0x402902B4` |\n\n**10진수로 곱한 뒤 16진수로** 바꾸면 실수가 적어요. 4 × 29 = 116 = 7 × 16 + 4 = `0x74`, `0x240 + 0x74` = `0x2B4`. 흔한 실수는 `4 ×`를 빼고 `0x240 + 29`(= `0x25D`)로 계산하는 거예요.\n\n### GPDO는 4개 묶음 안에서 역순\nGPDO 영역 시작은 `SIUL2_GPDO_OFFSET = 0x1300`이지만, S32K312에서는 **4바이트 묶음 안에서 번호가 거꾸로** 놓여 있어요. `0x1300`에는 GPDO0이 아니라 **GPDO3**이, `0x1303`에 GPDO0이 있어요.\n\n```svg GPDO 바이트 레지스터 — 4개 묶음 안에서 번호가 거꾸로\n<svg viewBox=\"0 0 680 246\" xmlns=\"http://www.w3.org/2000/svg\">\n  <text x=\"370\" y=\"18\" text-anchor=\"middle\" class=\"t-a\">← 묶음 안에서 번호가 거꾸로 (GPDO3, 2, 1, 0)<\/text>\n  <rect x=\"6\" y=\"28\" width=\"116\" height=\"56\" rx=\"10\" class=\"box\"/>\n  <text x=\"64\" y=\"52\" text-anchor=\"middle\" class=\"t-b\">0x1300 워드<\/text>\n  <text x=\"64\" y=\"72\" text-anchor=\"middle\" class=\"t-s\">GPDO0‥3<\/text>\n  <rect x=\"132\" y=\"28\" width=\"116\" height=\"56\" rx=\"8\" class=\"box-a\"/>\n  <text x=\"190\" y=\"50\" text-anchor=\"middle\" class=\"t-s\">0x1300<\/text>\n  <text x=\"190\" y=\"72\" text-anchor=\"middle\" class=\"t-b\">GPDO3<\/text>\n  <rect x=\"252\" y=\"28\" width=\"116\" height=\"56\" rx=\"8\" class=\"box-a\"/>\n  <text x=\"310\" y=\"50\" text-anchor=\"middle\" class=\"t-s\">0x1301<\/text>\n  <text x=\"310\" y=\"72\" text-anchor=\"middle\" class=\"t-b\">GPDO2<\/text>\n  <rect x=\"372\" y=\"28\" width=\"116\" height=\"56\" rx=\"8\" class=\"box-a\"/>\n  <text x=\"430\" y=\"50\" text-anchor=\"middle\" class=\"t-s\">0x1302<\/text>\n  <text x=\"430\" y=\"72\" text-anchor=\"middle\" class=\"t-b\">GPDO1<\/text>\n  <rect x=\"492\" y=\"28\" width=\"116\" height=\"56\" rx=\"8\" class=\"box-a\"/>\n  <text x=\"550\" y=\"50\" text-anchor=\"middle\" class=\"t-s\">0x1303<\/text>\n  <text x=\"550\" y=\"72\" text-anchor=\"middle\" class=\"t-b\">GPDO0<\/text>\n  <text x=\"370\" y=\"108\" text-anchor=\"middle\" class=\"t-s\">⋮ GPDO7‥4, GPDO11‥8 … 같은 규칙으로 반복 ⋮<\/text>\n  <rect x=\"6\" y=\"120\" width=\"116\" height=\"56\" rx=\"10\" class=\"box\"/>\n  <text x=\"64\" y=\"144\" text-anchor=\"middle\" class=\"t-b\">0x131C 워드<\/text>\n  <text x=\"64\" y=\"164\" text-anchor=\"middle\" class=\"t-s\">GPDO28‥31<\/text>\n  <rect x=\"132\" y=\"120\" width=\"116\" height=\"56\" rx=\"8\" class=\"box-a\"/>\n  <text x=\"190\" y=\"142\" text-anchor=\"middle\" class=\"t-s\">0x131C<\/text>\n  <text x=\"190\" y=\"164\" text-anchor=\"middle\" class=\"t-b\">GPDO31<\/text>\n  <rect x=\"252\" y=\"120\" width=\"116\" height=\"56\" rx=\"8\" class=\"box-e\"/>\n  <text x=\"310\" y=\"142\" text-anchor=\"middle\" class=\"t-s\">0x131D<\/text>\n  <text x=\"310\" y=\"164\" text-anchor=\"middle\" class=\"t-b\">GPDO30<\/text>\n  <rect x=\"372\" y=\"120\" width=\"116\" height=\"56\" rx=\"8\" class=\"box-c\"/>\n  <text x=\"430\" y=\"142\" text-anchor=\"middle\" class=\"t-s\">0x131E<\/text>\n  <text x=\"430\" y=\"164\" text-anchor=\"middle\" class=\"t-b\">GPDO29 ★<\/text>\n  <rect x=\"492\" y=\"120\" width=\"116\" height=\"56\" rx=\"8\" class=\"box-a\"/>\n  <text x=\"550\" y=\"142\" text-anchor=\"middle\" class=\"t-s\">0x131F<\/text>\n  <text x=\"550\" y=\"164\" text-anchor=\"middle\" class=\"t-b\">GPDO28<\/text>\n  <line x1=\"310\" y1=\"194\" x2=\"310\" y2=\"180\" class=\"ln-e\" marker-end=\"url(#ah-e)\"/>\n  <text x=\"310\" y=\"210\" text-anchor=\"middle\" class=\"t-s\">✗ 0x1300 + 29 = 0x131D<\/text>\n  <line x1=\"470\" y1=\"222\" x2=\"440\" y2=\"180\" class=\"ln-c\" marker-end=\"url(#ah-c)\"/>\n  <text x=\"484\" y=\"236\" class=\"t-a\">✓ 28 + (3 − 1) = 30 → 0x131E<\/text>\n<\/svg>\n```\n\n공식 `offset = 0x1300 + (n & ~3) + (3 − (n & 3))` = **묶음 시작 번호 + 묶음 안 뒤집힌 위치**. n = 29로 풀면,\n1. `n & ~3` → 아래 2비트를 지워 묶음 시작: 29 = `0b11101` → `0b11100` = **28**\n2. `n & 3` → 묶음 안 원래 위치 = **1**\n3. `3 − (n & 3)` → 위치 뒤집기 = **2**\n4. 28 + 2 = 30 = `0x1E` → 오프셋 **`0x131E`**, 절대 주소 **`0x4029131E`**\n\n| GPDO | 묶음 시작 | 뒤집힌 위치 | 오프셋 |\n|---|---|---|---|\n| 0 | 0 | 3 | `0x1303` |\n| 2 | 0 | 1 | `0x1301` |\n| 28 | 28 | 3 | `0x131F` |\n| 29 | 28 | 2 | `0x131E` |\n| 30 | 28 | 1 | `0x131D` |\n| 31 | 28 | 0 | `0x131C` |\n\n`0x1300 + 29` = `0x131D`로 계산하면 GPDO29가 아니라 **GPDO30**(PTA30) 칸에 써요. 출력 설정은 MSCR29에 해 놓고 값은 다른 칸에 쓰니 빨간 LED는 꺼진 채 그대로예요.\n\n### MSCR 번호 ≠ GPIO 번호\nIOMUX 표에서 **MSCR 번호는 CR 열**(예: `SIUL_MSCR31`), **GPIO 번호는 SSS = 0000_0000일 때의 Function 열**(예: `GPIO[31]`)에서 따로 읽어요. PTB0 행도 `SIUL_MSCR32`와 `GPIO[32]`가 다른 열에 있어요. 그 사이의 `SIUL_IMCRxxx` 행은 이 핀을 주변장치 입력으로 쓸 때의 IMCR 번호예요.\n\nPTA29는 **우연히 둘 다 29**일 뿐이에요. MSCR 번호는 MSCR 배열의 인덱스, GPIO 번호는 GPDO/GPDI의 인덱스라 다른 핀에서는 어긋날 수 있어요. 그래서 main.c도 `LED_RED_MSCR_INDEX`와 `LED_RED_GPDO_INDEX`를 **따로** 정의해요.", "tip": "묻는 게 **오프셋**(0x2B4·0x131E)인지 **절대 주소**(0x402902B4·0x4029131E)인지 구분해서 답해요. \"GPDO[n] = 0x1300 + n\" ✗ → GPDO29 = **0x131E**, GPDO30 = 0x131D, GPDO31 = 0x131C, GPDO0 = 0x1303."}, {"id": "c2-pin", "title": "핀 정보 찾기와 Active High / Active Low", "sec": ["7. 핀 정보 찾기 — 보드 매뉴얼 → IOMUX → 헤더, Active High/Low"], "tags": ["보드 매뉴얼", "IOMUX 표", "PTA29", "D13", "Active High", "Active Low", "LedOnLevel"], "body": "LED 하나를 켜려면 \"어느 핀인가 → 그 핀의 레지스터 번호는 → 그 레지스터 주소는\"을 차례로 알아야 하는데, 답이 **서로 다른 문서**에 있어요. 문서마다 다루는 범위가 달라서예요. 그래서 수치는 **추측하지 않고** 문서마다 확인해요.\n\n| 순서 | 문서 | 알려 주는 것 | D13 예 |\n|---|---|---|---|\n| 1 | 보드 매뉴얼 (p.19 User LED) | 부품 ↔ MCU 핀, active level | D13 → PTA29, Active High |\n| 2 | IOMUX 표 | 핀의 MSCR·GPIO 번호, ALT 기능 | SIUL_MSCR29, GPIO[29] |\n| 3 | RTD 헤더 / RM | 레지스터 주소·필드·구조체 이름 | 0x40290000, 0x240, 0x131E |\n\n- 보드 매뉴얼 = \"이 **보드**에서 LED가 어느 핀에 연결됐나\", IOMUX 표 = \"이 **칩**의 핀이 어떤 기능을 가질 수 있나\", 헤더·RM = \"레지스터가 **어느 주소**에 있나\".\n- 같은 S32K312를 써도 **보드가 다르면** 보드 매뉴얼의 연결 정보가 달라져요.\n- \"MSCR 번호를 보드 매뉴얼에서 찾는다\" ✗ → 핀 이름(PTA29)까지는 보드 매뉴얼, **번호(29)는 IOMUX 표**.\n\n**실습 LED 한 줄 요약**: D13 / RGBLED0_RED · MCU 핀 **PTA29** · **SIUL_MSCR29** · **GPIO[29]** · GPDO29(offset **0x131E**) · **Active High**\n\n```svg Active High vs Active Low — 어느 값을 써야 켜지나 (개념도)\n<svg viewBox=\"0 0 680 248\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"6\" y=\"6\" width=\"326\" height=\"236\" rx=\"14\" class=\"box-0 dash\"/>\n  <text x=\"169\" y=\"30\" text-anchor=\"middle\" class=\"t-b\">Active High · D13 (이번 실습)<\/text>\n  <rect x=\"40\" y=\"46\" width=\"110\" height=\"40\" rx=\"8\" class=\"box-a\"/>\n  <text x=\"95\" y=\"71\" text-anchor=\"middle\" class=\"t-b\">MCU 핀<\/text>\n  <line x1=\"95\" y1=\"88\" x2=\"95\" y2=\"110\" class=\"ln\"/>\n  <polygon points=\"79,110 111,110 95,136\" class=\"box-e\"/>\n  <line x1=\"79\" y1=\"136\" x2=\"111\" y2=\"136\" class=\"ln-e\"/>\n  <text x=\"120\" y=\"128\" class=\"t-s\">LED<\/text>\n  <line x1=\"95\" y1=\"136\" x2=\"95\" y2=\"168\" class=\"ln\"/>\n  <line x1=\"77\" y1=\"168\" x2=\"113\" y2=\"168\" class=\"ln\"/>\n  <line x1=\"84\" y1=\"175\" x2=\"106\" y2=\"175\" class=\"ln\"/>\n  <line x1=\"91\" y1=\"182\" x2=\"99\" y2=\"182\" class=\"ln\"/>\n  <text x=\"95\" y=\"202\" text-anchor=\"middle\" class=\"t-s\">GND<\/text>\n  <text x=\"180\" y=\"88\" class=\"t-a\">1 쓰기 → 켜짐<\/text>\n  <text x=\"180\" y=\"108\" class=\"t-s\">핀이 전류를 공급<\/text>\n  <text x=\"180\" y=\"148\" class=\"t-b\">0 쓰기 → 꺼짐<\/text>\n  <text x=\"169\" y=\"228\" text-anchor=\"middle\" class=\"t-s\">MCU 핀 → LED → GND<\/text>\n  <rect x=\"348\" y=\"6\" width=\"326\" height=\"236\" rx=\"14\" class=\"box-0 dash\"/>\n  <text x=\"511\" y=\"30\" text-anchor=\"middle\" class=\"t-b\">Active Low (비교용)<\/text>\n  <text x=\"437\" y=\"52\" text-anchor=\"middle\" class=\"t-s\">VDD<\/text>\n  <line x1=\"419\" y1=\"60\" x2=\"455\" y2=\"60\" class=\"ln\"/>\n  <line x1=\"437\" y1=\"60\" x2=\"437\" y2=\"96\" class=\"ln\"/>\n  <polygon points=\"421,96 453,96 437,122\" class=\"box-e\"/>\n  <line x1=\"421\" y1=\"122\" x2=\"453\" y2=\"122\" class=\"ln-e\"/>\n  <text x=\"462\" y=\"114\" class=\"t-s\">LED<\/text>\n  <line x1=\"437\" y1=\"122\" x2=\"437\" y2=\"152\" class=\"ln\"/>\n  <rect x=\"382\" y=\"152\" width=\"110\" height=\"40\" rx=\"8\" class=\"box-a\"/>\n  <text x=\"437\" y=\"177\" text-anchor=\"middle\" class=\"t-b\">MCU 핀<\/text>\n  <text x=\"514\" y=\"88\" class=\"t-a\">0 쓰기 → 켜짐<\/text>\n  <text x=\"514\" y=\"108\" class=\"t-s\">핀이 전류를 받아 줌<\/text>\n  <text x=\"514\" y=\"148\" class=\"t-b\">1 쓰기 → 꺼짐<\/text>\n  <text x=\"511\" y=\"228\" text-anchor=\"middle\" class=\"t-s\">VDD → LED → MCU 핀<\/text>\n<\/svg>\n```\n\n### Active High / Active Low\nLED가 켜지려면 전류가 흘러야 하고, 어느 쪽 전압일 때 흐르는지는 **회로 연결**이 정해요.\n1. **Active High**(D13): `MCU 핀 → LED → GND`. 핀이 **High(1)**가 되면 핀에서 전류가 나가 켜지고, 0을 쓰면 꺼져요.\n2. **Active Low**(비교용): `VDD → LED → MCU 핀`. 핀이 **Low(0)**가 돼야 VDD에서 핀 쪽으로 전류가 흘러 켜지고, 1을 쓰면 양쪽 전압이 같아져 꺼져요.\n\n| 설정 | 켜기 | 끄기 | `LedOnLevel()` | `LedOffLevel()` |\n|---|---|---|---|---|\n| `LED_RED_ACTIVE_HIGH (1U)` | 1 | 0 | `1U` | `0U` |\n| `LED_RED_ACTIVE_HIGH (0U)` | 0 | 1 | `0U` | `1U` |\n\n코드는 \"켜라/꺼라\"라는 **논리**와 \"1/0을 쓴다\"는 **전기 레벨**을 `LedOnLevel()`/`LedOffLevel()`로 분리해 뒀어요. 회로가 Active Low로 바뀌어도 `LED_RED_ACTIVE_HIGH` 하나만 0으로 바꾸면 `LedWrite(1U)`는 여전히 \"켜기\"로 동작해요.", "tip": "확인 순서는 **보드 매뉴얼 → IOMUX 표 → RTD 헤더/RM**. \"Active Low LED는 1을 쓰면 켜진다\" ✗(**0**이 켜짐). D13 / RGBLED0_RED는 **Active High** → 1 = 켜짐."}, {"id": "c2-sdk", "title": "직접 주소 매크로 vs SDK 헤더 IP_SIUL2, 클럭 게이팅", "sec": ["8. 직접 주소 매크로 vs SDK 헤더 구조체, 그리고 클럭 게이팅"], "tags": ["IP_SIUL2", "S32K312.h", "SDK 헤더", "직접 주소 매크로", "이식성", "클럭 게이팅"], "body": "같은 하드웨어를 두 방식으로 접근해요. 두 방식은 **CPU가 실제로 하는 일이 같아요** — 결국 같은 주소에 같은 값을 쓰는 store 명령이에요. 차이는 그 주소를 **누가 계산하느냐**예요.\n\n```c\n/* 1단계: 직접 주소 매크로 — 주소를 우리가 직접 계산 */\n#define SIUL2_MSCR(index)  \\\n  (*(volatile uint32_t *)  \\\n  (SIUL2_BASE_ADDR + SIUL2_MSCR_OFFSET \\\n   + (4UL * (uint32_t)(index))) )\n\n/* 2단계: SDK 헤더(S32K312.h) — 구조체 필드 이름 */\nIP_SIUL2->MSCR[29] = value;\nIP_SIUL2->GPDO29 = 1U;\n```\n\n| 대상 | 직접 주소 매크로 | SDK 헤더 | 실제 주소 |\n|---|---|---|---|\n| MSCR29 | `SIUL2_MSCR(29)` | `IP_SIUL2->MSCR[29]` | `0x402902B4` |\n| GPDO29 | `SIUL2_GPDO(29)` | `IP_SIUL2->GPDO29` | `0x4029131E` |\n\n- `IP_SIUL2`는 SIUL2 베이스(`0x40290000`)를 가리키는 **구조체 포인터**(S32K312.h)예요. 구조체 멤버 배치가 곧 레지스터 배치라서, `MSCR[29]`(+0x2B4)·`GPDO29`(+0x131E) 같은 **이름만 쓰면 오프셋은 헤더 정의대로 컴파일러가** 계산해요.\n- GPDO의 **역순 배치도 헤더에 이미 반영**돼 있어서 역순 계산 실수가 없어요.\n\n| 비교 항목 | 직접 주소 매크로 | SDK 헤더 활용 |\n|---|---|---|\n| 주소 계산 이해 | 높음 | 낮음 |\n| 코드 가독성 | 낮음 | 높음 |\n| 오타 위험 | 높음 | 낮음 |\n| 이식성 | 낮음 | 높음 |\n| 실습 목적 | 레지스터 구조 이해 | 실무형 접근 이해 |\n\n- 실무에서는 **SDK 헤더나 드라이버를 우선** 써요. 직접 주소는 **칩이나 헤더 정의가 바뀌면** 오류가 나기 쉬워요.\n- 그래도 한 번 해 보는 이유: 하드웨어가 주소와 비트 필드로 제어된다는 걸 알면 3장의 **HAL·MCAL·RTD 코드가 무엇을 대신해 주는지** 보여요.\n\n### 클럭 게이팅\n**클럭 게이팅**은 모듈마다 클럭 공급을 따로 켜고 끄는 구조예요. 쓰지 않는 모듈의 클럭을 꺼 전력을 아끼는 대신, **클럭이 공급되지 않은 주변장치는 동작하지 않아요**.\n\n| 구분 | 1장 UART | 2장 GPIO |\n|---|---|---|\n| 클럭 초기화 | `Clock_Ip_Init()` 직접 호출 | 기본 startup 코드에 맡김 |\n| 확인한 것 | LPUART6_CLK enabled | (코드에서 다루지 않음) |\n\n2장 main.c에 클럭 호출이 하나도 없는 이유는, RTD 드라이버를 쓰지 않으므로 클럭·시스템 초기화를 **S32DS/RTD가 생성한 기본 startup 코드에 맡기고** GPIO 레지스터 접근에만 집중하기 때문이에요.", "tip": "\"직접 주소 매크로가 가독성·이식성이 높다\" ✗. SDK 헤더가 더 안전한 이유 = **GPDO29의 실제 오프셋을 헤더가 이미 알고 있어** 역순 계산 실수가 없음. \"SDK 헤더는 다른 주소에 접근한다\" ✗ → 같은 0x4029131E."}, {"id": "c2-bare", "title": "gpio_bare.h — 접근 매크로와 두 함수", "sec": ["10. gpio_bare.h — 직접 접근 매크로와 함수"], "tags": ["gpio_bare.h", "SIUL2_GPDO_BYTE_OFFSET", "SIUL2_MSCR", "SIUL2_GPDO", "GpioBare_SetOutput", "GpioBare_Write", "static inline"], "body": "`gpio_bare.h`는 2장 전체 요약이에요: **① 주소 상수 → ② GPDO 역순 계산 → ③ 접근 매크로 → ④ MSCR 비트 정의 → ⑤ SetOutput(읽기-수정-쓰기) → ⑥ Write(단순 쓰기)**.\n\n```c\n#ifndef GPIO_BARE_H\n#define GPIO_BARE_H\n#include <stdint.h>\n\n#define SIUL2_BASE_ADDR    (0x40290000UL)\n#define SIUL2_MSCR_OFFSET  (0x0240UL)\n#define SIUL2_GPDO_OFFSET  (0x1300UL)\n\n#define SIUL2_GPDO_BYTE_OFFSET(index)  \\\n    (SIUL2_GPDO_OFFSET                 \\\n    + (((uint32_t)(index) & ~3UL)      \\\n    + (3UL - ((uint32_t)(index) & 3UL))))   // 묶음 시작 + 묶음 안 뒤집힌 위치\n\n#define SIUL2_MSCR(index)          \\\n    (*(volatile uint32_t *)        \\\n    (SIUL2_BASE_ADDR               \\\n    + SIUL2_MSCR_OFFSET            \\\n    + (4UL * (uint32_t)(index))))      // MSCR: 32비트, 4바이트 간격\n#define SIUL2_GPDO(index)          \\\n    (*(volatile uint8_t *)         \\\n    (SIUL2_BASE_ADDR               \\\n    + SIUL2_GPDO_BYTE_OFFSET(index)))  // GPDO: 8비트 바이트 레지스터\n\n#define SIUL2_MSCR_OBE_MASK   (1UL << 21)                      // 0x00200000\n#define SIUL2_MSCR_SSS_SHIFT  (0UL)\n#define SIUL2_MSCR_SSS_MASK   (0xFUL << SIUL2_MSCR_SSS_SHIFT)  // 하위 4비트\n#define SIUL2_MSCR_SSS_GPIO   (0UL << SIUL2_MSCR_SSS_SHIFT)    // GPIO 기능 = 0\n\nstatic inline void GpioBare_SetOutput(uint32_t mscrIndex)\n{\n    uint32_t value;\n    value = SIUL2_MSCR(mscrIndex);       // 읽기\n    value &= ~SIUL2_MSCR_SSS_MASK;       // SSS 필드 지우기\n    value |= SIUL2_MSCR_OBE_MASK;        // OBE set\n    value |= SIUL2_MSCR_SSS_GPIO;        // SSS = GPIO\n    SIUL2_MSCR(mscrIndex) = value;       // 다시 쓰기\n}\n\nstatic inline void GpioBare_Write(uint32_t gpdoIndex, uint8_t level)\n{\n    SIUL2_GPDO(gpdoIndex) = (level != 0U) ? 1U : 0U;   // 0이 아니면 1로 정규화\n}\n#endif\n```\n\n### `SIUL2_GPDO(29) = 1U;` 펼쳐 보기\n매크로는 컴파일 전에 **글자 그대로 치환**돼요.\n1. `SIUL2_GPDO_BYTE_OFFSET(29)` = `0x1300 + 28 + 2` = **`0x131E`**\n2. 베이스를 더해 주소 숫자 **`0x4029131E`**\n3. `(volatile uint8_t *)`로 \"**8비트 volatile 칸**\"을 가리키는 포인터로 변환 (GPDO가 8비트라서)\n4. 맨 앞 `*`로 그 칸 자체가 되고, `= 1U`로 1바이트 **store** → PTA29 High → D13 켜짐\n\n즉 `*(volatile uint8_t *)0x4029131EUL = 1U;`와 같은 쓰기예요. MSCR 매크로는 32비트라 `volatile uint32_t *`, 간격이 4바이트라 `4UL * index`가 들어가요. 인덱스를 `(uint32_t)`로 바꾸고 상수에 `UL`을 붙이는 건 주소 계산을 **부호 없는 32비트**로 하기 위해서예요.\n\n### 두 함수를 나눈 이유\n| 함수 | 대상 | 방식 | 이유 |\n|---|---|---|---|\n| `GpioBare_SetOutput` | MSCR (32비트) | 읽기-수정-쓰기 | 다른 설정 비트 보존 |\n| `GpioBare_Write` | GPDO (8비트) | 단순 쓰기 | 의미 있는 비트가 bit 0 하나 |\n\n- MSCR29가 `0x00000000`이면 SetOutput 결과는 **`0x00200000`**이에요. `value |= SIUL2_MSCR_SSS_GPIO;`는 0을 OR하니 값은 안 바뀌지만 \"**SSS = GPIO**\"라는 의도를 코드로 드러내는 줄이에요.\n- `(level != 0U) ? 1U : 0U`는 **0/1 정규화** → 누가 `level`에 5를 넘겨도 1만 써서 bit 0 말고 다른 비트에는 값을 넣지 않아요.\n- `#ifndef GPIO_BARE_H`는 같은 헤더가 두 번 포함돼도 한 번만 처리되게 하는 **include guard**, `static inline`은 헤더에 함수 본문을 둬도 여러 파일에서 include할 때 **중복 정의 오류가 없게** 하고 호출 오버헤드도 줄여요.", "tip": "빈칸 단골: GPDO 매크로 = **`volatile uint8_t *`**, MSCR 매크로 = **`volatile uint32_t *`** + 간격 **`4UL *`**, 역순 공식의 **`~3UL`**·**`3UL -`** 자리. `GpioBare_Write(29U, 5U)` → GPDO29에 **1**."}, {"id": "c2-main", "title": "main.c — 조건부 컴파일과 LED 점멸 흐름", "sec": ["11. main.c — 두 접근 방식을 매크로로 전환하며 LED 점멸"], "tags": ["main.c", "USE_SDK_HEADER_ACCESS", "#if", "LedInit", "LedWrite", "Delay", "for (;;)"], "body": "main.c는 `gpio_bare.h`(직접 경로)와 `S32K312.h`(SDK 경로)를 함께 include하고, `USE_SDK_HEADER_ACCESS`로 둘 중 한쪽만 골라 빌드해요.\n\n```c\n#define USE_SDK_HEADER_ACCESS  (0)       // 0: 직접 주소 / 1: SDK 헤더 — 먼저 0으로 확인\n#define LED_RED_MSCR_INDEX     (29UL)    // MSCR 번호와\n#define LED_RED_GPDO_INDEX     (29UL)    // GPDO 번호를 따로 정의\n#define LED_RED_ACTIVE_HIGH    (1U)\n\nstatic void Delay(volatile uint32_t count)\n{\n    while (count > 0UL) { count--; }     // volatile: 빈 루프 삭제 방지\n}\nstatic uint8_t LedOnLevel(void)  { return (LED_RED_ACTIVE_HIGH != 0U) ? 1U : 0U; }\nstatic uint8_t LedOffLevel(void) { return (LED_RED_ACTIVE_HIGH != 0U) ? 0U : 1U; }\n\nstatic void LedInit(void)\n{\n#if (USE_SDK_HEADER_ACCESS == 1)\n    uint32_t value;\n    value = IP_SIUL2->MSCR[LED_RED_MSCR_INDEX];\n    value &= ~SIUL2_MSCR_SSS_MASK;\n    value |= SIUL2_MSCR_OBE_MASK;\n    value |= SIUL2_MSCR_SSS_GPIO;\n    IP_SIUL2->MSCR[LED_RED_MSCR_INDEX] = value;\n    IP_SIUL2->GPDO29 = LedOffLevel();    // 초기 상태 = 꺼짐\n#else\n    GpioBare_SetOutput(LED_RED_MSCR_INDEX);\n    GpioBare_Write(LED_RED_GPDO_INDEX, LedOffLevel());   // 초기 상태 = 꺼짐\n#endif\n}\n\nstatic void LedWrite(uint8_t on)\n{\n    uint8_t level;\n    level = (on != 0U) ? LedOnLevel() : LedOffLevel();\n#if (USE_SDK_HEADER_ACCESS == 1)\n    IP_SIUL2->GPDO29 = level;\n#else\n    GpioBare_Write(LED_RED_GPDO_INDEX, level);\n#endif\n}\n\nint main(void)\n{\n    LedInit();\n    for (;;)\n    {\n        LedWrite(1U);\n        Delay(4000000UL);\n        LedWrite(0U);\n        Delay(4000000UL);\n    }\n}\n```\n\n```wave LED 점멸 타이밍 — LedInit에서 꺼짐으로 시작, 이후 켜짐/꺼짐 반복\n@mark 1 무한 루프 시작\n코드: = = . = . = . = . | Init, LedWrite(1), LedWrite(0), LedWrite(1), LedWrite(0)\nGPDO29: 0 1 . 0 . 1 . 0 .\nD13 LED: 0 1 . 0 . 1 . 0 .\nActive Low라면: 1 0 . 1 . 0 . 1 .\n@span 1-2 Delay(4000000UL)\n@span 3-4 Delay(4000000UL)\n```\n\n### 레지스터 값으로 따라가기 (직접 경로, Active High)\n1. **`LedInit()`** → `GpioBare_SetOutput(29)`가 MSCR29에 OBE = 1, SSS = 0을 넣어요(원래 0이었다면 `0x00200000`). 이어서 GPDO29 = **0** → LED **꺼짐**으로 시작해요.\n2. **`LedWrite(1U)`** → `LedOnLevel()` = 1 → GPDO29(`0x4029131E`) = 1 → PTA29 High → **D13 켜짐**.\n3. **`Delay(4000000UL)`** → 카운터를 4,000,000번 줄이는 동안 CPU가 그냥 기다려요(**busy-wait**).\n4. **`LedWrite(0U)`** → GPDO29 = 0 → **꺼짐**, 다시 Delay.\n5. `for (;;)`라서 2~4가 끝없이 반복되며 **점멸**해요.\n\n### 핵심 포인트\n- `#if (USE_SDK_HEADER_ACCESS == 1)` … `#else` … `#endif`는 **전처리기 조건부 컴파일**이에요. 조건에 맞는 쪽만 남고 나머지는 **아예 컴파일되지 않아요**(실행 중 `if`로 고르는 것과 달라요).\n- 두 경로 모두 **같은 두 주소**(`0x402902B4`, `0x4029131E`)에 같은 값을 써요 → 1로 바꿔 다시 빌드해도 **같은 LED가 같은 주기로** 깜빡여야 정상이에요. SDK 경로도 비트 마스크(`SIUL2_MSCR_OBE_MASK` 등)는 `gpio_bare.h` 것을 그대로 써요.\n- `LedInit()`이 두 경로 모두 처음에 **꺼짐**을 쓰는 이유: 전원 인가 직후 LED가 **잠깐 켜지는 현상**을 막기 위해서예요.\n- `Delay(4000000UL)`의 실제 시간은 코어 클럭과 컴파일 결과에 따라 달라요. 목표는 정확한 1초가 아니라 **사람 눈에 보이는 간격**이에요.\n- 파형의 \"Active Low라면\" 줄은 `LED_RED_ACTIVE_HIGH`만 0일 때 GPDO에 써지는 값이에요. 타이밍은 같고 **전기 레벨만 반대**예요.", "tip": "\"`#if`는 실행 중에 두 경로를 골라 실행\" ✗ → 전처리기가 컴파일 전에 한쪽만 남겨요. `LED_RED_ACTIVE_HIGH (1U)`일 때 `LedInit()` 직후 GPDO29 = **0**(꺼짐), 무한 반복 구조 = **`for (;;)`**."}, {"id": "c2-lab", "title": "실습 준비 · 빌드 · 실행 · 문제 해결", "sec": ["9. 실습 준비 — 사양, 환경, 프로젝트 생성", "12. 빌드·실행·비교와 문제 해결"], "tags": ["chap02_gpio_bare", "Config Tools 없음", "Run → Resume", "Debug_FLASH_PNE", "S32K312.h", "문제 해결"], "body": "**목표**: S32K312EVB-Q172의 RGB LED 중 **빨간색 채널(D13)**을 점멸해요. 1장과 달리 **Config Tools 없이 코드만으로** 레지스터를 제어해요.\n\n| 구분 | 1장 (UART) | 2장 (GPIO) |\n|---|---|---|\n| Config Tools | 사용 (.mex) | 사용하지 않음 |\n| 드라이버 | RTD IP (`Lpuart_Uart_Ip_*`) | 없음 — 레지스터 직접 |\n| 작성 파일 | `src/main.c` | `src/gpio_bare.h`(신규) + `src/main.c`(변경) |\n| 결과 확인 | PC 터미널 글자 | D13 빨간 LED 점멸 |\n\n### 프로젝트 생성 (File → New → S32DS Application Project)\n- Project name **`chap02_gpio_bare`** (사양 슬라이드·교재 표기는 `week02_gpio_bare` — 실습 절차는 `chap02_…` 기준)\n- Device / Core: **S32K312 / Cortex-M7**, **SDK/RTD: 필요 없음**\n- Toolchain / Debugger: Design Studio GCC 10.2 / PEmicro\n- `.project`·`.cproject`·`Project_Settings/`·`include/`는 생성 파일이고, 학생이 손대는 건 **`src/gpio_bare.h`**(src 우클릭 → New → Header File)와 **`src/main.c`**뿐이에요.\n- 진행은 두 단계: **1단계** `USE_SDK_HEADER_ACCESS = 0`(직접 주소) → 동작하면 **2단계** `= 1`(`IP_SIUL2` 구조체)로 바꿔 비교.\n- 사양 짝: LED **D13 / RGBLED0_RED**, MCU 핀 **PTA29**, MSCR 번호 **29**, GPIO/GPDO 번호 **29**, **Active High**.\n\n### 빌드 → 플래시 → 실행\n1. **Build**: Project → Build Project → **0 errors**, `Debug_FLASH/chap02_gpio_bare.elf` 생성\n2. **연결**: OpenSDA USB 포트를 PC에 연결\n3. **Debug**: Run → Debug → `chap02_gpio_bare_Debug_FLASH_PNE` (PEmicro가 보드 Flash에 기록)\n4. **Resume**: `main()`에서 멈추면 **Run → Resume**을 눌러야 LED가 움직여요\n5. **SDK 비교**: `#define USE_SDK_HEADER_ACCESS (1)`로 바꿔 다시 Build → Debug → Resume → **같은 LED·같은 주기**로 점멸하면 성공\n\nDebug Configurations 확인 값: Main 탭 C/C++ Application = `Debug_FLASH/chap02_gpio_bare.elf`, Debugger 탭 Interface = **OpenSDA Embedded Debug - USB Port**, Device = **S32K312**. 이번 장은 UART 출력이 없어서 결과를 터미널이 아니라 **LED로** 판단해요.\n\n### 문제 해결 — 증상별\n| 증상 | 원인 후보 | 확인할 것 |\n|---|---|---|\n| 빌드는 되는데 LED가 안 켜짐 | 전원·연결, 디버거 정지 | 전원·USB, Run → Resume |\n| 계속 켜짐/꺼짐으로 보임 | Delay가 짧음, 코드 정지 | `Delay()` 값 늘리기, Debug 상태 |\n| 초록/파랑 LED가 켜짐 | GPDO 번호·헤더 필드 오류 | GPIO[29], GPDO29, PTA29 재확인 |\n| `IP_SIUL2` 미정의 | 헤더 include | `S32K312.h` include와 include path |\n| `GPDO29` 필드 없음 | 디바이스 선택 | 프로젝트가 S32K312인지 |\n| Debug 연결 실패 | 디버거 설정 | Interface·Device 확인, 보드 재연결 |\n\n- 초록/파랑 LED가 켜졌다면 빨간색(PTA29)이 아닌 **다른 핀**을 건드렸다는 뜻이에요. 교재 기준 초록은 **PTA30**(D14), 파랑은 **PTA31**이라 인덱스를 30·31로 잡으면 바로 이 증상이 나와요. SDK 방식이라면 `GPDO29` 대신 다른 필드 이름을 고른 경우예요.\n- 디버거 문제는 **보드 전원 → USB 케이블(데이터용인지) → Interface 설정(OpenSDA) → Device 설정(S32K312)** 순서로 좁혀 가요.", "tip": "\"2장도 Config Tools로 핀을 설정한다\" ✗, 프로젝트 생성 시 SDK/RTD = **필요 없음**. 초록/파랑 LED → **GPDO 번호·헤더 필드 오류**(전원 문제 ✗). 매크로를 1로 바꿔도 **같은 D13이 같은 주기로** 점멸하면 성공."}]}, {"ch": 3, "title": "GPIO — IPL과 MCAL 사용하기", "summary": "2장과 같은 D13(PTA29) LED를 RTD IPL(Siul2_Port_Ip/Siul2_Dio_Ip, 포트 half + 핀 번호)과 MCAL(Port/Dio, 논리 채널 이름)로 점멸시키며, 설정은 Config Tools가 생성하고 main.c는 생성 이름만 쓰는 계층 구조를 비교해요.", "sections": [{"id": "c3-why", "title": "직접 접근의 한계와 추상화의 정의", "sec": ["1. 왜 다시 GPIO인가 — 직접 접근의 한계"], "tags": ["추상화", "하드웨어 의존성", "SIUL2_GPDO(29U)", "보드 교체", "리뷰 비용"], "body": "2장에선 LED 하나를 켜려고 응용 코드가 SIUL2 base `0x40290000`, MSCR 오프셋 `0x0240`, GPDO 오프셋 `0x1300`, 바이트 역순 배치까지 알아야 했어요. 그래서 `SIUL2_GPDO(29U) = 1U;` 한 줄이 **`0x4029131E`에 1을 쓰는 일**이 됐어요. LED 하나일 땐 하드웨어를 배우기에 좋지만, 핀·파일이 수십 개가 되면 문제가 커져요.\n\n```svg 2장 방식은 하드웨어 의존성이 여러 파일에 흩어지고, 추상화는 그것을 한 계층에 모아요\n<svg viewBox=\"0 0 680 206\" xmlns=\"http://www.w3.org/2000/svg\">\n  <text x=\"168\" y=\"18\" text-anchor=\"middle\" class=\"t-a\">2장 직접 접근 — 의존성이 흩어짐<\/text>\n  <rect x=\"16\" y=\"32\" width=\"92\" height=\"56\" rx=\"10\" class=\"box\"/>\n  <text x=\"62\" y=\"54\" text-anchor=\"middle\" class=\"t-b\">파일 A<\/text>\n  <text x=\"62\" y=\"74\" text-anchor=\"middle\" class=\"t-s\">주소·오프셋<\/text>\n  <rect x=\"122\" y=\"32\" width=\"92\" height=\"56\" rx=\"10\" class=\"box\"/>\n  <text x=\"168\" y=\"54\" text-anchor=\"middle\" class=\"t-b\">파일 B<\/text>\n  <text x=\"168\" y=\"74\" text-anchor=\"middle\" class=\"t-s\">주소·오프셋<\/text>\n  <rect x=\"228\" y=\"32\" width=\"92\" height=\"56\" rx=\"10\" class=\"box\"/>\n  <text x=\"274\" y=\"54\" text-anchor=\"middle\" class=\"t-b\">파일 C<\/text>\n  <text x=\"274\" y=\"74\" text-anchor=\"middle\" class=\"t-s\">주소·오프셋<\/text>\n  <line x1=\"62\" y1=\"89\" x2=\"62\" y2=\"144\" class=\"ln-e\" marker-end=\"url(#ah-e)\"/>\n  <line x1=\"168\" y1=\"89\" x2=\"168\" y2=\"144\" class=\"ln-e\" marker-end=\"url(#ah-e)\"/>\n  <line x1=\"274\" y1=\"89\" x2=\"274\" y2=\"144\" class=\"ln-e\" marker-end=\"url(#ah-e)\"/>\n  <rect x=\"16\" y=\"148\" width=\"304\" height=\"44\" rx=\"10\" class=\"box-c\"/>\n  <text x=\"168\" y=\"167\" text-anchor=\"middle\" class=\"t-b\">SIUL2 레지스터<\/text>\n  <text x=\"168\" y=\"184\" text-anchor=\"middle\" class=\"t-s\">MSCR · GPDO<\/text>\n  <line x1=\"340\" y1=\"8\" x2=\"340\" y2=\"198\" class=\"ln dash\"/>\n  <text x=\"512\" y=\"18\" text-anchor=\"middle\" class=\"t-a\">추상화 — 한 계층에 모음<\/text>\n  <rect x=\"360\" y=\"32\" width=\"92\" height=\"44\" rx=\"10\" class=\"box\"/>\n  <text x=\"406\" y=\"50\" text-anchor=\"middle\" class=\"t-b\">파일 A<\/text>\n  <text x=\"406\" y=\"68\" text-anchor=\"middle\" class=\"t-s\">API 호출<\/text>\n  <rect x=\"466\" y=\"32\" width=\"92\" height=\"44\" rx=\"10\" class=\"box\"/>\n  <text x=\"512\" y=\"50\" text-anchor=\"middle\" class=\"t-b\">파일 B<\/text>\n  <text x=\"512\" y=\"68\" text-anchor=\"middle\" class=\"t-s\">API 호출<\/text>\n  <rect x=\"572\" y=\"32\" width=\"92\" height=\"44\" rx=\"10\" class=\"box\"/>\n  <text x=\"618\" y=\"50\" text-anchor=\"middle\" class=\"t-b\">파일 C<\/text>\n  <text x=\"618\" y=\"68\" text-anchor=\"middle\" class=\"t-s\">API 호출<\/text>\n  <line x1=\"406\" y1=\"77\" x2=\"406\" y2=\"92\" class=\"ln-b\" marker-end=\"url(#ah-b)\"/>\n  <line x1=\"512\" y1=\"77\" x2=\"512\" y2=\"92\" class=\"ln-b\" marker-end=\"url(#ah-b)\"/>\n  <line x1=\"618\" y1=\"77\" x2=\"618\" y2=\"92\" class=\"ln-b\" marker-end=\"url(#ah-b)\"/>\n  <rect x=\"360\" y=\"96\" width=\"304\" height=\"40\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"512\" y=\"113\" text-anchor=\"middle\" class=\"t-b\">드라이버 계층<\/text>\n  <text x=\"512\" y=\"129\" text-anchor=\"middle\" class=\"t-s\">주소·오프셋·접근 폭은 여기에만<\/text>\n  <line x1=\"512\" y1=\"137\" x2=\"512\" y2=\"150\" class=\"ln-c\" marker-end=\"url(#ah-c)\"/>\n  <rect x=\"360\" y=\"154\" width=\"304\" height=\"38\" rx=\"10\" class=\"box-c\"/>\n  <text x=\"512\" y=\"178\" text-anchor=\"middle\" class=\"t-b\">SIUL2 레지스터<\/text>\n<\/svg>\n```\n\n### 슬라이드가 든 직접 접근의 문제 4가지\n- **흩어짐**: 핀 번호·주소·오프셋 계산이 여러 파일에 퍼져요.\n- **보드 교체**: LED가 다른 핀으로 가면 그 숫자가 들어간 **모든 사용처를 찾아** 고쳐야 해요.\n- **제각각**: 팀원 A는 매크로, B는 포인터 — 같은 레지스터를 **서로 다른 방식**으로 제어해요.\n- **리뷰 부담**: 리뷰어가 비트 값을 **매번 레퍼런스 매뉴얼과 대조**해야 해요.\n\n| | 2장 직접 접근 | 추상화 후 |\n|---|---|---|\n| 하드웨어 숫자 위치 | 여러 파일에 흩어짐 | 드라이버 계층 한 곳 |\n| 보드 교체 시 | 모든 사용처 수정 | 아래 계층만 교체 |\n| 리뷰 대상 | 매 줄의 비트 값 | API 호출과 설정 |\n\n### 추상화의 정의 (빈칸으로 그대로 나와요)\n추상화는 하드웨어를 모르게 만드는 장치가 아니라, **하드웨어 의존성을 어디에 모아 둘지 결정하는 설계 방법**이에요. 추상화해도 의존성은 **사라지지 않아요** — 누군가는 여전히 `0x4029131E`를 알아야 해요. 그래서 질문이 \"하드웨어를 **감출** 것인가?\" → \"하드웨어 의존성을 **어느 계층에 둘** 것인가?\"로 바뀌어요.\n\n비유하면 엘리베이터 버튼이에요. 위층(응용)은 \"3층\" 버튼만 누르고, 모터·브레이크 제어는 아래층(드라이버)이 맡아요.", "tip": "\"추상화 = 하드웨어를 **모르게** 만드는 장치\"는 ✗ — **하드웨어 의존성을 어느 계층에 모아 둘지 정하는 설계 방법**이에요. 문제점 4가지(흩어짐·보드 교체·제각각·리뷰 부담) 밖의 보기를 골라내는 문제가 나와요."}, {"id": "c3-layers", "title": "추상화 계층과 RTD 용어 (HLD · IPL · HAL)", "sec": ["2. 추상화 계층과 RTD 용어"], "tags": ["MCAL", "IPL", "HLD", "HAL", "AUTOSAR BSW/RTE", "이식성"], "body": "같은 LED를 켜는 코드가 **어느 층으로 들어가느냐**만 달라요. 아래로 갈수록 하드웨어에 가깝고, 위로 갈수록 `main.c`에서 하드웨어 숫자가 사라져요.\n\n```svg 3장 전체 지도 — 같은 LED, 세 가지 입구\n<svg viewBox=\"0 0 680 344\" xmlns=\"http://www.w3.org/2000/svg\">\n  <text x=\"8\" y=\"22\" class=\"t-a\">main.c는 어느 층으로 들어가나?<\/text>\n  <text x=\"8\" y=\"44\" class=\"t-s\">아래로 갈수록 하드웨어에 가깝고,<\/text>\n  <text x=\"8\" y=\"62\" class=\"t-s\">위로 갈수록 응용 코드에서<\/text>\n  <text x=\"8\" y=\"80\" class=\"t-s\">하드웨어 숫자가 사라져요.<\/text>\n  <rect x=\"290\" y=\"8\" width=\"300\" height=\"40\" rx=\"10\" class=\"box\"/>\n  <text x=\"440\" y=\"25\" text-anchor=\"middle\" class=\"t-b\">Application<\/text>\n  <text x=\"440\" y=\"41\" text-anchor=\"middle\" class=\"t-s\">응용 로직 · main.c<\/text>\n  <rect x=\"290\" y=\"62\" width=\"300\" height=\"40\" rx=\"10\" class=\"box-0 dash\"/>\n  <text x=\"440\" y=\"79\" text-anchor=\"middle\" class=\"t-b\">AUTOSAR BSW / RTE<\/text>\n  <text x=\"440\" y=\"95\" text-anchor=\"middle\" class=\"t-s\">서비스·통신·OS — 이번 실습은 거치지 않음<\/text>\n  <rect x=\"290\" y=\"116\" width=\"300\" height=\"48\" rx=\"10\" class=\"box-a\"/>\n  <text x=\"440\" y=\"136\" text-anchor=\"middle\" class=\"t-b\">MCAL (RTD 용어: HLD)<\/text>\n  <text x=\"440\" y=\"155\" text-anchor=\"middle\" class=\"t-s\">Port · Dio · Gpt · Adc · Can …<\/text>\n  <rect x=\"290\" y=\"178\" width=\"300\" height=\"48\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"440\" y=\"198\" text-anchor=\"middle\" class=\"t-b\">IPL (IP Level driver)<\/text>\n  <text x=\"440\" y=\"217\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"12\">Siul2_Port_Ip · Siul2_Dio_Ip<\/text>\n  <rect x=\"290\" y=\"240\" width=\"300\" height=\"40\" rx=\"10\" class=\"box-c\"/>\n  <text x=\"440\" y=\"257\" text-anchor=\"middle\" class=\"t-b\">레지스터 / 베어메탈<\/text>\n  <text x=\"440\" y=\"273\" text-anchor=\"middle\" class=\"t-s\">SIUL2 MSCR29 · GPDO (2장)<\/text>\n  <rect x=\"290\" y=\"294\" width=\"300\" height=\"42\" rx=\"10\" class=\"box-e\"/>\n  <text x=\"440\" y=\"312\" text-anchor=\"middle\" class=\"t-b\">PTA29 핀 → D13 LED<\/text>\n  <text x=\"440\" y=\"329\" text-anchor=\"middle\" class=\"t-s\">RGBLED0_RED · Active High<\/text>\n  <line x1=\"440\" y1=\"49\" x2=\"440\" y2=\"60\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"440\" y1=\"103\" x2=\"440\" y2=\"114\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"440\" y1=\"165\" x2=\"440\" y2=\"176\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"440\" y1=\"227\" x2=\"440\" y2=\"238\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"440\" y1=\"281\" x2=\"440\" y2=\"292\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <rect x=\"8\" y=\"116\" width=\"250\" height=\"48\" rx=\"10\" class=\"box-a\"/>\n  <text x=\"20\" y=\"136\" class=\"t-b\">③ 3장 MCAL<\/text>\n  <text x=\"20\" y=\"155\" font-family=\"monospace\" font-size=\"12\">Dio_WriteChannel(…)<\/text>\n  <line x1=\"259\" y1=\"140\" x2=\"286\" y2=\"140\" class=\"ln-a\" marker-end=\"url(#ah-a)\"/>\n  <rect x=\"8\" y=\"178\" width=\"250\" height=\"48\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"20\" y=\"198\" class=\"t-b\">② 3장 IPL<\/text>\n  <text x=\"20\" y=\"217\" font-family=\"monospace\" font-size=\"12\">Siul2_Dio_Ip_WritePin(…)<\/text>\n  <line x1=\"259\" y1=\"202\" x2=\"286\" y2=\"202\" class=\"ln-b\" marker-end=\"url(#ah-b)\"/>\n  <rect x=\"8\" y=\"240\" width=\"250\" height=\"40\" rx=\"10\" class=\"box\"/>\n  <text x=\"20\" y=\"257\" class=\"t-b\">① 2장 직접 접근<\/text>\n  <text x=\"20\" y=\"273\" font-family=\"monospace\" font-size=\"12\">SIUL2_GPDO(29U) = 1U;<\/text>\n  <line x1=\"259\" y1=\"260\" x2=\"286\" y2=\"260\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <path d=\"M598,118 L610,118 L610,224 L598,224\" class=\"ln\"/>\n  <text x=\"644\" y=\"160\" text-anchor=\"middle\" class=\"t-b\">HAL<\/text>\n  <text x=\"644\" y=\"178\" text-anchor=\"middle\" class=\"t-s\">= IPL<\/text>\n  <text x=\"644\" y=\"194\" text-anchor=\"middle\" class=\"t-s\">+ MCAL<\/text>\n<\/svg>\n```\n\n### 위 → 아래 계층 순서\n**Application → AUTOSAR BSW/RTE → MCAL → IPL → 레지스터/베어메탈**. 각 층은 **바로 아래 층을 함수 이름으로 감싸서**, 위 층이 하드웨어 세부를 몰라도 동작하게 해요. 이번 실습은 BSW/RTE 층을 **거치지 않아요**(완전한 AUTOSAR 앱을 만드는 게 아님).\n\n| 층 | 이 장의 예 | RTD가 부르는 이름 |\n|---|---|---|\n| MCAL | `Dio_WriteChannel()` | **HLD** (High Level Driver) |\n| IPL (가장 낮은 레벨) | `Siul2_Dio_Ip_WritePin()` | **IPL** (IP Level driver) |\n| 레지스터 | `SIUL2_GPDO(29U)` | 베어메탈 (드라이버 없음) |\n| 일반 용어 HAL | IPL + MCAL | 슬라이드 6 기준 |\n\n- **HLD ≠ HAL**: HLD는 RTD가 MCAL용 함수를 부르는 이름, HAL은 업계 일반 용어(Hardware Abstraction Layer)예요.\n- 교재 47쪽은 IPL 칸을 \"**HAL 또는 IPL**\"로 적었지만, 시험 답은 **슬라이드 기준 HAL = IPL + MCAL**이 안전해요.\n\n### 대가와 이득은 한 세트\n- **대가**: 층을 지날 때마다 호출이 한 겹씩 늘어 **코드가 늘고 빌드가 커져요**(10절의 MCAL `.text`가 더 클 수 있는 이유).\n- **이득 ① 이식성** — MCU가 바뀌어도 응용 코드는 그대로, 드라이버만 교체\n- **이득 ② 안전성** — 표준 인터페이스로 인증된 드라이버를 여러 차종에 재사용\n- **이득 ③ 검증 비용** — 한 번 검증한 계층을 재사용, 레지스터 코드를 매번 재검증하지 않음\n\n작은 실습에선 손해처럼 보여도 **여러 차종·여러 MCU·여러 팀**이 얽히면 이득이 훨씬 커요.", "tip": "MCAL과 IPL의 **위아래를 바꾼** 순서 보기가 단골 오답이에요. RTD 용어: MCAL = **HLD**, 가장 낮은 레벨 = **IPL**, 일반 HAL = **IPL + MCAL**. \"추상화하면 코드·빌드가 작아진다\"는 ✗."}, {"id": "c3-ipl", "title": "IPL — Siul2_Dio_Ip_WritePin과 포트 half", "sec": ["3. IPL — SIUL2 IP-level driver"], "tags": ["Siul2_Dio_Ip_WritePin", "Siul2_Port_Ip_Init", "PTA_H_HALF", "PTA_L_HALF", "13U", "SIUL2"], "body": "**IPL**(IP-level driver)은 특정 하드웨어 IP에 가까운 벤더 드라이버예요. S32K312의 GPIO는 **SIUL2** IP에 있어서 RTD 7.0.1이 `Siul2_…_Ip_*()` 함수를 줘요. 2장의 C 매크로 한 줄이 3장에선 C 함수 한 줄이 돼요.\n\n```svg 왜 13U인가 — PTA 32핀은 16핀씩 두 half로 나뉘고, PTA29는 high half의 13번이에요\n<svg viewBox=\"0 0 680 196\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"28\" y=\"8\" width=\"312\" height=\"24\" rx=\"6\" class=\"box\"/>\n  <text x=\"184\" y=\"25\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"12\">PTA_L_HALF · PTA0 ~ PTA15<\/text>\n  <rect x=\"340\" y=\"8\" width=\"312\" height=\"24\" rx=\"6\" class=\"box-b\"/>\n  <text x=\"496\" y=\"25\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"12\">PTA_H_HALF · PTA16 ~ PTA31<\/text>\n  <rect x=\"28\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box\"/>\n  <text x=\"37.75\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">0<\/text>\n  <rect x=\"47.5\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box\"/>\n  <text x=\"57.25\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">1<\/text>\n  <rect x=\"67\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box\"/>\n  <text x=\"76.75\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">2<\/text>\n  <rect x=\"86.5\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box\"/>\n  <text x=\"96.25\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">3<\/text>\n  <rect x=\"106\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box\"/>\n  <text x=\"115.75\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">4<\/text>\n  <rect x=\"125.5\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box\"/>\n  <text x=\"135.25\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">5<\/text>\n  <rect x=\"145\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box\"/>\n  <text x=\"154.75\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">6<\/text>\n  <rect x=\"164.5\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box\"/>\n  <text x=\"174.25\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">7<\/text>\n  <rect x=\"184\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box\"/>\n  <text x=\"193.75\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">8<\/text>\n  <rect x=\"203.5\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box\"/>\n  <text x=\"213.25\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">9<\/text>\n  <rect x=\"223\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box\"/>\n  <text x=\"232.75\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">10<\/text>\n  <rect x
