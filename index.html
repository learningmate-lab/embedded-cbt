<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="https://learningmate-lab.github.io/track.js" data-site="embedded-cbt" defer></script>
<title>임베디드 랩</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1418">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* 임베디드 랩: 개발 도구(IDE)·기판 느낌의 어두운 화면. 초록 = 통과/켜짐(LED), 호박색 = 주의, 빨강 = 실패 */
:root {
  color-scheme: dark;
  --bg: #0e1418; --bg2: #0a0f12; --panel: #151d22; --panel2: #1b252b; --line: #2a3840; --line2: #354750;
  --text: #e4ecef; --text-2: #c2d0d6; --mut: #8fa3ac; --muted: #8fa3ac;
  --acc: #3ddc97; --acc-soft: #12372a; --amber: #ffb547; --amber-soft: #3a2c10; --red: #ff6f6f; --red-soft: #3b1a1c; --cyan: #6cc8ff; --cyan-soft: #12303f; --violet: #b9a2ff;
  --ui: "Noto Sans KR", system-ui, sans-serif; --mono: "JetBrains Mono", Consolas, "D2Coding", ui-monospace, monospace;
  /* 그림(노트 도식) 색 — 어두운 바탕용 */
  --dg-bg: #111a1f; --dg-sub: #b4c4ca; --panel-ink: #0e1418; --accent: #3ddc97; --code-bg: #0b1114; --code-line: #2a3840;
  --d-a-f: #12485a; --d-a-s: #79cfe6; --d-b-f: #4d380e; --d-b-s: #f5c06a; --d-c-f: #124b2f; --d-c-s: #7edca7;
  --d-d-f: #362a62; --d-d-s: #c3aefb; --d-e-f: #59202c; --d-e-s: #ffa5b1; --d-0-f: #2d3f47; --d-0-s: #849ea7; --d-ln: #b6c6cc;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.65 var(--ui); min-height: 100vh; -webkit-text-size-adjust: 100%;
  background-image: radial-gradient(circle at 1px 1px, #ffffff0a 1px, transparent 0); background-size: 22px 22px; }
button { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); }
/* 합자 끄기: |= · != · << 가 기호 하나(⊨ 등)로 바뀌어 보이면 시험 코드가 헷갈려요 */
* { font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
.mut { color: var(--mut); }
a { color: var(--cyan); }

/* 상단 바 */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg2); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.top .in { max-width: 1440px; margin: 0 auto; height: 54px; display: flex; align-items: center; gap: 14px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; border: 0; background: none; cursor: pointer; padding: 0; flex: none; }
.chipico { width: 28px; height: 28px; flex: none; }
.brand b { font-weight: 800; font-size: 15.5px; letter-spacing: -.2px; }
.brand small { font: 600 11px var(--mono); color: var(--acc); display: block; line-height: 1; margin-top: 2px; }
.brand .bt { text-align: left; line-height: 1.15; }
.tabs { display: flex; gap: 2px; height: 100%; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: none; color: var(--mut); padding: 0 12px; font-weight: 700; font-size: 14px; cursor: pointer; position: relative; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.tabs button:hover { color: var(--text); }
.tabs button.on { color: var(--text); }
.tabs button.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; background: var(--acc); box-shadow: 0 0 8px var(--acc); }
.bdg { background: var(--red); color: #1a0505; font: 800 11px var(--mono); border-radius: 999px; padding: 0 6px; line-height: 17px; }
.top .r { display: flex; align-items: center; gap: 10px; margin-left: auto; flex: none; }
.clock { font: 600 14px var(--mono); color: var(--amber); background: var(--amber-soft); padding: 3px 10px; border-radius: 6px; }
.rec { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.mode-l { font-size: 13px; color: var(--mut); max-width: 36vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); }

/* 버튼 · 입력 */
.btn { border: 1px solid var(--line2); background: var(--panel2); color: var(--text); border-radius: 8px; padding: 7px 15px; font-weight: 700; cursor: pointer; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--mut); }
.btn.pri { background: var(--acc); border-color: var(--acc); color: #04150d; }
.btn.pri:hover { background: #5ce8ab; }
.btn:disabled { opacity: .4; cursor: default; }
.btn code { font-size: 12px; color: var(--cyan); font-weight: 600; }
.lnk { border: 0; background: none; color: var(--cyan); font-weight: 700; cursor: pointer; padding: 0; font-size: inherit; }
.btn:focus-visible, .opt:focus-visible, .tabs button:focus-visible, .lnk:focus-visible, .tpc:focus-visible, .seg button:focus-visible, .pick-g button:focus-visible, .bit:focus-visible, .tcard:focus-visible, .chcard:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.fld { display: grid; gap: 4px; font-size: 12.5px; color: var(--mut); font-weight: 700; min-width: 0; flex: 1 1 200px; }
.fld.sm { flex: 0 1 140px; } .fld.wide { flex: 1 1 100%; }
.fld input, .fld select { font: 600 15px var(--mono); color: var(--text); background: var(--bg2); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; }
.fld input:focus, .fld select:focus { outline: 2px solid var(--acc); outline-offset: 0; border-color: var(--acc); }
.fld input.bad { border-color: var(--red); }
.chk { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--text-2); align-self: end; padding-bottom: 8px; }
.chk input { width: 17px; height: 17px; accent-color: var(--acc); }

/* 공통 */
.wrap { max-width: 1240px; margin: 0 auto; padding: 26px max(16px, env(safe-area-inset-right, 0px)) 90px max(16px, env(safe-area-inset-left, 0px)); }
.wrap.narrow { max-width: 860px; }
h1 { font-size: 28px; margin: 0; letter-spacing: -.4px; line-height: 1.3; text-wrap: balance; }
h2 { font-size: 19px; margin: 0; }
.eyebrow { margin: 0 0 4px; font: 700 12px var(--mono); color: var(--acc); letter-spacing: .3px; }
.sub { color: var(--mut); margin: 6px 0 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-top: 16px; }
.panel h3 { margin: 0 0 12px; font-size: 15px; }
.chip { font: 700 11.5px var(--mono); padding: 2px 8px; border-radius: 6px; background: var(--panel2); color: var(--text-2); border: 1px solid var(--line2); white-space: nowrap; }
.chip.cat { color: var(--acc); border-color: #1f5a41; background: var(--acc-soft); }
.chip.lv1 { color: var(--cyan); border-color: #1d4d66; background: var(--cyan-soft); } .chip.lv2 { color: var(--amber); border-color: #6b4d14; background: var(--amber-soft); } .chip.lv3 { color: var(--red); border-color: #6e2a2d; background: var(--red-soft); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--acc); border-radius: 3px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 30px 0 12px; }
.sec-h span { color: var(--mut); font-size: 13.5px; }
.led { width: 10px; height: 10px; border-radius: 50%; background: #3a4a52; flex: none; display: inline-block; }
.led.g { background: var(--acc); box-shadow: 0 0 8px var(--acc); } .led.a { background: var(--amber); box-shadow: 0 0 8px var(--amber); } .led.r { background: var(--red); box-shadow: 0 0 8px var(--red); }

/* 홈: 보드 */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: stretch; }
.hero-t h1 { font-size: 30px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 10px; align-content: start; }
.stat .big { font: 700 34px/1 var(--mono); color: var(--acc); }
.stat .big small { font-size: 15px; color: var(--mut); }
.stat dl { margin: 0; display: grid; gap: 6px; font-size: 13.5px; }
.stat dl div { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding-bottom: 5px; }
.stat dt { color: var(--mut); } .stat dd { margin: 0; font: 700 13.5px var(--mono); }
.stat .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.board { margin-top: 18px; background: #0b1a16; border: 1px solid #1d3b31; border-radius: 16px; padding: 10px; position: relative; overflow: hidden;
  background-image: linear-gradient(#ffffff06 1px, transparent 1px), linear-gradient(90deg, #ffffff06 1px, transparent 1px); background-size: 24px 24px; }
.board svg { display: block; width: 100%; height: auto; }
.board .trace { fill: none; stroke: #2f6b55; stroke-width: 3; stroke-linejoin: round; }
.board .trace.flow { stroke: var(--acc); stroke-dasharray: 6 10; animation: flow 1.2s linear infinite; opacity: 0; transition: opacity .2s; }
.board g.blk:hover .trace.flow, .board g.blk:focus .trace.flow { opacity: .9; }
.board g.blk:hover .trace:not(.flow), .board g.blk:focus .trace:not(.flow) { stroke: #3e8d6f; }
@keyframes flow { to { stroke-dashoffset: -32; } }
.board .mcu { fill: #161c20; stroke: #4c5a61; stroke-width: 2; }
.board .pinl { stroke: #9aa9b0; stroke-width: 3; }
.board .mcu-t { fill: #e4ecef; font: 800 22px var(--mono); }
.board .mcu-s { fill: #8fa3ac; font: 600 12px var(--mono); }
.board g.blk { cursor: pointer; }
.board g.blk rect.bg { fill: #10231d; stroke: #2f6b55; stroke-width: 1.5; transition: fill .15s, stroke .15s; }
.board g.blk:hover rect.bg, .board g.blk:focus rect.bg { fill: #143429; stroke: var(--acc); }
.board g.blk:focus { outline: none; }
.board .bn { fill: var(--acc); font: 800 13px var(--mono); }
.board .bt { fill: #e4ecef; font: 800 17px var(--ui); }
.board .bs { fill: #9fb4ad; font: 600 12px var(--mono); }
.board .bp { fill: #8fa3ac; font: 600 11.5px var(--ui); }
.board .pbar-bg { fill: #1f3a31; } .board .pbar-fg { fill: var(--acc); }
.board .ledc { fill: #3a4a52; } .board .ledc.g { fill: var(--acc); } .board .ledc.a { fill: var(--amber); } .board .ledc.r { fill: var(--red); }
.board .lbl { fill: #6f8a80; font: 600 11px var(--mono); }
.chlist { display: none; gap: 10px; margin-top: 16px; }
.chcard { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; text-align: left; width: 100%; }
.chcard .no { width: 38px; height: 38px; border-radius: 8px; background: var(--acc-soft); color: var(--acc); font: 800 17px var(--mono); display: grid; place-items: center; grid-row: span 2; }
.chcard b { font-size: 15px; } .chcard small { color: var(--mut); font: 600 12px var(--mono); grid-column: 2; }
.chcard .led { grid-row: 1 / span 2; grid-column: 3; }
.legend-l { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--mut); margin-top: 10px; align-items: center; }
.legend-l span { display: inline-flex; gap: 6px; align-items: center; }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.tcard { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 2px 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; text-align: left; width: 100%; }
.tcard:hover { border-color: var(--acc); }
.tcard .ti { width: 46px; height: 46px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line2); color: var(--cyan); font: 800 13px var(--mono); display: grid; place-items: center; grid-row: span 2; }
.tcard b { font-size: 14.5px; } .tcard small { color: var(--mut); font-size: 12.5px; line-height: 1.45; }
.howto { margin-top: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; }
.howto summary { cursor: pointer; font-weight: 800; }
.howto ul { margin: 10px 0 2px; padding-left: 20px; font-size: 14px; line-height: 1.8; color: var(--text-2); }
.foot { margin-top: 22px; color: var(--mut); font-size: 13px; }

/* 장(개념) 화면 */
.cwrap { max-width: 1440px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 90px max(16px, env(safe-area-inset-left, 0px)); }
.backbar { position: sticky; top: calc(55px + env(safe-area-inset-top, 0px)); z-index: 8; display: flex; align-items: center; gap: 12px; background: var(--cyan-soft); border: 1px solid #1d4d66; border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; font-size: 13.5px; color: var(--text-2); }
.mchips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.mchip { flex: none; border: 1px solid var(--line2); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-size: 13.5px; cursor: pointer; white-space: nowrap; color: var(--text-2); }
.mchip b { color: var(--acc); margin-right: 4px; font-family: var(--mono); }
.mchip.on { background: var(--acc-soft); color: var(--text); border-color: var(--acc); }
.cgrid { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 20px; margin-top: 14px; align-items: start; }
.ctoc { position: sticky; top: calc(70px + env(safe-area-inset-top, 0px)); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; display: flex; flex-direction: column; max-height: calc(100vh - 90px); overflow: auto; }
.ctoc-h { font: 700 11.5px var(--mono); color: var(--mut); padding: 2px 8px 6px; }
.ctoc a { color: var(--text-2); text-decoration: none; font-size: 13.5px; padding: 6px 8px; border-radius: 6px; line-height: 1.4; position: relative; display: flex; gap: 8px; align-items: flex-start; }
.ctoc a:hover { background: var(--panel2); color: var(--text); }
.ctoc a .n { flex: none; font: 700 11px var(--mono); color: var(--mut); width: 20px; margin-top: 2px; }
.ctoc a.on { background: var(--acc-soft); color: var(--text); font-weight: 700; }
.ctoc a.on .n { color: var(--acc); }
.ctoc a.seen:not(.on) .n { color: #4f9c7c; }
.ctoc .prog { margin: 10px 8px 2px; font: 600 11.5px var(--mono); color: var(--mut); }
.ctoc .prog .bar { margin-top: 5px; height: 4px; }
.cmain { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.chead { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.chead h1 { font-size: 25px; }
.chead .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.chead .tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; font-size: 13px; color: var(--mut); }
.tpc { border: 1px solid var(--line2); background: var(--bg2); border-radius: 6px; padding: 2px 9px; font-size: 12.5px; cursor: pointer; color: var(--text-2); text-align: left; }
.tpc:hover { border-color: var(--cyan); color: var(--cyan); }
.tpc.tl { font-family: var(--mono); color: var(--cyan); }
.ccard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; scroll-margin-top: calc(70px + env(safe-area-inset-top, 0px)); }
.ccard.cur { border-color: #2f6b55; }
.ccard.flash { animation: fl 1.4s ease-out; }
@keyframes fl { 0% { box-shadow: 0 0 0 3px var(--acc); } 100% { box-shadow: 0 0 0 3px transparent; } }
.ccard h2 { margin: 0 0 10px; font-size: 18.5px; text-wrap: balance; }
.ccard h2 .sn { font: 700 13px var(--mono); color: var(--acc); margin-right: 8px; }
.md { font-size: 15px; line-height: 1.75; color: var(--text-2); }
.md b, .md strong { color: var(--text); }
.md p { margin: 0 0 10px; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
.md li { margin: 2px 0; }
.md h4 { margin: 16px 0 6px; font-size: 15px; color: var(--acc); }
.md code, .qt code, .opt code, .why code, .res code, .ctip code, .hint code, .kvs code, .pv code, .pn code, .res-line code { font-family: var(--mono); font-size: .88em; background: var(--bg2); border: 1px solid var(--line); color: #9fe3cf; padding: 0 5px; border-radius: 4px; }
.tbl { overflow-x: auto; margin: 4px 0 12px; }
.md table, table.bt { border-collapse: collapse; font-size: 14px; min-width: 100%; }
.md th, .md td, table.bt th, table.bt td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
.md th, table.bt th { background: var(--panel2); font-weight: 800; white-space: nowrap; color: var(--text); }
.md blockquote { margin: 0 0 10px; padding: 8px 14px; border-left: 3px solid var(--cyan); background: var(--cyan-soft); border-radius: 0 8px 8px 0; }
.md blockquote p { margin: 0; }
.ctip { display: flex; gap: 10px; background: var(--amber-soft); border: 1px solid #6b4d14; border-radius: 8px; padding: 10px 14px; font-size: 14px; line-height: 1.65; color: var(--text-2); }
.ctip > b { color: var(--amber); white-space: nowrap; font-family: var(--mono); font-size: 12.5px; padding-top: 2px; }
.cfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.cfoot .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.cnext { display: flex; justify-content: space-between; gap: 8px; }

/* 코드 편집기 모양 */
.editor { margin: 6px 0 14px; border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; background: #0b1114; font-weight: 400; }
.ed-tab { display: flex; align-items: center; gap: 8px; font: 600 12px var(--mono); color: var(--text-2); background: #121a1f; border-bottom: 1px solid var(--line); padding: 6px 12px; }
.ed-tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); }
pre.ed { margin: 0; padding: 10px 0; overflow-x: auto; font: 13.5px/1.6 var(--mono); color: #d8e3e8; }
pre.ed code { display: block; min-width: max-content; }
pre.ed .cl { display: flex; }
pre.ed .lnum { flex: none; width: 3.2em; padding-right: 12px; text-align: right; color: #4d6068; user-select: none; }
pre.ed .lc { white-space: pre; padding-right: 16px; }
pre .k { color: #ff8fc0; } pre .ty { color: #6cc8ff; } pre .n { color: #ffcb6b; } pre .s { color: #a8e07c; } pre .c { color: #6e858e; font-style: italic; } pre .pp { color: #c6a7ff; } pre .f { color: #82e0c4; }

/* 그림 */
figure.fig { margin: 8px 0 16px; padding: 14px 12px 10px; background: var(--dg-bg); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
figure.fig figcaption { margin: 10px auto 0; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 13.5px; color: var(--mut); text-align: center; line-height: 1.5; }
svg.dg { display: block; width: 100%; height: auto; margin: 0 auto; font-family: "Noto Sans KR", system-ui, sans-serif; font-size: 14px; overflow: visible; }
svg.dg text { fill: var(--text); }
svg.dg text[font-size="10"], svg.dg text[font-size="10.5"], svg.dg text[font-size="11"], svg.dg text[font-size="11.5"], svg.dg text[font-size="12"] { font-size: 12.5px; }
svg.dg .t { fill: var(--text); font-size: 14.5px; }
svg.dg .t-s { fill: var(--dg-sub); font-size: 12.5px; font-weight: 500; }
svg.dg .t-b { fill: var(--text); font-weight: 750; }
svg.dg .t-a { fill: var(--d-a-s); font-weight: 750; font-size: 13px; }
svg.dg .t-w { fill: var(--panel-ink); font-weight: 750; }
svg.dg .box, svg.dg .box-0 { fill: var(--d-0-f); stroke: var(--d-0-s); stroke-width: 1.5; }
svg.dg .box-a { fill: var(--d-a-f); stroke: var(--d-a-s); stroke-width: 1.7; }
svg.dg .box-b { fill: var(--d-b-f); stroke: var(--d-b-s); stroke-width: 1.7; }
svg.dg .box-c { fill: var(--d-c-f); stroke: var(--d-c-s); stroke-width: 1.7; }
svg.dg .box-d { fill: var(--d-d-f); stroke: var(--d-d-s); stroke-width: 1.7; }

}

<script>window.EMB_QS = [{"id": "e1-n01", "ch": 1, "type": "mcq", "cat": "concept", "level": 1, "sec": "1. 임베디드 시스템이란: 정의와 네 가지 특성", "q": "에어백 제어기가 충돌 여부를 **올바르게 판정**했지만, 정해진 마감(수 ms)을 넘겨 에어백을 전개했다. 이 상황에 대한 설명으로 옳은 것은?", "options": ["실시간성 요구를 위반한 것으로, 결과가 맞아도 마감을 넘기면 실패다", "판정 결과가 맞았으므로 임베디드 시스템으로서 정상 동작이다", "자원 제약 특성을 위반한 것으로, 메모리 양이 모자랐기 때문이다", "전용성 특성을 위반한 것으로, 에어백 외 기능을 함께 처리했기 때문이다"], "answer": [0], "pick": 1, "why": ["맞음: 실시간성은 결과의 정확성뿐 아니라 **마감시간 준수**까지 요구해요.", "틀림: 임베디드의 실시간성 관점에서는 늦은 결과는 실패예요.", "틀림: 자원 제약은 SRAM/Flash·전력처럼 양이 모자란 이야기라 이 상황과 맞지 않아요.", "틀림: 전용성은 목적에 맞춘 구성 이야기이고, 문제의 핵심은 마감 초과예요."], "explain": "실시간성은 \"빠르다\"가 아니라 **정해진 마감 안에 결과를 내는 것**이에요. 교재 점검 질문처럼 에어백은 결과가 맞아도 수 ms 마감을 넘기면 탑승자를 보호하지 못하므로 실패예요. 예시 문장만 보고 네 특성 중 어느 것인지 고르는 연습을 해 두세요."}, {"id": "e1-n02", "ch": 1, "type": "mcq", "cat": "concept", "level": 1, "sec": "2. Cortex-M7 코어: 레지스터·예외·벡터 테이블", "q": "Cortex-M7 레지스터에 대한 설명으로 **옳지 않은** 것은?", "options": ["R13(SP)은 스택 맨 위 주소를 가리키며 MSP와 PSP로 나뉜다", "R14(LR)에는 함수 호출 후 돌아올 복귀 주소가 저장된다", "R15(PC)는 다음에 실행할 명령어의 주소를 가리킨다", "PSP는 리셋 직후와 예외·인터럽트 처리에 쓰이는 스택 포인터다", "xPSR에는 조건 플래그와 예외 상태가 담긴다"], "answer": [3], "pick": 1, "why": ["틀림: 옳은 설명이라 답이 아니에요. SP는 MSP/PSP 두 개예요.", "틀림: 옳은 설명이에요. LR = 책갈피(복귀 주소).", "틀림: 옳은 설명이에요. PC = 지금 읽는 줄을 짚는 손가락.", "맞음: 리셋 직후·예외 처리에 쓰는 건 **MSP**예요. PSP는 RTOS가 태스크별 스택을 나눌 때 써요.", "틀림: 옳은 설명이에요. xPSR은 상태판 역할이에요."], "explain": "R13 = **SP**(MSP/PSP), R14 = **LR**(복귀 주소), R15 = **PC**(다음 명령 주소)예요. **MSP**(Main SP)는 리셋 직후와 예외·인터럽트 처리에, **PSP**(Process SP)는 FreeRTOS 같은 RTOS의 태스크별 스택에 써요. MSP/PSP 역할을 바꾼 보기가 단골 함정이에요."}, {"id": "e1-n03", "ch": 1, "type": "short", "cat": "read", "level": 1, "sec": "2. Cortex-M7 코어: 레지스터·예외·벡터 테이블", "q": "다음 코드에서 `main()`이 `func()`를 호출하는 `BL func` 명령이 실행되면, `func()`가 끝난 뒤 돌아올 주소(`main()`의 다음 줄 주소)가 Cortex-M7의 어느 레지스터에 저장되는가? 레지스터 이름(별칭 또는 R 번호)을 쓰시오.\n```c\nvoid func(void)\n{\n    uint32_t local = 3U;   /* 스택(SP가 가리킴)에 잡힘 */\n    (void)local;\n}\n\nint main(void)\n{\n    func();                /* BL func */\n    printf(\"back\\r\\n\");\n    while (1)\n    {\n    }\n}\n```", "accept": ["LR", "R14", "LR(R14)", "R14(LR)", "LinkRegister"], "model": "LR (R14)", "explain": "`BL func`가 실행되면 **돌아올 주소가 LR(R14)**에 저장되고 PC(R15)는 `func`의 첫 명령으로 바뀌어요. `func`의 지역 변수는 SP(R13)가 가리키는 스택에 잡히고, `func`가 끝나면 LR의 주소로 돌아가 `printf` 줄을 실행해요. PC(다음 실행 명령 주소)와 헷갈리지 마세요."}, {"id": "e1-n04", "ch": 1, "type": "mcq", "cat": "concept", "level": 1, "sec": "3. NXP S32K3와 S32K312: 차량용 MCU", "q": "S32K312 내부 메모리 블록 중 **전원을 끄면 내용이 사라지는** 것 **2개**를 고르시오.", "options": ["Code Flash — 프로그램 코드 저장", "SRAM — 전역 변수·스택·힙", "Data Flash — 설정값 등 비휘발성 데이터", "TCM — 코어 가까이 있는 저지연 메모리"], "answer": [1, 3], "pick": 2, "why": ["틀림: Flash는 전원이 꺼져도 유지돼서 프로그램을 계속 담아 둬요.", "맞음: SRAM은 실행 중 자유롭게 읽고 쓰지만 전원이 꺼지면 사라져요.", "틀림: Data Flash는 전원을 꺼도 남겨야 할 설정값을 두는 비휘발 영역이에요.", "맞음: TCM도 RAM 계열이라 전원을 끄면 사라져요(노트 표 기준)."], "explain": "노트의 S32K312 블록 표에서 **Code Flash·Data Flash = 유지**, **SRAM·TCM = 사라짐**이에요. 그래서 프로그램(ELF)은 Code Flash에, 꺼져도 남길 설정값은 Data Flash에 두고, 변수·스택은 SRAM에 둬요."}, {"id": "e1-n05", "ch": 1, "type": "mcq", "cat": "concept", "level": 2, "sec": "3. NXP S32K3와 S32K312: 차량용 MCU", "q": "차량용 MCU인 S32K3와 ASIL에 대한 설명으로 **옳은 것 2개**를 고르시오.", "options": ["범용 MCU와 차량용 MCU의 가장 큰 차이는 클럭 속도와 연산 성능이다", "ASIL은 A부터 D까지 네 단계이며 A가 가장 엄격하다", "Lockstep은 두 코어가 같은 연산을 수행해 결과를 대조하는 안전 메커니즘이다", "제동·조향처럼 고장 시 인명 피해가 큰 기능은 ASIL-D를 요구한다", "Lockstep은 두 코어가 일을 나눠 처리해 처리량을 두 배로 높이는 기능이다"], "answer": [2, 3], "pick": 2, "why": ["틀림: 차이는 성능이 아니라 **안전 메커니즘**(ECC, Lockstep, 전압·온도·클럭 감시)이에요.", "틀림: **D가 가장 엄격**하고 A가 가장 낮아요.", "맞음: 같은 연산 결과를 대조해 고장을 검출해요.", "맞음: 고장 시 위험이 큰 기능일수록 높은 등급을 요구해요.", "틀림: 일을 나누는 게 아니라 **같은 연산**을 해서 비교해요."], "explain": "S32K3가 \"차량용\"인 이유는 고장을 **검출하고 안전 상태로 전환**하는 안전 메커니즘(메모리 ECC, Lockstep, 전압·온도·클럭 감시)이에요. ASIL은 ISO 26262의 등급으로 **A(낮음)~D(가장 엄격)**이고, 제동·조향은 ASIL-D예요."}, {"id": "e1-n06", "ch": 1, "type": "short", "cat": "concept", "level": 1, "sec": "3. NXP S32K3와 S32K312: 차량용 MCU", "q": "ASIL(Automotive Safety Integrity Level)을 정의한 **자동차 기능 안전 국제 표준**의 이름을 쓰시오. (형식: ISO ○○○○○)", "accept": ["ISO 26262", "ISO26262", "ISO-26262", "26262"], "model": "ISO 26262", "explain": "ASIL은 **ISO 26262** 표준이 정한 자동차 안전 무결성 등급이에요. A(낮음)부터 D(가장 엄격)까지 네 단계이고, 등급이 높을수록 고장 검출·대응 수단을 더 엄격하게 갖춰야 해요."}, {"id": "e1-n07", "ch": 1, "type": "mcq", "cat": "read", "level": 2, "sec": "4. 메모리 맵과 Memory-Mapped I/O", "q": "다음 코드의 각 요소가 놓이는 메모리 맵 영역의 짝으로 **옳지 않은** 것은?\n```c\nconst uint8_t msg[] = \"Hello\";   /* (가) 읽기 전용 상수 */\nuint32_t g_count = 0U;           /* (나) 전역 변수     */\n\nint main(void)                   /* (다) main()의 기계어 */\n{\n    uint32_t i = 0U;             /* (라) 지역 변수     */\n    /* (마) LPUART6 제어 레지스터에 값을 쓴다 */\n    while (1)\n    {\n        i++;\n    }\n}\n```", "options": ["(가) — Code Flash", "(나) — SRAM", "(다) — Code Flash", "(라) — Data Flash", "(마) — Peripheral"], "answer": [3], "pick": 1, "why": ["틀림: 읽기 전용 상수는 실행 코드와 함께 Code Flash에 있어요.", "틀림: 전역 변수는 SRAM에 있어요.", "틀림: main()의 기계어는 Code Flash예요.", "맞음: 지역 변수는 **SRAM의 스택**에 잡혀요. Data Flash는 전원이 꺼져도 남길 설정값 영역이에요.", "틀림: LPUART6·SIUL2 같은 제어 레지스터는 Peripheral 영역이에요."], "explain": "메모리 맵 표대로 `main()` 기계어·읽기 전용 상수 = **Code Flash**, 전역 변수·지역 변수(스택) = **SRAM**, 꺼져도 남길 설정값 = **Data Flash**, LPUART6·SIUL2 레지스터 = **Peripheral**이에요. \"Data Flash = 지역 변수 스택\"은 노트가 짚은 바꿔치기 함정이에요."}, {"id": "e1-n08", "ch": 1, "type": "mcq", "cat": "concept", "level": 2, "sec": "5. 클럭 트리와 부팅 흐름", "q": "S32K312에 전원을 넣은 뒤 사용자 `main()`이 실행되기까지의 순서로 옳은 것은?", "options": ["POR → startup → BAF → IVT 확인 → 사용자 벡터 테이블 → main()", "POR → BAF → IVT 확인 → 사용자 벡터 테이블 → startup → main()", "POR → 사용자 벡터 테이블 → BAF → IVT 확인 → startup → main()", "POR → IVT 확인 → startup → BAF → 사용자 벡터 테이블 → main()"], "answer": [1], "pick": 1, "why": ["틀림: startup은 사용자 코드라 NXP 내장 BAF보다 먼저 올 수 없어요.", "맞음: 칩(NXP)의 부팅 단계(BAF → IVT) 뒤에 사용자 코드(벡터 테이블 → startup → main)가 이어져요.", "틀림: 사용자 벡터 테이블은 BAF가 IVT에서 진입 정보를 찾은 다음에 쓰여요.", "틀림: BAF가 IVT를 확인하는 주체라 IVT 확인이 BAF보다 앞설 수 없어요."], "explain": "부팅은 **POR → BAF(NXP 내장 코드) → IVT 확인(부팅 이미지·진입 정보) → 사용자 벡터 테이블(0번 SP, 1번 Reset handler) → startup(C 환경 준비) → main()** 순서예요. IVT는 \"무엇으로 부팅할지\", 벡터 테이블은 \"사건이 나면 어디로 갈지\"를 알려 주는 서로 다른 표예요."}, {"id": "e1-n09", "ch": 1, "type": "err", "cat": "error", "level": 2, "sec": "5. 클럭 트리와 부팅 흐름", "q": "1장 프로젝트에서 Config Tools **Clocks** 화면의 **LPUART6_CLK 체크를 해제**하고 Update Code 후 다시 빌드·플래시했다. 빌드·플래시는 정상으로 끝났고, main.c·핀 설정·Lpuart 설정·터미널(올바른 COM 포트, 115200 8N1)은 모두 그대로다. Run → Resume 후 터미널에는?", "answer": 3, "why": ["틀림: 클럭이 없는 LPUART6는 프레임을 만들어 내보낼 수 없어요.", "틀림: 깨짐은 신호가 PC까지 오되 baud/frame이 다를 때예요. 여기선 신호 자체가 나가지 않아요.", "틀림: COM 포트는 OpenSDA(USB) 쪽 장치라 MCU 내부 클럭 설정과 무관해요.", "맞음: LPUART6가 동작하지 않으니 PTA16으로 아무 신호도 나가지 않아요."], "outcomes": ["`Hello S32K3, 20261234 HongGildong`이 정상 출력된다", "글자가 깨져 보인다", "COM 포트가 장치 관리자에서 사라진다", "아무것도 출력되지 않는다"], "reasons": ["클럭이 꺼지면 터미널과 baud rate가 달라져 비트 경계를 잘못 샘플링한다", "LPUART6_CLK는 OpenSDA의 USB 연결용 클럭이라 VCOM이 끊긴다", "모든 주변장치는 클럭을 기준으로 동작하므로, 클럭이 공급되지 않은 LPUART6는 115200 bps 박자를 만들지 못해 송신하지 못한다", "CM7 코어 클럭도 함께 꺼져 printf가 문자열을 만들지 못한다"], "reason": 2, "rwhy": ["틀림: 그건 \"깨짐\"의 원인이에요. 클럭이 없으면 느린 박자가 아니라 박자 자체가 없어요.", "틀림: LPUART6_CLK는 MCU 안의 LPUART6용 Peripheral Clock이에요.", "맞음: 노트 — 실습에서 LPUART6_CLK enabled(0 Hz 아님)를 확인하는 이유가 바로 이거예요.", "틀림: 체크 해제한 건 LPUART6용 클럭뿐이고, CM7 코어 클럭(System Clock)은 그대로예요."], "explain": "CPU·버스·UART 등 모든 주변장치는 **클럭을 기준으로** 동작하고, 클럭이 안 들어간 모듈은 움직이지 않아요. Config Tools에서 **LPUART6_CLK가 enabled이고 0 Hz가 아닌지** 확인하는 이유가 이것이고, 꺼져 있으면 UART 출력이 나오지 않아요. 신호가 아예 없으니 증상은 \"깨짐\"이 아니라 **무출력**이에요."}, {"id": "e1-n10", "ch": 1, "type": "short", "cat": "api", "level": 1, "sec": "5. 클럭 트리와 부팅 흐름", "q": "기준 클럭 설정에서 CM7 코어 클럭 주파수를 RTD API로 읽어 출력하려 한다. 빈칸 (A)에 들어갈 함수 이름의 나머지 부분을 쓰시오.\n```c\nprintf(\"CM7 core clock = %lu Hz\\r\\n\",\n       (unsigned long)Clock_Ip_(A)(CM7_CORE_CLK));\n```", "accept": ["GetClockFrequency", "Clock_Ip_GetClockFrequency", "GetClockFrequency()", "Clock_Ip_GetClockFrequency()"], "model": "GetClockFrequency (`Clock_Ip_GetClockFrequency`)", "explain": "CM7 코어 클럭은 `Clock_Ip_GetClockFrequency(CM7_CORE_CLK)`로 읽고, 기준 설정 기대값은 **120000000 Hz**예요. 이 printf는 1장 기본 코드에 없어서 **직접 추가해야** 출력되고, `CM7_CORE_CLK` 이름 오류가 나면 `Clock_Ip_Types.h`에서 실제 enum 이름을 확인해요."}, {"id": "e1-n11", "ch": 1, "type": "mcq", "cat": "api", "level": 2, "sec": "6. 교차 개발과 S32 Design Studio 툴체인", "q": "RTD 함수 이름 규칙(`모듈_기능`, IP 계층은 `_Ip_` 포함)으로 볼 때, 다음 중 **IP Layer 함수가 아닌** 것은?", "options": ["`Port_Init`", "`Clock_Ip_Init`", "`Siul2_Port_Ip_Init`", "`Lpuart_Uart_Ip_SyncSend`", "`Lpuart_Uart_Ip_Init`"], "answer": [0], "pick": 1, "why": ["맞음: `Port_Init`은 3장에서 비교하는 **MCAL 계층** 이름이에요(이름에 `_Ip_`가 없어요).", "틀림: Clock 모듈, IP 계층, 초기화예요.", "틀림: SIUL2의 Port(핀) 드라이버, IP 계층, 초기화예요.", "틀림: LPUART의 UART 드라이버, IP 계층, 동기 송신이에요.", "틀림: LPUART UART 드라이버의 IP 계층 초기화예요."], "explain": "RTD 이름은 **모듈 → 계층 → 기능** 순으로 읽어요. 1장 main.c의 `Clock_Ip_Init`·`Siul2_Port_Ip_Init`·`Lpuart_Uart_Ip_*`는 모두 **IP 계층**이고, `Port_Init`·`Dio_WriteChannel`은 같은 일을 하는 **MCAL 계층** 이름이에요(3장)."}, {"id": "e1-n12", "ch": 1, "type": "mcq", "cat": "calc", "level": 2, "sec": "7. UART 기초와 프레임 구조", "q": "문자 `'K'`(0x4B)를 8N1로 보낼 때, TX 선에 나타나는 비트를 **시간 순서대로**(Start bit부터 Stop bit까지) 나열한 것으로 옳은 것은?", "options": ["Start `0` → 데이터 `0 1 0 0 1 0 1 1` → Stop `1`", "Start `1` → 데이터 `1 1 0 1 0 0 1 0` → Stop `0`", "Start `0` → 데이터 `1 1 0 1 0 0 1 0` → Stop `1`", "Start `1` → 데이터 `0 1 0 0 1 0 1 1` → Stop `0`"], "answer": [2], "pick": 1, "why": ["틀림: MSB(D7)부터 보낸 순서예요. UART는 **LSB부터** 보내요.", "틀림: 데이터 순서는 맞지만 Start = LOW(0), Stop = HIGH(1)가 뒤바뀌었어요.", "맞음: 0x4B = 0100 1011 → D0~D7 = 1,1,0,1,0,0,1,0, 앞뒤에 Start 0·Stop 1.", "틀림: 비트 순서(MSB 먼저)와 Start/Stop 레벨이 모두 틀렸어요."], "explain": "`0x4B` = `0100 1011`이고 UART는 **LSB(D0)부터** 보내므로 선 위 순서는 `1,1,0,1,0,0,1,0`이에요. 그 앞에 라인을 LOW로 내리는 **Start 0**, 뒤에 HIGH로 되돌리는 **Stop 1**이 붙어요. 거꾸로 파형을 읽을 땐 시간 순서 8비트를 뒤집어 16진수로 만들어요."}, {"id": "e1-n13", "ch": 1, "type": "mcq", "cat": "concept", "level": 1, "sec": "7. UART 기초와 프레임 구조", "q": "UART 8N1 프레임에 대한 설명으로 **옳은 것 2개**를 고르시오.", "options": ["보낼 데이터가 없을 때 라인은 LOW(0)를 유지한다", "Start bit가 라인을 HIGH에서 LOW로 떨어뜨리는 순간 수신 측이 프레임 시작을 알아챈다", "데이터 8비트는 MSB(D7)부터 보낸다", "TX/RX 외에 별도의 클럭 선으로 송수신 박자를 맞춘다", "8N1의 N은 패리티 비트가 없다는 뜻이고, 한 문자는 Start·Stop을 포함해 10비트다"], "answer": [1, 4], "pick": 2, "why": ["틀림: Idle은 **HIGH(1)**예요.", "맞음: Idle(HIGH) → Start(LOW)의 1→0 하강이 프레임 시작 신호예요.", "틀림: 데이터는 **LSB(D0)부터** 보내요.", "틀림: UART는 클럭 선이 없는 **비동기** 통신이라 양쪽이 같은 baud rate를 미리 약속해요.", "맞음: Start 1 + Data 8 + Stop 1 = 10비트, Parity는 없어요."], "explain": "UART 레벨은 **Idle·Stop = HIGH, Start = LOW**이고 데이터는 **LSB 먼저**예요. 클럭 선이 없어서 같은 baud rate 약속이 필수이고, 8N1 한 문자는 **10비트**라서 전송 시간을 계산할 때 8비트만 세면 틀려요."}, {"id": "e1-n14", "ch": 1, "type": "mcq", "cat": "calc", "level": 3, "sec": "7. UART 기초와 프레임 구조", "q": "기준 설정(CM7 코어 클럭 120 MHz)에서 다음 `printf` 한 줄을 115200 bps, 8N1로 보낸다. 프레임 사이에 Idle 없이 연속 송신한다고 할 때, 이 줄 전체(`\\r\\n` 포함)를 보내는 데 걸리는 시간에 가장 가까운 것은?\n```c\nprintf(\"CM7 core clock = %lu Hz\\r\\n\",\n       (unsigned long)Clock_Ip_GetClockFrequency(CM7_CORE_CLK));\n```", "options": ["약 2.15 ms", "약 2.52 ms", "약 2.69 ms", "약 3.04 ms"], "answer": [2], "pick": 1, "why": ["틀림: 31바이트를 8비트로만 센 값(31 × 8 ÷ 115200)이에요. Start·Stop이 빠졌어요.", "틀림: `\\r\\n` 2바이트를 빼고 29바이트로 센 값이에요.", "맞음: 31바이트 × 10비트 = 310비트, 310 ÷ 115200 ≈ 2.69 ms.", "틀림: `Hello S32K3, 20261234 HongGildong\\r\\n`(35바이트) 줄의 시간이에요."], "explain": "출력 문자열은 `CM7 core clock = 120000000 Hz\\r\\n`으로 **31바이트**예요. 8N1 한 문자는 Start·Stop 포함 **10비트(≈ 86.8 µs)**라서 31 × 86.8 µs ≈ **2.69 ms**예요. 8비트만 세거나 `\\r\\n`을 빼먹는 실수를 조심하세요."}, {"id": "e1-n15", "ch": 1, "type": "short", "cat": "calc", "level": 1, "sec": "7. UART 기초와 프레임 구조", "q": "1장 예제의 UART 설정을 보드와 터미널 모두 **9600 bps, 8N1**로 바꿨다. Idle 없이 연속으로 보낼 때 1초에 보낼 수 있는 최대 문자 수는? (숫자로)", "accept": ["960", "960개", "960문자", "960자"], "model": "960", "explain": "8N1 한 문자는 Start 1 + Data 8 + Stop 1 = **10비트**라서 9600 ÷ 10 = **960문자/초**예요(1문자 ≈ 1.04 ms). 9600 ÷ 8 = 1200은 Start·Stop을 빠뜨린 오답이에요."}, {"id": "e1-n16", "ch": 1, "type": "mcq", "cat": "concept", "level": 1, "sec": "9. 실습 준비: 사양·버전·프로젝트 구조", "q": "1장 실습(`chap01_hello_uart`)의 사양으로 **옳지 않은** 것은?", "options": ["구현 방식 — AUTOSAR MCAL Layer(`Uart_*` API)로 구현한다", "UART 채널 — LPUART6", "핀 매핑 — PTA16 = TX, PTA15 = RX", "통신 설정 — 115200 bps, 8N1, flow none", "학생이 직접 수정하는 파일 — `src/main.c`"], "answer": [0], "pick": 1, "why": ["맞음: 1장은 RTD `*_Ip_*` 함수를 직접 부르는 **IP Layer 방식**이에요. MCAL 방식은 3주차에 비교해요.", "틀림: 옳은 사양이에요. VCOM이 LPUART6에 배선돼 있어요.", "틀림: 옳은 사양이에요.", "틀림: 옳은 사양이에요. 터미널도 같은 값으로 맞춰요.", "틀림: 옳은 설명이에요. 나머지는 도구가 생성해요."], "explain": "1장 사양은 **LPUART6, PTA16 = TX, PTA15 = RX, 115200 bps 8N1 flow none, IP Layer 방식**이고, 학생이 손대는 파일은 `src/main.c` 하나예요. MCAL(`CDD_Uart.h`의 `Uart_*`) 버전은 교재 1.14 참고 자료이고 강의는 3주차예요."}, {"id": "e1-n17", "ch": 1, "type": "err", "cat": "error", "level": 3, "sec": "9. 실습 준비: 사양·버전·프로젝트 구조", "q": "학생이 터미널을 9600 bps로 쓰고 싶어서, Config Tools 대신 **`generate/` 폴더에 생성된 LPUART 설정 코드**의 baud rate 값을 직접 9600으로 고쳤다. 터미널도 9600 8N1로 맞추자 처음에는 정상 출력됐다. 며칠 뒤 Config Tools에서 **설정은 바꾸지 않고 Update Code만** 누른 다음, `generate/`는 다시 손대지 않고 빌드·플래시했다(`.mex`의 baud rate는 처음부터 115200, 터미널은 여전히 9600). 실행하면 터미널에는?", "answer": 1, "why": ["틀림: 손으로 고친 9600은 Update Code 때 사라졌어요.", "맞음: 보드는 다시 115200, 터미널은 9600이라 신호는 오지만 해석이 어긋나요.", "틀림: LPUART6·PTA16 경로는 그대로라 신호는 PC까지 와요. 무출력은 채널·핀 오류 증상이에요.", "틀림: `.mex` 설정 자체는 정상이라 Update Code는 문제없이 끝나요."], "outcomes": ["9600 bps로 정상 출력된다", "글자가 깨져 보인다", "아무것도 보이지 않는다", "Update Code 단계에서 오류가 나 빌드할 수 없다"], "reasons": ["Update Code를 누르면 LPUART6_CLK가 꺼져 LPUART6가 동작하지 않는다", "Update Code가 `generate/`를 `.mex` 설정(115200)대로 다시 만들어 손으로 고친 값이 덮어써졌고, 보드(115200)와 터미널(9600)의 baud가 달라졌다", "`generate/`를 손으로 고치면 PTA16 핀 mux가 풀려 VCOM과의 연결이 끊긴다", "9600 bps에서는 8N1 프레임을 쓸 수 없다"], "reason": 1, "rwhy": ["틀림: Update Code는 `.mex`대로 다시 생성할 뿐, 설정에 없는 변경(클럭 끄기)을 하지 않아요.", "맞음: `generate/`는 Update Code 때 자동 생성되어 덮어써지는 폴더예요. 설정은 `.mex`(Config Tools)에서 바꿔야 해요.", "틀림: 핀 설정은 바뀐 적이 없고, 신호가 끊겼다면 증상은 무출력이에요.", "틀림: 처음에 9600 8N1로 정상 출력된 것 자체가 반례예요."], "explain": "`generate/`·`RTD/`·`board/`·`Project_Settings/`는 도구가 **다시 생성하며 덮어쓰는** 폴더예요. 설정은 `.mex`를 Config Tools에서 고치고 **Update Code**로 재생성해야 **설정과 생성 코드의 일관성**이 유지돼요(교재 점검 5). 여기선 보드가 115200으로 돌아가 터미널(9600)과 baud가 어긋나므로 **글자가 깨져요**."}, {"id": "e1-n18", "ch": 1, "type": "mcq", "cat": "api", "level": 1, "sec": "10. 프로젝트 생성과 Config Tools 설정 (IP Layer)", "q": "1장 Config Tools(IP Layer) 설정 절차로 **옳지 않은** 것은?", "options": ["Clocks: LPUART6_CLK가 enabled이고 주파수가 0 Hz가 아닌지 확인한다", "Pins: PTA16 = LPUART6_TX(방향 Output), PTA15 = LPUART6_RX(Input)로 설정한다", "Peripherals: Components 창의 **MCAL** 그룹에서 UART 컴포넌트를 추가한다", "Lpuart 설정: Uart hardware channel = LPUART_6, Desire Baudrate = LPUART_UART_BAUDRATE_115200", "설정 후 Update Code를 누르고 Console에 error가 없는지 확인한다"], "answer": [2], "pick": 1, "why": ["틀림: 옳은 절차예요. 클럭이 없으면 LPUART6가 동작하지 않아요.", "틀림: 옳은 절차예요. TX는 MCU에서 나가는 신호라 Output이에요.", "맞음: 1장은 IP 드라이버를 쓰므로 **Drivers** 그룹의 `Lpuart_Uart`를 추가해요.", "틀림: 옳은 절차예요. Parity disabled·One stop bit·8 bits per char와 함께 8-N-1이 돼요.", "틀림: 옳은 절차예요."], "explain": "Config Tools 순서는 **Clocks(LPUART6_CLK enabled) → Pins(PTA16 TX Output, PTA15 RX Input) → Peripherals(Drivers 그룹 `Lpuart_Uart`, LPUART_6, 115200) → Update Code**예요. Components 창에는 MCAL / Drivers / OS 그룹이 있고, IP Layer 실습인 1장은 **Drivers** 그룹을 써요."}, {"id": "e1-n19", "ch": 1, "type": "err", "cat": "error", "level": 2, "sec": "10. 프로젝트 생성과 Config Tools 설정 (IP Layer)", "q": "1장 프로젝트에서 Config Tools Pins의 **Functional group 이름**을 `BOARD_InitPeripherals`에서 `MyUartPins`로 바꾸고 Update Code 했다. 핀 설정 내용은 그대로이고, main.c는 아래처럼 고치지 않은 채 빌드했다. 결과는?\n```c\nSiul2_Port_Ip_Init(\n    NUM_OF_CONFIGURED_PINS_PortContainer_0_BOARD_InitPeripherals,\n    g_pin_mux_InitConfigArr_PortContainer_0_BOARD_InitPeripherals);\n```", "answer": 2, "why": ["틀림: main.c가 쓰는 이름이 더 이상 생성되지 않아 빌드부터 실패해요.", "틀림: 실행까지 가지 못해요. 빌드에서 멈춰요.", "맞음: 옛 이름 `…_BOARD_InitPeripherals`가 정의되지 않아 컴파일 오류가 나요.", "틀림: baud/frame 설정은 바뀌지 않았고, 애초에 빌드가 안 돼요."], "outcomes": ["정상 빌드되고 출력도 정상이다", "빌드는 되지만 핀 설정이 빠져 터미널에 아무것도 보이지 않는다", "빌드 단계에서 식별자(심볼) 미정의 오류가 난다", "실행 중 글자가 깨져 보인다"], "reasons": ["Config Tools가 만든 핀 설정 심볼 이름 끝에 Functional group 이름이 붙으므로, 이름이 바뀌면서 main.c의 옛 이름이 더 이상 정의되지 않는다", "Functional group 이름을 바꾸면 PTA16·PTA15의 핀 mux가 해제되어 LPUART6 신호가 핀 밖으로 나가지 않는다", "Functional group 이름은 baud rate 설정에도 쓰여 115200이 다른 값으로 바뀐다", "`Siul2_Port_Ip_Init`의 인자는 배열 → 개수 순서여야 한다"], "reason": 0, "rwhy": ["맞음: 생성 심볼 이름은 Functional group에 따라 달라져요. 생성 헤더에서 실제 이름을 확인해 main.c를 맞춰야 해요.", "틀림: 핀 설정 내용은 그대로이고, 문제는 실행이 아니라 이름(빌드)이에요.", "틀림: Functional group은 핀 설정 묶음의 이름일 뿐 baud rate와 관계없어요.", "틀림: 인자 순서는 **개수 → 배열**이 맞고, 코드도 그 순서예요."], "explain": "Config Tools가 생성하는 객체 이름은 **functional group·configuration variant**에 따라 달라지고, `Siul2_Port_Ip_Init` 인자의 식별자 끝도 Functional group 이름(`BOARD_InitPeripherals`)이에요. 이름을 바꾸면 main.c의 옛 식별자가 사라져 **미정의 빌드 오류**가 나므로, `generate/include` 헤더에서 실제 이름을 확인해 고쳐야 해요."}, {"id": "e1-n20", "ch": 1, "type": "mcq", "cat": "read", "level": 2, "sec": "11. main.c 코드 분석 (IP Layer)", "q": "교재 1.14의 MCAL 버전 `_write()` 일부다(인자는 `…`로 축약). Config Tools에서 UartChannel 0을 LPUART6에 연결해 두었을 때, 이 코드로 송신한 바이트가 실제로 나가는 곳은?\n```c\n#define MCAL_UART_CHANNEL 0U\n\nif (E_OK != Uart_SyncSend(MCAL_UART_CHANNEL, …))\n{\n    return -1;\n}\nreturn len;\n```", "options": ["LPUART0의 TX 핀 — 채널 값이 0U이므로", "LPUART6의 PTA16(TX) — 0U는 LPUART6에 연결된 논리 채널이므로", "LPUART6의 PTA15 — PTA15가 LPUART6의 TX 핀이므로", "어느 핀으로도 나가지 않는다 — MCAL에서도 채널 값은 6U여야 하므로"], "answer": [1], "pick": 1, "why": ["틀림: MCAL의 `0U`는 하드웨어 번호가 아니라 **논리 채널** 번호예요(\"0U = LPUART0\" ✗).", "맞음: UartChannel 0 → LPUART6로 설정돼 있어 IP 버전과 똑같이 PTA16으로 나가요.", "틀림: PTA15는 LPUART6_**RX**이고, TX는 PTA16이에요.", "틀림: 하드웨어 instance 6U는 IP Layer에서 쓰는 값이에요. MCAL은 논리 채널 번호를 써요."], "explain": "IP Layer의 `UART_CHANNEL 6U`는 **하드웨어 instance**, MCAL의 `MCAL_UART_CHANNEL 0U`는 Config Tools가 만든 **논리 채널(UartChannel 0 → LPUART6)**이에요(교재 점검 8). 그래서 두 버전 모두 LPUART6 TX(**PTA16**) → OpenSDA VCOM으로 나가고, MCAL 쪽 성공 판정은 `E_OK`예요."}, {"id": "e1-n21", "ch": 1, "type": "err", "cat": "error", "level": 2, "sec": "11. main.c 코드 분석 (IP Layer)", "q": "학생이 교재의 MCAL 버전 main.c를 `src/main_mcal.c`로 추가하고, 기존 IP 버전 `src/main.c`도 지우지 않은 채 두 파일을 함께 빌드했다. 두 파일은 모두 `int main(void)`를 정의한다. 결과는?", "answer": 1, "why": ["틀림: C 프로그램에는 진입점 `main()`이 하나뿐이라 두 개를 차례로 실행하는 일은 없어요.", "맞음: 같은 이름의 전역 함수가 두 오브젝트 파일에 있어 링커가 오류를 내요.", "틀림: 실행 파일(ELF)이 만들어지지 않아요.", "틀림: 링커는 중복 정의를 임의로 골라 주지 않고 오류로 멈춰요."], "outcomes": ["IP 버전 main()이 먼저 실행된 뒤 MCAL 버전 main()이 이어서 실행된다", "빌드(링크) 단계에서 `main` 중복 정의 오류가 난다", "빌드는 되지만 같은 줄이 두 번씩 출력된다", "빌드 도구가 파일 이름 순서로 하나만 골라 정상 동작한다"], "reasons": ["IP 헤더(`Lpuart_Uart_Ip.h`)와 MCAL 헤더(`CDD_Uart.h`)는 같은 프로젝트에 있을 수 없다", "MCAL 채널 0U와 IP 채널 6U가 같은 LPUART6를 가리켜 실행 중 충돌한다", "`Uart_Init(NULL_PTR)`을 `Lpuart_Uart_Ip_Init`보다 먼저 호출해야 한다", "한 프로그램에는 `main()`이 하나만 있어야 하는데 두 파일이 같은 이름의 전역 함수를 정의해 링커가 하나로 정할 수 없다"], "reason": 3, "rwhy": ["틀림: 노트가 동시 빌드를 막는 이유로 든 건 헤더가 아니라 `main()` 중복이에요.", "틀림: 실행까지 가지 못해요. 문제는 빌드(링크) 단계예요.", "틀림: 호출 순서 문제가 아니라 같은 이름의 함수가 두 번 정의된 문제예요.", "맞음: 그래서 두 버전은 **동시에 빌드하지 않고** `src/main.c`를 통째로 교체해요."], "explain": "노트(교재 1.14)대로 IP 버전과 MCAL 버전 main.c는 `main()`이 겹치므로 **동시에 빌드하지 않고** `src/main.c`를 통째로 교체해요. 두 파일을 함께 빌드하면 링커가 `main` **중복 정의** 오류를 내고 ELF가 만들어지지 않아요."}, {"id": "e1-n22", "ch": 1, "type": "err", "cat": "error", "level": 1, "sec": "12. 빌드·플래시·실행, 확인 기준과 문제 해결", "q": "1장 예제를 Build(0 errors)하고 `chap01_hello_uart_Debug_FLASH_PNE` 구성으로 Debug를 실행했다. 플래시 다운로드는 완료됐고 터미널도 올바른 OpenSDA COM 포트·115200 8N1로 열었다. 그런데 Debug만 누르고 **그 뒤 아무 조작도 하지 않고** 기다렸다. 터미널에는?", "answer": 0, "why": ["맞음: 코드가 아직 printf까지 실행되지 않았어요.", "틀림: 그건 Run → Resume을 누른 뒤의 결과예요.", "틀림: 보드와 터미널 설정이 모두 115200 8N1로 같아요.", "틀림: printf는 무한 루프 밖에서 한 번만 호출돼요. 게다가 아직 실행 전이에요."], "outcomes": ["아무것도 출력되지 않는다", "`Hello S32K3, 20261234 HongGildong`이 한 줄 출력된다", "글자가 깨져 출력된다", "같은 줄이 계속 반복 출력된다"], "reasons": ["Debug 구성은 Flash가 아닌 SRAM에 올려 실행하므로 printf가 동작하지 않는다", "디버거는 `main()`에서 멈춘 상태로 시작하므로, Run → Resume을 눌러야 코드가 계속 실행된다", "PEmicro가 플래시 기록 중 LPUART6를 점유해 VCOM이 끊긴다", "Build 단계에서 ELF가 생성되지 않았다"], "reason": 1, "rwhy": ["틀림: 구성 이름의 **FLASH**는 Flash에 올려 실행한다는 뜻이에요.", "맞음: 자주 하는 실수예요 — Debug만 누르고 Resume을 안 누르면 보드는 main()에서 멈춰 있어요.", "틀림: OpenSDA는 디버깅과 VCOM을 USB 하나로 함께 처리해요.", "틀림: 0 errors였고 다운로드도 완료됐으니 ELF는 있어요."], "explain": "Debug(`…_Debug_FLASH_PNE`)를 실행하면 PEmicro가 ELF를 보드 Flash에 기록하고, 디버거는 **`main()`에서 멈춘 상태**로 시작해요. **Run → Resume**을 눌러야 클럭·핀·LPUART6 초기화와 printf가 실행되어 터미널에 줄이 찍혀요."}, {"id": "e1-n23", "ch": 1, "type": "mcq", "cat": "error", "level": 2, "sec": "12. 빌드·플래시·실행, 확인 기준과 문제 해결", "q": "1장 실습의 증상과 원인·조치의 짝으로 **옳지 않은** 것은?", "options": ["COM 포트가 안 보임 — 충전 전용 케이블이나 드라이버 문제 → 데이터 케이블·CDC 포트 확인", "터미널 글자가 깨짐 — LPUART 채널·핀 설정 오류 → LPUART6, PTA16/PTA15, 6U 확인", "`xHwConfigPB` 심볼 미정의 — 설정 코드 미생성 또는 심볼명 차이 → .mex 확인 후 재생성·생성 헤더 확인", "`CM7_CORE_CLK` 오류 — clock enum 이름 차이 → `Clock_Ip_Types.h`에서 실제 이름 확인", "Debug 연결 실패 — OpenSDA/PEmicro 설정 또는 보드 연결 → Interface·Device 확인, 전원 재연결"], "answer": [1], "pick": 1, "why": ["틀림: 옳은 짝이에요(USB·드라이버 구간).", "맞음: 글자 깨짐은 **baud/frame 불일치**예요. 채널·핀 오류는 **아무 출력도 없음**의 원인이에요.", "틀림: 옳은 짝이에요(코드 생성 구간).", "틀림: 옳은 짝이에요(enum 이름).", "틀림: 옳은 짝이에요(디버거 연결)."], "explain": "\"글자가 깨진다\"는 신호가 PC까지는 왔지만 **약속(baud/frame)이 다르다**는 뜻이라 터미널을 115200/8N1, flow none으로 맞춰요. \"아무 출력도 없다\"면 경로가 끊긴 것이라 **LPUART6, PTA16=TX, PTA15=RX, 6U**를 확인해요. 이 두 원인을 바꿔 낸 보기가 가장 흔해요."}, {"id": "embedded-01-01", "ch": 1, "type": "mcq", "cat": "concept", "level": 1, "sec": "1. 임베디드 시스템이란: 정의와 네 가지 특성", "q": "임베디드 시스템의 특성과 예시를 짝지은 것으로 **옳지 않은** 것은?", "options": ["전용성 — 세탁기 제어기는 세탁만 제어한다", "자원 제약 — TX 핀 설정이 틀리면 UART 출력이 나오지 않는다", "하드웨어 의존성 — 핀·클럭·레지스터를 직접 제어한다", "자원 제약 — MCU는 PC보다 작은 SRAM/Flash를 가진다", "실시간성 — 에어백 판단은 수 ms 이내에 끝나야 한다"], "answer": [1], "why": ["옳음: 목적이 하나로 정해진 전용성의 예시예요.", "틀림: TX 핀 설정 오류로 출력이 없는 건 핀·레지스터를 직접 다루는 **하드웨어 의존성**의 예시예요.", "옳음: 하드웨어 의존성의 의미 그대로예요.", "옳음: 메모리·전력 양이 모자란 이야기는 자원 제약이에요.", "옳음: 마감시간을 지켜야 하는 실시간성의 예시예요."], "explain": "슬라이드 표의 특성–의미–예시 짝을 그대로 묻는 문제예요. \"TX 핀 설정 오류 시 출력 없음\"은 **하드웨어 의존성**의 예시이고, 자원 제약은 SRAM/Flash·전력처럼 양이 부족한 이야기예요. 예시 문장만 보고 특성을 구별할 수 있어야 해요.", "pick": 1}, {"id": "embedded-01-02", "ch": 1, "type": "mcq", "cat": "concept", "level": 1, "sec": "2. Cortex-M7 코어: 레지스터·예외·벡터 테이블", "q": "Cortex-M7에서 리셋 직후 코어가 벡터 테이블의 0번·1번 항목을 읽는다. 각 항목의 내용으로 옳은 것은?", "options": ["0번: 초기 스택 포인터 값 / 1번: Reset handler 주소", "0번: 초기 PC 값 / 1번: 초기 LR(복귀 주소) 값", "0번: main() 주소 / 1번: startup 코드 주소", "0번: Reset handler 주소 / 1번: NMI 핸들러 주소"], "answer": [0], "why": ["옳음: 0번 → SP 초기값, 1번 → Reset handler 주소(PC로 적재).", "틀림: 0번은 SP 초기값이고, LR은 벡터 테이블에서 적재하지 않아요.", "틀림: main()은 startup 코드가 C 환경을 준비한 뒤 호출해요. 벡터 테이블 항목이 아니에요.", "틀림: 0번을 Reset으로 보는 게 대표 함정이에요. Reset handler는 1번이에요."], "explain": "벡터 테이블은 예외별 핸들러 주소 배열이지만, **0번은 핸들러 주소가 아니라 초기 스택 포인터 값**이에요. 1번이 Reset handler 주소이고, 이후 Reset Handler → Runtime Init(startup) → main() 순으로 진행돼요.", "pick": 1}, {"id": "embedded-01-03", "ch": 1, "type": "mcq", "cat": "concept", "level": 1, "sec": "4. 메모리 맵과 Memory-Mapped I/O", "q": "MCU에서 C 문장 `*ptr = value;` 에 대한 설명으로 옳은 것은?", "options": ["MCU의 메모리 주소는 RAM만 뜻하므로 결과는 항상 변수 값 변경이다", "`ptr`이 SRAM 주소면 하드웨어 레지스터에 값이 써져 핀 전압이 바뀐다", "주변장치 레지스터는 전용 I/O 명령으로만 접근하므로 이 문장으로는 제어할 수 없다", "`ptr`이 Peripheral 주소면 하드웨어 레지스터에 값이 써져 핀 전압·송수신·인터럽트 상태가 바뀔 수 있다"], "answer": [3], "why": ["틀림: Flash·SRAM·TCM·Peripheral이 하나의 주소 공간에 배치돼요.", "틀림: SRAM 주소면 메모리 한 칸에 저장되어 변수 값이 바뀔 뿐이에요.", "틀림: memory-mapped I/O에서는 변수와 같은 load/store 명령(C 포인터)으로 접근해요.", "옳음: 슬라이드 표 그대로 — peripheral 주소에 대한 대입은 하드웨어 동작을 즉시 바꿔요."], "explain": "같은 `*ptr = value;`도 주소 영역에 따라 의미가 달라요. SRAM이면 변수 값 변경, Peripheral이면 레지스터 기록으로 핀 전압·송수신·인터럽트 상태가 바뀔 수 있어요. 이 구조가 **memory-mapped I/O**이고, 2장에서 SIUL2 레지스터로 직접 실습해요.", "pick": 1}, {"id": "embedded-01-04", "ch": 1, "type": "mcq", "cat": "concept", "level": 1, "sec": "6. 교차 개발과 S32 Design Studio 툴체인", "q": "S32 Design Studio 구성요소와 역할의 짝으로 옳은 것은?", "options": ["RTD — 코드 편집·빌드·디버그를 하는 Eclipse 기반 IDE", "Design Studio GCC — 보드 플래시 기록과 디버깅을 담당한다", "S32 Config Tools — 핀·클럭·주변장치를 GUI로 설정하고 초기화 코드를 생성한다", "PEmicro — C 코드를 컴파일·링크해 ELF를 만든다"], "answer": [2], "why": ["틀림: RTD는 Real-Time Drivers, AUTOSAR 기반 주변장치 드라이버예요. IDE는 S32DS IDE예요.", "틀림: 플래시 기록·디버깅은 OpenSDA/PEmicro, GCC는 ELF 빌드예요.", "옳음: 슬라이드 표 그대로예요. Config Tools는 설정을 코드로 생성할 뿐 보드에 직접 쓰지 않아요.", "틀림: ELF를 만드는 건 Design Studio GCC예요. PEmicro는 플래시 기록·디버깅이에요."], "explain": "흐름은 소스 코드 → (GCC) 컴파일/링크 → ELF → (OpenSDA/PEmicro) MCU Flash → 실행이에요. **GCC는 ELF를 만들고, PEmicro는 그 ELF를 넣고 디버깅**해요. 역할을 서로 바꾼 보기가 단골 함정이에요.", "pick": 1}, {"id": "embedded-01-05", "ch": 1, "type": "mcq", "cat": "calc", "level": 2, "sec": "7. UART 기초와 프레임 구조", "q": "UART를 **115200 bps, 8N1**로 설정했다. 한 문자(1바이트)를 보내는 데 걸리는 시간에 가장 가까운 것은?", "options": ["약 69.4 µs", "약 86.8 µs", "약 104.2 µs", "약 8.68 µs"], "answer": [1], "why": ["틀림: 데이터 8비트만 센 값(8/115200)이에요. Start·Stop을 빠뜨렸어요.", "옳음: Start 1 + Data 8 + Stop 1 = 10비트 → 10/115200 ≈ 86.8 µs.", "틀림: 9600 bps의 1비트 시간(1/9600)이에요.", "틀림: 1비트 시간(1/115200)이에요."], "explain": "8N1 한 문자는 **Start 1 + Data 8 + Stop 1 = 10비트**예요. 1비트가 1/115200 ≈ 8.68 µs이니 한 문자는 ≈ 86.8 µs, 초당 11,520문자예요. 8비트만 세서 69.4 µs를 고르는 실수가 가장 흔해요.", "pick": 1}, {"id": "embedded-01-06", "ch": 1, "type": "short", "cat": "calc", "level": 2, "sec": "11. main.c 코드 분석 (IP Layer)", "q": "1장 main.c의 다음 `printf`가 `_write()`로 넘기는 문자열은 모두 몇 바이트인가? (`\\r\\n` 포함, 숫자로)\n```c\n#define STUDENT_ID      \"20261234\"\n#define STUDENT_NAME    \"HongGildong\"\n\nprintf(\"Hello S32K3, %s %s\\r\\n\",\n       STUDENT_ID, STUDENT_NAME);\n```", "accept": ["35", "35바이트", "35byte", "35bytes", "35B"], "model": "35", "explain": "출력 문자열은 `Hello S32K3, 20261234 HongGildong` + `\\r\\n`이에요. 보이는 글자 33개(공백 포함)에 `\\r`·`\\n` 2바이트를 더해 **35바이트**예요. 115200 8N1이면 35 × 86.8 µs ≈ 3.04 ms가 걸려요."}, {"id": "embedded-01-07", "ch": 1, "type": "short", "cat": "read", "level": 3, "sec": "7. UART 기초와 프레임 구조", "q": "8N1 UART의 TX 선을 관찰했더니 Idle(HIGH) 다음 Start 비트(LOW)가 오고, 이어지는 데이터 8비트가 **시간 순서대로** `1, 0, 0, 0, 0, 0, 1, 0` 이었다. 전송된 바이트 값을 16진수로 쓰시오.", "accept": ["0x41", "41", "41h", "0x41h"], "model": "0x41", "explain": "UART 데이터는 **LSB(D0)부터** 나가요. 시간 순서 `1,0,0,0,0,0,1,0`은 D0~D7이므로 뒤집어 읽으면 `0100 0001` = **0x41**('A')이에요. 순서대로 읽어 `1000 0010` = 0x82로 답하는 게 함정이에요."}, {"id": "embedded-01-08", "ch": 1, "type": "mcq", "cat": "read", "level": 2, "sec": "11. main.c 코드 분석 (IP Layer)", "q": "1장 main.c의 `printf`를 다음처럼 바꿔 다시 빌드·플래시했다. PC 터미널에 표시되는 줄은?\n```c\n#define STUDENT_ID      \"20261234\"\n#define STUDENT_NAME    \"HongGildong\"\n\nprintf(\"Hello S32K3, %s %s\\r\\n\",\n       STUDENT_NAME, STUDENT_ID);\n```", "options": ["컴파일 오류가 나서 아무것도 출력되지 않는다", "Hello S32K3, 20261234 HongGildong", "Hello S32K3, HongGildong 20261234", "Hello S32K3, STUDENT_NAME STUDENT_ID"], "answer": [2], "why": ["틀림: 두 인수 모두 문자열이라 %s와 형이 맞아요. 순서만 바뀐 정상 코드예요.", "틀림: 원래 코드의 출력이에요. 인수 순서가 바뀌었어요.", "옳음: 첫 번째 %s ← STUDENT_NAME, 두 번째 %s ← STUDENT_ID 순서로 채워져요.", "틀림: 매크로는 전처리 단계에서 문자열 리터럴로 치환돼요. 이름이 그대로 찍히지 않아요."], "explain": "`%s` 자리는 **인수 순서대로** 채워져요. 그래서 이름이 먼저, 학번이 뒤에 나와요. `STUDENT_ID`·`STUDENT_NAME`은 매크로라 컴파일 전에 문자열로 바뀌고, 값을 바꾸면 **다시 빌드·플래시**해야 출력이 바뀌어요.", "pick": 1}, {"id": "embedded-01-09", "ch": 1, "type": "short", "cat": "read", "level": 2, "sec": "12. 빌드·플래시·실행, 확인 기준과 문제 해결", "q": "1장 기준 클럭 설정에서 다음 코드를 `printf`(\"Hello…\") 뒤에 추가했다. 터미널에 출력되는 줄의 숫자 부분을 쓰시오.\n```c\nuint32 freq = Clock_Ip_GetClockFrequency(CM7_CORE_CLK);\nprintf(\"CM7 core clock = %lu MHz\\r\\n\",\n       (unsigned long)(freq / 1000000UL));\n```", "accept": ["120", "120MHz"], "model": "120", "explain": "기준 설정에서 `Clock_Ip_GetClockFrequency(CM7_CORE_CLK)`는 **120000000**(Hz)을 돌려줘요. 이를 1000000으로 나눠 `%lu`로 찍으니 `CM7 core clock = 120 MHz`가 돼요. 슬라이드 기대 출력의 `120000000 Hz`를 그대로 쓰면 단위 변환을 놓친 답이에요."}, {"id": "embedded-01-10", "ch": 1, "type": "mcq", "cat": "read", "level": 2, "sec": "11. main.c 코드 분석 (IP Layer)", "q": "1장 `_write()`가 아래와 같을 때, `r1`, `r2`, `r3`의 값을 순서대로 나열한 것은?\n```c\nint _write(int file, char *ptr, int len)\n{\n    (void)file;\n    if ((ptr == NULL) || (len <= 0))\n    {\n        return 0;\n    }\n    if (LPUART_UART_IP_STATUS_SUCCESS !=\n        Lpuart_Uart_Ip_SyncSend(UART_CHANNEL,\n            (const uint8 *)ptr, (uint32)len,\n            UART_TIMEOUT_US))\n    {\n        return -1;\n    }\n    return len;\n}\n\nchar msg[] = \"Hi\\r\\n\";\nr1 = _write(1, msg, 4);   /* SyncSend 성공 */\nr2 = _write(1, NULL, 4);\nr3 = _write(1, msg, 4);   /* SyncSend 실패 */\n```", "options": ["4, 0, -1", "1, 0, -1", "0, -1, 4", "4, -1, -1"], "answer": [0], "why": ["옳음: 성공 → len(4), NULL → 0, SyncSend 실패 → -1.", "틀림: 성공 시 반환값은 1이 아니라 보낸 바이트 수 len이에요.", "틀림: 성공하면 보낸 바이트 수 len(4)을 돌려줘요.", "틀림: ptr이 NULL이면 송신 없이 0을 돌려줘요(-1은 SyncSend 실패일 때)."], "explain": "`_write`의 반환 규칙은 **보낼 것 없음(ptr NULL 또는 len ≤ 0) → 0, SyncSend 실패 → -1, 성공 → len**이에요. `(void)file;`은 쓰지 않는 매개변수 경고를 없애는 관용구일 뿐 결과에 영향이 없어요.", "pick": 1}, {"id": "embedded-01-11", "ch": 1, "type": "short", "cat": "api", "level": 1, "sec": "11. main.c 코드 분석 (IP Layer)", "q": "`_write()` 송신부의 빈칸 (A)에 들어갈 함수 이름의 나머지 부분을 쓰시오. (다 보내거나 timeout이 될 때까지 기다리는 **동기(blocking) 송신** 함수)\n```c\nif (LPUART_UART_IP_STATUS_SUCCESS !=\n    Lpuart_Uart_Ip_(A)(UART_CHANNEL,\n                       (const uint8 *)ptr,\n                       (uint32)len,\n                       UART_TIMEOUT_US))\n{\n    return -1;\n}\nreturn len;\n```", "accept": ["SyncSend", "Lpuart_Uart_Ip_SyncSend", "SyncSend()", "Lpuart_Uart_Ip_SyncSend()"], "model": "SyncSend", "explain": "`Lpuart_Uart_Ip_SyncSend()`는 LPUART의 UART 드라이버(IP 계층)의 **동기 송신** 함수예요. RTD 이름은 `모듈_계층_기능` 규칙이라 `Lpuart_Uart` + `_Ip` + `_SyncSend`로 읽혀요. timeout은 `UART_TIMEOUT_US`(1000000U µs = 1초)예요."}, {"id": "embedded-01-12", "ch": 1, "type": "err", "cat": "error", "level": 2, "sec": "11. main.c 코드 분석 (IP Layer)", "q": "1장 main.c를 다음처럼 바꿨다(긴 심볼은 `…`로 축약). 실행하면 어떻게 되는가?\n```c\nint main(void)\n{\n    Clock_Ip_Init(&Clock_Ip_aClockConfig[0]);\n    Siul2_Port_Ip_Init(NUM_OF_…, g_pin_mux_…);\n\n    printf(\"Hello S32K3, %s %s\\r\\n\",\n           STUDENT_ID, STUDENT_NAME);\n\n    Lpuart_Uart_Ip_Init(UART_CHANNEL,\n                        &Lpuart_Uart_Ip_xHwConfigPB_6);\n    while (1)\n    {\n    }\n}\n```", "answer": 0, "why": ["옳음: 슬라이드 그대로 — 초기화 순서를 지키지 않으면 출력이 나오지 않거나 HardFault가 발생해요.", "틀림: printf 시점에 LPUART6가 아직 초기화되지 않았어요.", "틀림: 함수 호출 순서만 바뀌었을 뿐 문법·선언은 그대로라 빌드는 돼요.", "틀림: 글자 깨짐은 baud/frame 불일치 증상이에요. 여기선 장치 자체가 준비되지 않았어요."], "outcomes": ["출력이 나오지 않거나 HardFault가 발생할 수 있다", "정상적으로 `Hello S32K3, 20261234 HongGildong`이 출력된다", "컴파일 오류가 난다", "글자가 깨져서 출력된다"], "reasons": ["printf → _write → SyncSend가 실행될 때 LPUART6가 아직 초기화되지 않은 상태라 송신할 수 없다", "Siul2_Port_Ip_Init를 Clock_Ip_Init보다 먼저 호출해야 하기 때문이다", "printf는 무한 루프 안에서만 호출할 수 있기 때문이다", "LPUART6 초기화 뒤에 반드시 PLL을 다시 분배해야 하기 때문이다"], "reason": 0, "rwhy": ["옳음: 순서는 클럭 → 핀 → **LPUART6 초기화** → printf예요. 장치를 쓰기 전에 초기화해야 해요.", "틀림: 정해진 순서는 클럭 → 핀이고, 여기선 그 부분은 맞아요.", "틀림: printf는 어디서든 호출할 수 있어요. 문제는 호출 시점의 장치 상태예요.", "틀림: PLL 분배는 클럭 초기화 단계에서 끝나요. LPUART 초기화와 무관해요."], "explain": "1장 코드 흐름은 **클럭 → 핀 → LPUART6 → printf → 무한 루프**예요. printf가 LPUART6 초기화보다 먼저 오면 `_write`가 준비되지 않은 LPUART로 송신하게 되어, 슬라이드 경고대로 **출력이 없거나 HardFault**가 날 수 있어요. 빌드는 정상이라 더 헷갈리는 오류예요."}, {"id": "embedded-01-13", "ch": 1, "type": "err", "cat": "error", "level": 2, "sec": "12. 빌드·플래시·실행, 확인 기준과 문제 해결", "q": "보드 코드는 1장 예제 그대로(LPUART6, 115200 bps, 8N1)이다. PuTTY에서 장치 관리자의 OpenSDA COM 포트는 맞게 골랐지만 **Speed를 9600**으로 두고 Resume했다. 터미널에는 어떻게 보이는가?", "answer": 2, "why": ["틀림: 양쪽 baud rate가 달라 비트를 올바르게 자를 수 없어요.", "틀림: 신호는 VCOM을 거쳐 PC까지 와요. '무출력'은 채널·핀 설정 오류 증상이에요.", "옳음: 문제 해결표의 '글자가 깨짐 → baud rate 또는 frame 설정 불일치'예요.", "틀림: 터미널 설정은 PC 쪽 문제라 보드 동작에는 영향이 없어요."], "outcomes": ["`Hello S32K3, 20261234 HongGildong`이 정상 출력된다", "아무것도 보이지 않는다", "글자가 깨져 보인다", "보드에서 HardFault가 발생한다"], "reasons": ["VCOM은 LPUART6가 아닌 다른 UART에 배선되어 있다", "9600 bps에서는 Start 비트가 없어 프레임 시작을 알 수 없다", "터미널 속도가 낮으면 LPUART6_CLK가 꺼진다", "UART는 클럭 선이 없어 양쪽이 같은 baud rate를 약속해야 하는데, 달라서 수신 측이 비트 경계를 잘못 샘플링한다"], "reason": 3, "rwhy": ["틀림: VCOM은 LPUART6(PTA15/PTA16)에 배선되어 있고, 보드 코드도 LPUART6를 써요.", "틀림: Start 비트는 baud rate와 상관없이 모든 프레임에 있어요.", "틀림: PC 터미널 설정은 보드의 클럭에 영향을 주지 않아요.", "옳음: 비동기 통신이라 박자 약속(baud)이 어긋나면 엉뚱한 비트를 읽어 글자가 깨져요."], "explain": "UART는 **클럭 선 없이** 양쪽이 같은 baud rate로 비트를 잘라 읽는 비동기 통신이에요. 신호 경로는 살아 있으니 무언가는 도착하지만 샘플링 시점이 어긋나 **글자가 깨져요**. 조치는 터미널을 115200/8N1, flow none으로 맞추는 거예요."}, {"id": "embedded-01-14", "ch": 1, "type": "err", "cat": "error", "level": 2, "sec": "8. OpenSDA VCOM과 printf 리다이렉션", "q": "학생이 Config Tools에서 콘솔 UART를 **LPUART0 / PTA8·PTA9**로 설정하고, 생성된 심볼 이름에 맞게 main.c도 고쳐 빌드에 성공했다. 보드를 PC에 USB(OpenSDA)로 연결하고 터미널을 115200 8N1로 맞춘 뒤 실행하면?", "answer": 0, "why": ["옳음: 슬라이드 p.29 그대로 — LPUART0/PTA8/PTA9로 설정하면 터미널에 아무것도 보이지 않아요.", "틀림: COM 포트는 OpenSDA가 만들어요. 케이블·드라이버 문제일 때 안 보여요.", "틀림: VCOM은 LPUART0 핀과 연결되어 있지 않아요.", "틀림: 깨짐은 신호가 PC까지 온 경우(baud/frame 불일치)예요. 여기선 신호가 VCOM에 닿지 않아요."], "outcomes": ["터미널에 아무것도 보이지 않는다", "COM 포트가 장치 관리자에 나타나지 않는다", "정상 출력된다", "글자가 깨져 보인다"], "reasons": ["printf는 LPUART6에서만 동작하도록 C 라이브러리에 정해져 있다", "PTA8·PTA9는 입력 전용 핀이라 송신할 수 없다", "보드의 OpenSDA VCOM은 LPUART6(PTA15=RX, PTA16=TX)에 고정 배선되어 있어 다른 핀의 신호는 PC로 가지 않는다", "LPUART0은 115200 bps를 지원하지 않는다"], "reason": 2, "rwhy": ["틀림: printf는 `_write()`를 통해 어디로든 보낼 수 있어요(retargeting). 막힌 건 배선이에요.", "틀림: PTA8·PTA9는 LPUART0의 송수신 핀으로 쓸 수 있는 핀이라 신호는 나가요. 다만 그 핀이 VCOM에 연결되어 있지 않아요.", "옳음: VCOM 배선이 고정이라 콘솔은 반드시 LPUART6/PTA16(TX)여야 해요 — 하드웨어 의존성의 예.", "틀림: LPUART0도 클럭만 주면 115200 bps를 낼 수 있어요. 신호는 나가지만 VCOM으로 가는 선이 없을 뿐이에요."], "explain": "OpenSDA VCOM은 보드 위에서 **LPUART6의 PTA16(TX)/PTA15(RX)**에 배선되어 있어요. 코드가 아무리 맞아도 선이 없는 핀으로 나간 신호는 PC가 받을 수 없어 **무출력**이 돼요. '글자 깨짐'(baud 불일치)과 '무출력'(채널·핀 오류)을 구별하는 게 핵심이에요."}, {"id": "embedded-01-15", "ch": 1, "type": "err", "cat": "error", "level": 3, "sec": "11. main.c 코드 분석 (IP Layer)", "q": "`_write()`에서 `(void)file;` 한 줄을 지웠다. 빌드와 실행 결과는?\n```c\nint _write(int file, char *ptr, int len)\n{\n    if ((ptr == NULL) || (len <= 0))\n    {\n        return 0;\n    }\n    if (LPUART_UART_IP_STATUS_SUCCESS !=\n        Lpuart_Uart_Ip_SyncSend(UART_CHANNEL,\n            (const uint8 *)ptr, (uint32)len,\n            UART_TIMEOUT_US))\n    {\n        return -1;\n    }\n    return len;\n}\n```", "answer": 2, "why": ["틀림: 송신 코드(SyncSend)는 바뀌지 않았어요.", "틀림: C에서 매개변수를 쓰지 않는 건 오류가 아니에요(경고 대상일 뿐).", "옳음: `(void)file;`은 경고 억제용 관용구라, 지워도 동작은 같아요.", "틀림: 함수 이름·시그니처가 그대로라 printf는 여전히 이 _write를 불러요."], "outcomes": ["빌드는 되지만 터미널에 아무것도 출력되지 않는다", "컴파일 오류가 난다", "정상 빌드·동작한다 (쓰지 않는 매개변수 경고가 날 수 있을 뿐 출력은 같다)", "링크 오류로 printf가 _write를 찾지 못한다"], "reasons": ["`(void)file;`이 있어야 printf가 _write를 호출한다", "`(void)file;`은 안 쓰는 매개변수 경고를 없애는 관용구일 뿐 프로그램 동작에는 영향이 없다", "`file` 값이 출력할 UART 채널을 고르므로 반드시 읽어야 한다", "C에서는 선언한 매개변수를 함수 본문에서 반드시 사용해야 한다"], "reason": 1, "rwhy": ["틀림: printf → _write 연결은 함수 이름으로 이뤄져요.", "옳음: 슬라이드·노트의 설명 그대로예요. MSVC /W4도 경고(C4100)만 내고 빌드돼요.", "틀림: 채널은 `UART_CHANNEL`(6U)이 정해요. file은 쓰지 않아요.", "틀림: 그런 규칙은 C에 없어요. 컴파일러가 경고를 줄 수 있을 뿐이에요."], "explain": "`(void)file;`은 **안 쓰는 매개변수 경고를 없애는 관용구**예요. 지우면 컴파일러가 '참조되지 않은 매개변수' 경고를 낼 수 있지만, 오류가 아니고 동작도 같아요. '경고 = 오류'로 착각하게 만드는 함정이에요."}, {"id": "embedded-01-16", "ch": 1, "type": "mcq", "cat": "api", "level": 2, "sec": "11. main.c 코드 분석 (IP Layer)", "q": "1장 IP Layer 예제의 다음 매크로에서 `6U`가 뜻하는 것은?\n```c\n/* LPUART6 = OpenSDA VCOM (PTA16=TX, PTA15=RX) */\n#define UART_CHANNEL    6U\n#define UART_TIMEOUT_US 1000000U\n```", "options": ["TX 핀 번호(PTA6)", "송신 timeout 6초", "LPUART 하드웨어 instance 번호(LPUART6)", "Config Tools Pins 화면의 6번째 핀 설정"], "answer": [2], "why": ["틀림: TX 핀은 PTA16이에요.", "틀림: timeout은 `UART_TIMEOUT_US 1000000U`(µs) = 1초예요.", "옳음: `Lpuart_Uart_Ip_Init`/`SyncSend`에 넘기는 값은 LPUART 하드웨어 instance 번호 6이에요.", "틀림: 핀 설정은 Siul2_Port_Ip_Init에 넘기는 생성 배열이 담당해요."], "explain": "IP Layer 함수는 **하드웨어 instance 번호**를 받아요. VCOM이 LPUART6에 배선돼 있으니 `UART_CHANNEL`은 `6U`예요. 단, 생성 객체 이름(`Lpuart_Uart_Ip_xHwConfigPB_6`)은 instance 번호와 꼭 같지 않으니 `generate/include` 헤더에서 확인해요.", "pick": 1}, {"id": "e2-h01", "ch": 2, "type": "mcq", "cat": "calc", "level": 1, "sec": "3. 비트 마스킹 기본 패턴", "q": "5(0101)와 3(0011)에 대한 비트 연산 결과로 옳은 것을 **2개 고르시오.**", "options": ["`5 & 3` = 1", "`5 | 3` = 7", "`5 ^ 3` = 2", "`5 & 3` = 7", "`5 | 3` = 8"], "answer": [0, 1], "why": ["맞음: 0101 & 0011 = 0001 → 둘 다 1인 자리만 1이에요.", "맞음: 0101 | 0011 = 0111 → 하나라도 1이면 1이에요.", "틀림: 0101 ^ 0011 = 0110 = **6**이에요. 서로 다른 자리만 1이에요.", "틀림: 7은 OR 결과예요. AND는 둘 다 1인 bit0만 남아 1이에요.", "틀림: 비트 OR는 덧셈이 아니에요. 0111 = 7이에요."], "explain": "2진수로 펼쳐서 자리마다 계산해요. **AND = 둘 다 1**, **OR = 하나라도 1**, **XOR = 서로 다르면 1**. 5 & 3 = 1, 5 | 3 = 7, 5 ^ 3 = 6.", "hot": 1, "pick": 2}, {"id": "e2-h02", "ch": 2, "type": "short", "cat": "calc", "level": 1, "sec": "3. 비트 마스킹 기본 패턴", "q": "다음 식의 값을 16진수로 쓰시오.\n```c\n0xB6 & 0x3C\n```", "accept": ["0x34", "34", "0x34u", "34h"], "model": "0x34", "explain": "0xB6 = 1011 0110, 0x3C = 0011 1100 → 자리마다 AND = **0011 0100 = 0x34**. 16진수 한 자리를 4비트로 펼쳐서 계산하면 실수가 없어요.", "hot": 1}, {"id": "e2-h03", "ch": 2, "type": "short", "cat": "calc", "level": 1, "sec": "3. 비트 마스킹 기본 패턴", "q": "다음 식의 값을 16진수로 쓰시오.\n```c\n0xA5 ^ 0xFF\n```", "accept": ["0x5A", "5A", "0x5Au", "5Ah"], "model": "0x5A", "explain": "1과 XOR하면 그 비트가 **뒤집혀요**. 0xFF는 8비트가 모두 1이라 0xA5(1010 0101)의 8비트가 전부 뒤집혀 **0101 1010 = 0x5A**가 돼요.", "hot": 1}, {"id": "e2-h04", "ch": 2, "type": "mcq", "cat": "calc", "level": 1, "sec": "3. 비트 마스킹 기본 패턴", "q": "`int x = 6;`일 때 시프트 연산 결과로 옳은 것은?", "options": ["`x << 3` = 48, `x >> 1` = 3", "`x << 3` = 18, `x >> 1` = 3", "`x << 3` = 48, `x >> 1` = 12", "`x << 3` = 9, `x >> 1` = 5"], "answer": [0], "why": ["맞음: 왼쪽 1칸 = ×2라서 3칸이면 ×8 = 48이에요. 오른쪽 1칸 = ÷2라서 3이에요.", "틀림: 18은 ×3이에요. 시프트 3칸은 2³ = 8배예요.", "틀림: 12는 왼쪽으로 민 값이에요. `>>`는 ÷2라서 3이에요.", "틀림: 시프트는 덧셈이 아니에요. 6 + 3 = 9, 6 − 1 = 5는 함정이에요."], "explain": "`x << n` = x × 2ⁿ, `x >> n` = x ÷ 2ⁿ(나머지 버림, 양수 기준). 6 = 0110 → `<< 3` = 0011 0000 = **48**, `>> 1` = 0011 = **3**.", "hot": 1, "pick": 1}, {"id": "e2-h05", "ch": 2, "type": "mcq", "cat": "read", "level": 2, "sec": "3. 비트 마스킹 기본 패턴", "q": "다음 코드 실행 후 `reg`의 값은?\n```c\nuint32_t reg = 0xF0U;\nreg &= ~(1U << 5);\nreg |= (1U << 1);\n```", "options": ["0xD2", "0xF2", "0xD0", "0x22"], "answer": [0], "why": ["맞음: 1111 0000 → bit5 끄기 → 1101 0000(0xD0) → bit1 켜기 → 1101 0010 = 0xD2예요.", "틀림: bit5를 끄는 첫 줄을 건너뛴 값이에요.", "틀림: 두 번째 줄 `|= (1U << 1)`로 bit1을 켜야 해요.", "틀림: `&= ~` 를 `&=`로 읽어서 bit5만 남긴 뒤 bit1을 켠 값이에요."], "explain": "`&= ~(1U << n)` = **n번 비트만 0**, `|= (1U << n)` = **n번 비트만 1**. 0xF0 → 0xD0 → **0xD2**. 나머지 비트는 그대로 남아요.", "hot": 1, "pick": 1}, {"id": "e2-h06", "ch": 2, "type": "short", "cat": "calc", "level": 2, "sec": "3. 비트 마스킹 기본 패턴", "q": "다음 코드 실행 후 `x`의 값을 16진수로 쓰시오.\n```c\nuint8_t x = 0x81U;\nx = (uint8_t)(x << 1);\n```", "accept": ["0x02", "0x2", "2", "02", "0x02u", "02h"], "model": "0x02", "explain": "0x81 = 1000 0001 → 왼쪽으로 1칸 = 1 0000 0010(0x102). `uint8_t`는 8비트만 담으니 맨 위로 넘친 1은 버려지고 **0x02**가 남아요. 시프트는 ×2지만 **자료형 크기를 넘으면 잘려요**.", "hot": 1}, {"id": "e2-h07", "ch": 2, "type": "mcq", "cat": "read", "level": 1, "sec": "1. Memory-Mapped I/O — 같은 문장, 다른 결과", "q": "주소 `0x10002000`에 있는 32비트 값을 `int i`에 읽어 오는 코드로 옳은 것을 **2개 고르시오.**", "options": ["`int i = *(int *)0x10002000;`", "`int *msr = (int *)0x10002000;  int i = *msr;`", "`int i = (int *)0x10002000;`", "`int i = &0x10002000;`", "`int (*) msr = 0x10002000;  int i = *msr;`"], "answer": [0, 1], "why": ["맞음: `(int *)`로 숫자를 주소로 바꾸고, 앞의 `*`로 그 주소의 값을 꺼내요.", "맞음: 같은 일을 포인터 변수를 거쳐 두 줄로 쓴 거예요.", "틀림: `*`가 없어서 값이 아니라 **주소 자체**를 int에 넣으려는 코드예요.", "틀림: `&`는 변수의 주소를 얻는 연산자라 숫자 상수에는 쓸 수 없어요(컴파일 오류).", "틀림: `int (*) msr`은 C 선언 문법이 아니에요. 포인터 선언은 `int *msr`이에요."], "explain": "주소 접근 공식은 **`*(자료형 *)주소`**예요. `(int *)` = 숫자를 int 포인터로 형변환, 앞의 `*` = 그 주소로 가서 값 읽기. 포인터 변수에 먼저 담아도 같아요. 실제 레지스터라면 `volatile uint32_t *`를 써요.", "hot": 1, "pick": 2}, {"id": "e2-h08", "ch": 2, "type": "mcq", "cat": "concept", "level": 1, "sec": "6. SIUL2 주소 계산 — MSCR 배열과 GPDO 역순 배치", "q": "MSR 레지스터가 0번 `0x10002000`, 1번 `0x10002004`, 2번 `0x10002008`, 3번 `0x1000200C`처럼 **4씩** 늘어나는 이유로 옳은 것은?", "options": ["레지스터 하나가 32비트 = 4바이트이고, 주소는 1바이트마다 1씩 늘기 때문", "주소를 16진수로 적기 때문", "ARM 주소 버스가 4비트 단위이기 때문", "컴파일러가 레지스터 사이에 빈 공간을 3바이트씩 넣기 때문"], "answer": [0], "why": ["맞음: 주소 1칸 = 1바이트예요. 32비트 레지스터는 4칸을 차지하니 다음 레지스터는 +4예요.", "틀림: 16진수는 숫자를 적는 방법일 뿐이에요. 10진수로 써도 4씩 늘어요(…8192, 8196, 8200).", "틀림: 주소 버스 폭과는 관계없어요. Cortex-M7은 32비트 주소를 써요.", "틀림: 빈 공간이 아니라 레지스터 자체가 4바이트예요."], "explain": "주소는 **바이트 단위**로 매겨져요. 32비트(4바이트) 레지스터가 연달아 있으면 다음 주소 = 앞 주소 + 4. 16진수로 0x0C = 12, 0x10 = 16이라 `00 → 04 → 08 → 0C → 10`처럼 보이는 거예요. 같은 이유로 MSCRn = BASE + 0x240 + **4 × n**이에요.", "hot": 1, "pick": 1}, {"id": "e2-h09", "ch": 2, "type": "short", "cat": "calc", "level": 2, "sec": "8. 직접 주소 매크로 vs SDK 헤더 구조체, 그리고 클럭 게이팅", "q": "다음 코드에서 `msr->r3`이 접근하는 **절대 주소**를 16진수로 쓰시오.\n```c\ntypedef struct {\n    int r0;\n    int r1;\n    int r2;\n    int r3;\n    int r4;\n} MSR_Type;\n\nMSR_Type *msr = (MSR_Type *)0x10002000;\nint v = msr->r3;\n```", "accept": ["0x1000200C", "1000200C", "0x1000200Cu", "1000200Ch"], "model": "0x1000200C", "explain": "구조체 시작 주소만 정해 주면 멤버 주소는 컴파일러가 **앞 멤버 크기를 더해서** 계산해요. int = 4바이트라 r0 +0, r1 +4, r2 +8, **r3 +0xC** → 0x10002000 + 0xC = **0x1000200C**.", "hot": 1}, {"id": "e2-h10", "ch": 2, "type": "err", "cat": "error", "level": 3, "sec": "8. 직접 주소 매크로 vs SDK 헤더 구조체, 그리고 클럭 게이팅", "q": "레지스터 묶음을 구조체로 만들면서 멤버를 **포인터**로 선언했다. 이 코드를 실행하면?\n```c\ntypedef struct {\n    int *r0;\n    int *r1;\n} MSR_Type;\n\nMSR_Type *msr = (MSR_Type *)0x10002000;\n*msr->r1 = 1;     /* r1 레지스터에 1을 쓰려는 의도 */\n```", "answer": 2, "why": ["틀림: `*msr->r1`은 문법상 올바른 식이라 빌드돼요.", "틀림: 0x10002004에 있는 건 레지스터 '값'인데, 코드는 그 값을 다시 주소로 써요.", "맞음: r1 칸(0x10002004)에 든 숫자를 주소로 보고 그곳에 1을 써요. 레지스터 r1은 그대로이고 HardFault가 날 수도 있어요.", "틀림: 외부 함수·변수를 쓰지 않아 링크 단계 문제는 없어요."], "outcomes": ["컴파일 오류가 난다", "의도대로 0x10002004에 1을 쓴다", "컴파일은 되지만 0x10002004에 1이 써지지 않고 엉뚱한 주소에 써진다", "링크 오류가 난다"], "reasons": ["멤버가 포인터라서 `msr->r1`은 레지스터 값이 아니라 '주소를 담은 칸'으로 해석되고, `*`가 그 값을 한 번 더 따라간다", "구조체 포인터에는 `->`를 쓸 수 없다", "0x10002004가 4의 배수가 아니라 정렬 오류가 난다", "포인터 멤버는 8바이트라 r1의 오프셋이 8이 된다"], "reason": 0, "rwhy": ["맞음: 레지스터 구조체의 멤버는 값(`int r1;`, 실제로는 `volatile uint32_t`)이어야 `msr->r1 = 1;`이 그 주소에 바로 써요.", "틀림: 구조체 포인터의 멤버 접근이 바로 `->`예요.", "틀림: 0x10002004는 4의 배수예요(…04).", "틀림: 32비트 Cortex-M7에서 포인터는 4바이트라 오프셋은 4예요. 문제는 크기가 아니라 '한 번 더 따라가는 것'이에요."], "explain": "레지스터 구조체는 **멤버 = 레지스터 값 자체**로 선언해요: `typedef struct { volatile uint32_t r0; volatile uint32_t r1; } MSR_Type;` 그리고 `msr->r1 = 1;`. 멤버를 `int *`로 두면 레지스터 값을 주소로 착각해 **한 번 더 역참조**하게 돼요.", "hot": 1}, {"id": "e2-h11", "ch": 2, "type": "short", "cat": "calc", "level": 3, "sec": "8. 직접 주소 매크로 vs SDK 헤더 구조체, 그리고 클럭 게이팅", "q": "다음 구조체 포인터에서 `p->f`의 **절대 주소**를 16진수로 쓰시오.\n```c\ntypedef struct {\n    uint8_t  a;\n    uint8_t  b[3];\n    uint32_t c;\n    uint16_t d;\n    uint16_t e;\n    uint32_t f;\n} X_Type;\n\nX_Type *p = (X_Type *)0x40000000U;\n```", "accept": ["0x4000000C", "4000000C", "0x4000000Cu", "4000000Ch"], "model": "0x4000000C", "explain": "다음 멤버 주소 = 앞 주소 + 앞 멤버 크기. a 1바이트(+0) → b 1×3바이트(+1) → c 4바이트(+4) → d 2바이트(+8) → e 2바이트(+0xA) → **f(+0xC)**. 0x40000000 + 0xC = **0x4000000C**.", "hot": 1}, {"id": "e2-h12", "ch": 2, "type": "mcq", "cat": "concept", "level": 1, "sec": "8. 직접 주소 매크로 vs SDK 헤더 구조체, 그리고 클럭 게이팅", "q": "`S32K312.h`의 다음 정의에 대한 설명으로 옳은 것은?\n```c\n#define IP_SIUL2_BASE  (0x40290000u)\n#define IP_SIUL2       ((SIUL2_Type *)IP_SIUL2_BASE)\n```", "options": ["SIUL2 시작 주소 0x40290000을 `SIUL2_Type` 구조체 포인터로 형변환한 것이다", "SIUL2_Type 크기만큼 RAM에 새 변수를 만든다", "0x40290000 레지스터에 들어 있는 값을 읽는다", "IP_SIUL2를 부를 때마다 SIUL2를 초기화하는 함수다"], "answer": [0], "why": ["맞음: 숫자 주소를 구조체 포인터로 바꿔서 `IP_SIUL2->MSCR[29]`처럼 멤버 이름으로 접근하게 해요.", "틀림: `#define`은 글자 치환이라 메모리를 만들지 않아요. 주소는 이미 하드웨어에 있어요.", "틀림: `*`가 없어서 값을 읽지 않아요. 포인터(주소)일 뿐이에요.", "틀림: 함수가 아니라 매크로 상수예요."], "explain": "구조체 방식의 핵심: **시작 주소 하나만 구조체 포인터로 형변환**하면, 각 레지스터 주소는 구조체 멤버 오프셋으로 컴파일러가 계산해요. `IP_SIUL2->GPDO29`가 역순 오프셋(0x131E)을 자동으로 맞히는 이유도 이거예요.", "hot": 1, "pick": 1}, {"id": "e2-h13", "ch": 2, "type": "mcq", "cat": "calc", "level": 2, "sec": "8. 직접 주소 매크로 vs SDK 헤더 구조체, 그리고 클럭 게이팅", "q": "`SIUL2_Type`이 다음처럼 시작할 때, `IP_SIUL2->MIDR1`의 절대 주소는? (`IP_SIUL2_BASE` = `0x40290000u`)\n```c\ntypedef struct {\n    uint8_t  RESERVED_0[4];\n    uint32_t MIDR1;\n    uint32_t MIDR2;\n    /* ... */\n} SIUL2_Type;\n```", "options": ["0x40290004", "0x402 nuint32_t reg = 0x00U;\nreg |= (1U << 7) | (1U << 0);\n```", "accept": ["0x81", "81", "0x00000081", "0x81u", "81h"], "model": "0x81", "explain": "`1U << 7` = 1000 0000(0x80), `1U << 0` = 0000 0001(0x01). 둘을 OR하면 0x81이고, 0에 OR하니 **0x81**. 여러 비트를 한 번에 켤 땐 마스크끼리 `|`로 묶어요.", "hot": 1}, {"id": "e2-h17", "ch": 2, "type": "mcq", "cat": "read", "level": 1, "sec": "3. 비트 마스킹 기본 패턴", "q": "다음 코드의 출력은?\n```c\nuint32_t reg = 0x34U;   /* 0011 0100 */\nprintf(\"%s \", (reg & (1U << 2)) ? \"ON\" : \"OFF\");\nprintf(\"%s\\n\", (reg & (1U << 3)) ? \"ON\" : \"OFF\");\n```", "options": ["ON OFF", "OFF ON", "ON ON", "OFF OFF"], "answer": [0], "why": ["맞음: 0x34 = 0011 0100 → bit2 = 1(ON), bit3 = 0(OFF)이에요.", "틀림: 왼쪽부터 세면 이렇게 돼요. 비트 번호는 **오른쪽 bit0부터** 세요.", "틀림: bit3은 0이라 AND 결과가 0 → OFF예요.", "틀림: bit2는 1이라 AND 결과가 4(0이 아님) → ON이에요."], "explain": "비트 검사 = `reg & (1U << n)`. 결과가 **0이 아니면 그 비트는 1**이에요. 0x34 = 0011 0100에서 오른쪽부터 bit0=0, bit1=0, **bit2=1**, **bit3=0** → `ON OFF`.", "hot": 1, "pick": 1}, {"id": "e2-h18", "ch": 2, "type": "short", "cat": "calc", "level": 1, "sec": "3. 비트 마스킹 기본 패턴", "q": "bit 7~4(네 비트)만 1이고 나머지는 0인 마스크를 만들려고 `0xFU << 4`를 썼다. 이 값을 16진수로 쓰시오.", "accept": ["0xF0", "F0", "0x000000F0", "0xF0u", "F0h"], "model": "0xF0", "explain": "0xF = 1111(네 비트)를 왼쪽으로 4칸 밀면 1111 0000 = **0xF0**. \"bit n부터 k비트 마스크\" = `((1U << k) - 1U) << n` 또는 `0xF << n`(k=4)이에요.", "hot": 1}, {"id": "e2-h19", "ch": 2, "type": "mcq", "cat": "read", "level": 2, "sec": "3. 비트 마스킹 기본 패턴", "q": "레지스터에서 bit 7:4 필드 값만 꺼내는 코드다. 실행 후 `field`의 값은?\n```c\nuint32_t reg = 0x0000A5C3U;\nuint32_t field = (reg >> 4) & 0xFU;\n```", "options": ["0xC", "0x3", "0x5", "0xC3"], "answer": [0], "why": ["맞음: 0xA5C3의 16진 자리는 오른쪽부터 3(bit3:0), **C(bit7:4)**, 5, A예요. 4칸 밀고 하위 4비트만 남기면 0xC예요.", "틀림: 0x3은 bit3:0 필드예요. `>> 4`로 이미 밀려났어요.", "틀림: 0x5는 bit11:8 필드예요.", "틀림: `& 0xF`가 하위 4비트만 남겨서 두 자리가 나올 수 없어요."], "explain": "필드 꺼내기 = **`(reg >> 시작비트) & 마스크`**. 먼저 필드를 bit0 자리로 내리고(`>> 4`), 필요한 폭만 남겨요(`& 0xF`). 16진수 한 자리 = 4비트라 bit7:4는 오른쪽에서 두 번째 자리 **C**예요.", "hot": 1, "pick": 1}, {"id": "e2-h20", "ch": 2, "type": "mcq", "cat": "read", "level": 2, "sec": "3. 비트 마스킹 기본 패턴", "q": "bit 11:8 필드만 5로 바꾸는 코드다. 실행 후 `reg`의 값은?\n```c\nuint32_t reg = 0x1234U;\nreg = (reg & ~(0xFU << 8)) | (0x5U << 8);\n```", "options": ["0x1534", "0x1734", "0x1254", "0x5234"], "answer": [0], "why": ["맞음: bit11:8은 오른쪽에서 세 번째 자리(2)예요. 먼저 0으로 지우고 5를 넣으면 0x1534예요.", "틀림: 지우기(`& ~`) 없이 OR만 한 값이에요. 2(0010) | 5(0101) = 7(0111)이라 이전 비트가 섞여요.", "틀림: 0x1254는 bit7:4(3)를 바꾼 값이에요. `<< 8`이라 세 번째 자리예요.", "틀림: 0x5234는 bit15:12를 바꾼 값이에요."], "explain": "필드 바꾸기 = **`(reg & ~(마스크 << n)) | (값 << n)`**. ① `& ~(0xF << 8)`로 bit11:8을 0으로 지우고(0x1034) ② `| (0x5 << 8)`로 5를 넣어요 → **0x1534**. 지우기를 빼면 2 | 5 = 7이 되어 0x1734가 나와요.", "hot": 1, "pick": 1}, {"id": "e2-h21", "ch": 2, "type": "err", "cat": "error", "level": 2, "sec": "3. 비트 마스킹 기본 패턴", "q": "bit5 하나만 켜려고 다음 코드를 썼다. `reg`의 기존 값이 `0x0F`일 때 결과는?\n```c\nuint32_t reg = 0x0FU;   /* bit3:0 이 켜져 있음 */\nreg = (1U << 5);        /* bit5 켜기 의도 */\n```", "answer": 2, "why": ["틀림: 평범한 대입이라 빌드돼요.", "틀림: 0x2F를 만들려면 `|=`를 써야 해요.", "맞음: `=`는 레지스터 전체를 0x20으로 덮어써서 원래 켜져 있던 bit3:0이 모두 0이 돼요.", "틀림: 대입이 실행되니 값은 바뀌어요."], "outcomes": ["컴파일 오류가 난다", "bit5만 켜지고 나머지는 그대로라 0x2F가 된다", "bit5는 켜지지만 기존 bit3:0이 지워져 0x20이 된다", "아무 변화가 없어 0x0F 그대로다"], "reasons": ["`|=`가 아니라 `=`로 대입해서 레지스터 전체가 `1U << 5` 값으로 덮어써졌다", "`1U`의 U 때문에 결과가 부호 없는 값이 되어 하위 비트가 잘렸다", "시프트 양 5가 레지스터 폭을 넘어서 정의되지 않은 동작이다", "`<<`가 `=`보다 우선순위가 낮아 `reg = 1U`가 먼저 실행됐다"], "reason": 0, "rwhy": ["맞음: 한 비트만 바꾸려면 읽기-수정-쓰기(`reg |= (1U << 5);`)로 나머지 비트를 보존해야 해요.", "틀림: U는 부호 없는 상수일 뿐 비트를 자르지 않아요.", "틀림: 32비트 값에서 5칸 시프트는 정상이에요.", "틀림: `<<`가 `=`보다 우선순위가 높아요. 오른쪽 식 0x20이 먼저 계산돼요."], "explain": "**`=`는 덮어쓰기, `|=`는 켜기**예요. `reg = (1U << 5);` → 0x20(다른 비트 전부 0). 수업의 MSCR도 `MSCR = 0x00200000` 통째 대입이 오답인 이유가 같아요(IBE 등이 지워짐).", "hot": 1}, {"id": "e2-h22", "ch": 2, "type": "err", "cat": "error", "level": 3, "sec": "3. 비트 마스킹 기본 패턴", "q": "bit3이 0이면 `CLEAR`를 출력하려고 다음 코드를 썼다. `reg = 0x30`(bit3 = 0)일 때 결과는?\n```c\nuint32_t reg = 0x30U;   /* 0011 0000 */\nif (reg & (1U << 3) == 0) {\n    printf(\"CLEAR\\n\");\n}\n```", "answer": 2, "why": ["틀림: 문법은 맞아서 경고(우선순위 주의)만 나오고 빌드돼요.", "틀림: 식이 의도와 다르게 묶여서 조건이 항상 거짓이에요.", "맞음: `reg & 0` = 0이라 if 안이 실행되지 않아요.", "틀림: `&`는 값을 읽기만 하지 레지스터를 바꾸지 않아요."], "outcomes": ["컴파일 오류가 난다", "의도대로 CLEAR가 출력된다", "컴파일은 되지만 아무것도 출력되지 않는다", "bit3이 1로 바뀌고 CLEAR가 출력된다"], "reasons": ["`==`가 `&`보다 우선순위가 높아 `reg & ((1U << 3) == 0)` = `reg & 0`으로 계산된다", "`1U << 3`이 8이 아니라 3이 된다", "printf는 if 안에서 쓸 수 없다", "0x30의 bit3은 실제로 1이다"], "reason": 0, "rwhy": ["맞음: `(1U << 3) == 0` → 8 == 0 → 0, 그래서 `reg & 0` = 0(거짓)이에요. 괄호 `(reg & (1U << 3)) == 0`이 필요해요.", "틀림: `1U << 3` = 8이에요.", "틀림: if 안에서 printf는 문제없어요.", "틀림: 0x30 = 0011 0000이라 bit3은 0이에요."], "explain": "C 우선순위는 **`<<` > `==` > `&` > `|`**예요. 비트 검사에 비교를 붙일 땐 반드시 **`(reg & mask) == 0`처럼 괄호**를 쳐요. 컴파일러는 경고만 하고 빌드해 줘서 더 찾기 어려운 버그예요.", "hot": 1}, {"id": "e2-h23", "ch": 2, "type": "short", "cat": "calc", "level": 1, "sec": "3. 비트 마스킹 기본 패턴", "q": "다음 코드 실행 후 `x`의 값을 16진수로 쓰시오.\n```c\nuint8_t x = 0x3CU;   /* 0011 1100 */\nx = (uint8_t)~x;\n```", "accept": ["0xC3", "C3", "0xC3u", "C3h"], "model": "0xC3", "explain": "`~`는 모든 비트를 뒤집어요. 0011 1100 → **1100 0011 = 0xC3**. 16진수 자리마다 15에서 빼도 같아요(3 → C, C → 3).", "hot": 1}, {"id": "e2-h24", "ch": 2, "type": "mcq", "cat": "read", "level": 2, "sec": "3. 비트 마스킹 기본 패턴", "q": "다음 코드 실행 후 `reg`의 값은?\n```c\nuint32_t reg = 0xA5U;\nreg ^= 0x18U;\nreg ^= 0x18U;\n```", "options": ["0xA5", "0xBD", "0x00", "0x18"], "answer": [0], "why": ["맞음: 같은 마스크로 XOR을 두 번 하면 그 비트들이 두 번 뒤집혀 원래 값으로 돌아와요.", "틀림: 0xBD는 XOR을 한 번만 한 값이에요(0xA5 ^ 0x18).", "틀림: XOR은 값을 지우지 않아요. 같은 값끼리 XOR할 때만 0이에요.", "틀림: 마스크 값 자체가 남지 않아요."], "explain": "toggle(`^=`)은 1인 마스크 자리만 뒤집어요. 한 번: 0xA5 ^ 0x18 = 0xBD, 두 번: 0xBD ^ 0x18 = **0xA5**. 그래서 LED 깜빡임을 `^=` 한 줄로 만들 수 있어요.", "hot": 1, "pick": 1}, {"id": "e2-h25", "ch": 2, "type": "short", "cat": "calc", "level": 2, "sec": "3. 비트 마스킹 기본 패턴", "q": "다음 코드 실행 후 `reg`의 값을 16진수로 쓰시오.\n```c\nuint32_t reg = 0x0FU;\nreg <<= 4;\nreg >>= 2;\n```", "accept": ["0x3C", "3C", "0x0000003C", "0x3Cu", "3Ch"], "model": "0x3C", "explain": "0x0F = 0000 1111 → `<<= 4` → 1111 0000(0xF0) → `>>= 2` → 0011 1100 = **0x3C**. 결과적으로 왼쪽으로 2칸 민 것과 같아요(15 × 4 = 60 = 0x3C).", "hot": 1}, {"id": "e2-h26", "ch": 2, "type": "mcq", "cat": "read", "level": 3, "sec": "3. 비트 마스킹 기본 패턴", "q": "MSCR 값 `mscr`에서 **OBE(bit 21)가 1인지** 검사하는 식으로 옳은 것은? (다른 비트도 켜져 있을 수 있다. 예: `mscr = 0x00680000`)", "options": ["`(mscr & (1UL << 21)) != 0U`", "`(mscr | (1UL << 21)) != 0U`", "`(mscr >> 21) == 1U`", "`(mscr & 21U) != 0U`"], "answer": [0], "why": ["맞음: bit21만 남겨서 0이 아닌지 보면 다른 비트와 상관없이 OBE만 검사해요.", "틀림: OR은 bit21을 강제로 켜서 결과가 항상 0이 아니에요(항상 참).", "틀림: bit22가 켜져 있으면 `0x00680000 >> 21` = 3이라 OBE = 1인데도 거짓이 돼요.", "틀림: 21은 비트 번호이지 마스크가 아니에요. 21 = 0001 0101은 bit0·2·4를 검사해요."], "explain": "비트 검사는 **`(값 & (1 << n)) != 0`**. `>>` 후 비교하려면 `((mscr >> 21) & 1U) == 1U`처럼 `& 1`로 다른 비트를 떼어내야 해요. 0x00680000 = bit22·21·19라 보기 C만 틀린 결과(거짓)를 내요.", "hot": 1, "pick": 1}, {"id": "e2-n01", "ch": 2, "type": "short", "cat": "concept", "level": 1, "sec": "1. Memory-Mapped I/O — 같은 문장, 다른 결과", "q": "RAM·Flash·주변장치 레지스터를 **하나의 주소 공간**에 배치해서, CPU가 변수와 하드웨어 레지스터를 **같은 load/store 명령**(C에서는 포인터 역참조)으로 다루는 구조를 무엇이라 하는가? (영문 용어)", "accept": ["Memory-mapped I/O", "Memory mapped I/O", "Memory-mapped IO", "Memory mapped IO", "MemorymappedI/O", "Memory-mapped Input/Output", "MMIO", "메모리 맵드 I/O", "메모리맵드IO", "메모리 매핑 I/O"], "model": "Memory-mapped I/O", "explain": "주변장치 제어 레지스터에 **메모리처럼 주소를 붙여** 두는 방식이 Memory-mapped I/O예요. 그래서 전용 I/O 명령 없이 `*ptr = 1U;` 같은 포인터 대입만으로 하드웨어를 움직여요. \"영역마다 주소 공간이 따로 있다\"·\"전용 I/O 명령으로만 접근한다\"는 대표 오답이에요."}, {"id": "e2-n02", "ch": 2, "type": "mcq", "cat": "read", "level": 2, "sec": "1. Memory-Mapped I/O — 같은 문장, 다른 결과", "q": "다음 코드가 실행될 때에 대한 설명으로 옳은 것을 **2개 고르시오.** (MSCR29는 이미 GPIO 출력으로 설정되어 있다)\n```c\nuint8_t flag = 0U;                                            /* SRAM 변수 */\nuint8_t *pv = &flag;\nvolatile uint8_t *gpdo29 = (volatile uint8_t *)0x4029131EUL;\n\n*pv     = 1U;   /* (A) */\n*gpdo29 = 1U;   /* (B) */\n```", "options": ["(A)와 (B)는 둘 다 CPU의 같은 store 명령으로 실행된다", "(B)는 주변장치 전용 I/O 명령이 필요하므로 C 포인터로는 쓸 수 없다", "0x4029131E는 SIUL2 BASE 0x40290000에 GPDO29 오프셋 0x131E를 더한 주소다", "0x4029131E는 MSCR29의 주소라서 (B)는 PTA29의 핀 기능을 바꾼다", "(A)와 (B)는 문장 꼴이 같으므로 둘 다 SRAM 값만 바뀐다"], "answer": [0, 2], "pick": 2, "why": ["맞음: Memory-mapped I/O에서는 변수든 레지스터든 같은 load/store 명령으로 다뤄요.", "틀림: 레지스터도 메모리처럼 주소가 있어서 포인터 역참조로 그대로 써요.", "맞음: 0x40290000 + 0x131E = 0x4029131E, PTA29의 출력 값 레지스터예요.", "틀림: MSCR29는 0x40290000 + 0x240 + 4 × 29 = 0x402902B4예요.", "틀림: (B)는 Peripheral 주소라 값이 회로로 전달돼 PTA29 핀 전압이 바뀌어요."], "explain": "CPU는 주소 뒤에 무엇이 있는지 따지지 않고 **같은 store**를 실행해요. (A)는 SRAM이라 **변수 값**이, (B)는 Peripheral 주소(GPDO29 = 0x40290000 + 0x131E)라 **PTA29 핀 전압**이 바뀌어 D13이 켜져요. 같은 문장이라도 주소가 가리키는 대상에 따라 결과가 달라요."}, {"id": "e2-n03", "ch": 2, "type": "mcq", "cat": "concept", "level": 2, "sec": "2. volatile — 컴파일러 최적화로부터 하드웨어 접근 지키기", "q": "2장·5장 실습 기준으로 `volatile`을 붙여야 하는 대상을 **2개 고르시오.**", "options": ["`#define LED_RED_GPDO_INDEX (29UL)` 같은 매크로 상수", "ISR과 main 루프가 함께 읽고 쓰는 전역 플래그 변수", "`GpioBare_SetOutput()` 안에서 계산용으로만 쓰는 지역 변수 `value`", "`SIUL2_GPDO(n)`처럼 주변장치 레지스터를 가리키는 포인터", "`LedOnLevel()`이 반환하는 0/1 값"], "answer": [1, 3], "pick": 2, "why": ["틀림: 매크로 상수는 전처리기가 숫자로 바꿔 넣을 뿐, 메모리 접근이 아니에요.", "맞음: 인터럽트가 프로그램 흐름 밖에서 값을 바꾸므로 매번 실제로 읽어야 해요(5장).", "틀림: `value`는 CPU 안에서만 계산하는 값이에요. 실제 레지스터 접근은 volatile인 `SIUL2_MSCR()` 매크로가 해요.", "맞음: 접근이 생략·재배치되면 코드는 정상인데 LED가 안 움직여요.", "틀림: 프로그램 안에서만 결정되는 일반 반환값이에요."], "explain": "`volatile`은 값이 **프로그램 밖**(회로·인터럽트)에서 바뀌거나 접근 자체가 의미 있는 동작일 때 붙여요. 정리하면 **주변장치 레지스터 · ISR 공유 변수 · busy-wait Delay 카운터** 세 곳이에요. 빼도 컴파일 에러는 나지 않고 보드에서만 이상하게 동작해요."}, {"id": "e2-n04", "ch": 2, "type": "mcq", "cat": "read", "level": 2, "sec": "3. 비트 마스킹 기본 패턴", "q": "다음 코드 실행 후 `reg`의 값은?\n```c\nuint32_t reg = 0x00080005UL;\nreg &= ~(1UL << 19);\nreg ^=  (1UL << 21);\nreg  = (reg & ~0xFUL) | 0x2UL;\n```", "options": ["0x00280002", "0x00200007", "0x00200002", "0x00000002"], "answer": [2], "pick": 1, "why": ["틀림: bit 19(0x00080000) clear를 빠뜨린 값이에요.", "틀림: 필드를 지우지 않고 OR만 한 값(0101 OR 0010 = 0111)이에요.", "맞음: 0x00080005 → bit 19 clear 0x00000005 → bit 21 toggle 0x00200005 → 하위 4비트를 2로 0x00200002.", "틀림: bit 21은 원래 0이라 XOR 1로 **1이 돼요**. toggle은 끄기가 아니라 뒤집기예요."], "explain": "한 줄씩 보면 `&= ~(1UL << 19)`는 bit 19 하나만 지워 0x00000005, `^= (1UL << 21)`은 0이던 bit 21을 뒤집어 0x00200005, `(reg & ~0xF) | 0x2`는 하위 4비트를 0101 → 0010으로 바꿔 **0x00200002**예요. 필드 변경은 반드시 **지우고 → 넣기** 두 단계예요."}, {"id": "e2-n05", "ch": 2, "type": "mcq", "cat": "read", "level": 1, "sec": "3. 비트 마스킹 기본 패턴", "q": "`uint32_t reg = 0x000000FFUL;`일 때, 실행 후 `reg`가 **0x000000DF**(bit 5만 0, 나머지 보존)가 되는 코드는?", "options": ["`reg |= ~(1u << 5);`", "`reg &= (1u << 5);`", "`reg ^= ~(1u << 5);`", "`reg &= ~(1u << 5);`", "`reg = ~(1u << 5);`"], "answer": [3], "pick": 1, "why": ["틀림: OR에 ~마스크를 쓰면 bit 5 외의 모든 비트가 1이 돼 0xFFFFFFFF예요.", "틀림: ~ 없이 AND하면 bit 5만 남고 나머지가 지워져 0x00000020이에요.", "틀림: bit 5 외의 모든 비트가 뒤집혀 0xFFFFFF20이에요.", "맞음: 0xFF AND 0xFFFFFFDF = 0xDF. clear의 정석 패턴이에요.", "틀림: 기존 값과 상관없이 덮어써서 0xFFFFFFDF가 돼요."], "explain": "clear는 **AND 0**이라 마스크를 `~`로 뒤집어 bit 5 자리만 0인 값(0xFFFFFFDF)과 AND해요. 마스크가 1인 자리는 원래 값이 그대로 남아 0xDF예요. `|= ~`·`&=`(~ 없이)·`= ~`는 연산자 바꿔치기 단골 오답이에요."}, {"id": "e2-n06", "ch": 2, "type": "mcq", "cat": "concept", "level": 2, "sec": "4. S32K3의 GPIO 블록 — SIUL2와 주요 레지스터", "q": "S32K312 SIUL2의 **GPDO** 레지스터에 대한 설명으로 **옳지 않은** 것은?", "options": ["핀 하나마다 8비트 레지스터가 하나씩 있고, 의미 있는 비트는 bit 0(PDO_n)뿐이다", "핀마다 자기 바이트가 따로 있어서 읽기-수정-쓰기 없이 0/1을 그대로 써도 다른 핀에 영향이 없다", "여러 핀의 출력을 한 번에 바꾸려면 Parallel 레지스터인 PGPDO를 쓴다", "실습 코드에서는 `volatile uint8_t *`로 딱 1바이트만 접근한다", "MSCR의 OBE 설정과 관계없이 GPDO에 1을 쓰면 핀이 High로 구동된다"], "answer": [4], "pick": 1, "why": ["틀림: 옳은 설명이에요 — bit 7~1은 읽으면 0인 예약 비트예요.", "틀림: 옳은 설명이에요 — 그래서 GpioBare_Write는 단순 쓰기예요.", "틀림: 옳은 설명이에요 — PGPDO/PGPDI의 P = Parallel이에요(이번 장 범위 밖).", "틀림: 옳은 설명이에요 — GPDO가 8비트 레지스터라서예요.", "맞음(정답): 이 설명이 틀렸어요 — OBE = 1로 Output driver를 켜야 GPDO 값이 핀에 나타나요."], "explain": "GPDO는 **핀 1개의 출력 값**을 담는 1바이트 칸이고, 그 값이 핀에 나타나려면 MSCR에서 **OBE = 1**로 출력 버퍼를 켜야 해요. OBE = 0이면 값은 DO까지 와도 드라이버가 꺼져 있어 핀이 안 움직여요. LED가 안 켜질 때 GPDO보다 MSCR을 먼저 의심하는 이유예요."}, {"id": "e2-n07", "ch": 2, "type": "mcq", "cat": "calc", "level": 2, "sec": "5. MSCR — 핀을 GPIO 출력으로 만들기", "q": "디버거로 어떤 핀의 MSCR 값을 읽었더니 `0x00282000`이었다. 1로 설정된 필드와 SSS 값을 바르게 짝지은 것은? (MSCR 비트: OBE 21, IBE 19, INV 17, PKE 16, SRC 14, PUE 13, PUS 11, SSS 3:0)", "options": ["OBE · PKE · PUS, SSS = 0", "OBE · IBE · PUE, SSS = 0", "IBE · INV · SRC, SSS = 0", "OBE · IBE · PUE, SSS = 2"], "answer": [1], "pick": 1, "why": ["틀림: 0x00080000은 bit 19(IBE)이고 PKE(bit 16)는 0x00010000이에요. 0x2000은 bit 13(PUE)이에요.", "맞음: 0x00200000(bit 21) + 0x00080000(bit 19) + 0x00002000(bit 13), 하위 4비트 0 → SSS = 0(GPIO).", "틀림: bit 17(INV, 0x00020000)·bit 14(SRC, 0x00004000)는 0이고, bit 21(OBE)을 빠뜨렸어요.", "틀림: SSS는 맨 끝 16진수 자리(bit 3:0)라 0이에요. `2`는 bit 13의 0x2000 자리예요."], "explain": "16진수 한 자리 = 4비트로 쪼개 읽어요. `0x00282000` = 0x00200000(bit 21, **OBE**) + 0x00080000(bit 19, **IBE**) + 0x00002000(bit 13, **PUE**)이고, 하위 4비트가 0이라 **SSS = 0(GPIO)**이에요. 즉 GPIO 출력 + 입력 버퍼 + 풀 저항이 켜진 상태예요."}, {"id": "e2-n08", "ch": 2, "type": "short", "cat": "calc", "level": 1, "sec": "5. MSCR — 핀을 GPIO 출력으로 만들기", "q": "MSCR에서 PUE(Pull enable)는 bit 13, PUS(Pull select)는 bit 11이다. 두 비트를 한 번에 set하는 마스크 `(1UL << 13) | (1UL << 11)`의 값을 16진수로 쓰시오.", "accept": ["0x2800", "2800", "0x00002800", "00002800", "2800h", "0x2800UL", "0x00002800UL", "0x0000_2800"], "model": "0x2800", "explain": "`1UL << 13` = 0x2000, `1UL << 11` = 0x0800이라 OR하면 **0x2800**이에요. bit 15~12 자리에 2(0010), bit 11~8 자리에 8(1000)이 들어가요. 여러 비트를 한 번에 켤 땐 마스크를 OR로 묶어 `|=` 하면 돼요."}, {"id": "e2-n09", "ch": 2, "type": "err", "cat": "error", "level": 3, "sec": "5. MSCR — 핀을 GPIO 출력으로 만들기", "q": "`GpioBare_SetOutput()`에서 `~` 하나를 빠뜨렸다. MSCR29의 기존 값이 `0x00080001`(IBE = 1, SSS = 1, 설명용 가정)이고 나머지는 실습 코드 그대로일 때 결과는?\n```c\nstatic inline void GpioBare_SetOutput(uint32_t mscrIndex)\n{\n    uint32_t value;\n    value = SIUL2_MSCR(mscrIndex);\n    value &= SIUL2_MSCR_SSS_MASK;      /* ← ~ 누락 */\n    value |= SIUL2_MSCR_OBE_MASK;\n    value |= SIUL2_MSCR_SSS_GPIO;\n    SIUL2_MSCR(mscrIndex) = value;\n}\n```", "answer": 2, "why": ["틀림: MSCR29 최종값이 0x00200001이라 핀 기능이 GPIO가 아니에요.", "틀림: `&=`와 마스크 상수는 문법상 문제없어 빌드는 돼요.", "맞음: 출력 버퍼는 켜졌지만 핀에 GPIO가 연결되지 않아 GPDO29 값이 D13으로 나가지 않아요.", "틀림: IBE가 지워지는 건 맞지만 SSS = 1이 남아 LED도 동작하지 않아요."], "outcomes": ["D13 빨간 LED가 정상 점멸한다", "컴파일 오류가 난다", "D13 빨간 LED가 점멸하지 않는다", "D13은 정상 점멸하고, IBE만 0으로 지워진다"], "reasons": ["`&= SIUL2_MSCR_SSS_MASK`가 OBE 비트까지 지워 출력 버퍼가 꺼진다", "`& 0xF`가 하위 4비트만 남겨 SSS = 1이 그대로이고, `|= SIUL2_MSCR_SSS_GPIO`(0을 OR)는 SSS를 0으로 바꾸지 못해 MSCR29 = 0x00200001이 된다", "`~`가 없으면 SIUL2_MSCR 매크로가 MSCR30을 가리킨다", "SSS_MASK와 32비트 레지스터 값을 AND하면 정의되지 않은 동작이 된다"], "reason": 1, "rwhy": ["틀림: AND 다음 줄 `|= SIUL2_MSCR_OBE_MASK`가 OBE를 다시 1로 set해요.", "맞음: 0x00080001 & 0xF = 0x00000001 → OR 0x00200000 → 0x00200001. SSS ≠ 0이라 GPIO가 아닌 기능이 연결돼요.", "틀림: 주소 계산(`4UL * index`)은 그대로라 MSCR29에 써요.", "틀림: `0xFUL`과의 AND는 평범한 비트 연산이에요."], "explain": "`& ~mask`는 **필드를 지우는** 연산인데, `~`를 빼면 반대로 **필드만 남기고 나머지를 지워요**. 0x00080001 → `& 0xF` = 0x00000001 → OBE OR → **0x00200001**이 되어 SSS = 1로 남아요. `| SIUL2_MSCR_SSS_GPIO`는 0을 OR할 뿐이라 이미 1인 비트를 지우지 못해요(정상 결과는 0x00280000)."}, {"id": "e2-n10", "ch": 2, "type": "mcq", "cat": "calc", "level": 2, "sec": "6. SIUL2 주소 계산 — MSCR 배열과 GPDO 역순 배치", "q": "S32K312에서 `SIUL2_GPDO(17)`이 접근하는 **절대 주소**는? (SIUL2 BASE `0x40290000`, GPDO 영역 시작 `0x1300`)", "options": ["0x40291311", "0x40291310", "0x40291313", "0x40291312"], "answer": [3], "pick": 1, "why": ["틀림: `0x1300 + 17` 단순 계산이에요. 이 칸은 GPDO18이에요.", "틀림: GPDO19의 주소예요(0x1310 워드의 첫 바이트).", "틀림: GPDO16의 주소예요(묶음 안 위치 0 → 뒤집어 3).", "맞음: 17 & ~3 = 16, 3 − (17 & 3) = 2 → 16 + 2 = 18 = 0x12 → 0x1312."], "explain": "묶음 시작 `17 & ~3` = 16, 묶음 안 위치 `17 & 3` = 1을 뒤집어 3 − 1 = 2, 합 18 = `0x12`라 오프셋 **0x1312**, 절대 주소 **0x402913
