 write는 **START + 주소 바이트(8비트+ACK) + 데이터 바이트(8비트+ACK) + STOP**이다. START·STOP을 빼고 이 `Putc` 한 번에 필요한 **SCL 클럭 수**는?", "options": ["18", "32", "36", "64", "72"], "answer": [4], "pick": 1, "why": ["틀림: 18은 write **한 번**(9 + 9)의 클럭 수예요. Putc는 write를 4번 해요.", "틀림: 4번 × 데이터 8비트만 센 값이에요. 주소 바이트와 ACK가 빠졌어요.", "틀림: 4번 × 9클럭으로 데이터 바이트만 센 값이에요. 매 write마다 주소 바이트(9클럭)도 다시 나가요.", "틀림: 4번 × 16비트로 ACK 클럭 두 개를 빠뜨린 값이에요.", "맞음: IPL은 한 글자에 write 4번(0x4D, 0x49, 0x1D, 0x19), write마다 9 + 9 = 18클럭 → 4 × 18 = 72클럭이에요."], "explain": "IPL `PulseEnable`은 니블마다 E=1 바이트와 E=0 바이트를 따로 써서 **한 글자 = write 4번**이에요. 각 write가 START~STOP 한 프레임이라 주소 바이트도 매번 다시 나가므로 write 하나에 **9클럭(주소+W+ACK) + 9클럭(데이터+ACK) = 18클럭**, 합계 **72클럭**이에요. 100 kHz(클럭 10 µs)면 START·STOP·Delay를 빼고도 0.72 ms예요. 그래서 LCD 출력은 느리고 ISR에서 하면 안 돼요. MCAL 버전은 write 6번이라 108클럭이에요."}, {"id": "e4-n04", "ch": 4, "type": "mcq", "cat": "read", "level": 2, "sec": "3. 7-bit 주소와 I2C 스캐너", "q": "I2C 버스에 LCD 백팩(7-bit **0x27**)과 RTC(7-bit **0x68**) 두 장치만 연결되어 있다. 다음 `I2c_Scan()`을 실행하면 UART에 찍히는 내용은?\n```c\nstatic void I2c_Scan(void)\n{\n    uint8_t addr;\n    uint8_t found = 0U;\n    for (addr = 0x03U; addr <= 0x77U; addr++)\n    {\n        if (I2c_Probe(addr) != 0U)\n        {\n            (void)printf(\"I2C device found at 0x%02X\\r\\n\", (unsigned int)addr);\n            found = 1U;\n        }\n    }\n    if (found == 0U)\n    {\n        (void)printf(\"No I2C device found\\r\\n\");\n    }\n}\n```", "options": ["`I2C device found at 0x27` 다음 줄에 `I2C device found at 0x68`", "`I2C device found at 0x4E` 다음 줄에 `I2C device found at 0xD0`", "`I2C device found at 0x68` 다음 줄에 `I2C device found at 0x27`", "`I2C device found at 0x27` 한 줄만 (첫 장치를 찾으면 끝남)", "`I2C device found at 0x27`, `I2C device found at 0x68`, `No I2C device found` 세 줄"], "answer": [0], "pick": 1, "why": ["맞음: 0x03부터 올라가며 ACK하는 주소를 7-bit 값 그대로 `%02X`로 찍어요. 0x27이 먼저, 0x68이 나중이에요.", "틀림: 0x4E·0xD0은 버스에 실리는 쓰기 첫 바이트(주소<<1)예요. 루프 변수 `addr`은 7-bit 주소예요.", "틀림: `addr`이 0x03 → 0x77로 **증가**하므로 작은 주소가 먼저 찍혀요.", "틀림: 루프에 `break`가 없어 0x77까지 전부 시도해요.", "틀림: 하나라도 찾으면 `found = 1U`라서 `No I2C device found`는 찍히지 않아요."], "explain": "스캐너는 **0x03~0x77**에 차례로 0x00 한 바이트를 써 보고, ACK가 오는 주소를 **7-bit 값 그대로** `0x%02X`로 출력해요. 그래서 `I2C device found at 0x27`, `I2C device found at 0x68` 순서로 두 줄이 나와요. `0x4E`/`0xD0`처럼 `<< 1` 한 값과 헷갈리지 마세요. `No I2C device found`는 하나도 못 찾았을 때만 찍혀요."}, {"id": "e4-n05", "ch": 4, "type": "short", "cat": "read", "level": 1, "sec": "3. 7-bit 주소와 I2C 스캐너", "q": "위 `I2c_Scan()`의 `for (addr = 0x03U; addr <= 0x77U; addr++)` 루프가 한 번 실행될 때 `I2c_Probe()`는 **몇 번** 호출되는가? (숫자로)", "accept": ["117", "117번", "117회"], "model": "`117`", "explain": "0x03 = 3, 0x77 = 119이므로 3~119 양끝을 포함해 119 − 3 + 1 = **117번**이에요. 0x00~0x02와 0x78~0x7F는 예약 주소라 빼요. 장치를 찾아도 `break`가 없어서 항상 117번 다 시도해요."}, {"id": "e4-n06", "ch": 4, "type": "err", "cat": "error", "level": 3, "sec": "3. 7-bit 주소와 I2C 스캐너", "q": "IPL 버전에서 주소를 확인하려고 `I2c_Scan()`을 **`Lcd1602_Init()` 뒤로** 옮겼다. 버스에는 0x27 백팩 하나만 있고, UART에는 `I2C device found at 0x27`이 정상으로 찍힌다. LCD의 상태는? (`I2c_Probe()`·`I2c_Scan()`은 슬라이드 코드와 같다)\n```c\nLpi2c_Ip_MasterInit(1U, &I2c_Lpi2cMaster_HwChannel1_Channel0);\nLcd1602_Init(0x27U);\nI2c_Scan();                    /* 여기로 옮김 */\nLcd1602_SetCursor(0U, 0U);\nLcd1602_Puts(\"Hello S32K3\");\n```", "answer": 1, "why": ["틀림: 스캔이 0x27에 0x00을 써서 백라이트를 끄고, 대상 주소도 바꿔 놓아요.", "맞음: 스캔 중 0x27에 0x00이 써져 P3(BL)=0이 되고, 그 뒤 SetCursor·Puts는 0x77로 가서 LCD에 닿지 않아요.", "틀림: 이후 바이트가 PCF8574에 아예 도착하지 않으니 깨진 글자도, 백라이트 재점등도 없어요.", "틀림: 문제에서 스캔 출력은 정상이라고 했어요. 장치가 있으면 ACK가 와요."], "outcomes": ["\"Hello S32K3\"가 정상 표시되고 백라이트도 켜져 있다", "백라이트가 꺼지고 \"Hello S32K3\"도 표시되지 않는다", "백라이트는 켜진 채 글자가 깨져 표시된다", "스캔이 0x27을 못 찾아 `No I2C device found`가 찍히고 LCD는 그대로다"], "reasons": ["`I2c_Scan()`이 LPI2C1을 다시 초기화해 100 kHz 설정이 지워진다", "스캐너는 8-bit 주소 0x4E로 불러야 0x27 백팩이 대답한다", "IPL Probe가 `MasterSetSlaveAddr()`로 대상 주소를 바꿔 놓아 스캔 뒤 대상이 마지막 0x77로 남고, 0x27에는 0x00이 써져 BL까지 꺼진다", "`Lcd1602_Init()` 뒤에는 SDA/SCL이 LCD 전용으로 묶여 다른 주소를 부를 수 없다"], "reason": 2, "rwhy": ["틀림: `I2c_Scan()`은 `I2c_Probe()`만 부르고, Probe는 SetSlaveAddr + 1바이트 전송뿐이에요. MasterInit은 다시 부르지 않아요.", "틀림: RTD API에는 7-bit 값을 넣어요. 하드웨어가 << 1과 R/W를 붙여요.", "맞음: `Lcd1602_Init()`이 정해 둔 0x27을 Probe가 계속 덮어써요. 루프 마지막 Probe(0x77) 뒤로 LCD 쓰기는 모두 0x77로 가서 NACK가 돼요. 0x27이 마지막으로 받은 0x00 때문에 백라이트도 꺼진 채예요.", "틀림: I2C는 주소로 장치를 고르는 공유 버스라, 언제든 다른 주소를 부를 수 있어요."], "explain": "IPL `I2c_Probe()`는 호출마다 `Lpi2c_Ip_MasterSetSlaveAddr(1U, addr, FALSE)`로 **대상 주소를 바꿔 놓아요**. 그래서 스캔이 끝나면 대상은 마지막 **0x77**이고, 뒤의 `SetCursor`·`Puts`는 아무도 없는 주소로 가요(NACK, 반환값은 `(void)`로 무시). 또 스캔이 0x27에 쓴 **0x00** 때문에 P3(BL)도 꺼져 있어요. 그래서 슬라이드는 `I2c_Scan()`을 `Lcd1602_Init()` **앞**에 두고, 스캔 후엔 LCD를 다시 초기화하라고 해요."}, {"id": "e4-n07", "ch": 4, "type": "mcq", "cat": "concept", "level": 1, "sec": "4. HD44780과 1602 LCD", "q": "HD44780(수업 GDM1602K의 KS0066U 호환) 16×2 LCD에 대한 설명으로 옳은 것을 **2개** 고르시오.", "options": ["RS = 0이면 값이 IR(명령 레지스터)로, RS = 1이면 DR(데이터 레지스터)로 간다", "LCD는 E가 0→1로 올라가는 상승 에지에서 RS와 데이터선 값을 래치한다", "16×2 화면의 2행 첫 칸 DDRAM 주소는 0x10이다", "수업 코드는 R/W=1로 busy flag(BF)를 읽어 LCD가 준비됐는지 확인한다", "화면에 표시할 문자 코드는 DDRAM에, 사용자 정의 문자는 CGRAM에 저장된다"], "answer": [0, 4], "pick": 2, "why": ["맞음: RS 0 = 명령(IR), 1 = 데이터(DR → AC가 가리키는 DDRAM 칸)예요.", "틀림: E가 **1→0으로 떨어지는 하강 에지**에서 래치해요.", "틀림: 2행은 0x10이 아니라 **0x40**부터예요(1행 0x00~0x0F, 2행 0x40~0x4F).", "틀림: 수업 코드는 R/W(P1)를 **항상 0**으로 둬서 BF를 못 읽고, Delay로 충분히 기다려요.", "맞음: DDRAM(80바이트) = 표시 문자 코드, CGRAM = 사용자 정의 문자, CGROM = 내장 글꼴이에요."], "explain": "HD44780은 **RS로 IR(명령)/DR(데이터)**을 고르고, **E 하강 에지**에서 값을 받아 가요. 문자 코드는 **DDRAM**에 저장되고 CGROM/CGRAM 글꼴로 그려져요. 2행 시작 주소 **0x40**, BF 대신 **Delay**는 RS 뒤집기·상승 에지와 함께 단골 함정이에요."}, {"id": "e4-n08", "ch": 4, "type": "mcq", "cat": "calc", "level": 2, "sec": "4. HD44780과 1602 LCD", "q": "LCD가 수업 `Lcd1602_Init()`으로 초기화된 뒤 다음을 실행했다. 'X'가 표시되는 위치(row·col은 0부터)와 그 칸의 DDRAM 주소는?\n```c\nLcd1602_WriteCommand(0xCAU);   /* Set DDRAM address */\nLcd1602_Putc('X');\n```", "options": ["1행(row 0) 10번 열 — DDRAM 0x0A", "2행(row 1) 10번 열 — DDRAM 0x4A", "2행(row 1) 0번 열 — DDRAM 0x40", "DDRAM 0xCA — 2행 범위(0x40~0x4F) 밖이라 보이지 않는 칸", "2행(row 1) 12번 열 — DDRAM 0x4C"], "answer": [1], "pick": 1, "why": ["틀림: 1행 10번 열이면 명령은 0x80 | 0x0A = **0x8A**예요.", "맞음: 0xCA = 0x80 | 0x4A → DDRAM 0x4A = 2행 시작 0x40 + 10, 즉 row 1, col 10이에요.", "틀림: 0x40은 2행 첫 칸(명령 0xC0)이에요. 아래 7비트 0x4A에는 열 10이 들어 있어요.", "틀림: 최상위 비트 0x80은 'Set DDRAM 명령' 표시라 주소가 아니에요. 주소는 아래 7비트 0x4A예요.", "틀림: 0x4C(명령 0xCC)는 12번 열이에요. 0x0A = 10이에요."], "explain": "커서 이동 명령은 **0x80 | 행 시작 주소 | 열**이에요. 거꾸로 풀면 0xCA에서 0x80을 떼고 **0x4A**, 2행 시작 0x40을 빼면 **열 10**이에요. 그래서 `Lcd1602_SetCursor(1U, 10U)`와 같은 명령이에요. 이어서 쓴 'X'는 DDRAM 0x4A, 2행 11번째 칸(col 10)에 기록되고, Entry mode(0x06) 때문에 주소는 0x4B로 하나 늘어요."}, {"id": "e4-n09", "ch": 4, "type": "mcq", "cat": "calc", "level": 3, "sec": "5. PCF8574 백팩과 4-bit 전송", "q": "로직 분석기로 IPL 버전 LCD 드라이버가 PCF8574(0x27)에 쓰는 데이터 바이트를 캡처했더니 다음 4바이트가 연속으로 찍혔다. 이 4바이트를 만든 `lcd1602` 호출은? (매핑: P0=RS 0x01, P2=E 0x04, P3=BL 0x08, P4~P7=D4~D7)\n```\n0xCC → 0xC8 → 0x0C → 0x08\n```", "options": ["`Lcd1602_SetCursor(0U, 0U)`", "`Lcd1602_WriteCommand(LCD_CMD_DISPLAY_ON)` (0x0C)", "`Lcd1602_SetCursor(1U, 0U)`", "`Lcd1602_Putc((char)0xC0)`", "`Lcd1602_SetCursor(1U, 12U)`"], "answer": [2], "pick": 1, "why": ["틀림: 명령 0x80이라 상위 니블 8 → 0x8C, 0x88, 0x0C, 0x08이에요.", "틀림: 0x0C는 상위 니블이 0이라 순서가 0x0C, 0x08, 0xCC, 0xC8로 뒤집혀요.", "맞음: 명령 0xC0(0x80|0x40|0) → 상위 니블 C: 0xCC(E=1), 0xC8(E=0), 하위 니블 0: 0x0C, 0x08. RS 비트(0x01)가 없으니 명령이에요.", "틀림: Putc는 데이터라 RS=1 → 0xCD, 0xC9, 0x0D, 0x09가 돼요.", "틀림: 명령 0xCC라 하위 니블도 C → 0xCC, 0xC8, 0xCC, 0xC8이에요."], "explain": "바이트를 비트로 풀면 돼요. 첫 바이트 **0xCC = 1100 · 1 1 0 0** → D7~D4 = 1100, BL=1, E=1, RS=0이에요. 두 E 하강 에지(0xC8, 0x08)에서 LCD가 래치한 니블은 **1100, 0000** → 8비트 **0xC0**이고, RS=0이라 **명령**이에요. 0xC0 = 0x80 | 0x40 | 0 = `SetCursor(1U, 0U)`(2행 첫 칸)예요. 명령은 RS 비트만 빠진다는 점과 니블 순서(상위 먼저)가 판별 포인트예요."}, {"id": "e4-n10", "ch": 4, "type": "short", "cat": "calc", "level": 2, "sec": "5. PCF8574 백팩과 4-bit 전송", "q": "IPL 버전 `Lcd1602_Putc('0')`('0' = 0x30)가 PCF8574에 쓰는 4바이트 중 **세 번째** 바이트(하위 니블, E=1)를 16진수로 쓰시오. (매핑: P0=RS 0x01, P2=E 0x04, P3=BL 0x08, P4~P7=D4~D7)", "accept": ["0x0D", "0D", "0xD", "D", "0Dh", "0x0Dh"], "model": "`0x0D`", "explain": "하위 니블은 `(uint8_t)(0x30 << 4)` = 0x300의 아래 8비트 = **0x00**이에요. 여기에 BL 0x08, RS 0x01(데이터), E 0x04를 OR 하면 **0x0D**예요. 4바이트 전체는 0x3D, 0x39, **0x0D**, 0x09예요. 데이터 니블이 0이어도 BL·E·RS 비트는 그대로 실려요."}, {"id": "e4-n11", "ch": 4, "type": "err", "cat": "error", "level": 2, "sec": "5. PCF8574 백팩과 4-bit 전송", "q": "IPL `lcd1602.c`의 `Lcd1602_WriteNibble()`을 다음처럼 작성했다(나머지와 `main.c`는 슬라이드와 같다: `I2c_Probe(0x27U)` → `Lcd1602_Init(0x27U)` → `Puts(\"Hello S32K3\")`). 결과는?\n```c\nstatic void Lcd1602_WriteNibble(uint8_t nibble, uint8_t isData)\n{\n    uint8_t value = (uint8_t)(nibble & LCD_DATA_MASK);  /* LCD_BACKLIGHT 빠짐 */\n    if (isData != 0U)\n    {\n        value |= LCD_RS;\n    }\n    Lcd1602_PulseEnable(value);\n}\n```", "answer": 3, "why": ["틀림: 어떤 바이트에도 BL(0x08)이 없어 백라이트를 켜는 바이트가 한 번도 안 나가요.", "틀림: OR 하나를 뺐을 뿐 문법·자료형 문제는 없어요.", "틀림: RS·E·D4~D7은 그대로라 래치는 정상이에요. 꺼지는 쪽은 백라이트예요.", "맞음: 'A'라면 0x45, 0x41, 0x15, 0x11처럼 BL 비트만 빠진 바이트가 나가요. LCD는 정상 래치하지만 P3=0이라 백라이트는 꺼진 채예요."], "outcomes": ["\"Hello S32K3\"가 정상 표시되고 백라이트도 켜진다", "컴파일 오류", "백라이트는 켜지지만 LCD가 명령을 받지 못해 글자가 기록되지 않는다", "글자는 LCD에 기록되지만 백라이트가 꺼져 있어 화면이 어둡다"], "reasons": ["P3(BL)가 한 번도 1이 되지 않는다 — `I2c_Probe(0x27U)`가 0x00으로 끈 백라이트를 다시 켜 줄 비트가 없고, RS·E·데이터 비트는 그대로다", "BL 비트가 E 비트 자리를 겸하므로 E 펄스가 사라진다", "RS가 0으로 고정되어 모든 바이트가 명령이 된다", "BL 비트가 없는 바이트는 PCF8574가 NACK한다"], "reason": 0, "rwhy": ["맞음: 슬라이드 main은 Probe로 백라이트를 끄고, `Lcd1602_Init()`부터 `LCD_BACKLIGHT`를 OR 해 다시 켜요. 그 OR가 없으니 백라이트는 끝까지 꺼져 있어요.", "틀림: E는 P2(0x04), BL은 P3(0x08)로 서로 다른 비트예요. PulseEnable이 E를 그대로 토글해요.", "틀림: RS는 `isData`로 따로 OR 해요. 데이터 바이트는 RS=1이에요.", "틀림: PCF8574는 주소가 맞으면 어떤 데이터 바이트든 ACK하고 핀으로 내보내요."], "explain": "PCF8574의 각 비트가 LCD 핀 하나라서, `LCD_BACKLIGHT`(0x08, P3)를 OR 하지 않으면 **백라이트만** 꺼지고 RS·E·D4~D7 동작은 그대로예요. 문자는 DDRAM에 정상 기록되지만 백라이트가 꺼져 있어 화면이 어두워요. 노트 시험 포인트처럼 \"백라이트 비트(0x08)를 빼면 백라이트가 꺼진다\"예요."}, {"id": "e4-n12", "ch": 4, "type": "mcq", "cat": "api", "level": 2, "sec": "6. 기준 하드웨어·배선·IPL 설정", "q": "IPL 실습 A의 Config Tools 설정과 코드의 관계에 대한 설명으로 **옳지 않은** 것은?", "options": ["Pins 탭에서 SDA/SCL을 LPI2C1_SDA/SCL 기능으로 두고, 핀 특성은 open-drain으로 한다", "LCD 주소 0x27과 7-bit 여부는 Lpi2c_Ip master config에 입력해 고정한다", "클럭 참조점 LPI2C1_CLK(ALPS_SLOW_CLK)의 reference frequency가 0 Hz가 아닌지 확인한다", "Config의 I2cHwChannel = LPI2C1은 API 첫 인수 instance `1U`와 짝을 이룬다", "I2cAsyncMethod가 LPI2C_USING_INTERRUPTS여도 이 실습의 blocking API는 내부적으로 polling하고 callback은 NULL_PTR이다"], "answer": [1], "pick": 1, "why": ["틀림: 옳은 설명이에요. 오픈 드레인 버스라 SDA/SCL은 open-drain이고, 풀업은 백팩이 외부에서 해 줘요.", "맞음: 옳지 않은 설명이에요. 주소는 config가 아니라 코드 인수예요 — `Lpi2c_Ip_MasterSetSlaveAddr(1U, address, FALSE)`, FALSE = 7-bit.", "틀림: 옳은 설명이에요. 0 Hz면 LPI2C에 클럭이 안 들어가 SCL을 만들 수 없어요.", "틀림: 옳은 설명이에요. IPL은 물리 instance 번호를 써서 LPI2C1 → `1U`예요(0U는 MCAL 논리 채널).", "틀림: 옳은 설명이에요. 설정표대로예요. blocking API는 끝날 때까지 polling하고 DMA는 쓰지 않아요."], "explain": "IPL 설정의 짝은 **Pins(open-drain) → `Siul2_Port_Ip_Init`**, **LPI2C1_CLK(0 Hz 아님) → clock source**, **LPI2C1 → instance 1U**, **Master·100000 bit/s → `I2c_Lpi2cMaster_HwChannel1_Channel0`**이에요. 슬레이브 주소는 설정하지 않고, `Lcd1602_Init()` 안의 `MasterSetSlaveAddr(1U, 0x27U, FALSE)` **인수**로 넘겨요."}, {"id": "e4-n13", "ch": 4, "type": "short", "cat": "api", "level": 1, "sec": "6. 기준 하드웨어·배선·IPL 설정", "q": "IPL Config Tools에서 LPI2C 모듈의 Clock Source로 고를 수 있게 **클럭 참조점(Clock_Ip_ReferencePoints)** 을 추가한다. Frequency Select = ALPS_SLOW_CLK로 두는 이 참조점의 **Name**은?", "accept": ["LPI2C1_CLK"], "model": "`LPI2C1_CLK`", "explain": "참조점 모듈에 **LPI2C1_CLK**(Frequency Select = ALPS_SLOW_CLK)를 추가해야 Lpi2c_Ip 설정의 I2cClockRef로 고를 수 있어요. 생성 후 reference frequency가 **0 Hz가 아닌지** 확인해요. MCAL 실습도 McuClockReferencePoint에 같은 LPI2C1_CLK를 만들어요."}, {"id": "e4-n14", "ch": 4, "type": "mcq", "cat": "read", "level": 2, "sec": "7. lcd1602 드라이버 — 호출 계층과 초기화", "q": "IPL 버전 `Lcd1602_Init(0x27U)`가 실행될 때 `I2c_Lcd1602_Write()`가 **처음 4번** 쓰는 값을 순서대로 옳게 나열한 것은?\n```c\nstatic void Lcd1602_PulseEnable(uint8_t value)\n{\n    I2c_Lcd1602_Write(value | LCD_E);\n    Lcd1602_Delay(2000U);\n    I2c_Lcd1602_Write(value & (uint8_t)(~LCD_E));\n    Lcd1602_Delay(2000U);\n}\nstatic void Lcd1602_WriteNibble(uint8_t nibble, uint8_t isData)\n{\n    uint8_t value = (uint8_t)(nibble & LCD_DATA_MASK) | LCD_BACKLIGHT;\n    if (isData != 0U) { value |= LCD_RS; }\n    Lcd1602_PulseEnable(value);\n}\nvoid Lcd1602_Init(uint8_t address)\n{\n    g_lcd_addr = address;\n    Lpi2c_Ip_MasterSetSlaveAddr(1U, address, FALSE);\n    Lcd1602_Delay(400000U);\n    Lcd1602_WriteNibble(0x30U, 0U);\n    Lcd1602_Delay(50000U);\n    Lcd1602_WriteNibble(0x30U, 0U);\n    /* ... */\n}\n```", "options": ["0x3D, 0x39, 0x3D, 0x39", "0x38, 0x3C, 0x38, 0x3C", "0x3C, 0x38, 0x0C, 0x08", "0x34, 0x30, 0x34, 0x30", "0x3C, 0x38, 0x3C, 0x38"], "answer": [4], "pick": 1, "why": ["틀림: `isData`가 0U(명령)라 RS(0x01)는 붙지 않아요.", "틀림: PulseEnable은 E=1 바이트를 **먼저**, E=0 바이트를 나중에 써요.", "틀림: `WriteCommand(0x30)`(니블 2번)일 때의 값이에요. Init 앞부분은 `WriteNibble`이라 니블 1개씩이에요.", "틀림: WriteNibble은 항상 `LCD_BACKLIGHT`(0x08)를 OR 해요.", "맞음: `(0x30 & 0xF0) | 0x08` = 0x38 → E=1 0x3C, E=0 0x38, 이걸 두 번 반복해요."], "explain": "Init 앞부분은 `WriteNibble(0x30U, 0U)`로 **니블 1개씩** 보내요. 값은 `0x30 | BL 0x08` = **0x38**(명령이라 RS=0)이고, PulseEnable이 **0x3C(E=1) → 0x38(E=0)**을 써요. 두 번째 0x30 니블도 같아서 **0x3C, 0x38, 0x3C, 0x38**이에요. 이렇게 0x30을 세 번 보내 8-bit로 동기화하고, 0x20 니블(0x2C, 0x28)로 4-bit에 들어가요."}, {"id": "e4-n15", "ch": 4, "type": "mcq", "cat": "api", "level": 2, "sec": "7. lcd1602 드라이버 — 호출 계층과 초기화", "q": "수업 `lcd1602` 드라이버의 계층 구조에 대한 설명으로 **옳지 않은** 것은?", "options": ["`Lcd1602_WriteCommand(cmd)`는 `Lcd1602_WriteByte(cmd, 1U)`로 RS=1 상태에서 명령을 보낸다", "`main.c`가 부르는 공개 API는 Init·Clear·SetCursor·Putc·Puts 5개이고, 나머지 함수는 `static`으로 숨긴다", "`Lcd1602_Putc(c)`는 `Lcd1602_WriteByte((uint8_t)c, 1U)`로 RS=1(데이터)을 보낸다", "MCAL로 바꿀 때는 맨 아래 1바이트 쓰기 함수 `I2c_Lcd1602_Write()`(교재 이름 `Lcd1602_WriteExpander()`)를 교체한다", "R/W(P1)를 항상 0으로 두므로 busy flag를 읽지 않고 Delay로 기다린다"], "answer": [0], "pick": 1, "why": ["맞음: 옳지 않은 설명이에요. 명령은 `WriteByte(cmd, 0U)`예요. 0U = 명령(RS=0), 1U = 데이터(RS=1)예요.", "틀림: 옳은 설명이에요. 아래 층을 `static`으로 숨겨 I2C 세부사항이 `main.c`로 새지 않아요.", "틀림: 옳은 설명이에요. 1U는 \"데이터니까 RS=1\"이라는 뜻이에요.", "틀림: 옳은 설명이에요. 층 구조 덕분에 맨 아래 한 함수만 바꾸면 MCAL로 갈아탈 수 있어요(교재는 같은 역할을 `Lcd1602_WriteExpander()`로 불러요).", "틀림: 옳은 설명이에요. 수업 코드는 R/W를 한 번도 세우지 않아서 BF를 못 읽어요."], "explain": "층은 **Puts/Putc → WriteByte → WriteNibble → PulseEnable → I2c_Lcd1602_Write** 순이에요. `WriteByte`의 두 번째 인수 `isData`가 RS를 정해요. `Putc`는 **1U(데이터)**, `WriteCommand`는 **0U(명령)**예요. 이 둘을 바꾸면 명령이 DDRAM에 글자로, 글자가 명령으로 들어가요."}, {"id": "e4-n16", "ch": 4, "type": "err", "cat": "error", "level": 2, "sec": "7. lcd1602 드라이버 — 호출 계층과 초기화", "q": "`Lcd1602_Putc()`를 다음처럼 잘못 작성했다. 나머지 `lcd1602.c`(Init·SetCursor는 `WriteCommand()` 사용)와 `main.c`는 슬라이드와 같다. 결과는?\n```c\nvoid Lcd1602_Putc(char c)\n{\n    Lcd1602_WriteByte((uint8_t)c, 0U);\n}\n```", "answer": 1, "why": ["틀림: 글자 바이트에 RS(0x01)가 빠져 LCD가 문자로 받지 않아요.", "맞음: 초기화는 정상이라 백라이트는 켜지지만, 글자 코드가 명령으로 처리돼 DDRAM에 글자가 기록되지 않아요.", "틀림: `(uint8_t)c` 캐스트는 정상이에요. 인수 값만 바뀌었어요.", "틀림: BL 비트는 WriteNibble이 항상 OR 하고, 주소도 그대로라 PCF8574는 정상 ACK해요."], "outcomes": ["\"Hello S32K3\"가 정상 표시된다", "백라이트는 켜져 있지만 문자열이 화면에 제대로 나타나지 않는다", "컴파일 오류 (`char`를 `uint8_t`로 변환할 수 없음)", "백라이트가 꺼지고 LCD가 응답하지 않는다"], "reasons": ["`WriteByte`의 두 번째 인수가 0이면 E 펄스가 생략되어 LCD가 래치하지 않는다", "`isData = 0U`이면 BL 비트가 빠진다", "`isData = 0U`이면 PCF8574 주소가 명령용 주소로 바뀐다", "RS=0이라 문자 코드가 DDRAM이 아닌 IR(명령 레지스터)로 들어가 명령으로 처리된다"], "reason": 3, "rwhy": ["틀림: PulseEnable은 `isData`와 상관없이 E를 1→0으로 토글해요.", "틀림: BL은 `isData`와 무관하게 항상 OR돼요.", "틀림: 주소는 `MasterSetSlaveAddr()`로 정해 둔 0x27 그대로예요. 명령/데이터 구분은 RS 비트로 해요.", "맞음: HD44780은 RS 0 = 명령(IR), RS 1 = 데이터(DR → DDRAM)예요. 'H'(0x48)라면 0x4C, 0x48, 0x8C, 0x88(RS 비트 없음)이 나가 명령 0x48로 래치돼요."], "explain": "`Putc`는 **RS=1(데이터)**로 보내야 문자 코드가 DR을 거쳐 DDRAM에 기록돼요. 0U로 보내면 RS=0이라 LCD는 그 값을 **명령**으로 받아요. 그래서 글자는 안 나오고 화면 상태만 엉뚱하게 바뀌어요. 초기화·커서 명령은 `WriteCommand()`로 정상 전달되니 백라이트는 켜져 있어요."}, {"id": "e4-n17", "ch": 4, "type": "mcq", "cat": "read", "level": 2, "sec": "8. main 흐름 — IPL vs MCAL API", "q": "슬라이드 IPL `main()`의 카운터 루프다. `count`가 **12345**일 때 LCD 2행에 표시되는 문자열은?\n```c\nchar line[17];\n\n(void)snprintf(line, sizeof(line),\n               \"Count: %04lu\",\n               (unsigned long)count);\nLcd1602_SetCursor(1U, 0U);\nLcd1602_Puts(\"                \");\nLcd1602_SetCursor(1U, 0U);\nLcd1602_Puts(line);\n```", "options": ["`Count: 1234`", "`Count: 2345`", "`Count: 12345`", "`Count: 123`"], "answer": [2], "pick": 1, "why": ["틀림: `%04lu`의 4는 **최소** 폭이라 다섯 자리를 4자리로 자르지 않아요.", "틀림: 아래 네 자리만 남기는 동작은 없어요.", "맞음: 12345는 이미 4자리보다 길어 0을 채우지 않고 그대로 찍혀요. `Count: 12345`는 12글자라 `line[17]`(16글자 + '\\0')에 다 들어가요.", "틀림: 버퍼가 17이라 12글자는 잘리지 않아요(잘림은 버퍼를 줄였을 때 이야기예요)."], "explain": "`%04lu`는 \"4자리, 빈자리는 0\"이라 7은 `0007`이 되지만, 12345처럼 4자리를 넘는 값은 **자르지 않고 전부** 찍어요. 결과 `Count: 12345`는 12글자로 `line[17]`(LCD 한 줄 16글자 + `'\\0'`) 안이라 그대로 표시돼요. 공백 16칸으로 먼저 지우니 이전 글자도 남지 않아요."}, {"id": "e4-n18", "ch": 4, "type": "short", "cat": "calc", "level": 3, "sec": "8. main 흐름 — IPL vs MCAL API", "q": "IPL 버전 `main()`의 `for (;;)` 루프 **1회**(count = 7)에서 `I2c_Lcd1602_Write()`(PCF8574 1바이트 쓰기)는 **모두 몇 번** 호출되는가? `Lcd1602_Puts(\"                \")`는 공백 16칸이고, `snprintf`·`Delay`는 I2C write가 아니다.\n```c\n(void)snprintf(line, sizeof(line), \"Count: %04lu\", (unsigned long)count);\nLcd1602_SetCursor(1U, 0U);\nLcd1602_Puts(\"                \");\nLcd1602_SetCursor(1U, 0U);\nLcd1602_Puts(line);\ncount++;\nDelay(4000000UL);\n```", "accept": ["116", "116번", "116회"], "model": "`116`", "explain": "IPL은 명령이든 글자든 **바이트 하나 = 니블 2개 × write 2번 = 4번**이에요. SetCursor 2번(명령 2바이트) + 공백 16글자 + `Count: 0007` 11글자 = 29바이트 → 29 × 4 = **116번**이에요. MCAL 버전은 니블당 3번이라 29 × 6 = 174번이에요. 루프 한 번에 I2C 프레임이 이만큼 나가니 LCD 출력은 느린 작업이에요."}, {"id": "e4-n19", "ch": 4, "type": "err", "cat": "error", "level": 2, "sec": "8. main 흐름 — IPL vs MCAL API", "q": "IPL `main()`에서 \"쓸데없어 보인다\"며 `I2c_Probe(0x27U);` 줄을 지웠다. 나머지는 슬라이드와 같다. 결과는?\n```c\nLpi2c_Ip_MasterInit(1U, &I2c_Lpi2cMaster_HwChannel1_Channel0);\n/* I2c_Probe(0x27U); */   /* 지움 */\nLcd1602_Init(0x27U);\nLcd1602_SetCursor(0U, 0U);\nLcd1602_Puts(\"Hello S32K3\");\n```", "answer": 0, "why": ["맞음: Probe는 0x00을 한 번 써서 백라이트를 끄는 줄일 뿐이에요. LCD 표시에는 영향이 없어요.", "틀림: 주소는 `Lcd1602_Init()`이 `MasterSetSlaveAddr(1U, address, FALSE)`로 직접 설정해요.", "틀림: 오히려 백라이트를 끄는 줄을 지운 셈이에요. Init부터는 모든 바이트에 BL이 OR돼 켜져요.", "틀림: 4-bit 초기화(0x30 ×3 → 0x20 → 0x28 …)는 전부 `Lcd1602_Init()` 안에 있어요."], "outcomes": ["정상 동작 — 1행 Hello S32K3, 2행 카운터가 표시된다", "LCD 주소가 설정되지 않아 아무것도 표시되지 않는다", "백라이트가 계속 꺼져 있다", "LCD 초기화 시퀀스 첫 단계가 빠져 글자가 깨진다"], "reasons": ["Probe가 대상 주소를 0x27로 설정해 주므로, 빠지면 Init이 주소를 모른다", "`I2c_Probe(0x27U)`는 0x00 한 바이트로 백라이트를 끄는 용도일 뿐이고, 주소 설정·4-bit 초기화·백라이트 켜기는 모두 `Lcd1602_Init(0x27U)`가 한다", "Probe가 보낸 0x00이 LCD 8-bit 동기화의 첫 단계다", "Probe가 없으면 LPI2C1 master 초기화가 완료되지 않는다"], "reason": 1, "rwhy": ["틀림: Init이 받은 address로 `MasterSetSlaveAddr()`를 직접 불러요.", "맞음: 슬라이드 주석 그대로 `/* 백라이트를 끈다 */`예요. 0x00 → P3(BL)=0이고, Init부터 `LCD_BACKLIGHT`가 OR돼 다시 켜져요.", "틀림: Probe의 0x00은 슬라이드 주석대로 백라이트를 끄는 바이트예요. 8-bit 동기화는 Init의 `WriteNibble(0x30)` ×3이 해요.", "틀림: master 초기화는 `Lpi2c_Ip_MasterInit()` 한 줄로 끝나요."], "explain": "슬라이드 `main()`의 `I2c_Probe(0x27U); /* 백라이트를 끈다 */`는 0x00을 써서 P3(BL)까지 0으로 만드는 줄이에요. 스캐너를 넣을 자리이기도 해요. LCD가 동작하는 데 필요한 **주소 설정·4-bit 초기화·BL 켜기는 모두 `Lcd1602_Init()`** 안에 있어서, 이 줄을 지워도 화면은 똑같이 나와요. \"동작하나?\"를 묻는 문제는 정말로 정상인 경우도 있어요."}, {"id": "e4-n20", "ch": 4, "type": "mcq", "cat": "api", "level": 2, "sec": "9. MCAL 설정과 코드 변화", "q": "IPL `lcd1602`를 MCAL(CDD I2c)로 옮길 때 같은 의미의 **IPL 표현 ↔ MCAL 표현** 짝으로 옳은 것을 **2개** 고르시오.", "options": ["IPL `sendStop = TRUE` ↔ MCAL `.RepeatedStart = TRUE`", "IPL instance `1U` ↔ MCAL `#define LCD_I2C_MCAL_CHANNEL (1U)`", "IPL `MasterSetSlaveAddr(1U, addr, FALSE)`의 세 번째 인수 `FALSE`(7-bit) ↔ MCAL `.BitsSlaveAddressSize = FALSE`", "IPL 성공 판정 `== LPI2C_IP_SUCCESS_STATUS` ↔ MCAL 성공 판정 `== E_OK`", "IPL에서 `Lcd1602_Init()` 때 한 번 정하던 대상 주소 ↔ MCAL에서도 `I2c_Init()` 때 한 번만 정한다"], "answer": [2, 3], "pick": 2, "why": ["틀림: STOP 표현은 반대예요. IPL \"STOP 보낼래?\" → TRUE, MCAL \"Repeated START로 이어갈래?\" → **FALSE**.", "틀림: MCAL 채널은 Config Tools의 **논리** 번호 0이에요(I2c Channel ID = 0 → `(0U)`).", "맞음: 둘 다 7-bit 주소를 뜻해요.", "맞음: IPL Probe는 `LPI2C_IP_SUCCESS_STATUS`, MCAL Probe는 `I2cMcal_SyncWrite(...) == E_OK`로 ACK 여부를 판단해요.", "틀림: MCAL은 `.SlaveAddress`에 주소를 담아 **요청마다** 보내요(`g_lcd_addr` 사용). MCAL Init엔 SetSlaveAddr가 없어요."], "explain": "IPL이 함수 인수와 `MasterSetSlaveAddr()`로 나눠 주던 정보가 MCAL에선 `I2c_RequestType` **구조체 한 장**에 모여요. 7-bit는 양쪽 다 **FALSE**지만, STOP은 IPL `sendStop = TRUE` ↔ MCAL `RepeatedStart = FALSE`로 **값이 반대**예요. 채널은 물리 1U ↔ 논리 0U, 성공은 `LPI2C_IP_SUCCESS_STATUS` ↔ `E_OK`예요."}, {"id": "e4-n21", "ch": 4, "type": "err", "cat": "error", "level": 2, "sec": "9. MCAL 설정과 코드 변화", "q": "MCAL 프로젝트에서 `Lcd1602_PulseEnable()` 첫 줄이 중복 같아서 지웠다. 나머지 MCAL 코드·설정은 슬라이드와 같다. 결과는?\n```c\nstatic void Lcd1602_PulseEnable(uint8_t value)\n{\n    /* I2c_Lcd1602_Write(value); */   /* 지움 */\n    I2c_Lcd1602_Write(value | LCD_E);\n    Lcd1602_Delay(2000U);\n    I2c_Lcd1602_Write(value & (uint8_t)(~LCD_E));\n    Lcd1602_Delay(2000U);\n}\n```", "answer": 2, "why": ["틀림: 남은 두 줄이 E=1 → E=0을 그대로 만들어 하강 에지가 있어요.", "틀림: 전송 요청 형식은 그대로라 E_NOT_OK가 날 이유가 없어요.", "맞음: IPL PulseEnable과 같은 모양이 돼요. 'A'라면 0x4D, 0x49, 0x1D, 0x19 — 래치 값은 같고 트래픽만 줄어요.", "틀림: 니블마다 하강 에지가 정확히 한 번씩이라 짝이 어긋나지 않아요."], "outcomes": ["LCD가 니블을 래치하지 못해 글자가 나오지 않는다", "`I2c_SyncTransmit()`이 E_NOT_OK를 반환해 백라이트만 켜진다", "정상 표시되고, 한 글자당 I2C write만 6번에서 4번으로 줄어든다", "글자가 반 니블씩 밀려 깨져 표시된다"], "reasons": ["LCD는 E의 1→0 하강 에지에서 래치하는데, 남은 두 줄이 니블마다 E=1 → E=0을 그대로 만든다", "MCAL `I2c_SyncTransmit()`은 E=0 바이트를 먼저 받아야 전송을 시작한다", "지운 줄이 RS를 세우는 유일한 줄이었다", "MCAL은 주소를 요청마다 보내므로 write가 줄면 주소가 빠진다"], "reason": 0, "rwhy": ["맞음: 지운 첫 write(E=0으로 데이터 먼저 세팅)는 안정화용이에요. 화면 결과는 하강 에지만 결정해요.", "틀림: `I2c_SyncTransmit()`은 버퍼 내용과 상관없이 요청대로 보내요.", "틀림: RS는 WriteNibble이 `value`에 OR 해서 넘겨요. 남은 두 바이트에도 RS가 있어요.", "틀림: 남은 write도 모두 `I2cMcal_SyncWrite(g_lcd_addr, …)`로 주소를 실어 보내요."], "explain": "슬라이드의 MCAL `PulseEnable`은 E=0 상태로 데이터·RS를 먼저 한 번 더 쓰는(**니블당 3번, 한 글자 6번**) 형태지만, LCD가 값을 가져가는 순간은 어느 쪽이든 **E가 1→0으로 떨어질 때**예요. 그래서 첫 줄을 지우면 IPL과 같은 **니블당 2번, 한 글자 4번**이 되고 화면은 똑같아요. 노트도 \"화면 결과는 같고, MCAL 쪽이 I2C 트래픽만 조금 더 많아요\"라고 해요. 시험에서 횟수를 물으면 슬라이드 기준 IPL 4번 / MCAL 6번이에요."}, {"id": "e4-n22", "ch": 4, "type": "mcq", "cat": "concept", "level": 2, "sec": "10. 실행 확인·문제 해결", "q": "스캐너가 `I2C device found at 0x27`을 출력했고, `Lcd1602_Init(0x27U)` 뒤 **백라이트도 켜졌지만 글자가 전혀 보이지 않는다**. 다음으로 확인할 것으로 가장 알맞은 것은?", "options": ["SDA/SCL 핀 설정과 GND 공통 연결", "contrast 가변저항과 4-bit 초기화 순서", "`Lcd1602_Init()`에 넣은 주소를 0x4E로 바꾸기", "SDA/SCL에 레벨시프터 추가", "`CDD_I2c.h` include 경로"], "answer": [1], "pick": 1, "why": ["틀림: 스캐너가 0x27을 찾았으니 배선·풀업·GND는 이미 통과했어요.", "맞음: 백라이트가 켜졌다는 건 PCF8574까지 바이트가 간다는 뜻이에요. 남은 층은 LCD 쪽(초기화 순서·contrast)이에요.", "틀림: API에는 7-bit 0x27이 맞아요. 0x4E를 넣으면 0x9C가 나가 오히려 NACK예요.", "틀림: 레벨시프터는 '통신 중 보드 불안정'(5 V 풀업 직결) 증상의 조치예요.", "틀림: MCAL 빌드 오류용 조치예요. 이 상황은 빌드·통신이 이미 되고 있어요."], "explain": "문제 해결은 **전기 → 버스 → 주소 → LCD 초기화 → 핀 매핑** 순으로 아래층부터 좁혀요. 스캐너 성공 = 배선·풀업·주소 통과, 백라이트 켜짐 = PCF8574까지 바이트 전달(BL 0x08 → P3)이에요. 그래서 남은 원인은 LCD 쪽, 즉 **contrast 가변저항과 4-bit 초기화 순서**예요(슬라이드 표: \"백라이트만, 글자 없음 → 초기화 시퀀스·contrast\")."}, {"id": "e4-n23", "ch": 4, "type": "mcq", "cat": "error", "level": 2, "sec": "10. 실행 확인·문제 해결", "q": "I2C LCD 실습의 **증상 → 원인·조치** 짝으로 **옳지 않은** 것은?", "options": ["`CDD_I2c.h`를 찾을 수 없음 → CDD I2c 설정·코드 생성 누락, 추가 후 재생성하고 include 경로 확인", "`I2c_SyncTransmit()`이 계속 `E_NOT_OK` → 논리 channel 번호 매크로와 Config의 Channel ID 일치, `I2c_Init()`이 먼저인지 확인", "글자가 깨짐 → PCF8574-LCD 핀 매핑 차이, `LCD_RS`·`LCD_E`·데이터 비트 매핑 확인", "통신 중 보드가 불안정 → I2C 속도를 1 MHz로 올려 전송 시간을 줄인다", "0x27은 안 되고 0x3F는 됨 → 백팩 주소 차이, 스캐너 결과를 LCD 주소에 반영"], "answer": [3], "pick": 1, "why": ["틀림: 옳은 설명이에요. 슬라이드 MCAL 빌드 문제 해결 항목 그대로예요.", "틀림: 옳은 설명이에요. 논리 채널 불일치·초기화 순서가 대표 원인이에요(Timeout 기본값 1도 함께 의심).", "틀림: 옳은 설명이에요. 매핑은 백팩 회로가 정하는 것이라 백팩마다 다를 수 있어요.", "맞음: 옳지 않은 설명이에요. 보드 불안정의 원인은 **5 V 풀업 직접 연결**이고, 조치는 **레벨시프터 또는 3.3 V 풀업**이에요. 속도와는 상관없어요.", "틀림: 옳은 설명이에요. 고장이 아니라 백팩마다 주소가 달라서예요(보통 0x27 또는 0x3F)."], "explain": "슬라이드 문제 해결표는 증상마다 의심할 층이 정해져 있어요. **통신 중 보드 불안정 = 전압 레벨 문제**(5 V 풀업이 3.3 V 범위를 넘음) → 레벨시프터나 3.3 V 풀업이에요. 이 밖에 스캐너 무응답 → 핀·GND·풀업, 백라이트만 → 초기화·contrast, 글자 깨짐 → 핀 매핑도 함께 외워 두세요."}, {"id": "e4-n24", "ch": 4, "type": "err", "cat": "error", "level": 1, "sec": "10. 실행 확인·문제 해결", "q": "따로 스캐너를 돌려 봤더니 UART에 `I2C device found at 0x3F` **한 줄만** 찍혔다. 이 보드에서 슬라이드 IPL `main.c`(`I2c_Probe(0x27U);` → `Lcd1602_Init(0x27U);` → `Lcd1602_Puts(\"Hello S32K3\");`)를 **그대로** 실행하면?", "answer": 2, "why": ["틀림: I2C 장치는 자기 주소에만 대답해요. 자동으로 맞춰 주는 기능은 없어요.", "틀림: 깨진 글자라도 나오려면 바이트가 PCF8574에 도착해야 해요. 이 경우 하나도 도착하지 않아요.", "맞음: 0x27로 보낸 write는 모두 NACK라 PCF8574 출력이 바뀌지 않고, LCD는 초기화도 글자도 받지 못해요.", "틀림: 주소는 런타임 인수일 뿐이라 빌드에는 문제가 없어요."], "outcomes": ["\"Hello S32K3\"가 정상 표시된다 (백팩이 주소를 자동으로 맞춘다)", "글자가 깨져 표시된다", "LCD에 아무 글자도 표시되지 않는다", "컴파일 오류"], "reasons": ["0x3F는 8-bit 주소라서 `>> 1` 한 0x1F를 넣어야 한다", "PCF8574-LCD 핀 매핑이 달라 `LCD_RS`·`LCD_E`를 바꿔야 한다", "백팩이 고장 나서 교체해야 한다", "버스의 백팩은 0x3F에만 ACK하므로 0x27로 보낸 모든 write가 NACK가 되어 PCF8574에 바이트가 전달되지 않는다"], "reason": 3, "rwhy": ["틀림: 스캐너가 찍는 값은 루프 변수 `addr`, 즉 **7-bit 주소** 그대로예요. 0x3F를 그대로 넣으면 돼요.", "틀림: 핀 매핑 차이는 '글자가 깨짐' 증상의 원인이에요. 여기선 바이트가 아예 안 가요.", "틀림: 0x3F에서 ACK가 왔으니 장치는 살아 있어요. \"0x27은 안 되고 0x3F는 됨\"은 **백팩 주소 차이**예요.", "맞음: 백팩 주소는 제품마다 달라요(보통 0x27 또는 0x3F). 스캐너 결과대로 `I2c_Probe(0x3FU)`, `Lcd1602_Init(0x3FU)`로 바꾸면 돼요."], "explain": "백팩 주소는 **제품마다 달라서**(보통 0x27 또는 0x3F) 먼저 스캐너로 찾아요. 버스의 장치가 0x3F뿐이면 0x27로 보낸 쓰기는 **9번째 클럭에 아무도 SDA를 당기지 않아 NACK**가 되고, PCF8574 핀은 그대로라 LCD에 아무것도 나오지 않아요. 고장이 아니라 주소 차이예요. 스캐너 결과 **0x3F**(7-bit 그대로)를 `Lcd1602_Init()` 주소로 넣어요."}, {"id": "embedded-04-01", "ch": 4, "type": "mcq", "cat": "concept", "level": 1, "sec": "1. I2C 버스와 오픈 드레인·풀업", "q": "I2C의 SDA/SCL 신호선에 대한 설명으로 옳은 것은?", "options": ["push-pull 출력처럼 HIGH와 LOW를 모두 강하게 구동한다", "대부분의 장치는 LOW만 끌어내리고, HIGH는 풀업 저항(보통 4.7 kΩ)이 만든다", "여러 장치가 동시에 출력하면 합선이 나므로 장치는 1:1로만 연결한다", "풀업 저항이 없어도 아무도 구동하지 않으면 선은 HIGH(idle)로 유지된다"], "answer": [1], "why": ["슬라이드 6: I2C 신호선은 push-pull처럼 HIGH·LOW를 모두 구동하지 않아요.", "슬라이드 6 그대로예요. 그래서 SDA/SCL에 풀업 저항이 필요해요.", "오픈 드레인이라 여러 장치가 충돌 없이 공존해요(멀티슬레이브).", "HIGH를 만드는 게 풀업 저항이라, 없으면 선을 HIGH로 올릴 것이 없어요."], "explain": "I2C는 **오픈 드레인** 버스예요. 장치는 LOW만 끌어내리고 HIGH는 **풀업 저항**에 맡기므로, 누구든 0을 내면 0이 될 뿐 충돌이 없어요. 풀업이 없으면 idle·START·ACK를 판단할 수 없고, 5 V 풀업 백팩은 idle 전압을 꼭 확인해야 해요.", "pick": 1}, {"id": "embedded-04-02", "ch": 4, "type": "mcq", "cat": "concept", "level": 1, "sec": "2. I2C 프레임: START에서 STOP까지", "q": "I2C 버스에서 **SCL이 HIGH인 동안 SDA가 LOW → HIGH로** 바뀌었다. 이 신호는?", "options": ["START", "데이터 비트 1", "STOP", "ACK", "Repeated START"], "answer": [2], "why": ["START는 SCL HIGH 동안 SDA가 HIGH → LOW예요.", "데이터 비트는 SCL이 LOW일 때 바뀌고 HIGH일 때 읽혀요. SCL HIGH 중 변화는 데이터가 아니에요.", "슬라이드 8: STOP = SCL이 HIGH인 동안 SDA가 LOW → HIGH.", "ACK는 수신 측이 9번째 클럭 동안 SDA를 LOW로 유지하는 것이에요.", "Repeated START는 STOP 없이 다시 보내는 START(HIGH → LOW)예요."], "explain": "규칙은 '데이터는 SCL이 LOW일 때만 바뀐다'예요. SCL이 HIGH인데 SDA가 바뀌면 특별 신호이고, **1→0이면 START, 0→1이면 STOP**이에요. 둘을 바꿔 낸 보기가 단골이에요.", "pick": 1}, {"id": "embedded-04-03", "ch": 4, "type": "short", "cat": "calc", "level": 1, "sec": "3. 7-bit 주소와 I2C 스캐너", "q": "7-bit 주소가 **0x27**인 PCF8574 백팩에 **쓰기**를 할 때, 버스에 실제로 나가는 첫 바이트(주소 + R/W)를 16진수로 쓰시오.", "accept": ["0x4E", "4E", "4Eh", "0x4Eh"], "model": "`0x4E`", "explain": "첫 바이트 = **(7-bit 주소 << 1) | R/W**. 0x27 = `010 0111` → 한 칸 밀어 `0100 111_` → 쓰기(W=0)를 넣으면 `0100 1110` = **0x4E**예요(읽기면 0x4F). RTD API에는 7-bit 0x27을 넣고, 밀기와 R/W는 하드웨어가 붙여요."}, {"id": "embedded-04-04", "ch": 4, "type": "mcq", "cat": "calc", "level": 2, "sec": "3. 7-bit 주소와 I2C 스캐너", "q": "스캐너로 찾은 백팩 주소가 7-bit **0x3F**였다. 이 장치에서 **읽기**를 할 때 버스에 나가는 첫 바이트는?", "options": ["0x7F", "0x7E", "0x1F", "0x3F", "0xBF"], "answer": [0], "why": ["(0x3F << 1) | 1 = 0x7E | 1 = 0x7F.", "쓰기(W=0) 첫 바이트예요.", "오른쪽으로 민(>>1) 값이에요.", "7-bit 주소 그대로예요. 버스 첫 바이트는 시프트 + R/W예요.", "주소를 시프트하지 않고 bit7에 R/W를 붙인 잘못된 계산이에요."], "explain": "(0x3F << 1) = 0x7E, 읽기는 R/W = 1이라 **0x7F**예요. 쓰기면 0x7E. 0x27이면 쓰기 0x4E, 읽기 0x4F예요.", "pick": 1}, {"id": "embedded-04-05", "ch": 4, "type": "err", "cat": "error", "level": 2, "sec": "3. 7-bit 주소와 I2C 스캐너", "q": "학생이 '첫 바이트 = 주소 << 1'을 미리 반영하려고 IPL `main.c`를 아래처럼 고쳤다. (`Lcd1602_Init()`은 슬라이드대로 `Lpi2c_Ip_MasterSetSlaveAddr(1U, address, FALSE);`를 호출한다.) 결과는?\n```c\n#define LCD_ADDR   (0x27U << 1)   /* R/W 자리 확보 */\n\nLpi2c_Ip_MasterInit(1U,\n    &I2c_Lpi2cMaster_HwChannel1_Channel0);\nLcd1602_Init(LCD_ADDR);\nLcd1602_SetCursor(0U, 0U);\nLcd1602_Puts(\"Hello S32K3\");\n```", "answer": 3, "why": ["주소가 틀려 PCF8574가 대답하지 않아요.", "0x27 << 1 = 0x4E로 uint8_t 범위 안이라 문제없이 컴파일돼요.", "바이트가 PCF8574에 전달되지 않으니 글자든 백라이트든 바뀌지 않아요.", "버스에는 0x4E를 한 번 더 민 0x9C가 나가 응답(ACK)하는 장치가 없어요(NACK)."], "outcomes": ["정상적으로 \"Hello S32K3\"가 표시된다", "컴파일 오류 (`uint8_t` 범위 초과)", "글자는 표시되지만 백라이트가 꺼진다", "LCD가 응답하지 않아 글자가 표시되지 않는다"], "reasons": ["`LCD_ADDR`이 매크로라서 `Lcd1602_Init()`에 상수를 넘길 수 없다", "0x4E는 읽기 주소라 쓰기 요청이 거부된다", "`MasterSetSlaveAddr`의 세 번째 인수 `FALSE`가 10-bit 주소를 뜻한다", "RTD API는 7-bit 주소를 받아 하드웨어가 << 1과 R/W를 붙이므로, 0x4E가 다시 밀려 첫 바이트가 0x9C가 된다"], "reason": 3, "rwhy": ["매크로는 전처리 후 상수 0x4E가 되어 정상적으로 넘어가요.", "0x4E는 0x27의 '쓰기' 첫 바이트예요(읽기는 0x4F).", "`FALSE` = 7-bit 주소예요(슬라이드 28).", "슬라이드 9: RTD API에 넣는 값이 7-bit 주소인지 확인. 흔한 실수가 0x4E를 넣는 것이에요."], "explain": "수업 코드의 0x27은 **7-bit 주소**이고, `Lpi2c_Ip_MasterSetSlaveAddr(1U, address, FALSE)`에 그대로 넣으면 LPI2C 하드웨어가 시프트와 R/W를 붙여요. 이미 민 0x4E를 넣으면 한 번 더 밀려 **0x9C**가 나가고 아무도 ACK하지 않아요. 데이터시트의 '8-bit 주소 0x4E'는 `>> 1` 해서 0x27로 바꿔 넣어야 해요."}, {"id": "embedded-04-06", "ch": 4, "type": "mcq", "cat": "calc", "level": 2, "sec": "5. PCF8574 백팩과 4-bit 전송", "q": "IPL 버전 `lcd1602.c`의 일부다. `Lcd1602_WriteByte('A', 1U)`(= `Lcd1602_Putc('A')`, 'A' = 0x41)가 `I2c_Lcd1602_Write()`로 보내는 바이트를 순서대로 옳게 나열한 것은?\n```c\n#define LCD_RS         (0x01U)\n#define LCD_E          (0x04U)\n#define LCD_BACKLIGHT  (0x08U)\n#define LCD_DATA_MASK  (0xF0U)\n\nstatic void Lcd1602_PulseEnable(uint8_t value)\n{\n    I2c_Lcd1602_Write(value | LCD_E);\n    Lcd1602_Delay(2000U);\n    I2c_Lcd1602_Write(value & (uint8_t)(~LCD_E));\n    Lcd1602_Delay(2000U);\n}\nstatic void Lcd1602_WriteNibble(uint8_t nibble, uint8_t isData)\n{\n    uint8_t value = (uint8_t)(nibble & LCD_DATA_MASK)\n                    | LCD_BACKLIGHT;\n    if (isData != 0U) { value |= LCD_RS; }\n    Lcd1602_PulseEnable(value);\n}\nstatic void Lcd1602_WriteByte(uint8_t value, uint8_t isData)\n{\n    Lcd1602_WriteNibble(value, isData);\n    Lcd1602_WriteNibble((uint8_t)(value << 4U), isData);\n    Lcd1602_Delay(5000U);\n}\n```", "options": ["0x49, 0x4D, 0x19, 0x1D", "0x4D, 0x49, 0x1D, 0x19", "0x4C, 0x48, 0x1C, 0x18", "0x1D, 0x19, 0x4D, 0x49", "0x45, 0x41, 0x15, 0x11"], "answer": [1], "why": ["E=1과 E=0 순서가 뒤집혔어요. PulseEnable은 E=1(`|LCD_E`)을 먼저 써요.", "상위 니블 0x40|BL|RS = 0x49 → E=1 0x4D, E=0 0x49 → 하위 니블 0x10|0x09 = 0x19 → 0x1D, 0x19.", "RS(0x01)가 빠진 값이에요. 데이터라 isData=1 → RS=1.", "상위 니블을 먼저 보내야 해요.", "백라이트 비트(0x08)가 빠진 값이에요."], "explain": "상위 니블: `0x41 & 0xF0 = 0x40` → `| 0x08 | 0x01` = **0x49**, PulseEnable이 **0x4D(E=1) → 0x49(E=0)**. 하위 니블: `(uint8_t)(0x41 << 4)` = 0x10 → **0x19**, 그래서 **0x1D → 0x19**. E가 1→0으로 떨어지는 순간 LCD가 니블을 래치하므로 한 글자에 I2C write가 4번이에요.", "pick": 1}, {"id": "embedded-04-07", "ch": 4, "type": "short", "cat": "calc", "level": 2, "sec": "5. PCF8574 백팩과 4-bit 전송", "q": "IPL 버전 `Lcd1602_Putc('S')`('S' = 0x53)가 PCF8574에 쓰는 **첫 번째** 바이트를 16진수로 쓰시오. (매핑: P0=RS 0x01, P2=E 0x04, P3=BL 0x08, P4~P7=D4~D7)", "accept": ["0x5D", "5D", "5Dh"], "model": "`0x5D`", "explain": "상위 니블 `0x53 & 0xF0 = 0x50`에 BL(0x08)·RS(0x01)를 OR하면 0x59, PulseEnable이 먼저 **E=1**(`| 0x04`)로 쓰므로 첫 바이트는 **0x5D**예요. E를 빼먹은 0x59, 하위 니블인 0x3D가 함정이에요."}, {"id": "embedded-04-08", "ch": 4, "type": "mcq", "cat": "calc", "level": 3, "sec": "4. HD44780과 1602 LCD", "q": "다음 `Lcd1602_SetCursor(1U, 20U);` 호출이 LCD에 보내는 **명령 바이트**(니블로 나누기 전 8비트 값)는?\n```c\n#define LCD_CMD_SET_DDRAM   (0x80U)\n#define LCD_DDRAM_ROW0      (0x00U)\n#define LCD_DDRAM_ROW1      (0x40U)\n#define LCD_COLUMN_COUNT    (16U)\n\nvoid Lcd1602_SetCursor(uint8_t row, uint8_t col)\n{\n    uint8_t ddramAddress;\n    if (col >= LCD_COLUMN_COUNT)\n    {\n        col = LCD_COLUMN_COUNT - 1U;\n    }\n    ddramAddress = (row == 0U) ? LCD_DDRAM_ROW0\n                               : LCD_DDRAM_ROW1;\n    Lcd1602_WriteCommand(\n        (uint8_t)(LCD_CMD_SET_DDRAM | ddramAddress | col));\n}\n```", "options": ["0xCF", "0x8F", "0x9F", "0xD4", "0x94"], "answer": [0], "why": ["col → 15(0x0F), 2행 0x40 → 0x80 | 0x40 | 0x0F = 0xCF.", "1행(row 0)일 때의 값이에요.", "2행 시작을 0x10으로 잘못 잡은 값이에요.", "col 20(0x14)을 그대로 OR한 값이에요. 16 이상이면 15로 고정돼요.", "행 주소를 빼고 col 20을 OR한 값이에요."], "explain": "`col`이 16 이상이면 **15로 고정**되고, row 1이면 DDRAM 2행 시작 **0x40**을 골라 `0x80 | 0x40 | 0x0F` = **0xCF**예요. 2행이 0x10이 아니라 0x40부터라는 점과 열 제한이 두 함정이에요. 이 명령은 RS=0으로 0xCC, 0xC8, 0xFC, 0xF8 네 바이트로 나가요.", "pick": 1}, {"id": "embedded-04-09", "ch": 4, "type": "mcq", "cat": "read", "level": 2, "sec": "5. PCF8574 백팩과 4-bit 전송", "q": "IPL 버전에서 `Lcd1602_Clear();`가 호출하는 `Lcd1602_WriteCommand(LCD_CMD_CLEAR)`(0x01)는 PCF8574에 어떤 4바이트를 순서대로 보내는가?\n```c\nstatic void Lcd1602_WriteCommand(uint8_t command)\n{\n    Lcd1602_WriteByte(command, 0U);\n}\nvoid Lcd1602_Clear(void)\n{\n    Lcd1602_WriteCommand(LCD_CMD_CLEAR);\n    Lcd1602_Delay(200000U);\n}\n```", "options": ["0x0C, 0x08, 0x1C, 0x18", "0x0D, 0x09, 0x1D, 0x19", "0x08, 0x0C, 0x18, 0x1C", "0x1C, 0x18, 0x0C, 0x08"], "answer": [0], "why": ["상위 니블 0x00 → 0x08|E = 0x0C, 0x08 / 하위 니블 0x10 → 0x1C, 0x18.", "RS(0x01)가 켜진 값이에요. 명령은 isData = 0U라 RS = 0이에요.", "E=0을 먼저 쓴 순서예요. IPL PulseEnable은 E=1부터 써요.", "하위 니블을 먼저 보냈어요. WriteByte는 상위 니블이 먼저예요."], "explain": "명령이면 RS 비트만 빠져요. 0x01의 상위 니블 0x00 + BL 0x08 → **0x0C(E=1), 0x08(E=0)**, 하위 니블 `(0x01 << 4)` = 0x10 → **0x1C, 0x18**. Clear는 처리 시간이 길어서 뒤에 `Delay(200000U)`로 오래 기다려요.", "pick": 1}, {"id": "embedded-04-10", "ch": 4, "type": "short", "cat": "read", "level": 3, "sec": "7. lcd1602 드라이버 — 호출 계층과 초기화", "q": "IPL 버전 `Lcd1602_Init()`이다. `I2c_Lcd1602_Write()`(I2C write 1회)는 이 함수가 끝날 때까지 **모두 몇 번** 호출되는가? (`Lpi2c_Ip_MasterSetSlaveAddr()`는 write가 아니다. `Lcd1602_Clear()`는 `WriteCommand(0x01)` 한 번 + Delay)\n```c\nvoid Lcd1602_Init(uint8_t address)\n{\n    g_lcd_addr = address;\n    Lpi2c_Ip_MasterSetSlaveAddr(1U, address, FALSE);\n    Lcd1602_Delay(400000U);\n    Lcd1602_WriteNibble(0x30U, 0U);\n    Lcd1602_Delay(50000U);\n    Lcd1602_WriteNibble(0x30U, 0U);\n    Lcd1602_Delay(10000U);\n    Lcd1602_WriteNibble(0x30U, 0U);\n    Lcd1602_Delay(10000U);\n    Lcd1602_WriteNibble(0x20U, 0U);\n    Lcd1602_Delay(10000U);\n    Lcd1602_WriteCommand(LCD_CMD_FUNCTION_4BIT);\n    Lcd1602_WriteCommand(LCD_CMD_DISPLAY_ON);\n    Lcd1602_WriteCommand(LCD_CMD_ENTRY_INCREMENT);\n    Lcd1602_Clear();\n}\n```", "accept": ["24", "24번", "24회"], "model": "`24`", "explain": "IPL PulseEnable은 니블 하나에 write **2번**(E=1, E=0)이에요. `WriteNibble` 4번 → 4 × 2 = 8, `WriteCommand` 4번(0x28, 0x0C, 0x06, Clear의 0x01) → 각 니블 2개 × 2 = 4번씩 16. 합계 **24번**이에요. MCAL 버전은 니블당 3번이라 36번이 돼요."}, {"id": "embedded-04-11", "ch": 4, "type": "mcq", "cat": "read", "level": 2, "sec": "9. MCAL 설정과 코드 변화", "q": "MCAL 버전 `Lcd1602_PulseEnable()`이다. `Lcd1602_Putc('H')`('H' = 0x48)가 `I2c_Lcd1602_Write()`로 보내는 바이트를 순서대로 옳게 나열한 것은?\n```c\nstatic void I2c_Lcd1602_Write(uint8_t value)\n{\n    uint8_t tx = value;\n    (void)I2cMcal_SyncWrite(g_lcd_addr, &tx, 1U);\n}\n\nstatic void Lcd1602_PulseEnable(uint8_t value)\n{\n    I2c_Lcd1602_Write(value);\n    I2c_Lcd1602_Write(value | LCD_E);\n    Lcd1602_Delay(2000U);\n    I2c_Lcd1602_Write(value & (uint8_t)(~LCD_E));\n    Lcd1602_Delay(2000U);\n}\n```", "options": ["0x49, 0x4D, 0x49, 0x89, 0x8D, 0x89", "0x4D, 0x49, 0x8D, 0x89", "0x49, 0x4D, 0x49, 0x19, 0x1D, 0x19", "0x4D, 0x49, 0x49, 0x8D, 0x89, 0x89"], "answer": [0], "why": ["니블마다 value(E=0) → value|E → value&~E. 상위 0x49, 하위 0x89.", "IPL 버전(니블당 2번)의 바이트예요. MCAL은 E=0 값을 먼저 한 번 더 써요.", "하위 니블이 'A'(0x41)의 값이에요. 0x48의 하위 니블 8 → 0x80|0x09 = 0x89.", "세 번의 순서가 틀렸어요. E=0 → E=1 → E=0이에요."], "explain": "MCAL `PulseEnable`은 E=0 상태로 데이터·RS를 먼저 세팅한 뒤 E를 올렸다 내려서 **니블당 3번, 한 글자 6번** 써요. 'H' = 0x48 → 상위 0x40|0x08|0x01 = **0x49 → 0x4D → 0x49**, 하위 `(0x48 << 4)` = 0x80 → **0x89 → 0x8D → 0x89**. LCD가 래치하는 순간(E 1→0)은 IPL과 같아 화면 결과는 같아요.", "pick": 1}, {"id": "embedded-04-12", "ch": 4, "type": "err", "cat": "error", "level": 2, "sec": "5. PCF8574 백팩과 4-bit 전송", "q": "IPL `lcd1602.c`의 `Lcd1602_PulseEnable()`을 다음처럼 잘못 작성했다(나머지는 슬라이드와 같다). LCD의 상태는?\n```c\nstatic void Lcd1602_PulseEnable(uint8_t value)\n{\n    I2c_Lcd1602_Write(value);\n    Lcd1602_Delay(2000U);\n    I2c_Lcd1602_Write(value & (uint8_t)(~LCD_E));\n    Lcd1602_Delay(2000U);\n}\n```", "answer": 3, "why": ["LCD가 아무 니블도 받아 가지 않아요.", "문법·자료형 모두 문제없어요.", "주소·배선이 그대로라 PCF8574는 정상 ACK하고 BL 비트가 출력돼요.", "보내는 바이트(0x49, 0x49, 0x19 …)에 BL(0x08)은 있지만 E(0x04)는 한 번도 1이 아니에요."], "outcomes": ["\"Hello S32K3\"가 정상 표시된다", "컴파일 오류", "I2C NACK가 나서 백라이트도 꺼진다", "백라이트는 켜지지만 글자가 표시되지 않는다"], "reasons": ["`~LCD_E`의 결과가 int라 uint8_t 변수에 담을 수 없다", "RS가 0으로 고정되어 모든 바이트가 명령으로 처리된다", "E(P2)가 한 번도 1이 되지 않아 1→0 하강 에지가 없으므로 LCD가 어떤 니블도 래치하지 않는다", "백라이트 비트가 지워져서 화면이 어둡다"], "reason": 2, "rwhy": ["`(uint8_t)` 캐스트가 있어 문제없어요.", "RS는 WriteNibble이 isData로 세팅하므로 그대로예요.", "슬라이드 13·34: '각 니블은 E 핀을 1→0으로 토글해야 LCD가 값을 래치한다.'", "BL(0x08)은 WriteNibble이 항상 OR해요."], "explain": "LCD는 **E가 1→0으로 떨어지는 하강 에지**에서 RS와 D4~D7을 래치해요. 이 코드는 `value`(E=0)와 `value & ~E`(E=0)만 써서 E가 한 번도 올라가지 않으니 초기화 명령조차 전달되지 않아요. 바이트에는 BL 비트가 있어 PCF8574 P3가 1이므로 '백라이트만 켜지고 글자 없음' 증상이 돼요."}, {"id": "embedded-04-13", "ch": 4, "type": "mcq", "cat": "calc", "level": 3, "sec": "5. PCF8574 백팩과 4-bit 전송", "q": "`Lcd1602_WriteByte()`에서 하위 니블 처리를 실수로 다음처럼 썼다. LCD가 **이미 올바르게 4-bit로 초기화된 상태**라고 할 때, `Lcd1602_Putc('A')`('A' = 0x41) 한 번으로 LCD가 래치하는 8비트 값은?\n```c\nstatic void Lcd1602_WriteByte(uint8_t value, uint8_t isData)\n{\n    Lcd1602_WriteNibble(value, isData);\n    Lcd1602_WriteNibble(value, isData);  /* << 4U 누락 */\n    Lcd1602_Delay(5000U);\n}\n```", "options": ["0x44 ('D')", "0x14", "0x41 ('A')", "0x11", "0x40 ('@')"], "answer": [0], "why": ["WriteNibble이 `& 0xF0`으로 상위 4비트만 쓰므로 두 번 다 니블 4 → 0x44.", "니블 순서를 뒤집은 값이에요.", "하위 니블 1이 전달되지 않아요.", "하위 니블만 두 번 보낸 경우의 값이에요.", "두 번째 니블은 0이 아니라 다시 4예요."], "explain": "`WriteNibble`은 `nibble & LCD_DATA_MASK(0xF0)`로 **상위 4비트만** D7~D4에 올려요. 그래서 하위 니블을 `<< 4`로 끌어올리지 않으면 상위 니블 `0100`이 두 번 가서 LCD는 **0x44('D')**를 받아요. 같은 함수가 명령에도 쓰이므로 0x0C(Display ON)는 0x00이 되는 등 초기화부터 망가져요.", "pick": 1}, {"id": "embedded-04-14", "ch": 4, "type": "err", "cat": "error", "level": 3, "sec": "7. lcd1602 드라이버 — 호출 계층과 초기화", "q": "`LCD_CMD_FUNCTION_4BIT` 값을 다음처럼 바꿨다. 나머지 `Lcd1602_Init()`은 슬라이드와 같다(0x30 니블 ×3 → 0x20 니블 → `WriteCommand(0x38)` → 0x0C → 0x06 → Clear). 결과는?\n```c\n#define LCD_CMD_FUNCTION_4BIT   (0x38U)   /* 원래 0x28U */\n\n    Lcd1602_WriteNibble(0x20U, 0U);   /* 4-bit 진입 */\n    Lcd1602_Delay(10000U);\n    Lcd1602_WriteCommand(LCD_CMD_FUNCTION_4BIT);\n    Lcd1602_WriteCommand(LCD_CMD_DISPLAY_ON);\n    Lcd1602_WriteCommand(LCD_CMD_ENTRY_INCREMENT);\n    Lcd1602_Clear();\n```", "answer": 1, "why": ["0x38은 4-bit Function set이 아니에요(수업 값은 0x28).", "BL 비트는 그대로 나가지만 LCD의 4-bit 설정이 깨져 초기화가 실패해요(슬라이드 81: 백라이트만 켜지고 글자 없음 ← 초기화 시퀀스).", "값만 바뀌었을 뿐 문법 문제는 없어요.", "명령 값은 PCF8574의 BL 비트(P3)와 별개라 백라이트는 켜져 있어요."], "outcomes": ["0x28과 마찬가지로 정상 표시된다", "백라이트는 켜지지만 글자가 정상적으로 표시되지 않는다", "컴파일 오류", "백라이트가 꺼진다"], "reasons": ["0x38은 Clear 명령이라 화면이 계속 지워진다", "0x38에 0x08 비트가 있어서 백라이트 명령으로 해석된다", "4-bit 모드에서 두 니블(0x3, 0x8)이 합쳐진 0x38은 상위 니블이 0x3('8-bit 지정')인 Function set이라, 방금 들어간 4-bit 모드가 다시 8-bit로 바뀌고 이후 니블 짝이 어긋난다", "Function set은 `WriteNibble()`로만 보낼 수 있다"], "reason": 2, "rwhy": ["Clear는 0x01이에요.", "BL은 PCF8574의 P3 비트일 뿐, 명령 바이트는 니블로 나뉘어 D7~D4로만 가요.", "`WriteCommand(0x38)`의 첫 니블 바이트(0x3C → 0x38)는 `WriteNibble(0x30)`과 똑같은 '8-bit 지정'이에요. 4-bit 모드의 LCD는 0x3·0x8을 합친 0x38을 받아 8-bit 모드로 돌아가요. 4-bit용 Function set은 상위 니블이 0x2인 **0x28**이에요.", "4-bit 진입 이후의 Function set(0x28)은 `WriteCommand()`(니블 2번)로 보내요."], "explain": "수업의 4-bit Function set은 **0x28**(4-bit, 2줄, 5×8)이에요. 0x38은 상위 니블이 0x3, 즉 초기화 앞부분 `WriteNibble(0x30)`과 같은 **'8-bit 지정'**이에요(첫 니블 바이트도 똑같이 0x3C → 0x38). 4-bit 모드의 LCD는 두 니블을 합쳐 0x38을 받아 **다시 8-bit 모드로 돌아가고**, 그 뒤로는 니블 하나하나를 따로 처리해 명령·글자가 어긋나요. 그래서 백라이트(BL 비트)는 켜지지만 글자가 제대로 안 나오는 '초기화 시퀀스' 증상(슬라이드 81)이 돼요. 슬라이드 p31의 `/* 4-bit, 2-line, 5x8 dots */` 주석은 0x0C 줄에 잘못 붙은 오타이고 0x28의 설명이에요."}, {"id": "embedded-04-15", "ch": 4, "type": "mcq", "cat": "api", "level": 1, "sec": "7. lcd1602 드라이버 — 호출 계층과 초기화", "q": "수업 `Lcd1602_Init()`이 LCD에 보내는 초기화 값의 순서로 옳은 것은?", "options": ["0x28 → 0x0C → 0x06 → 0x01 → 0x30(니블) ×3 → 0x20(니블)", "0x20(니블) → 0x30(니블) ×3 → 0x28 → 0x01 → 0x0C → 0x06", "0x30(니블) ×3 → 0x20(니블) → 0x28 → 0x0C → 0x06 → 0x01", "0x30(니블) ×3 → 0x20(니블) → 0x38 → 0x0C → 0x06 → 0x01"], "answer": [2], "why": ["모드 동기화(0x30 ×3, 0x20)가 먼저예요.", "0x20(4-bit 진입)은 0x30 ×3 다음이에요.", "슬라이드 37 그대로: 8-bit 동기화 → 4-bit 진입 → Function set → Display ON → Entry mode → Clear.", "4-bit Function set은 0x38이 아니라 0x28이에요."], "explain": "상대 LCD 상태를 모른다고 보고 **0x30 니블 ×3**으로 8-bit에 동기화한 뒤 **0x20 니블**로 4-bit에 들어가요. 그다음부터는 니블 2번짜리 `WriteCommand`로 **0x28(Function set) → 0x0C(Display ON, 커서 OFF) → 0x06(Entry mode) → 0x01(Clear)**을 보내요.", "pick": 1}, {"id": "embedded-04-16", "ch": 4, "type": "mcq", "cat": "api", "level": 2, "sec": "8. main 흐름 — IPL vs MCAL API", "q": "I2C LCD 실습의 IPL 방식과 MCAL 방식에 대한 설명으로 **옳지 않은** 것은?", "options": ["초기화: IPL은 `Lpi2c_Ip_MasterInit()`, MCAL은 `I2c_Init(NULL_PTR)`", "LCD 채널 번호: IPL은 논리 channel `0U`, MCAL은 물리 instance `1U`", "1바이트 쓰기: IPL은 `Lpi2c_Ip_MasterSendDataBlocking()`, MCAL은 `I2c_SyncTransmit()`", "두 방식은 대체 관계라 한 빌드에서 `Lpi2c_Ip_MasterInit()`과 `I2c_Init()`을 함께 호출하지 않는다", "MCAL I2C 드라이버는 AUTOSAR 정식 표준 모듈이 아니라 CDD로 제공된다"], "answer": [1], "why": ["슬라이드 51 표 그대로예요.", "반대예요. IPL = 물리 instance 1U(LPI2C1), MCAL = Config Tools가 만든 논리 channel 0U.", "슬라이드 51 표 그대로예요.", "슬라이드 49 주의 그대로예요.", "슬라이드 50: I2C는 CDD로서 정식 표준에는 포함되어 있지 않아요."], "explain": "IPL은 하드웨어 블록을 직접 다뤄 **물리 instance 1U**를, MCAL은 Config Tools가 붙인 **논리 channel 0U**(LPI2C1에 매핑)를 써요. 두 번호를 맞바꾼 보기가 단골 함정이에요. 참고로 슬라이드 50 그림의 `MCU_Init()` 대문자 표기는 오타이고 실제 함수는 `Mcu_Init()`이에요.", "pick": 1}, {"id": "embedded-04-17", "ch": 4, "type": "short", "cat": "api", "level": 2, "sec": "9. MCAL 설정과 코드 변화", "q": "MCAL 버전 `I2cMcal_SyncWrite()`의 요청 구조체다. 수업 코드처럼 **전송 끝에 STOP**을 보내려면 빈칸 (A)에 들어갈 값은?\n```c\nI2c_RequestType request =\n{\n    .SlaveAddress         = (I2c_AddressType)slaveAddress,\n    .BitsSlaveAddressSize = FALSE,   /* 7-bit */\n    .ExpectNack           = FALSE,\n    .RepeatedStart        = (A),\n    .BufferSize           = length,\n    .DataDirection        = I2C_SEND_DATA,\n    .DataBuffer           = data\n};\nreturn I2c_SyncTransmit(LCD_I2C_MCAL_CHANNEL, &request);\n```", "accept": ["FALSE", "0", "0U"], "model": "`FALSE`", "explain": "MCAL은 'Repeated START로 이어 갈래?'를 묻는 필드라 STOP을 보내려면 **`.RepeatedStart = FALSE`**예요(슬라이드 62 주석 `/* STOP */`). IPL `Lpi2c_Ip_MasterSendDataBlocking(…, TRUE, …)`의 `sendStop = TRUE`와 표현이 반대인 게 함정이에요."}, {"id": "embedded-04-18", "ch": 4, "type": "err", "cat": "error", "level": 2, "sec": "9. MCAL 설정과 코드 변화", "q": "Config Tools의 I2c 설정은 슬라이드대로(**I2c Channel ID = 0**, I2c hardware channel = LPI2C_1)이다. 학생이 `lcd1602.h`를 다음처럼 바꿨다. 결과는?\n```c\n/* LPI2C1을 쓰니까 1로 바꿈 */\n#define LCD_I2C_MCAL_CHANNEL    (1U)\n\nStd_ReturnType I2cMcal_SyncWrite(uint8 slaveAddress,\n                                 uint8 *data,\n                                 uint16 length);\n```", "answer": 0, "why": ["슬라이드 82: '`I2c_SyncTransmit()`이 계속 E_NOT_OK ← 논리 channel 번호가 다름'.", "1U는 평범한 상수라 빌드는 돼요.", "MCAL 채널 번호는 물리 번호가 아니라 논리 번호예요.", "모든 전송이 같은 채널 번호를 쓰므로 일부만 실패하지 않아요."], "outcomes": ["빌드는 되지만 `I2c_SyncTransmit()`이 E_OK를 돌려주지 않아 LCD에 표시되지 않는다", "컴파일 오류", "LPI2C1이므로 정상 표시된다", "글자는 표시되지만 2행 카운터만 갱신되지 않는다"], "reasons": ["`I2c_Init()`에 채널 번호 1U를 넘기지 않았다", "MCAL에서는 주소를 요청마다 보내므로 채널 번호는 무시된다", "`I2c_SyncTransmit()`의 첫 인수는 Config Tools가 만든 **논리** 채널 번호(I2c Channel ID = 0)인데 물리 instance 번호를 넣었다", "1U는 `uint8` 범위를 벗어난다"], "reason": 2, "rwhy": ["`I2c_Init(NULL_PTR)`은 생성 설정을 쓰므로 인수가 필요 없어요.", "주소와 채널은 별개예요. 채널이 틀리면 전송 자체가 실패해요.", "슬라이드 60 주석: '이 채널 번호는 물리 번호가 아니라 논리 번호다'. 생성된 Channel ID(0)를 써야 해요.", "1은 uint8 범위 안이에요."], "explain": "IPL은 물리 instance `1U`를 쓰지만, MCAL의 `LCD_I2C_MCAL_CHANNEL`은 Config Tools의 **I2c Channel ID(=0)**와 맞춰야 하는 **논리 번호**예요. 물리 번호를 넣으면 슬라이드 82의 'E_NOT_OK ← 논리 channel 번호 불일치' 증상이 나요. 조치는 생성된 채널 번호를 매크로에 반영하는 거예요."}, {"id": "embedded-04-19", "ch": 4, "type": "err", "cat": "error", "level": 2, "sec": "9. MCAL 설정과 코드 변화", "q": "MCAL `main()`의 초기화 순서를 다음처럼 바꿨다(Mcu 초기화는 슬라이드와 같다). 결과는?\n```c\nMcu_SetMode(0U);\nPort_Init(NULL_PTR);\nI2c_Probe(0x27U);        /* 백라이트 끄기 */\nLcd1602_Init(0x27U);\nI2c_Init(NULL_PTR);      /* 맨 뒤로 옮김 */\nLcd1602_SetCursor(0U, 0U);\nLcd1602_Puts(\"Hello S32K3\");\n```", "answer": 1, "why": ["슬라이드 76: I2C 초기화 전에 Scan·Lcd1602_Init을 실행하면 안 돼요.", "I2c_Init 전의 Probe·Init 전송이 실패해 4-bit 초기화가 LCD에 도달하지 않아요.", "선언·문법은 그대로라 빌드는 돼요.", "LCD 초기화가 실패했으니 글자가 정상 표시된다고 볼 수 없어요."], "outcomes": ["정상 표시된다 (I2c_Init 위치는 상관없다)", "빌드는 되지만 LCD 초기화 명령이 전달되지 않아 \"Hello S32K3\"가 정상 표시되지 않는다", "컴파일 오류", "글자는 표시되지만 백라이트가 꺼진 채로 남는다"], "reasons": ["`I2c_Init()` 전에 보낸 전송은 실패(E_NOT_OK)하는데 `I2c_Lcd1602_Write()`가 `(void)`로 반환값을 버려, 4-bit 초기화 시퀀스가 LCD에 전달되지 않는다", "`Lcd1602_Init()`이 내부에서 `I2c_Init()`을 다시 호출하므로 순서가 무관하다", "`Port_Init()`이 `I2c_Init()`보다 먼저 호출되어 SDA/SCL 핀이 잠긴다", "MCAL 버전에는 `MasterSetSlaveAddr()`가 없어서 주소가 설정되지 않는다"], "reason": 0, "rwhy": ["슬라이드 82·교재: E_NOT_OK면 'Init이 먼저인지' 확인. 초기화 전송이 조용히 실패해요.", "Lcd1602_Init은 I2C 초기화를 하지 않아요.", "Port → I2c 순서가 슬라이드의 정상 순서예요.", "MCAL은 주소를 요청 구조체에 매번 넣으므로 MasterSetSlaveAddr가 필요 없어요."], "explain": "정상 순서는 **클럭(Mcu) → 핀(Port_Init) → I2C 초기화(I2c_Init) → Probe/스캔 → Lcd1602_Init**이에요. I2c_Init 전에 보낸 LCD 초기화 바이트는 전송에 실패하고, 반환값을 `(void)`로 버리니 코드는 그냥 지나가요. 그 뒤 `Puts()`는 전송되더라도 LCD가 4-bit로 초기화되지 않아 정상 표시가 안 돼요(슬라이드 76·82)."}, {"id": "embedded-04-20", "ch": 4, "type": "mcq", "cat": "api", "level": 2, "sec": "8. main 흐름 — IPL vs MCAL API", "q": "MCAL 버전 `main()`의 초기화 호출 순서로 옳은 것은?", "options": ["`Port_Init(NULL_PTR)` → `Mcu_Init(NULL_PTR)` → `Mcu_InitClock(0U)` → `I2c_Init(NULL_PTR)`", "`Mcu_Init(NULL_PTR)` → `Mcu_DistributePllClock()` → PLL 잠금 대기 → `Mcu_InitClock(0U)` → `Port_Init(NULL_PTR)` → `I2c_Init(NULL_PTR)`", "`Mcu_Init(NULL_PTR)` → `Mcu_InitClock(0U)` → PLL 잠금 대기 → `Mcu_DistributePllClock()` → `Mcu_SetMode(0U)` → `Port_Init(NULL_PTR)` → `I2c_Init(NULL_PTR)`", "`I2c_Init(NULL_PTR)` → `Mcu_Init(NULL_PTR)` → `Mcu_InitClock(0U)` → `Mcu_SetMode(0U)` → `Port_Init(NULL_PTR)`"], "answer": [2], "why": ["클럭(Mcu)이 먼저예요. 클럭 없이는 주변장치가 동작하지 않아요.", "PLL이 잠긴 것을 확인한 뒤에 분배해요. InitClock이 먼저예요.", "슬라이드 73·74 코드 순서 그대로예요.", "I2C 초기화는 클럭과 핀이 준비된 다음이에요."], "explain": "슬라이드 73·74: `Mcu_Init(NULL_PTR)` → `Mcu_InitClock(0U)`(실패 시 무한 대기) → `while (MCU_PLL_LOCKED != Mcu_GetPllStatus())` → `Mcu_DistributePllClock()` → `Mcu_SetMode(0U)` → `Port_Init(NULL_PTR)` → `I2c_Init(NULL_PTR)`. 슬라이드 76은 '시스템 클록·Port·Platform 초기화는 생성 코드 순서를 유지'하라고 해요. p50 그림의 `MCU_Init()` 표기는 오타예요.", "pick": 1}, {"id": "embedded-04-21", "ch": 4, "type": "short", "cat": "api", "level": 2, "sec": "8. main 흐름 — IPL vs MCAL API", "q": "MCAL `main()`에서 PLL이 잠길 때까지 기다리는 부분이다. 빈칸 (A)에 들어갈 함수 호출은?\n```c\n#if (MCU_NO_PLL == STD_OFF)\n    while (MCU_PLL_LOCKED != (A))\n    {\n    }\n    (void)Mcu_DistributePllClock();\n#endif\n    Mcu_SetMode(0U);\n```", "accept": ["Mcu_GetPllStatus()", "Mcu_GetPllStatus"], "model": "`Mcu_GetPllStatus()`", "explain": "`Mcu_GetPllStatus()`가 `MCU_PLL_LOCKED`를 돌려줄 때까지 빈 루프로 기다린 뒤 `Mcu_DistributePllClock()`으로 PLL 클럭을 분배해요(슬라이드 74). 슬라이드 50 그림의 `MCU_GetPllStatus()` 같은 대문자 표기는 오타예요."}, {"id": "embedded-04-22", "ch": 4, "type": "err", "cat": "error", "level": 1, "sec": "9. MCAL 설정과 코드 변화", "q": "MCAL 프로젝트의 Config Tools에서 **I2c General > I2c Disable Production Error Reporting** 체크박스를 **체크하지 않은 채** 코드를 생성하고 빌드했다. 나머지 설정·코드는 슬라이드와 같다. 결과는?", "answer": 2, "why": ["슬라이드가 이 항목을 체크하라고 하는 이유가 바로 빌드 문제예요.", "timeout은 Timeout Duration 항목의 이야기예요.", "슬라이드 57 설정표: '체크박스에 check — 컴파일시 오류 야기'.", "실행 단계 증상이 아니라 빌드 단계에서 멈춰요."], "outcomes": ["정상 빌드되고 LCD가 표시된다", "빌드는 되지만 첫 전송에서 timeout으로 실패한다", "컴파일 오류", "빌드는 되지만 백라이트만 켜진다"], "reasons": ["Timeout Duration 기본값 1이 너무 짧다", "슬라이드 설정표가 이 항목을 체크하지 않으면 컴파일 시 오류가 난다고 명시한다", "I2c Channel ID가 C 코드의 채널 번호와 다르다", "ConfigTimeSupport가 VARIANT-PRE-COMPILE이 아니라 `I2c_Init(NULL_PTR)`을 쓸 수 없다"], "reason": 1, "rwhy": ["별개 항목이고 '설정·코드는 슬라이드와 같다'고 했어요(10000).", "p57의 '확인' 칸 그대로예요(노트 §9 표: 안 하면 컴파일 오류).", "Channel ID는 슬라이드대로 0이에요.", "슬라이드대로 VARIANT-PRE-COMPILE이라 NULL_PTR이 가능해요."], "explain": "슬라이드 57의 I2c 설정표는 **Disable Production Error Reporting = 체크**, 이유는 '체크하지 않으면 **컴파일 시 오류**'예요. 같은 표의 Timeout Duration(10000, 기본값 1은 너무 짧음), Channel ID(0)와 헷갈리지 않게 항목별 이유를 짝지어 외워요."}, {"id": "embedded-04-23", "ch": 4, "type": "mcq", "cat": "api", "level": 2, "sec": "9. MCAL 설정과 코드 변화", "q": "MCAL I2C LCD 프로젝트의 Config Tools 설정에 대한 설명으로 **옳지 않은** 것은?", "options": ["Mcu Config Variant가 VARIANT-PRE-COMPILE이라 `Mcu_Init(NULL_PTR)`처럼 인자를 생략할 수 있다", "I2c Timeout Duration은 기본값 1을 그대로 둔다", "McuPeripheral에서 LPI2C_1의 Peripheral Clock Enable을 체크한다", "I2c Channel ID = 0은 C 코드에서 사용할 값이다", "I2c hardware channel = LPI2C_1로 물리 instance 1에 연결한다"], "answer": [1], "why": ["슬라이드 55 그대로예요.", "슬라이드 57: 10000으로 설정, '기본값 1은 너무 짧음'.", "슬라이드 55: LPI2C1 회로가 동작하는 데 필수예요.", "슬라이드 57 그대로예요(`LCD_I2C_MCAL_CHANNEL (0U)`).", "슬라이드 57 그대로예요."], "explain": "슬라이드 57은 **Timeout Duration = 10000**으로 두고 '기본값 1은 너무 짧다'고 해요. 나머지는 모두 슬라이드 55·57 설정표 내용이에요. VARIANT-PRE-COMPILE이라 `Mcu_Init()`·`I2c_Init()`에 `NULL_PTR`을 넘길 수 있다는 연결도 함께 기억해요.", "pick": 1}, {"id": "embedded-04-24", "ch": 4, "type": "short", "cat": "read", "level": 2, "sec": "8. main 흐름 — IPL vs MCAL API", "q": "카운터 루프에서 버퍼 크기를 줄였다. `count`가 7일 때 LCD 2행에 표시되는 문자열은? (따옴표 없이)\n```c\nchar line[11];              /* 원래 line[17] */\nuint32_t count = 7U;\n\n(void)snprintf(line, sizeof(line),\n               \"Count: %04lu\",\n               (unsigned long)count);\nLcd1602_SetCursor(1U, 0U);\nLcd1602_Puts(\"                \");\nLcd1602_SetCursor(1U, 0U);\nLcd1602_Puts(line);\n```", "accept": ["Count: 000", "Count:000"], "model": "`Count: 000`", "explain": "`\"Count: %04lu\"`는 `Count: 0007`(11글자)를 만들지만, `snprintf`는 `sizeof(line)` = 11에서 **널 종단 자리 1칸**을 빼고 10글자까지만 써요. 그래서 마지막 `7`이 잘린 **`Count: 000`**이 표시돼요. 슬라이드의 `line[17]`은 LCD 한 줄 16글자 + `'\\0'`이라서예요."}, {"id": "embedded-04-25", "ch": 4, "type": "mcq", "cat": "read", "level": 2, "sec": "8. main 흐름 — IPL vs MCAL API", "q": "MCAL `main()` 시작 부분이다. 클럭 설정이 잘못되어 `Mcu_InitClock(0U)`가 **E_NOT_OK**를 반환하면 어떻게 되는가?\n```c\nMcu_Init(NULL_PTR);\nif (E_OK != Mcu_InitClock(0U))\n{\n    while (1) { }\n}\n#if (MCU_NO_PLL == STD_OFF)\nwhile (MCU_PLL_LOCKED != Mcu_GetPllStatus())\n{\n}\n(void)Mcu_DistributePllClock();\n#endif\nMcu_SetMode(0U);\nPort_Init(NULL_PTR);\nI2c_Init(NULL_PTR);\n```", "options": ["경고만 남기고 PLL 대기 루프로 넘어간다", "`main()`이 반환되어 MCU가 리셋된다", "`while (1) { }`에 머물러 `Port_Init()`·`I2c_Init()`·LCD 초기화가 실행되지 않는다", "`Mcu_InitClock(0U)`가 성공할 때까지 자동으로 다시 호출된다"], "answer": [2], "why": ["if 블록 안의 무한 루프에서 빠져나오지 않아요.", "return 문이 없고 무한 루프에 갇혀요.", "조건 `E_OK != E_NOT_OK`가 참 → 빈 무한 루프. 이후 초기화 줄은 실행되지 않아요.", "루프 몸체가 비어 있어 재호출하지 않아요."], "explain": "`Mcu_InitClock()` 실패 시 의도적으로 `while (1) { }`에서 멈춰요. 클럭 없이 핀·I2C를 초기화해도 동작할 수 없으니 그 자리에서 멈추는 거예요. 그래서 LCD에는 아무 변화가 없고, 디버거로 멈추면 이 루프에 있어요.", "pick": 1}, {"id": "e5-n01", "ch": 5, "type": "mcq", "cat": "calc", "level": 2, "sec": "1. 지난 주 정리 — I2C 버스", "q": "MCAL LCD 드라이버는 글자 1개를 쓸 때 I2C write를 **6번** 하고, 100 kHz에서 1바이트 write 한 번은 약 **0.2 ms**라고 하자. main loop가 LCD 2행에 `\"Count: 0003\"`을 다시 쓸 때 **I2C write에만** 드는 시간은 약 얼마인가? (SetCursor 명령·E 펄스 Delay는 제외)", "options": ["약 2.2 ms", "약 8.8 ms", "약 13.2 ms", "약 0.13 ms", "약 132 ms"], "answer": [2], "pick": 1, "why": ["틀림: 11글자 × 0.2 ms로, 글자당 write가 6번인 것을 빠뜨린 값이에요.", "틀림: 글자당 4번(IPL 드라이버)으로 계산한 값이에요. 문제는 MCAL 6번이에요.", "맞음: `\"Count: 0003\"`은 11글자 → 11 × 6 = 66번 × 0.2 ms = 13.2 ms예요.", "틀림: 단위를 잘못 옮긴 값이에요(66 × 0.002 ms).", "틀림: 0.2 ms를 2 ms로 잘못 본 값이에요."], "explain": "공백과 콜론까지 세면 `Count: 0003`은 **11글자**예요. 11 × 6 = 66번 write × 0.2 ms ≈ **13.2 ms**이고, 실제로는 Delay가 더 붙어요. `I2c_SyncTransmit()`이 **blocking**이라 이 시간 동안 CPU가 묶이므로, 이런 LCD 출력을 버튼 콜백(ISR) 안에 넣으면 안 돼요."}, {"id": "e5-n02", "ch": 5, "type": "mcq", "cat": "concept", "level": 1, "sec": "1. 지난 주 정리 — I2C 버스", "q": "4장 내용이 5장 버튼 인터럽트 실습으로 이어지는 방식에 대한 설명으로 **옳지 않은 것**은?", "options": ["`I2c_SyncTransmit()`은 전송이 끝나야 돌아오는 blocking 함수라서 LCD 한 줄 갱신에도 수 ms 이상 걸릴 수 있다", "버튼 누름 횟수 표시에 쓰는 lcd1602 모듈은 4장 프로젝트에서 복사해 온다", "5장도 코드만으로는 동작하지 않고 Config Tools에서 핀·ICU·인터럽트 컨트롤러를 설정해야 한다", "LCD 출력이 main loop를 오래 막으므로, 버튼 콜백 안으로 옮겨 누를 때만 출력하는 것이 수업 방식이다", "IPL과 MCAL은 대체 관계이므로 버튼 실습도 두 프로젝트로 만들고 섞지 않는다"], "answer": [3], "pick": 1, "why": ["틀림(옳은 설명): 동기 전송이라 글자마다 write가 여러 번 쌓여 수~수십 ms가 걸려요.", "틀림(옳은 설명): lcd1602.c/.h는 4장에서 복사하고 main.c만 새로 작성해요.", "틀림(옳은 설명): 4장의 '코드 + 하드웨어 설정' 패턴이 그대로 적용돼요.", "맞음(옳지 않은 설명): blocking LCD 출력을 콜백에 넣으면 그동안 다른 인터럽트와 main이 밀려요. 출력은 main loop에서 해요.", "틀림(옳은 설명): IP 버전과 MCAL 버전을 따로 만들고 생성 파일을 공유하지 않아요."], "explain": "4장에서 가져오는 핵심은 **`I2c_SyncTransmit()`이 blocking**이라는 점이에요. 그래서 5장에서는 LCD 출력을 **ISR(콜백) 안에 넣지 않고** main loop가 맡아요. 'main을 덜 막으려고 ISR로 옮긴다'는 문제 해결표에서도 오답으로 쓰이는 함정이에요."}, {"id": "e5-n03", "ch": 5, "type": "err", "cat": "error", "level": 2, "sec": "2. 폴링과 인터럽트", "q": "폴링 방식으로 버튼 누름을 세는 루프다. `ReadButton()`은 PTB26 레벨을 읽는 설명용 함수(눌림 = 1)이고, `UpdateLcd()`는 한 번에 약 13 ms가 걸리는 blocking LCD 갱신이다. 버튼을 **약 5 ms 동안만** 아주 짧게 눌렀다 떼면 어떻게 될 수 있는가? (채터링 없음)\n```c\nuint8_t prev = 0U;\nfor (;;) {\n    uint8_t now = ReadButton();              /* 0 또는 1 */\n    if ((now != 0U) && (prev == 0U)) {       /* 0 → 1 변화 */\n        g_press_count++;\n    }\n    prev = now;\n    UpdateLcd(g_press_count);                /* 약 13 ms */\n}\n```", "answer": 0, "why": ["맞음: 두 번의 읽기 사이 13 ms 안에 눌림이 시작하고 끝나면 `ReadButton()`이 1을 한 번도 읽지 못해요.", "틀림: 0→1 변화만 세므로 한 번 읽힌 눌림은 1번만 세요.", "틀림: 문법상 문제는 없어요.", "틀림: 읽기 간격(약 13 ms)보다 짧은 눌림은 보장되지 않아요."], "outcomes": ["눌림을 놓쳐 카운트가 오르지 않을 수 있다", "누를 때마다 카운트가 2씩 오른다", "컴파일 오류가 난다", "항상 정확히 1씩 오른다"], "reasons": ["`prev`가 루프 밖에 선언돼 매번 0으로 초기화된다", "폴링으로는 원리상 edge(0→1 변화)를 감지할 수 없다", "CPU가 LCD 갱신(약 13 ms)을 하는 동안에는 버튼을 읽지 않아, 그 사이에 시작·끝난 눌림은 보지 못한다", "`UpdateLcd()`가 `g_press_count`를 0으로 지운다"], "reason": 2, "rwhy": ["틀림: 루프 밖 선언이라 값이 유지되고, 매번 초기화되는 건 루프 안에 선언했을 때예요.", "틀림: 이전 값과 비교하면 폴링으로도 0→1 변화를 찾을 수 있어요. 문제는 읽는 간격이에요.", "맞음: 폴링은 다음 '읽기' 차례가 와야 알아채므로, 읽기 사이에 끝난 짧은 눌림은 놓칠 수 있어요.", "틀림: 문제에 그런 동작은 없어요."], "explain": "폴링 CPU는 **다음 읽기 차례가 와야** 입력을 봐요. LCD 출력처럼 오래 걸리는 일이 끼면 반응이 늦어지고, 읽기 간격보다 짧은 눌림은 **놓칠 수도** 있어요. 인터럽트는 edge가 오는 순간 하드웨어가 ISR로 분기시키니 이런 누락이 없어요."}, {"id": "e5-n04", "ch": 5, "type": "mcq", "cat": "calc", "level": 2, "sec": "3. Cortex-M7 예외와 벡터 테이블", "q": "Cortex-M7에서 Priority **10**인 ISR A가 실행 중이다. 먼저 ISR B(Priority **12**) 요청이 오고, 곧이어 ISR C(Priority **4**) 요청이 왔다. 세 IRQ 모두 enable이고 그룹(선점) 우선순위만 쓴다고 할 때, 실행 순서로 **옳은 것**은?", "options": ["A → B → C → main 복귀", "A → B(선점) → A 나머지 → C → main 복귀", "A → C(선점) → B → A 나머지 → main 복귀", "A → C(선점) → A 나머지 → B → main 복귀"], "answer": [3], "pick": 1, "why": ["틀림: C는 A보다 우선순위가 높아(4 < 10) 기다리지 않고 바로 선점해요.", "틀림: B는 12 > 10이라 A를 선점하지 못하고 pending으로 기다려요.", "틀림: C가 끝나면 남은 것 중 A(10)가 B(12)보다 높아서 A가 먼저 재개돼요.", "맞음: C(4)가 A를 선점 → C 끝 → A 재개 → A 끝나면 대기하던 B로 tail-chaining → main 복귀예요."], "explain": "우선순위는 **숫자가 작을수록 높아요**. 실행 중보다 **더 높은** 것(C, 4)만 선점하고, **같거나 낮은** 것(B, 12)은 pending으로 기다렸다가 A가 끝날 때 **tail-chaining**으로 바로 이어져요. C가 끝난 시점엔 중단된 A(10)가 B(12)보다 높아서 A가 먼저예요."}, {"id": "e5-n05", "ch": 5, "type": "short", "cat": "calc", "level": 1, "sec": "3. Cortex-M7 예외와 벡터 테이블", "q": "S32K312의 SIUL2 EIRQ는 NVIC 벡터 4개(IRQ **53~56**)로 묶인다. 이 가운데 **IRQ 56**의 핸들러 주소는 벡터 테이블 `__Vectors[]`의 **몇 번 칸**에 들어가는가? (숫자만)", "accept": ["72"], "model": "72", "explain": "0~15번 칸은 ARM 코어 예외이고 외부 인터럽트는 **16번 칸부터** 시작하므로 IRQ n은 **16 + n**번 칸이에요. IRQ 56 → 16 + 56 = **72**. 같은 규칙으로 IRQ 53은 69번이에요. 56을 그대로 쓰거나 0번(MSP) 칸을 빼먹고 계산하면 틀려요."}, {"id": "e5-n06", "ch": 5, "type": "mcq", "cat": "api", "level": 1, "sec": "4. NVIC — 외부 인터럽트 관리자", "q": "NVIC 레지스터와 역할·CMSIS API의 연결로 **옳은 것**은?", "options": ["IPR — IRQ 우선순위 설정, `NVIC_SetPriority()`", "ICPR — IRQ 우선순위 해제, `NVIC_SetPriority()`", "ISER — IRQ pending 설정, `NVIC_SetPendingIRQ()`", "ICER — IRQ 개별 enable, `NVIC_EnableIRQ()`"], "answer": [0], "pick": 1, "why": ["맞음: IPR = Interrupt **Priority** Register, 우선순위는 `NVIC_SetPriority()`로 정해요.", "틀림: ICPR은 Interrupt Clear **Pending** Register로 pending 해제(`NVIC_ClearPendingIRQ()`)예요.", "틀림: ISER은 Set **Enable**(`NVIC_EnableIRQ()`), pending 설정은 ISPR이에요.", "틀림: ICER은 Clear Enable, 즉 disable(`NVIC_DisableIRQ()`)이에요."], "explain": "이름을 **S**et/**C**lear + **E**nable/**P**ending + **R**egister로 풀면 헷갈리지 않아요. ISER/ICER = enable/disable, ISPR/ICPR = pending 설정/해제, **IPR = 우선순위**예요. 'ICPR = 우선순위 해제'처럼 글자를 비튼 보기가 단골이에요."}, {"id": "e5-n07", "ch": 5, "type": "mcq", "cat": "concept", "level": 2, "sec": "4. NVIC — 외부 인터럽트 관리자", "q": "NVIC 동작에 대한 설명으로 **옳은 것을 2개 고르시오**.", "options": ["enable = 0인 IRQ는 요청이 와도 CPU가 ISR로 분기하지 않는다", "실행 중인 ISR보다 우선순위가 같거나 낮은 요청은 pending으로 기다렸다가 그 ISR이 끝나면 실행된다", "NVIC는 문맥 저장 없이 분기하므로 ISR 진입 비용이 전혀 없다", "RTD IP Layer에서 NVIC의 enable·우선순위 등록은 Siul2_Icu_Ip가 맡는다", "NMI도 일반 IRQ처럼 ICER로 끌 수 있다"], "answer": [0, 1], "pick": 2, "why": ["맞음: enable이 꺼져 있으면 ISR로 가지 않아요.", "맞음: 같거나 낮은 우선순위는 pending으로 대기했다가 끝나면 실행돼요.", "틀림: 진입마다 레지스터 8개를 스택에 저장·복원하는 비용이 있어요. 그래서 ISR은 짧아야 해요.", "틀림: NVIC 등록은 IP = IntCtrl_Ip, MCAL = Platform이에요. Siul2_Icu_Ip는 채널·edge·콜백 담당이에요.", "틀림: NMI는 막을 수 없는(Non-Maskable) 별도 입력이에요."], "explain": "NVIC는 IRQ마다 **enable · pending · priority**를 보고 판단해요. 꺼져 있으면 무시, 더 높으면 즉시 분기, 같거나 낮으면 **pending**으로 대기해요. 빠르지만 **공짜는 아니고**(문맥 저장), RTD에선 **IntCtrl_Ip / Platform**이 등록을 대신해요."}, {"id": "e5-n08", "ch": 5, "type": "short", "cat": "api", "level": 1, "sec": "4. NVIC — 외부 인터럽트 관리자", "q": "RTD를 쓰지 않고 CMSIS로 NVIC를 직접 설정한다면, **IPR** 레지스터에 IRQ의 **우선순위**를 써 넣는 함수의 이름은? (RTD에서는 IntCtrl_Ip / Platform 생성 코드가 이 일을 대신한다)", "accept": ["NVIC_SetPriority", "NVIC_SetPriority()"], "model": "`NVIC_SetPriority`", "explain": "IPR(Interrupt Priority Register)은 **`NVIC_SetPriority()`** 로 설정해요. 개별 허용은 `NVIC_EnableIRQ()`(ISER), pending은 `NVIC_SetPendingIRQ()`(ISPR)예요. 실습에선 Config Tools에서 Priority 10을 고르면 `IntCtrl_Ip_Init()` / `Platform_Init()`이 이 일을 해 줘요."}, {"id": "e5-n09", "ch": 5, "type": "mcq", "cat": "calc", "level": 2, "sec": "5. SIUL2 EIRQ와 RTD ICU", "q": "S32K312의 SIUL2 EIRQ 32채널은 8개씩 OR로 묶여 NVIC 벡터 4개를 공유한다. USER_SW0(PTB26) = **EIRQ13**과 **같은 NVIC 벡터(SIUL_1_IRQn)** 를 공유하는 채널을 **2개 고르시오**.", "options": ["EIRQ 7", "EIRQ 8", "EIRQ 15", "EIRQ 16", "EIRQ 21"], "answer": [1, 2], "pick": 2, "why": ["틀림: 7은 0~7 묶음(IRQ_07_00)이라 다른 벡터예요.", "맞음: 8은 8~15 묶음(IRQ_15_08)의 첫 채널이에요.", "맞음: 15는 8~15 묶음의 마지막 채널이에요.", "틀림: 16은 16~23 묶음(IRQ_23_16)의 첫 채널이에요.", "틀림: 21은 16~23 묶음이에요."], "explain": "묶음 번호는 **채널 ÷ 8의 몫**이에요. 13 ÷ 8 = 1 → **SIUL_1_IRQn**(IRQ_15_08)이고, 몫이 1인 채널은 **8~15**예요. 그래서 ISR 이름도 채널 번호가 아니라 범위인 `SIUL2_EXT_IRQ_8_15_ISR`이고, RTD ISR이 원인 채널을 확인한 뒤 콜백을 불러요."}, {"id": "e5-n10", "ch": 5, "type": "mcq", "cat": "concept", "level": 2, "sec": "5. SIUL2 EIRQ와 RTD ICU", "q": "S32K3 SIUL2 외부 인터럽트 경로에서 핀 전압 변화가 NVIC 요청이 되기까지의 순서로 **옳은 것**은?", "options": ["Pads → Glitch filter → Edge detection(IREE/IFEE) → EIF 플래그 → Interrupt enable(EIRE) → OR → NVIC", "Pads → Edge detection(IREE/IFEE) → Glitch filter → Interrupt enable(EIRE) → EIF 플래그 → OR → NVIC", "Pads → Interrupt enable(EIRE) → Glitch filter → EIF 플래그 → Edge detection(IREE/IFEE) → OR → NVIC", "Pads → OR → Glitch filter → Edge detection(IREE/IFEE) → EIF 플래그 → Interrupt enable(EIRE) → NVIC"], "answer": [0], "pick": 1, "why": ["맞음: 잡음 제거 → edge 선택 → 플래그 기록 → 켜진 채널만 통과 → 8개씩 OR → NVIC 순서예요.", "틀림: 잡음 펄스를 먼저 걸러야 하므로 Glitch filter가 Edge detection보다 앞이에요.", "틀림: enable은 플래그가 선 뒤 '켜진 채널만 위로 전달'하는 단계예요.", "틀림: OR은 8채널을 묶어 NVIC로 보내는 마지막 단계예요."], "explain": "RM 그림은 아래 Pads에서 위로 읽어요. **Glitch filter**(IFE)가 짧은 잡음을 먼저 거르고(채터링 하드웨어 대책), **Edge detection**에서 rising(IREE)/falling(IFEE)을 고르고, **EIF** 플래그가 기록된 뒤 **EIRE**가 켜진 채널만 올려 보내고, 8개씩 **OR**로 묶어 NVIC에 넘겨요."}, {"id": "e5-n11", "ch": 5, "type": "mcq", "cat": "concept", "level": 2, "sec": "6. ISR 작성 원칙과 volatile 공유 변수", "q": "ISR과 main loop가 공유하는 변수, 그리고 관련 도구에 대한 설명으로 **옳은 것**은?", "options": ["`volatile`은 값이 현재 코드 흐름 밖(ISR·하드웨어)에서 바뀔 수 있으니 매번 메모리에서 다시 읽으라고 컴파일러에 알린다", "`__DSB()`를 호출하면 그 뒤에 쓰는 변수는 volatile처럼 매번 메모리에서 읽힌다", "`volatile`을 붙이면 그 변수의 읽기·쓰기가 원자적이 되어 ISR과 main이 동시에 써도 안전하다", "`UserSw0_Callback()`은 RTD ISR 밖에서 따로 불리므로 ISR 작성 규칙을 따르지 않아도 된다"], "answer": [0], "pick": 1, "why": ["맞음: 그래서 레지스터 캐싱으로 ISR이 바꾼 값을 놓치는 일을 막아요.", "틀림: DSB/ISB는 메모리 접근·명령 실행의 순서를 강제하는 배리어로, volatile과 다른 도구예요.", "틀림: volatile은 '다시 읽기'만 보장하고 원자성은 보장하지 않아요.", "틀림: 콜백은 RTD ISR 안에서 불리므로 ISR과 같은 규칙(짧게)을 지켜야 해요."], "explain": "컴파일러는 ISR이 변수를 바꾸는 걸 모르니, volatile이 없으면 루프에서 값을 **레지스터에 캐싱**할 수 있어요. volatile은 **매번 메모리에서 읽기**만 보장하고 원자성은 아니에요(이 실습은 ISR만 쓰고 main은 읽기만 해서 안전). `__DSB()`/`__ISB()`는 **순서 강제 배리어**예요."}, {"id": "e5-n12", "ch": 5, "type": "mcq", "cat": "read", "level": 3, "sec": "7. 버튼 채터링과 디바운싱", "q": "다음 디바운스 함수에 1 ms tick 기준으로 tick **1000, 1004, 1200, 1203, 1400**에서 차례로 rising edge가 들어왔다(사람은 약 0.2초 간격으로 **3번** 눌렀고, 1004·1203은 채터링). `s_last`와 `g_press_count`는 0에서 시작한다. `DEBOUNCE_TICKS`가 **50**일 때와 **300**일 때의 최종 `g_press_count`는 각각?\n```c\nstatic uint32_t s_last = 0U;\n\nvoid OnEdge(uint32_t now)\n{\n    if ((now - s_last) < DEBOUNCE_TICKS) { return; }\n    s_last = now;\n    g_press_count++;\n}\n```", "options": ["50일 때 3, 300일 때 3", "50일 때 3, 300일 때 2", "50일 때 5, 300일 때 2", "50일 때 2, 300일 때 3", "50일 때 3, 300일 때 1"], "answer": [1], "pick": 1, "why": ["틀림: 300이면 1200이 1000과 200밖에 차이 나지 않아 진짜 눌림인데도 무시돼요.", "맞음: 50 → 1000·1200·1400 인정(3). 300 → 1000 인정, 1200(차 200)·1203 무시, 1400(차 400) 인정(2).", "틀림: 50이어도 1004(차 4)와 1203(차 3)은 채터링으로 무시돼요.", "틀림: 두 값을 바꾼 보기예요. 무시 구간이 길수록 카운트가 줄어요.", "틀림: 1400은 마지막 인정(1000)과 400 차이라 300일 때도 인정돼요."], "explain": "`DEBOUNCE_TICKS`가 50이면 채터링(1004, 1203)만 걸러져 사람이 누른 횟수 **3**과 같아요. 300으로 너무 크게 잡으면 0.2초 뒤의 **진짜 눌림(1200)까지 무시**돼 **2**가 돼요. 채터링이 남으면 늘리고, 연타가 씹히면 줄이는 게 조절 원칙이에요."}, {"id": "e5-n13", "ch": 5, "type": "mcq", "cat": "read", "level": 3, "sec": "7. 버튼 채터링과 디바운싱", "q": "1 ms마다 1씩 증가하는 32비트 tick이 최댓값을 넘어 0으로 돌아가는 순간 근처다. `DEBOUNCE_TICKS`는 20U, `s_last`는 **0xFFFFFFF0U**(마지막으로 인정한 눌림), `g_press_count`는 0이다. 이어서 `now` = **0xFFFFFFF8U, 0x00000002U, 0x00000010U** 순서로 `OnEdge()`가 불렸다면 최종 `g_press_count`와 `s_last`는?\n```c\n#define DEBOUNCE_TICKS  20U\nstatic uint32_t s_last = 0xFFFFFFF0U;\n\nvoid OnEdge(uint32_t now)\n{\n    if ((now - s_last) < DEBOUNCE_TICKS) { return; }\n    s_last = now;\n    g_press_count++;\n}\n```", "options": ["count 1, s_last 0x00000010", "count 2, s_last 0x00000010", "count 0, s_last 0xFFFFFFF0", "count 3, s_last 0x00000010"], "answer": [0], "pick": 1, "why": ["맞음: 차이가 8, 18(무시), 32(인정)라서 마지막 edge만 인정돼요.", "틀림: 0x00000002 − 0xFFFFFFF0 은 부호 없는 뺄셈으로 18이라 20보다 작아 무시돼요.", "틀림: 0x00000010 − 0xFFFFFFF0 = 32 ≥ 20이라 인정돼요. now가 s_last보다 '작아 보여도' 차이는 올바르게 나와요.", "틀림: 0xFFFFFFF8은 s_last와 8 차이로 채터링 구간이에요."], "explain": "`now - s_last`를 **uint32_t 뺄셈**으로 하면 0으로 돌아간 뒤에도 2^32를 법으로 계산돼 차이가 올바르게 나와요: 8, 18, **32**. 그래서 세 번째만 인정돼 `g_press_count` = 1, `s_last` = 0x00000010이에요. 무시된 edge는 `s_last`를 바꾸지 않는다는 점도 같이 확인하세요."}, {"id": "e5-n14", "ch": 5, "type": "mcq", "cat": "error", "level": 2, "sec": "7. 버튼 채터링과 디바운싱", "q": "버튼을 한 번 눌렀는데 LCD 카운트가 **3씩** 오른다. 원인을 채터링으로 보았을 때 **적절한 조치를 2개 고르시오**.", "options": ["콜백 안의 `DEBOUNCE_TICKS` 값을 늘린다", "SIUL2의 Glitch filter(IFE)를 켜서 짧은 펄스를 핀 단에서 거른다", "`DEBOUNCE_TICKS` 값을 줄여 판단을 더 빠르게 한다", "Activation condition을 rising과 falling 양쪽으로 바꾼다", "IntCtrl_Ip에서 SIUL_1_IRQn의 Priority를 10에서 0으로 바꾼다"], "answer": [0, 1], "pick": 2, "why": ["맞음: 무시 구간이 길어져 첫 edge 뒤의 튐이 걸러져요.", "맞음: 하드웨어 필터는 CPU 부담 없이 짧은 잡음 펄스를 제거해요.", "틀림: 무시 구간이 짧아져 채터링이 오히려 더 많이 통과해요.", "틀림: 누름·뗌 모두에서 불려 카운트가 더 늘어나요.", "틀림: 우선순위는 선점 순서를 정할 뿐 edge 개수와 무관해요."], "explain": "한 번 눌렀는데 여러 번 세는 건 **채터링**(접점이 여러 번 붙었다 떨어짐)이에요. 대책은 소프트웨어 디바운스(**DEBOUNCE_TICKS 증가**)나 하드웨어 **Glitch filter**예요. 'DEBOUNCE_TICKS를 줄인다'는 반대 방향이라 단골 오답이에요."}, {"id": "e5-n15", "ch": 5, "type": "mcq", "cat": "concept", "level": 1, "sec": "8. 실습 개요 — 목표, 하드웨어, 두 가지 버전", "q": "5장 실습 보드(S32K312EVB-Q172) 하드웨어에 대한 설명으로 **옳지 않은 것**은?", "options": ["버튼은 SW5 = USER_SW0 = PTB26이고, 눌림 시 High가 되는 입력이다", "LED는 D13 = RGBLED0_RED = PTA29이고, Active High라 1을 쓰면 켜진다", "보드 매뉴얼상 SW5–PTB26 연결은 기본 Disabled라 0 Ω 연결을 활성화해야 한다", "버튼 입력은 USER_SW1(PTB19)을 EIRQ로 설정해 받는다", "IP 버전은 IntCtrl_Ip, MCAL 버전은 Platform으로 NVIC를 등록하고, 두 프로젝트는 생성 파일을 공유하지 않는다"], "answer": [3], "pick": 1, "why": ["틀림(옳은 설명): 눌림 = High라서 activation condition이 rising edge예요.", "틀림(옳은 설명): Active High라 `g_led_request`가 1이면 핀에 1을 써서 켜요.", "틀림(옳은 설명): 콜백이 안 불릴 때 소프트웨어보다 먼저 확인할 곳이에요.", "맞음(옳지 않은 설명): 이 실습은 USER_SW0(PTB26) = EIRQ13을 써요. USER_SW1(PTB19)은 쓰지 않아요.", "틀림(옳은 설명): NVIC 등록 담당이 계층마다 다르고, 두 프로젝트는 섞지 않아요."], "explain": "버튼 **SW5 / USER_SW0 / PTB26**(눌림 = High → rising), LED **D13 / RGBLED0_RED / PTA29**(Active High)를 세트로 외워요. 비슷한 번호의 **PTB19(USER_SW1)** 가 오답으로 나오고, **SW5–PTB26 연결이 기본 Disabled**라는 점도 실습 전 함정이에요."}, {"id": "e5-n16", "ch": 5, "type": "err", "cat": "error", "level": 2, "sec": "9. IP Layer 설정 — Pins · Port · ICU · IntCtrl", "q": "IP Layer 실습에서 Siul2_Icu_Ip 채널 13의 Activation condition만 **Falling edge**로 잘못 설정하고, 나머지(EIRQ[13], Notification, IntCtrl_Ip, 콜백·루프 코드)는 수업 그대로 했다. SW5를 **2초 동안 누르고 있다가 뗐다**(채터링 없음). 어떻게 되는가?\n```c\nvoid UserSw0_Callback(void)\n{\n    g_press_count++;\n    g_led_request ^= 1U;\n}\n/* main 루프 */\nfor (;;) {\n    Siul2_Dio_Ip_WritePin(IP_LED_PORT, IP_LED_PIN,\n                          (g_led_request != 0U) ? 1U : 0U);\n}\n```", "answer": 1, "why": ["틀림: 누르는 순간은 Low→High, 즉 rising edge라 falling 설정에선 반응하지 않아요.", "맞음: 손을 떼는 순간 High→Low falling edge가 한 번 생겨 콜백이 한 번 불려요.", "틀림: 인터럽트 경로는 모두 열려 있고 edge 방향만 바뀌었어요.", "틀림: 그건 rising·falling 양쪽을 켰을 때예요."], "outcomes": ["누르는 순간 LED가 토글되고 카운트가 1 오른다", "누르고 있는 2초 동안은 변화가 없고, 손을 떼는 순간 LED가 토글되고 카운트가 1 오른다", "콜백이 전혀 불리지 않는다", "누를 때와 뗄 때 한 번씩, 모두 2번 토글된다"], "reasons": ["Falling edge 설정에서는 Notification이 자동으로 꺼진다", "SW5는 눌림 시 High인 입력이라, 뗄 때 High → Low falling edge가 생긴다", "SW5는 눌림 시 Low인 입력이라, 누를 때 falling edge가 생긴다", "Falling edge는 NVIC 우선순위가 낮아서 늦게 처리된다"], "reason": 1, "rwhy": ["틀림: edge 조건과 Notification 허용은 서로 다른 설정이에요.", "맞음: 눌림 = High이므로 falling edge는 '뗄 때' 생겨요. 그래서 실습은 rising edge를 골라요.", "틀림: SW5는 눌림 시 High예요(Active High 입력).", "틀림: edge 방향은 NVIC 우선순위와 관계없어요."], "explain": "Activation condition은 '핀의 **어떤 변화**를 사건으로 볼지'예요. SW5는 **눌림 = High**라 누르는 순간이 rising, 떼는 순간이 falling이에요. falling으로 잘못 고르면 동작은 하지만 **뗄 때** 반응하는 오동작이 돼요."}, {"id": "e5-n17", "ch": 5, "type": "mcq", "cat": "api", "level": 2, "sec": "11. MCAL Layer 설정 — Port · Dio · Icu · Platform", "q": "MCAL Layer 실습의 Icu·Platform 설정에 대한 설명으로 **옳은 것**은?", "options": ["IcuHwInterruptConfigList의 ISR Name `SIUL2_0_IRQ_CH_13`은 Platform에 등록하는 NVIC 핸들러 이름이기도 하다", "IcuChannels의 Measurement mode는 `ICU_MODE_SIGNAL_EDGE_DETECT`, IcuSignalNotification은 `UserSw0_Callback`으로 설정한다", "ConfigTimeSupport가 VARIANT-PRE-COMPILE이므로 `Icu_Init()`에는 생성된 config 구조체의 주소를 꼭 넘겨야 한다", "EIRQ13은 SIUL2 instance 0의 채널이므로 Platform의 Interrupt Name은 `SIUL_0_IRQn`으로 등록한다"], "answer": [1], "pick": 1, "why": ["틀림: `SIUL2_0_IRQ_CH_13`은 Icu의 ISR Name 설정값일 뿐이고, NVIC 핸들러는 `SIUL2_EXT_IRQ_8_15_ISR`이에요.", "맞음: edge detection을 쓰고, 알림 함수 이름이 main.c의 콜백 이름이 돼요.", "틀림: PRE-COMPILE이면 config가 컴파일 때 고정돼 `Icu_Init(NULL_PTR)`처럼 NULL_PTR만 넘겨요.", "틀림: EIRQ13은 8~15 그룹이라 `SIUL_1_IRQn`이에요. instance 번호와 벡터 묶음 번호는 달라요."], "explain": "MCAL Icu는 ISR Name **SIUL2_0_IRQ_CH_13**, channel **13**, 이름 **USER_SW0**, **ICU_MODE_SIGNAL_EDGE_DETECT**, Notification **UserSw0_Callback**이에요. NVIC 쪽은 **Platform**에 **SIUL_1_IRQn → SIUL2_EXT_IRQ_8_15_ISR, Priority 10**을 등록해요. 'SIUL2_0'의 0을 벡터 번호로 착각하지 마세요."}, {"id": "e5-n18", "ch": 5, "type": "err", "cat": "error", "level": 3, "sec": "11. MCAL Layer 설정 — Port · Dio · Icu · Platform", "q": "MCAL Layer 실습에서 Icu의 다른 설정은 모두 맞게 했지만 **IcuOptionalApis > IcuEdgeDetectApi**를 **disabled**로 둔 채 Update Code를 했다. main.c는 수업 코드 그대로다. 빌드하면 어떻게 되는가?\n```c\nPlatform_Init(NULL_PTR);\nIcu_Init(NULL_PTR);\nIcu_EnableNotification(IcuConf_IcuChannel_USER_SW0);\nIcu_EnableEdgeDetection(IcuConf_IcuChannel_USER_SW0);\nLcd1602_Init(0x27);\n```", "answer": 3, "why": ["틀림: 코드가 부르는 API가 생성되지 않았어요.", "틀림: 호출 횟수와 관계없는 설정이에요.", "틀림: 실행 단계까지 가지 못해요.", "맞음: IcuEdgeDetectApi를 켜야 `Icu_EnableEdgeDetection()` API가 생성돼요. 꺼 두면 그 함수가 없어 빌드가 안 돼요."], "outcomes": ["빌드 성공, 버튼마다 정상 동작한다", "빌드 성공, 콜백이 두 번씩 불린다", "빌드 성공, 실행하면 HardFault로 멈춘다", "`Icu_EnableEdgeDetection`을 찾지 못해 빌드 오류가 난다"], "reasons": ["IcuEdgeDetectApi는 우선순위 설정 항목이라 끄면 콜백 순서만 바뀐다", "`Icu_EnableNotification()`은 `Icu_EnableEdgeDetection()`보다 나중에 불러야 한다", "VARIANT-PRE-COMPILE에서는 `Icu_Init(NULL_PTR)`을 쓸 수 없다", "IcuEdgeDetectApi = enabled여야 `Icu_EnableEdgeDetection()` API가 생성되는데, 꺼 두어 생성되지 않았다"], "reason": 3, "rwhy": ["틀림: 선택 API를 만들지 말지 정하는 항목이지 우선순위와 무관해요.", "틀림: 자료마다 순서가 달라도 둘 다 호출하면 돼요. 순서가 핵심이 아니에요.", "틀림: PRE-COMPILE이라서 오히려 NULL_PTR을 넘겨요.", "맞음: 선택(optional) API는 설정에서 켜야 생성되므로, 끄면 호출하는 쪽이 빌드 단계에서 막혀요."], "explain": "MCAL의 선택 API는 Config Tools에서 켜야 생성돼요. **IcuEdgeDetectApi = enabled**가 있어야 `Icu_EnableEdgeDetection()`이 생기므로, 꺼 두면 코드가 그 함수를 찾지 못해 **빌드 오류**예요. 3장의 DioFlipChannelApi ↔ `Dio_FlipChannel()`과 같은 패턴이에요."}, {"id": "e5-n19", "ch": 5, "type": "short", "cat": "api", "level": 2, "sec": "11. MCAL Layer 설정 — Port · Dio · Icu · Platform", "q": "MCAL Icu 설정에서 IcuChannels의 Name을 **USER_SW0**로 바꾸지 않고 교재처럼 기본 이름 **IcuChannel_0** 그대로 두었다. 이때 main.c에서 `Icu_EnableNotification()`에 넘겨야 하는 생성 채널 심볼은?", "accept": ["IcuConf_IcuChannel_IcuChannel_0"], "model": "`IcuConf_IcuChannel_IcuChannel_0`", "explain": "Config Tools에 적은 채널 이름이 그대로 C 심볼이 돼요: `IcuConf_IcuChannel_<이름>`. 이름이 USER_SW0면 `IcuConf_IcuChannel_USER_SW0`, 기본 이름 IcuChannel_0이면 **`IcuConf_IcuChannel_IcuChannel_0`**(교재 코드의 표기)이에요. 실제 심볼은 생성된 `Icu_PBcfg.h`로 확인해요."}, {"id": "e5-n20", "ch": 5, "type": "mcq", "cat": "api", "level": 1, "sec": "12. MCAL Layer main.c와 IP 비교", "q": "MCAL Layer 프로젝트(`chap05_interrupt_button_mcal`)의 main.c에 들어가면 **안 되는** 줄은?", "options": ["`Dio_WriteChannel(DioConf_DioChannel_LED_RED, (g_led_request != 0U) ? STD_HIGH : STD_LOW);`", "`Platform_Init(NULL_PTR);`", "`Siul2_Dio_Ip_WritePin(IP_LED_PORT, IP_LED_PIN, (g_led_request != 0U) ? 1U : 0U);`", "`Icu_EnableEdgeDetection(IcuConf_IcuChannel_USER_SW0);`", "`Lcd1602_Puts(line);`"], "answer": [2], "pick": 1, "why": ["틀림(들어감): MCAL에서 LED는 `Dio_WriteChannel()`로만 써요.", "틀림(들어감): MCAL의 NVIC 등록이에요.", "맞음(안 됨): IP Layer API예요. MCAL 프로젝트에 `Siul2_*_Ip` 헤더·API를 섞지 않아요.", "틀림(들어감): Notification과 함께 꼭 호출하는 edge 검출 시작이에요.", "틀림(들어감): 4장에서 복사한 lcd1602 모듈로, main loop에서 출력해요."], "explain": "두 계층은 **섞지 않아요**. MCAL 프로젝트에서 LED는 논리 채널 `Dio_WriteChannel(DioConf_DioChannel_LED_RED, STD_HIGH/STD_LOW)`로만 쓰고, 물리 port/pin을 쓰는 `Siul2_Dio_Ip_WritePin()`은 IP 프로젝트 전용이에요. 같은 하드웨어를 두 드라이버가 따로 설정하게 되기 때문이에요."}, {"id": "e5-n21", "ch": 5, "type": "err", "cat": "read", "level": 3, "sec": "13. 실행 확인, 보고서, 자주 발생하는 문제", "q": "문제 해결표의 \"LCD 갱신이 느림 → **값이 바뀔 때만** 갱신\"을 적용해 MCAL 루프를 다음처럼 바꿨다. `Lcd1602_Init()` 직후 2행은 비어 있다. 전원을 켠 뒤 버튼을 누르기 전과, 한 번 누른 뒤 LCD 2행은 어떻게 되는가?\n```c\nstatic uint32_t s_shown = 0U;          /* 마지막으로 LCD에 쓴 값 */\nchar line[17];\nfor (;;) {\n    Dio_WriteChannel(DioConf_DioChannel_LED_RED,\n        (g_led_request != 0U) ? STD_HIGH : STD_LOW);\n    if (g_press_count != s_shown) {\n        s_shown = g_press_count;\n        (void)snprintf(line, sizeof(line), \"Count: %04lu\",\n                       (unsigned long)s_shown);\n        Lcd1602_SetCursor(1U, 0U);\n        Lcd1602_Puts(line);\n    }\n}\n```", "answer": 1, "why": ["틀림: 처음 비교에서 0 != 0이 거짓이라 `Count: 0000`은 한 번도 쓰이지 않아요.", "맞음: 첫 누름으로 g_press_count가 1이 되면 비교가 참이 되어 그때 처음 `Count: 0001`을 써요.", "틀림: 값이 바뀌면 출력하므로 첫 누름 뒤에는 표시돼요.", "틀림: `%04lu`는 4자리 0 채움이라 `0001`이에요."], "outcomes": ["누르기 전 `Count: 0000`, 한 번 누른 뒤 `Count: 0001`", "누르기 전 비어 있음, 한 번 누른 뒤 `Count: 0001`", "누르기 전과 누른 뒤 모두 비어 있음", "누르기 전 비어 있음, 한 번 누른 뒤 `Count: 1`"], "reasons": ["`s_shown`이 `g_press_count`와 같은 0에서 시작해 첫 비교가 거짓이므로 초기값 0000을 쓸 기회가 없다", "`s_shown`에 volatile이 없어 ISR이 바꾼 값을 못 본다", "`snprintf()`는 main loop에서 쓸 수 없다", "`Lcd1602_SetCursor(1U, 0U)`는 1행을 가리킨다"], "reason": 0, "rwhy": ["맞음: 고치려면 `s_shown`을 0xFFFFFFFFU처럼 나올 수 없는 값으로 시작하거나 루프 전에 한 번 출력해요.", "틀림: `s_shown`은 main만 쓰는 변수라 volatile이 필요 없어요. ISR과 공유하는 `g_press_count`는 이미 volatile이에요.", "틀림: 출력·포맷은 main loop가 담당하는 일이에요.", "틀림: 행 인덱스 1은 2행이에요."], "explain": "'바뀔 때만 갱신'은 루프를 가볍게 하는 올바른 개선이지만, 비교 기준 `s_shown`의 **초기값**이 카운트 초기값(0)과 같으면 처음 화면을 한 번도 그리지 않아요. 동작은 하지만 시작 화면이 빈 **오동작**이에요. `s_shown = 0xFFFFFFFFU`로 시작하면 첫 바퀴에 `Count: 0000`이 나와요."}, {"id": "e5-n22", "ch": 5, "type": "err", "cat": "error", "level": 2, "sec": "13. 실행 확인, 보고서, 자주 발생하는 문제", "q": "IP Layer 루프의 LED 줄을 다음처럼 작성했다(콜백은 수업 코드 그대로, 채터링 없음). 전원을 켠 직후와 버튼을 누를 때 D13(RGBLED0_RED)은 어떻게 되는가?\n```c\nfor (;;) {\n    Siul2_Dio_Ip_WritePin(IP_LED_PORT, IP_LED_PIN,\n                          (g_led_request != 0U) ? 0U : 1U);\n}\n```", "answer": 2, "why": ["틀림: g_led_request = 0일 때 1을 쓰므로 시작부터 켜져요.", "틀림: 요청이 0일 때 1을 쓰므로 켜지는 순간이 있어요.", "맞음: 0회 누름 → 핀 1(켜짐), 1회 → 0(꺼짐), 2회 → 1… 토글은 되지만 상태가 반대예요.", "틀림: 삼항 연산자 인자는 문법상 문제없어요."], "outcomes": ["전원 직후 꺼져 있고, 누를 때마다 정상 토글된다", "LED가 한 번도 켜지지 않는다", "전원 직후부터 켜져 있고, 누를 때마다 토글된다(정상과 반대 상태)", "컴파일 오류가 난다"], "reasons": ["D13을 Active Low로 착각해 요청 0일 때 1을 쓰게 했지만, D13은 Active High라 1이 켜짐이다", "`Siul2_Dio_Ip_WritePin()`은 세 번째 인자로 0U만 받을 수 있다", "콜백이 LED를 직접 써야 하는데 main에서 써서 늦게 반영된다", "`g_led_request`에 volatile이 있어 값이 반대로 읽힌다"], "reason": 0, "rwhy": ["맞음: 문제 해결표의 'LED가 반대로 동작 → active high/low 혼동'이에요.", "틀림: 0U/1U 모두 쓸 수 있어요.", "틀림: LED 쓰기는 원래 main loop에서 하는 게 수업 방식이에요.", "틀림: volatile은 매번 메모리에서 읽게 할 뿐 값을 바꾸지 않아요."], "explain": "D13/RGBLED0_RED는 **Active High**라 `g_led_request`가 1일 때 **1**을 써야 켜져요. 식을 `? 0U : 1U`로 뒤집으면 토글은 되지만 시작부터 켜져 있는 **반대 동작**이 돼요. 문제 해결표의 'LED가 반대로 동작 = active high/low 혼동'이에요."}, {"id": "embedded-05-01", "ch": 5, "type": "mcq", "cat": "concept", "level": 1, "sec": "2. 폴링과 인터럽트", "q": "폴링(polling)과 인터럽트(interrupt)에 대한 설명으로 **옳은 것**은?", "options": ["인터럽트는 이벤트가 생기면 하드웨어가 CPU를 ISR로 분기시켜 즉각 반응한다", "폴링은 하드웨어가 CPU에 이벤트를 알려 주는 방식이다", "폴링은 이벤트가 드물면 확인을 멈추므로 CPU 효율이 높다", "인터럽트는 흐름이 동기적이어서 설계가 단순하고 명확하다"], "answer": [0], "why": ["슬라이드 표 그대로: 사건 발생 시 하드웨어가 ISR을 호출 → 즉각 반응, CPU 효율 상승.", "하드웨어가 알려 주는 쪽은 인터럽트예요. 폴링은 CPU가 루프에서 직접 반복해서 읽어요.", "폴링은 이벤트가 드물어도 계속 확인해야 해서 CPU를 낭비해요.", "장단점을 뒤집은 보기예요. 인터럽트는 흐름이 비동기라 설계가 까다로워요."], "explain": "폴링은 **CPU가 루프에서 상태를 반복 확인**해서 단순하지만 CPU를 낭비하고 늦게 반응할 수 있어요. 인터럽트는 **하드웨어가 CPU를 ISR로 분기**시켜 즉각 반응하지만 흐름이 비동기라 설계가 까다로워요. 장단점 칸을 서로 바꾼 보기가 단골 함정이에요.", "pick": 1}, {"id": "embedded-05-02", "ch": 5, "type": "mcq", "cat": "concept", "level": 2, "sec": "3. Cortex-M7 예외와 벡터 테이블", "q": "Cortex-M7의 예외 처리에 대한 설명으로 **옳지 않은 것**은?", "options": ["EXC_RETURN 특수값으로 복귀하면 푸시했던 레지스터가 자동으로 복원된다", "벡터 테이블 `__Vectors[]`의 0번 칸은 Reset 핸들러의 주소이다", "우선순위는 숫자가 작을수록 높다", "잘못된 주소 접근이나 정렬 오류가 나면 벡터 3(HardFault)으로 점프한다", "인터럽트가 발생하면 레지스터 8개를 자동으로 스택에 푸시한 뒤 핸들러를 실행한다"], "answer": [1], "why": ["복귀는 EXC_RETURN, 푸시한 레지스터는 자동 복원돼요.", "틀린 설명이라 정답이에요. 0번은 핸들러가 아니라 초기 스택 포인터(MSP) 값이고, Reset은 1번이에요.", "Cortex-M 우선순위는 숫자가 작을수록 높아요(실습 버튼은 10).", "슬라이드 사례: HardFault = 벡터 3.", "슬라이드 5.3: 진입 시 8개 레지스터 자동 푸시(R0~R3, R12, LR, PC, xPSR)."], "explain": "벡터 테이블은 칸 번호 = 예외 번호인 주소 배열이에요. **0번 = 초기 MSP**, 1번 = Reset, 2번 = NMI, **3번 = HardFault**, 16번부터 외부 IRQ예요. '0번 = Reset'은 대표 함정이에요.", "pick": 1}, {"id": "embedded-05-03", "ch": 5, "type": "mcq", "cat": "calc", "level": 2, "sec": "5. SIUL2 EIRQ와 RTD ICU", "q": "S32K312의 SIUL2 EIRQ 32채널은 8개씩 OR로 묶여 NVIC 벡터 4개(IRQ_07_00, IRQ_15_08, IRQ_23_16, IRQ_31_24)를 공유한다. 실습의 USER_SW0(PTB26)은 EIRQ**13**이다. 다른 버튼을 EIRQ **20**에 연결했다면 그 채널이 속하는 묶음은?", "options": ["IRQ_07_00", "IRQ_15_08", "IRQ_23_16", "IRQ_31_24"], "answer": [2], "why": ["채널 0~7 묶음이에요.", "EIRQ13(실습 버튼)이 속한 8~15 묶음(SIUL_1_IRQn)이에요. 20은 범위 밖이에요.", "20 ÷ 8 = 2 → 세 번째 묶음, 채널 16~23이에요.", "채널 24~31 묶음이에요."], "explain": "8개씩 묶이므로 묶음 번호 = 채널 ÷ 8(정수 나눗셈)이에요. EIRQ13은 13 ÷ 8 = 1 → 8~15 묶음 → **SIUL_1_IRQn**이고, EIRQ20은 20 ÷ 8 = 2 → **16~23(IRQ_23_16)** 이에요. 벡터를 공유하므로 RTD ISR이 어느 채널 플래그가 섰는지 확인한 뒤 콜백을 불러요.", "pick": 1}, {"id": "embedded-05-04", "ch": 5, "type": "mcq", "cat": "concept", "level": 1, "sec": "6. ISR 작성 원칙과 volatile 공유 변수", "q": "버튼 인터럽트 콜백 `UserSw0_Callback()` 안에서 **하지 말아야 할 일**을 **2개 고르시오**.", "options": ["디바운싱 조건(tick 차이) 확인", "`Lcd1602_Puts()`로 LCD에 문자열 출력", "`g_press_count++`로 카운터 증가", "`printf()`로 디버그 메시지 출력", "`g_led_request ^= 1U`로 LED 요청 플래그 토글"], "answer": [1, 3], "pick": 2, "why": ["슬라이드가 ISR에서 수행할 일로 든 항목이에요.", "I2C LCD 출력은 blocking I2C write를 여러 번 포함해 오래 걸려요 → ISR 밖에서.", "ISR에서 해도 되는 짧은 작업이에요.", "printf()는 느린 출력이라 ISR 밖(main loop)에서 해요.", "ISR에서 해도 되는 짧은 작업이에요(XOR 1 = 토글)."], "explain": "슬라이드 5.5는 버튼 ISR이 **디바운싱 조건 확인 · 카운터 증가 · LED 요청 플래그 토글** 정도만 하고, **LCD 출력과 printf()는 ISR 밖**에서 하라고 해요. 콜백도 RTD ISR 안에서 불리므로 같은 규칙이 적용돼요."}, {"id": "embedded-05-05", "ch": 5, "type": "err", "cat": "error", "level": 2, "sec": "6. ISR 작성 원칙과 volatile 공유 변수", "q": "ISR과 main이 함께 쓰는 플래그를 다음처럼 선언했다. 최적화를 켜고 빌드한 뒤 버튼을 누르면 어떻게 될 수 있는가?\n```c\nstatic uint8_t g_flag = 0U;      /* volatile 없음 */\n\nvoid UserSw0_Callback(void)       /* 버튼 edge 콜백 */\n{\n    g_flag = 1U;\n}\n\n/* main() 안 */\nwhile (g_flag == 0U) { }          /* 버튼 대기 */\nDio_WriteChannel(DioConf_DioChannel_LED_RED, STD_HIGH);\n```", "answer": 0, "why": ["콜백은 실행되지만 main 루프가 값을 레지스터에 캐싱하면 바뀐 값을 못 봐요.", "모든 이름이 정의돼 있어 링크 오류는 없어요.", "문법상 문제는 없어요. volatile은 선택 한정자예요.", "volatile이 없으면 정상 동작이 보장되지 않아요."], "outcomes": ["버튼을 눌러 콜백이 실행돼도 main이 변화를 보지 못해 계속 대기할 수 있다", "링크 오류(undefined reference)가 난다", "컴파일 오류가 난다", "버튼을 누르면 while을 빠져나와 LED가 켜진다(항상 정상)"], "reasons": ["while 본문이 비어 있으면 컴파일러가 반드시 무한 루프로 만든다", "컴파일러는 ISR이 g_flag를 바꾸는 것을 모르므로 루프에서 값을 한 번 읽어 재사용(레지스터 캐싱)할 수 있다", "static 변수는 ISR(콜백)에서 접근할 수 없다", "uint8_t 변수에는 1U 같은 unsigned 상수를 대입할 수 없다"], "reason": 1, "rwhy": ["본문이 비어 있어도 조건을 매번 다시 읽는다면 정상 탈출해요. 문제는 '다시 읽지 않을 수 있다'는 점이에요.", "슬라이드 5.5 사례 그대로예요. volatile은 '코드 흐름 밖에서 바뀔 수 있으니 매번 메모리에서 읽어라'는 표시예요.", "같은 파일 안의 함수라면 static 변수에 접근할 수 있어요. 수업 코드도 static volatile이에요.", "uint8_t에 1U 대입은 아무 문제 없어요."], "explain": "컴파일러는 main 코드만 보고 루프 안에서 `g_flag`를 바꾸는 줄이 없다고 판단해 **메모리를 다시 읽지 않을 수 있어요**. 그러면 ISR이 1을 써도 main은 옛값만 봐요. 그래서 수업 코드는 공유 변수를 `static volatile`로 선언해요. `__DSB()/__ISB()`는 순서 배리어라 volatile을 대신하지 못해요."}, {"id": "embedded-05-06", "ch": 5, "type": "err", "cat": "error", "level": 1, "sec": "10. IP Layer main.c", "q": "IP Layer 실습 main.c의 일부다. 빌드하면 어떻게 되는가?\n```c\nstatic volatile uint32_t g_press_count = 0U;\nstatic volatile uint8_t  g_led_request = 0U;\n\nvoid UserSw0_Callback(void)\n{\n    g_press_count++;\n    g_led_request ^= 1U;\n}\n\nint main(void)\n{\n    /* ... 클럭, 핀, ICU, IntCtrl 초기화 ... */\n    for (;;) {\n        Siul2_Dio_Ip_WritePin(IP_LED_PORT, IP_LED_PIN,\n                              g_led_state ? 1U : 0U);\n    }\n}\n```", "answer": 1, "why": ["변수 이름 오류는 링크 전에 컴파일러가 잡아요.", "선언되지 않은 식별자를 쓰면 컴파일 단계에서 오류예요.", "빌드가 되지 않으므로 실행할 수 없어요.", "빌드가 되지 않아요."], "outcomes": ["링크 오류", "컴파일 오류", "빌드 성공, LED가 버튼마다 토글", "빌드 성공, LED가 항상 꺼져 있음"], "reasons": ["volatile 변수는 콜백에서 `^=`로 수정할 수 없다", "`for (;;)` 무한 루프 뒤에 return이 없어서이다", "`g_led_state`는 선언된 적 없는 이름이다 — 선언된 변수는 `g_led_request`이다", "`Siul2_Dio_Ip_WritePin()`의 세 번째 인수에는 삼항 연산자를 쓸 수 없다"], "reason": 2, "rwhy": ["volatile 변수도 읽고 쓰기 모두 가능해요.", "main에서 return 생략은 오류가 아니에요.", "슬라이드·교재 원본 코드의 오타예요. `g_led_request`로 읽어야 해요.", "삼항 연산자는 값을 만드는 식이라 인수로 쓸 수 있어요(MCAL 버전도 사용)."], "explain": "루프의 `g_led_state`는 어디에도 선언되지 않았어요. 선언된 공유 변수는 `g_led_request`라서 그대로 치면 **컴파일 오류(undeclared identifier)** 예요. 고친 줄은 `Siul2_Dio_Ip_WritePin(IP_LED_PORT, IP_LED_PIN, (g_led_request != 0U) ? 1U : 0U);`예요."}, {"id": "embedded-05-07", "ch": 5, "type": "err", "cat": "error", "level": 2, "sec": "9. IP Layer 설정 — Pins · Port · ICU · IntCtrl", "q": "IP Layer 실습에서 Config Tools 설정(ICU 채널 13, Rising edge, Notification = UserSw0_Callback)은 맞게 했지만 main()을 다음처럼 작성했다. 빌드는 성공한다. 버튼(SW5)을 누르면 어떻게 되는가?\n```c\n(void)Siul2_Icu_Ip_Init(0U, &Siul2_Icu_Ip_0_Config_PB);\nSiul2_Icu_Ip_EnableInterrupt(0U, USER_SW0_ICU_CHANNEL);\nSiul2_Icu_Ip_EnableNotification(0U, US
