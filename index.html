ER_SW0_ICU_CHANNEL);\n/* IntCtrl_Ip_Init(&IntCtrlConfig_0); 를 빠뜨림 */\n\nfor (;;) {\n    Siul2_Dio_Ip_WritePin(IP_LED_PORT, IP_LED_PIN,\n                          (g_led_request != 0U) ? 1U : 0U);\n}\n```", "answer": 2, "why": ["ISR로 분기 자체가 일어나지 않으니 잘못된 주소 접근도 없어요.", "NVIC 등록이 빠져 인터럽트가 CPU까지 가지 못해요.", "SIUL2 채널은 요청을 내지만 NVIC에서 SIUL_1_IRQn이 허용·연결되지 않아 ISR→콜백이 실행되지 않아요.", "그건 rising·falling 양쪽 edge를 켰을 때(또는 채터링) 현상이에요."], "outcomes": ["HardFault로 멈춘다", "버튼마다 LED가 정상 토글된다", "콜백이 불리지 않아 LED가 바뀌지 않는다", "버튼 한 번에 카운트가 2씩 오른다"], "reasons": ["Siul2_Icu_Ip_EnableNotification()을 호출하지 않았다", "Siul2_Icu_Ip_Init()이 NVIC 등록까지 하므로 IntCtrl_Ip_Init()은 중복 호출이다", "ICU 채널을 falling edge로 설정했다", "NVIC에 SIUL_1_IRQn의 enable·우선순위·핸들러(SIUL2_EXT_IRQ_8_15_ISR) 등록이 되지 않았다"], "reason": 3, "rwhy": ["코드에 EnableNotification은 있어요.", "ICU 초기화는 채널·edge·콜백만 다뤄요. NVIC 등록은 IntCtrl_Ip 몫이에요.", "문제에서 Rising edge로 맞게 설정했어요.", "IP Layer에서 NVIC 등록은 IntCtrl_Ip(IntCtrl_Ip_Init) 담당이에요."], "explain": "경로는 **핀 → SIUL2 채널 → NVIC → RTD ISR → 콜백**이에요. ICU 3종은 SIUL2 채널까지만 열어 주고, NVIC 칸은 **`IntCtrl_Ip_Init(&IntCtrlConfig_0)`** 이 열어요(MCAL에선 `Platform_Init`). 하나라도 빠지면 그 뒤는 전부 조용해요."}, {"id": "embedded-05-08", "ch": 5, "type": "err", "cat": "error", "level": 2, "sec": "5. SIUL2 EIRQ와 RTD ICU", "q": "IP Layer main()에서 ICU 초기화를 다음처럼 했다(IntCtrl_Ip_Init 포함, 설정은 모두 정상). 버튼을 누르면 어떻게 되는가?\n```c\n(void)Siul2_Icu_Ip_Init(0U, &Siul2_Icu_Ip_0_Config_PB);\nSiul2_Icu_Ip_EnableInterrupt(0U, USER_SW0_ICU_CHANNEL);\nIntCtrl_Ip_Init(&IntCtrlConfig_0);\n```", "answer": 3, "why": ["함수 하나를 안 부른 것이라 문법 문제는 없어요.", "edge 조건은 Config Tools의 Rising edge 그대로예요.", "콜백 호출 허용(EnableNotification)이 빠졌어요.", "채널 인터럽트는 허용됐지만 콜백 호출이 허용되지 않았어요."], "outcomes": ["컴파일 오류가 난다", "누를 때와 뗄 때 모두 콜백이 불린다", "정상: 콜백이 불려 LED가 토글된다", "콜백 `UserSw0_Callback()`이 불리지 않아 LED·카운트가 변하지 않는다"], "reasons": ["`Siul2_Icu_Ip_EnableNotification()`을 호출하지 않아 RTD ISR이 콜백을 부르지 않는다", "`Siul2_Icu_Ip_SetActivationCondition()`을 호출하지 않아 edge 조건이 없다", "`EnableInterrupt`는 `IntCtrl_Ip_Init()` 뒤에 호출해야 한다", "IP Layer에서는 콜백을 main.c에 정의할 수 없다"], "reason": 0, "rwhy": ["EnableInterrupt = 채널 인터럽트 허용, EnableNotification = 콜백 호출 허용. 둘 다 켜야 콜백까지 도착해요.", "실습은 Config Tools의 Rising edge를 그대로 써서 SetActivationCondition을 호출하지 않아요.", "수업 코드도 ICU 3종 → IntCtrl_Ip_Init 순서예요.", "콜백 본체는 main.c에 같은 이름으로 정의해요."], "explain": "RTD ICU API는 **설정(Init) → 허용(EnableInterrupt) → 알림(EnableNotification)** 단계예요. EnableInterrupt만 켜면 인터럽트는 나지만 콜백은 안 불리고, EnableNotification만 켜면 애초에 인터럽트가 안 나요. **둘 다** 켜야 `UserSw0_Callback()`까지 도착해요."}, {"id": "embedded-05-09", "ch": 5, "type": "mcq", "cat": "api", "level": 2, "sec": "5. SIUL2 EIRQ와 RTD ICU", "q": "RTD Siul2_Icu_Ip API와 역할의 연결로 **옳은 것**은?", "options": ["`Siul2_Icu_Ip_Init()` — NVIC 우선순위 설정", "`Siul2_Icu_Ip_EnableNotification()` — edge 조건(rising/falling) 설정", "`Siul2_Icu_Ip_SetActivationCondition()` — edge 조건 설정", "`Siul2_Icu_Ip_EnableInterrupt()` — 콜백 호출 허용"], "answer": [2], "why": ["Init은 ICU 설정 초기화예요. NVIC 등록은 IntCtrl_Ip가 해요.", "EnableNotification은 콜백 호출 허용이에요.", "슬라이드 표: SetActivationCondition = edge 조건 설정.", "EnableInterrupt는 채널 인터럽트 허용이에요(두 Enable을 바꾼 함정)."], "explain": "슬라이드 5.4 표: **Init = ICU 설정 초기화, EnableInterrupt = 채널 인터럽트 허용, EnableNotification = 콜백 호출 허용, SetActivationCondition = edge 조건 설정**. 실습은 Config Tools에서 Rising edge를 정해 두어 main.c에선 SetActivationCondition을 부르지 않아요.", "pick": 1}, {"id": "embedded-05-10", "ch": 5, "type": "short", "cat": "api", "level": 1, "sec": "12. MCAL Layer main.c와 IP 비교", "q": "MCAL Layer 실습 main()의 초기화 부분이다. NVIC에 SIUL_1_IRQn(핸들러 SIUL2_EXT_IRQ_8_15_ISR, 우선순위 10)을 등록하는 빈칸 (A)의 함수 이름은?\n```c\nMcu_SetMode(0U);\nPort_Init(NULL_PTR);\nI2c_Init(NULL_PTR);\n(A)(NULL_PTR);\nIcu_Init(NULL_PTR);\nIcu_EnableNotification(IcuConf_IcuChannel_USER_SW0);\nIcu_EnableEdgeDetection(IcuConf_IcuChannel_USER_SW0);\nLcd1602_Init(0x27);\n```", "accept": ["Platform_Init", "Platform_Init()", "Platform_Init(NULL_PTR)"], "model": "`Platform_Init`", "explain": "MCAL에서 NVIC 등록은 **Platform** 드라이버가 맡아요(IP Layer의 `IntCtrl_Ip_Init(&IntCtrlConfig_0)` 자리). VARIANT-PRE-COMPILE이라 `NULL_PTR`만 넘겨요. 'Icu가 NVIC를 등록한다'는 오답이에요."}, {"id": "embedded-05-11", "ch": 5, "type": "short", "cat": "api", "level": 2, "sec": "10. IP Layer main.c", "q": "IP Layer 실습 main()에서 버튼 인터럽트 경로를 여는 부분이다. 빈칸 (A)에 들어갈 함수 이름은?\n```c\n(void)Siul2_Icu_Ip_Init(0U, &Siul2_Icu_Ip_0_Config_PB);\nSiul2_Icu_Ip_EnableInterrupt(0U, USER_SW0_ICU_CHANNEL);\n(A)(0U, USER_SW0_ICU_CHANNEL);   /* 콜백 호출 허용 */\nIntCtrl_Ip_Init(&IntCtrlConfig_0);\n```", "accept": ["Siul2_Icu_Ip_EnableNotification", "Siul2_Icu_Ip_EnableNotification()"], "model": "`Siul2_Icu_Ip_EnableNotification`", "explain": "ICU 초기화 3종은 **Init → EnableInterrupt → EnableNotification**이에요. EnableNotification이 있어야 인터럽트가 왔을 때 RTD ISR이 `UserSw0_Callback()`을 불러요. 그다음 `IntCtrl_Ip_Init()`이 NVIC를 등록해요."}, {"id": "embedded-05-12", "ch": 5, "type": "mcq", "cat": "read", "level": 2, "sec": "12. MCAL Layer main.c와 IP 비교", "q": "MCAL Layer 실습 코드다. 채터링 없이 버튼을 **5번** 누른 뒤 LCD 2행과 LED(D13, Active High) 상태는?\n```c\nstatic volatile uint32_t g_press_count = 0U;\nstatic volatile uint8_t  g_led_request = 0U;\n\nvoid UserSw0_Callback(void)\n{\n    g_press_count++;\n    g_led_request ^= 1U;\n}\n/* main 루프 */\nchar line[17];\nfor (;;) {\n    Dio_WriteChannel(DioConf_DioChannel_LED_RED,\n        (g_led_request != 0U) ? STD_HIGH : STD_LOW);\n    (void)snprintf(line, sizeof(line), \"Count: %04lu\",\n                   (unsigned long)g_press_count);\n    Lcd1602_SetCursor(1U, 0U);\n    Lcd1602_Puts(line);\n}\n```", "options": ["`Count: 0005`, LED OFF", "`Count: 5`, LED ON", "`Count: 0004`, LED ON", "`Count: 0005`, LED ON"], "answer": [3], "why": ["홀수 번 토글이면 g_led_request = 1이라 켜져요.", "%04lu는 4자리 0 채움이라 `0005`예요.", "카운터는 0에서 시작해 5번 증가하면 5예요.", "5번 증가 → 0005(%04lu), XOR 토글 5번 → 1 → STD_HIGH → Active High라 켜짐."], "explain": "`g_led_request ^= 1U`는 0↔1 토글이라 **홀수 번 누르면 1(LED ON), 짝수 번이면 0(OFF)** 이에요. `%04lu`는 4자리로 맞추고 빈자리를 0으로 채워서 `Count: 0005`가 돼요.", "pick": 1}, {"id": "embedded-05-13", "ch": 5, "type": "err", "cat": "read", "level": 3, "sec": "10. IP Layer main.c", "q": "IP Layer 콜백의 토글 줄을 다음처럼 바꿨다. 루프는 수업 코드(고친 버전) 그대로다. 버튼을 누를 때마다(채터링 없음) 어떻게 되는가?\n```c\nstatic volatile uint32_t g_press_count = 0U;\nstatic volatile uint8_t g_led_request = 0U;\n\nvoid UserSw0_Callback(void)\n{\n    g_press_count++;\n    g_led_request = ~g_led_request;   /* ^= 1U 대신 */\n}\n/* main 루프 */\nfor (;;) {\n    Siul2_Dio_Ip_WritePin(IP_LED_PORT, IP_LED_PIN,\n        (g_led_request != 0U) ? 1U : 0U);\n}\n```", "answer": 2, "why": ["첫 누름에 0xFF(≠0)가 되어 켜져요.", "uint8_t에 ~를 쓰는 건 문법상 문제없어요.", "값이 0 → 0xFF → 0x00 → 0xFF…로 바뀌고 루프는 '0이 아닌가'만 보므로 토글과 같아요.", "~0xFF를 uint8_t에 저장하면 0x00이 되어 다시 꺼져요."], "outcomes": ["LED가 한 번도 켜지지 않는다", "컴파일 오류가 난다", "정상: 누를 때마다 LED가 켜짐↔꺼짐으로 토글된다", "첫 누름 이후 LED가 계속 켜져 있다"], "reasons": ["~는 논리 부정이라 0이 아니면 항상 0이 된다", "uint8_t에 저장하면 ~0 → 0xFF, ~0xFF → 0x00이 되고, 루프가 `!= 0U`로 판단하므로 0/비0이 번갈아 나온다", "~는 int로 승격되어 -1이 되므로 한 번 켜지면 영원히 참이다", "~ 연산은 volatile 변수에 쓸 수 없다"], "reason": 1, "rwhy": ["~는 비트 반전이에요. 논리 부정은 !예요.", "승격 후 결과(0xFFFFFFFF / 0xFFFFFF00)가 uint8_t로 저장되면서 하위 8비트 0xFF / 0x00만 남아요.", "연산 중엔 int로 승격되지만 대입할 때 uint8_t로 잘려 0x00이 될 수 있어요.", "volatile 변수에도 모든 연산을 쓸 수 있어요."], "explain": "수업 코드는 `^= 1U`로 0↔1을 토글하지만, 루프가 `(g_led_request != 0U)`로 **0인지 아닌지만** 보기 때문에 0↔0xFF로 바뀌어도 LED는 똑같이 토글돼요. 반대로 `|= 1U`처럼 바꾸면 한 번 켜진 뒤 다시 꺼지지 않아요. 비트 연산 결과를 '조건식이 무엇을 보는지'와 함께 읽는 문제예요."}, {"id": "embedded-05-14", "ch": 5, "type": "mcq", "cat": "read", "level": 2, "sec": "10. IP Layer main.c", "q": "콜백을 다음처럼 잘못 작성했다. 채터링 없이 버튼을 **4번** 누른 뒤 `g_press_count` 값과 LED(Active High) 상태는?\n```c\nvoid UserSw0_Callback(void)\n{\n    g_press_count++;\n    g_led_request |= 1U;      /* ^= 1U 대신 */\n}\n/* 루프: WritePin(..., (g_led_request != 0U) ? 1U : 0U) */\n```", "options": ["4, LED OFF", "4, LED ON", "1, LED ON", "0, LED OFF"], "answer": [1], "why": ["원래 코드(^= 1U)라면 짝수 번이라 OFF지만, |= 1U는 끄지 못해요.", "카운터는 정상적으로 4번 증가하고, |= 1U는 첫 누름 이후 계속 1이라 LED가 켜진 채로 남아요.", "카운터 증가 줄은 그대로라 매번 1씩 올라요.", "콜백은 정상 호출되므로 카운터가 올라요."], "explain": "`|= 1U`는 비트를 **켜기만** 해요. 첫 누름에 1이 된 뒤에는 계속 1이라 LED가 꺼지지 않아요. 토글은 XOR(`^= 1U`)이에요(2장 비트 연산). 카운터 줄은 바뀌지 않았으니 `g_press_count`는 4예요.", "pick": 1}, {"id": "embedded-05-15", "ch": 5, "type": "mcq", "cat": "read", "level": 3, "sec": "7. 버튼 채터링과 디바운싱", "q": "슬라이드의 디바운스 두 줄을 넣은 함수다. `DEBOUNCE_TICKS`는 20이고 `s_last`는 0에서 시작한다. tick이 **100, 103, 107, 300, 302, 315, 321**일 때 차례로 rising edge가 들어와 `OnEdge()`가 불렸다면 최종 `g_press_count`는?\n```c\n#define DEBOUNCE_TICKS  20U\nstatic uint32_t s_last = 0U;\n\nvoid OnEdge(uint32_t now)\n{\n    if ((now - s_last) < DEBOUNCE_TICKS) { return; }\n    s_last = now;\n    g_press_count++;\n}\n```", "options": ["2", "3", "5", "7"], "answer": [1], "why": ["315는 300과 15 차이라 무시되지만, 321은 마지막 인정(300)과 21 차이라 인정돼요.", "100(인정) → 103·107 무시 → 300(인정) → 302·315 무시 → 321(321−300 = 21 ≥ 20, 인정) = 3.", "무시된 edge까지 일부 센 값이에요.", "디바운스가 없을 때(edge 7개 모두 인정)의 값이에요."], "explain": "비교 기준은 '직전 edge'가 아니라 **마지막으로 인정한 눌림 시각 `s_last`** 예요. 무시된 edge는 `s_last`를 갱신하지 않으므로 321은 300과 비교되어 21 ≥ 20 → 인정돼요. 채터링이 DEBOUNCE_TICKS보다 길게 이어지면 이렇게 여분의 카운트가 생기므로 조치는 **DEBOUNCE_TICKS 증가 또는 하드웨어(glitch) 필터**예요.", "pick": 1}, {"id": "embedded-05-16", "ch": 5, "type": "mcq", "cat": "read", "level": 2, "sec": "5. SIUL2 EIRQ와 RTD ICU", "q": "Siul2_Icu_Ip 채널 13의 Activation condition을 Rising edge가 아니라 **rising과 falling 양쪽(both edges)** 으로 설정했다. 콜백·루프는 수업 코드 그대로이고 채터링은 없다. SW5를 **3번 눌렀다 뗀** 뒤 `g_press_count`와 LED 상태는?", "options": ["3, LED OFF", "3, LED ON", "6, LED OFF", "6, LED ON"], "answer": [2], "why": ["카운트는 edge 수만큼 올라요.", "Rising edge만 설정했을 때의 결과예요.", "누를 때(rising)와 뗄 때(falling) 모두 콜백 → 6번 증가, 짝수 번 토글이라 0 → LED OFF.", "6번 토글하면 g_led_request는 0이에요."], "explain": "IREE(rising)와 IFEE(falling)를 둘 다 켜면 한 번 누르고 뗄 때 콜백이 **두 번** 불려 카운트가 2씩 올라요. LED는 누를 때 켜졌다가 뗄 때 꺼져 **바뀌지 않은 것처럼** 보여요. SW5는 눌림 시 High라서 실습 설정은 **Rising edge**예요.", "pick": 1}, {"id": "embedded-05-17", "ch": 5, "type": "mcq", "cat": "error", "level": 2, "sec": "6. ISR 작성 원칙과 volatile 공유 변수", "q": "다음 콜백 코드의 문제점을 **2개 고르시오**.\n```c\nuint32_t g_count = 0U;          /* main 루프도 읽음 */\n\nvoid UserSw0_Callback(void)\n{\n    g_count++;\n    Lcd1602_SetCursor(1U, 0U);\n    Lcd1602_Puts(\"pressed!\");\n}\n```", "options": ["main과 공유하는 `g_count`에 `volatile`이 없다", "콜백 안에서 blocking I2C write가 여러 번 들어가는 LCD 출력을 한다", "콜백의 반환형이 `void`라서 RTD ISR이 호출할 수 없다", "콜백 안에서 전역 변수를 증가시키면 안 된다", "`g_count`를 `uint32_t`가 아니라 `uint8_t`로 선언해야 한다"], "answer": [0, 1], "pick": 2, "why": ["ISR과 main이 함께 쓰는 변수는 volatile이어야 main이 바뀐 값을 봐요.", "LCD 출력은 오래 걸려 ISR(콜백) 밖, main loop에서 해야 해요.", "콜백 형식은 `void 함수(void)`가 맞아요.", "카운터 증가는 ISR에서 해도 되는 짧은 작업이에요.", "수업 코드도 카운터를 uint32_t로 선언해요. 형 크기는 문제가 아니에요."], "explain": "두 가지가 모두 틀렸어요. ① 공유 변수는 **volatile**이어야 해요. 안 그러면 main이 레지스터에 캐싱된 옛값을 볼 수 있어요. ② 콜백은 RTD ISR 안에서 실행되므로 **LCD 출력은 금지**예요. I2C LCD 출력은 blocking write를 여러 번 포함해 ISR을 길게 만들어요. ISR은 **사건만 기록**하고 표시는 main loop가 해요."}, {"id": "embedded-05-18", "ch": 5, "type": "err", "cat": "error", "level": 2, "sec": "9. IP Layer 설정 — Pins · Port · ICU · IntCtrl", "q": "Siul2_Icu_Ip의 Notification에는 `UserSw0_Callback`을 적고 Update Code를 했다. 그런데 main.c에는 다음처럼 정의했다. 빌드하면 어떻게 되는가?\n```c\n/* main.c */\nvoid UserSW0_Callback(void)     /* 대문자 W */\n{\n    g_press_count++;\n    g_led_request ^= 1U;\n}\n```", "answer": 1, "why": ["생성 코드가 참조하는 함수가 없으므로 빌드부터 실패해요.", "생성 config가 UserSw0_Callback의 주소를 참조하는데 그 정의가 어디에도 없어요.", "실행 파일이 만들어지지 않아요.", "C는 대소문자를 구분해 두 이름이 다른 함수예요."], "outcomes": ["빌드 성공, 버튼을 눌러도 아무 반응 없음", "링크 오류(정의되지 않은 참조: UserSw0_Callback)", "실행 중 HardFault", "빌드 성공, 버튼마다 정상 동작"], "reasons": ["Config Tools에 적은 콜백 이름은 런타임에 문자열로 찾으므로 대소문자를 무시한다", "콜백에서 volatile 변수를 수정했기 때문이다", "Notification 이름은 생성 코드에 콜백 주소(함수 포인터)로 들어가므로 main.c에 같은 이름의 함수 정의가 필요하다", "콜백 함수는 반드시 static으로 선언해야 한다"], "reason": 2, "rwhy": ["이름은 컴파일·링크 시점의 심볼이에요. C 심볼은 대소문자를 구분해요.", "volatile 수정은 문제가 아니에요.", "Notification에 적은 이름이 생성 config 안 함수 포인터가 돼요. 정의가 없으면 링커가 찾지 못해요.", "static으로 하면 오히려 다른 파일(생성 코드)에서 참조할 수 없어요."], "explain": "Config Tools의 Notification 이름은 생성 코드 안에 **콜백 주소**로 들어가요. 그래서 main.c에 `void UserSw0_Callback(void)`를 **정확히 같은 이름**으로 정의해야 해요. 철자가 다르면 그 심볼의 정의가 없어서 **링크 오류(undefined reference)** 가 나요(6장 Adc1_Callback도 같은 규칙)."}, {"id": "embedded-05-19", "ch": 5, "type": "short", "cat": "calc", "level": 2, "sec": "11. MCAL Layer 설정 — Port · Dio · Icu · Platform", "q": "MCAL Layer 실습에서 LED(PTA29)를 Dio 채널 LED_RED로 만든다. Dio Port Id가 1(PTA[31:16], 상위 절반)일 때 Dio Channel Id에 넣을 값은? (숫자만)", "accept": ["13", "13U"], "model": "`13`", "explain": "Dio Port Id 1은 PTA의 위쪽 절반 PTA[31:16]이고, PTA29는 그 안에서 **29 − 16 = 13**번째예요. '29'를 그대로 쓰는 게 함정이에요. 생성 후 `Dio_Cfg.h`에 `DioConf_DioChannel_LED_RED`가 생겨요."}, {"id": "embedded-05-20", "ch": 5, "type": "short", "cat": "api", "level": 2, "sec": "9. IP Layer 설정 — Pins · Port · ICU · IntCtrl", "q": "IntCtrl_Ip(또는 MCAL Platform)에서 SW5(PTB26, EIRQ13)용으로 **SIUL_1_IRQn**에 연결하는 RTD 제공 핸들러(ISR) 이름은?", "accept": ["SIUL2_EXT_IRQ_8_15_ISR"], "model": "`SIUL2_EXT_IRQ_8_15_ISR`", "explain": "EIRQ13은 8~15 공유 묶음이라 핸들러 이름에도 채널 번호가 아니라 **범위 8_15**가 들어가요. 이 RTD ISR이 어느 채널이 불렀는지 확인한 뒤 `UserSw0_Callback()`을 불러요. MCAL Icu의 `SIUL2_0_IRQ_CH_13`은 ICU ISR Name 설정값이지 NVIC 핸들러가 아니에요."}, {"id": "embedded-05-21", "ch": 5, "type": "mcq", "cat": "api", "level": 2, "sec": "12. MCAL Layer main.c와 IP 비교", "q": "MCAL Layer 실습 main()의 초기화 순서로 **옳은 것**은? (클럭 초기화 Mcu_* 는 끝났다고 가정)", "options": ["`Port_Init` → `I2c_Init` → `Platform_Init` → `Icu_Init` → `Icu_EnableNotification`·`Icu_EnableEdgeDetection` → `Lcd1602_Init`", "`Lcd1602_Init` → `I2c_Init` → `Port_Init` → `Icu_Init` → `Platform_Init`", "`Icu_Init` → `Icu_EnableEdgeDetection` → `Port_Init` → `Platform_Init` (Notification은 불필요)", "`Icu_EnableNotification` → `Icu_Init` → `Port_Init` → `Platform_Init`"], "answer": [0], "why": ["슬라이드 p.45 코드 순서 그대로예요.", "LCD 초기화가 I2C 초기화보다 먼저면 안 돼요(4장 경고).", "Notification이 없으면 콜백이 불리지 않아요. 둘 다 필수예요.", "Init 전에 Enable을 부르는 보기예요. 설정을 먼저 적용해야 해요."], "explain": "초기화는 '**의존하는 것이 먼저**'예요: 클럭 → 핀(Port) → I2C → NVIC 등록(Platform) → Icu_Init → Notification·EdgeDetection → LCD → 루프. Notification/EdgeDetection의 둘 사이 순서는 자료마다 다르지만 **둘 다 호출**해야 한다는 게 핵심이에요.", "pick": 1}, {"id": "e6-n01", "ch": 6, "type": "mcq", "cat": "calc", "level": 2, "sec": "1. ADC의 역할 — 양자화·분해능·LSB", "q": "Vref가 **5.0 V(5000 mV)**인 ADC에서 이 과목의 LSB 식(1 LSB = Vref / 최대 code, 12-bit면 Vref / 4095)을 쓴다. 분해능을 **12-bit에서 14-bit**로 바꾸면 단계 수와 1 LSB 크기는?", "options": ["8192단계, 약 0.610 mV", "16384단계, 약 0.305 mV", "16384단계, 약 4.884 mV", "4096단계, 약 1.221 mV"], "answer": [1], "pick": 1, "why": ["틀림: 8192단계는 13-bit(2¹³)예요. 2비트가 늘면 단계는 4배가 돼요.", "맞음: 2¹⁴ = 16384단계, 최대 code 16383 → 5000 / 16383 ≈ 0.305 mV예요.", "틀림: 단계가 4배가 되면 LSB는 4배 커지는 게 아니라 약 1/4로 작아져요.", "틀림: 12-bit 그대로일 때의 값이에요(5000 / 4095 ≈ 1.221 mV)."], "explain": "14-bit는 2¹⁴ = **16384단계**(12-bit의 4배), code 0~16383이라 1 LSB = 5000 / 16383 ≈ **0.305 mV**예요. 단계가 늘면 칸이 촘촘해져 LSB는 작아져요. 이 \"4배\"가 분해능 기본값(14-bit) 함정에서 전압이 약 4배로 보이는 이유와 같은 숫자예요."}, {"id": "e6-n02", "ch": 6, "type": "short", "cat": "calc", "level": 2, "sec": "1. ADC의 역할 — 양자화·분해능·LSB", "q": "실제 기준전압이 **3.3 V**인 보드에 맞추려고 환산 줄을 다음처럼 바꿨다. `filtered`(uint16_t)가 **1000**일 때 `mv`(uint32_t)의 값은? (정수, 숫자만)\n```c\nmv = ((uint32_t)filtered * 3300U) / 4095U;\n```", "accept": ["805", "805mV"], "model": "805", "explain": "1000 × 3300 = 3,300,000이고 ÷ 4095 = 805.86…이에요. C의 정수 나눗셈은 소수점을 **버리므로** 반올림한 806이 아니라 **805**예요. 곱셈을 먼저 하고 나눗셈을 나중에 하는 순서라 정밀도가 지켜져요."}, {"id": "e6-n03", "ch": 6, "type": "mcq", "cat": "concept", "level": 1, "sec": "2. S32K3 ADC 모듈과 블록 구조", "q": "S32K312 ADC 모듈과 블록 구조에 대한 설명으로 **옳지 않은 것**은?", "options": ["S32K312에는 ADC0와 ADC1 두 개의 ADC가 있고, 각 채널은 특정 핀에 매핑된다", "변환 모드에는 단발·연속·트리거가 있고, 트리거 소스로 eMIOS·BCTU가 있다", "변환 제어 블록은 SAMPLE → AVERAGING → COMPARE 순서로 동작한다", "MCR[AVGEN]이 켜져 있으면 2^(2+MCR[AVGS])회 변환한 값을 평균한다", "이 장의 변환 방식은 Software triggered one-shot이다"], "answer": [2], "pick": 1, "why": ["틀림(옳은 설명): S32K312에는 ADC0 / ADC1이 있고 가변저항은 ADC1이에요.", "틀림(옳은 설명): 단발 / 연속 / 트리거(eMIOS · BCTU)예요.", "맞음(옳지 않은 설명): 블록도 순서는 SAMPLE → COMPARE → AVERAGING이에요. 비교(변환)한 결과들을 평균해요.", "틀림(옳은 설명): 블록도 식 그대로예요. 01b면 8회예요.", "틀림(옳은 설명): 이 장은 소프트웨어가 시작하는 단발 변환이에요(p.25)."], "explain": "블록도 오른쪽 위의 변환 제어는 **SAMPLE(샘플-홀드) → COMPARE(SAR 비교, 분해능 RESN) → AVERAGING** 순서예요. 평균은 비교로 얻은 code들을 모아 내는 단계라 비교보다 먼저 올 수 없어요. 순서 배열 문제에서 평균을 앞에 둔 보기가 대표 함정이에요."}, {"id": "e6-n04", "ch": 6, "type": "mcq", "cat": "api", "level": 2, "sec": "2. S32K3 ADC 모듈과 블록 구조", "q": "S32K3 ADC 레지스터 필드와 역할의 짝으로 옳은 것을 **2개** 고르면?", "options": ["평균 횟수 선택 — CALBISTREG[NR_SMPL]", "분해능 선택 — CALBISTREG[RESN]", "변환 결과 저장 — MCR[AVGS]", "결과 정렬(우측/좌측) — MCR[WLSIDE]", "하드웨어 평균 켜기 — CALBISTREG[AVG_EN]"], "answer": [1, 3], "pick": 2, "why": ["틀림: NR_SMPL은 **보정용** 평균 필드예요. 일반 변환 평균 횟수는 MCR[AVGS]예요.", "맞음: RESN이 14·12·10·8-bit를 고르고, 001b = 12-bit예요.", "틀림: AVGS는 평균 횟수 코드예요. 결과는 PCDRk[CDATA]에 저장돼요.", "맞음: WLSIDE=0이면 [14:0] 우측, 1이면 [15:1] 좌측 정렬이에요.", "틀림: AVG_EN도 **보정용**(DoCalibration이 32회로 설정)이에요. 일반 평균 켜기는 MCR[AVGEN]이에요."], "explain": "짝은 **분해능 = CALBISTREG[RESN]**, **정렬 = MCR[WLSIDE]**, **평균 = MCR[AVGEN] / MCR[AVGS]**, **결과 = PCDRk[CDATA]**예요. CALBISTREG[AVG_EN] / [NR_SMPL]은 보정 평균이라 별개이고, `Adc_Sar_Ip_DoCalibration()`이 32회로 직접 설정해요."}, {"id": "e6-n05", "ch": 6, "type": "mcq", "cat": "concept", "level": 1, "sec": "3. 핀이 곧 채널 — PTA11 = ADC1_S10", "q": "보드 가변저항 전압이 ADC 채널에 이르는 경로와 설정에 대한 설명으로 **옳지 않은 것**은?", "options": ["ADC 채널은 소프트웨어에서 정하므로, ADC0의 아무 빈 채널로 설정해도 가변저항을 읽을 수 있다", "보드 가변저항(10K)의 출력 전압 범위는 0 V ~ VDD_HV_A_PERH이다", "보드 신호 ADC_POT0은 R353(0Ω)을 거쳐 MCU의 PTA11에 연결된다", "PTA11은 IOMUX에서 ADC1_S10이므로 ADC1 instance의 S10 채널로 읽는다", "Siul2_Port_Ip에서 PTA11의 Mux는 ADC1_S10, Input buffer는 digital input disable로 설정한다"], "answer": [0], "pick": 1, "why": ["맞음(옳지 않은 설명): 가변저항이 납땜된 **핀이 채널을 결정**해요. PTA11은 ADC1_S10이고 ADC0이 아니에요.", "틀림(옳은 설명): 회로도 p.22 기준 0 ~ VDD_HV_A_PERH예요.", "틀림(옳은 설명): MCU 회로도 p.23의 경로예요. 옆의 R355는 DNP(미장착)예요.", "틀림(옳은 설명): 이 장의 핵심 매핑이에요.", "틀림(옳은 설명): 실습 A 설정표(Siul2_Port_Ip)의 값이에요."], "explain": "ADC는 \"채널을 고르는\" 게 아니라 **핀이 채널을 정해요**: ADC_POT0 → R353(0Ω) → **PTA11** → IOMUX **ADC1_S10**. 슬라이드도 \"ADC0이 아니다\"라고 강조해요. MCAL 설정에서는 같은 입력이 Physical Channel Id **34**(S10_ChanNum34)로 나와요."}, {"id": "e6-n06", "ch": 6, "type": "mcq", "cat": "concept", "level": 1, "sec": "4. 샘플-홀드와 SAR", "q": "SAR ADC의 샘플-홀드와 변환에 대한 설명으로 **옳은 것**은?", "options": ["SAR ADC는 입력을 잡아 두지 않고, 비트를 정할 때마다 그 순간의 입력 전압과 비교한다", "SAR ADC는 LSB부터 시작해 MSB 쪽으로 비트를 하나씩 정한다", "12-bit SAR ADC는 code 하나를 정하기 위해 4096번 비교한다", "입력 임피던스가 높거나 샘플 시간이 짧으면 샘플 커패시터가 덜 충전되어 값이 흔들린다"], "answer": [3], "pick": 1, "why": ["틀림: 비교 중에 입력이 변하지 않도록 먼저 **샘플-홀드**로 샘플 커패시터에 잡아 둬요.", "틀림: **MSB부터** 1을 놓고 비교하는 이진 탐색이에요.", "틀림: 매 비교마다 후보가 반으로 줄어 n비트면 **n번**, 12-bit는 12번이에요.", "맞음: 슬라이드 p.10의 주의 문장이에요. 코드가 맞아도 값이 흔들릴 수 있어요."], "explain": "SAR ADC는 **샘플-홀드**로 입력을 잡아 두고, **내부 DAC + 비교기**로 MSB부터 비트를 하나씩 정해요(n비트 = n번 비교). 입력 임피던스가 높거나 샘플 시간이 짧으면 샘플 커패시터가 Vin까지 충분히 충전되지 않아, 덜 찬 전압으로 비교하니 **값이 흔들려요**."}, {"id": "e6-n07", "ch": 6, "type": "mcq", "cat": "calc", "level": 2, "sec": "4. 샘플-홀드와 SAR", "q": "4-bit SAR ADC(눈금 0~16, DAC 시험값 = code)에 **Vin = 13.7**이 들어왔다. MSB부터 해당 비트를 1로 놓고, **시험값 ≤ Vin이면 그 비트를 1로 유지**, 아니면 0으로 되돌린다. **세 번째 비교**의 DAC 시험값과 최종 결과 code로 옳은 것은?", "options": ["`1100`(12) / 결과 `1100`", "`1010`(10) / 결과 `1011`", "`1110`(14) / 결과 `1101`", "`1110`(14) / 결과 `1110`"], "answer": [2], "pick": 1, "why": ["틀림: 12는 두 번째 비교의 시험값이고, 13.7이면 마지막 비트도 1이 돼요.", "틀림: 두 번째 비교(12 ≤ 13.7)에서 bit2가 1로 유지되므로 세 번째 시험값은 1010이 될 수 없어요.", "맞음: ① 1000=8 유지 ② 1100=12 유지 ③ 1110=14 > 13.7 → 0 ④ 1101=13 유지 → 1101.", "틀림: 14 > 13.7이라 bit1은 0으로 되돌아가요."], "explain": "① `1000`(8) ≤ 13.7 → 1 유지, ② `1100`(12) ≤ 13.7 → 1 유지, ③ `1110`(14) > 13.7 → 0, ④ `1101`(13) ≤ 13.7 → 1 유지. 결과는 **1101₂ = 13**이에요. 매 단계 후보 범위가 반으로 줄어드는 이진 탐색이라 4-bit는 4번 비교로 끝나요."}, {"id": "e6-n08", "ch": 6, "type": "mcq", "cat": "calc", "level": 2, "sec": "5. 두 가지 평균 — 이동 평균 필터와 하드웨어 묶음 평균", "q": "실습 기본값(하드웨어 평균 8회 × 이동 평균 N=8)에서는 filtered 1개에 **64회** 변환이 들어간다. 하드웨어 평균 횟수는 2^(2+MCR[AVGS])회, 이동 평균 창 크기는 `ADC_FILTER_N`이다. filtered 1개에 들어가는 변환 횟수가 **똑같이 64회**인 조합을 **2개** 고르면?", "options": ["AVGS = 11b, N = 4", "AVGS = 00b, N = 16", "AVGS = 00b, N = 8", "AVGS = 01b, N = 16", "AVGS = 10b, N = 4"], "answer": [1, 4], "pick": 2, "why": ["틀림: 11b → 32회, 32 × 4 = 128회예요.", "맞음: 00b → 4회, 4 × 16 = 64회예요.", "틀림: 00b → 4회, 4 × 8 = 32회예요.", "틀림: 01b → 8회, 8 × 16 = 128회예요.", "맞음: 10b → 16회, 16 × 4 = 64회예요."], "explain": "filtered 1개 = (HW 평균 횟수) × N이고, HW 횟수는 AVGS 코드로 00b→4, 01b→8, 10b→16, 11b→32회예요. 그래서 4 × 16 = 64, 16 × 4 = 64가 실습 기본(8 × 8)과 같아요. AVGS 값 자체(0~3)를 횟수로 착각하면 모든 계산이 틀어져요."}, {"id": "e6-n09", "ch": 6, "type": "mcq", "cat": "calc", "level": 3, "sec": "6. 실습 준비와 실습 A 설정 — 분해능·정렬·평균", "q": "결과 레지스터 PCDRn의 CDATA는 **15비트** 폭이고, MCR[WLSIDE]=0이면 bits [14:0], WLSIDE=1이면 bits [15:1]에 놓인다. CDATA 값이 **0x07FF**인데 WLSIDE를 **1**로 설정했다면, 레지스터의 bits [15:0]을 16비트 정수로 그대로 읽은 값은? (그 밖의 비트는 0)", "options": ["`0x07FF`", "`0x0FFE`", "`0x7FF0`", "`0x03FF`"], "answer": [1], "pick": 1, "why": ["틀림: WLSIDE=0(우측 정렬, bits [14:0])일 때의 값이에요.", "맞음: 15비트 값이 bit1부터 놓이므로 0x07FF << 1 = 0x0FFE예요.", "틀림: 4비트 밀어 올린 값이에요. 좌측 정렬은 [15:1], 즉 1비트만 올라가요.", "틀림: 오른쪽으로 1비트 민 값이에요. 방향이 반대예요."], "explain": "WLSIDE=1이면 15비트 CDATA가 **[15:1]**에 놓여 bit0이 비어요. 그래서 하위 16비트를 그대로 읽으면 CDATA × 2 = 0x07FF << 1 = **0x0FFE**이고, 원래 값으로 되돌리려면 `>> 1`을 해야 해요. 실습은 `ADC_SAR_IP_DATA_ALIGNED_RIGHT`(WLSIDE=0, [14:0])라 이런 보정이 필요 없어요."}, {"id": "e6-n10", "ch": 6, "type": "mcq", "cat": "error", "level": 2, "sec": "6. 실습 준비와 실습 A 설정 — 분해능·정렬·평균", "q": "ADC 기준전압과 가변저항 최댓값(VDD_HV_A_PERH)이 실제로는 **3.3 V**인 보드에서, 수업 코드의 환산 `mv = ((uint32_t)filtered * 5000U) / 4095U;`와 표시 코드를 그대로 썼다. filtered가 **2047**일 때 LCD 2행과 실제 입력 전압(3300 mV 기준 정수 환산)으로 옳은 것은?", "options": ["`Voltage: 2.499` — 실제는 약 1.649 V", "`Voltage: 1.649` — 실제도 약 1.649 V", "`Voltage: 2.500` — 실제는 약 1.650 V", "`Voltage: 2.499` — 실제도 약 2.499 V"], "answer": [0], "pick": 1, "why": ["맞음: 표시는 2047 × 5000 / 4095 = 2499 → 2.499, 실제는 2047 × 3300 / 4095 = 1649 mV예요.", "틀림: 코드가 5000U으로 계산하므로 표시가 실제 Vref를 따라가지 않아요.", "틀림: 정수 나눗셈은 버림이라 2.500이 아니라 2.499예요.", "틀림: code는 실제 Vref(3.3 V) 기준으로 나온 값이라 실제 전압은 약 1.649 V예요."], "explain": "code는 실제 기준전압 기준으로 나오지만 계산식은 5000 mV를 가정해서, 표시값이 실제보다 5000/3300 ≈ **1.5배** 크게 나와요(노브 끝에서도 `Voltage: 5.000`). 코드는 맞게 돌아도 숫자의 의미가 틀어진 **오동작**이라, 보고서엔 실제 설정·측정 Vref를 적어요(p.26)."}, {"id": "e6-n11", "ch": 6, "type": "err", "cat": "error", "level": 2, "sec": "6. 실습 준비와 실습 A 설정 — 분해능·정렬·평균", "q": "실습 A에서 Adc_Sar_Ip의 HW Average 설정을 켜지 않은 채 Update Code를 했다. 생성된 `Adc_Sar_Ip_PBcfg.c`의 ADC1 config 객체에 `AvgEn = TRUE`, `AvgSel = ADC_SAR_IP_AVG_8_CONV`가 없다. main.c와 adc_filter는 수업 코드 그대로다. 실행하면 어떻게 되는가?", "answer": 2, "why": ["틀림: 설정값만 다를 뿐 생성 코드는 정상적으로 만들어지고 빌드돼요.", "틀림: 코드가 같아도 설정이 다르면 읽히는 숫자가 달라져요.", "맞음: 슬라이드 p.34 — 빠지면 코드가 같아도 평균되지 않은 값이 읽혀요.", "틀림: 그건 분해능(RESOLUTION_12)을 안 바꿨을 때의 증상이에요."], "outcomes": ["빌드 오류: AvgEn이 없어 config 객체를 만들 수 없다", "정상: 결과가 평균을 켰을 때와 똑같다", "빌드·실행은 되지만 HW 값이 평균되지 않은 값이라, 평균을 켰을 때보다 더 흔들린다", "code가 0~16383으로 나와 전압이 약 4배로 표시된다"], "reasons": ["`Adc_Sar_Ip_Init()`이 생성된 config 값대로 레지스터를 기록하므로 AVGEN이 꺼진 채 변환 1회 값이 읽힌다", "하드웨어 평균이 꺼지면 adc_filter의 이동 평균도 동작하지 않는다", "AvgEn이 없으면 분해능이 기본값 14-bit로 돌아간다", "`GetConvData()`가 8회 변환 값을 나누지 않고 더해서 돌려준다"], "reason": 0, "rwhy": ["맞음: Config Tools 설정 → 생성 config 객체 → Init이 MCR에 기록하는 흐름이라, AvgEn이 없으면 AVGEN=0이에요.", "틀림: adc_filter는 ADC 설정과 무관한 소프트웨어라 그대로 동작해요. MA는 여전히 HW보다 덜 흔들려요.", "틀림: 분해능은 Conversion resolution(RESN)으로 따로 정해져요.", "틀림: 평균이 꺼지면 변환 1회 값을 돌려줄 뿐 더하지 않아요."], "explain": "하드웨어 평균은 **설정만으로** 동작해요. Config Tools 값이 `Adc_Sar_Ip_PBcfg.c`에 생성되고 `Adc_Sar_Ip_Init()`이 MCR에 기록하므로, `AvgEn`/`AvgSel`이 빠지면 같은 코드로도 **평균되지 않은 값**이 읽혀 \"값이 심하게 흔들림\" 증상이 나요. 조치는 생성 코드에서 `AvgEn = TRUE`, `AvgSel = ADC_SAR_IP_AVG_8_CONV`를 확인하는 거예요."}, {"id": "e6-n12", "ch": 6, "type": "err", "cat": "error", "level": 2, "sec": "7. 실습 A — ReadPotAdcIp(), 폴링으로 한 번 읽기", "q": "`ReadPotAdcIp()`에서 마지막 flag clear 줄을 빠뜨렸다. 빌드는 성공한다. 루프에서 이 함수를 계속 부르면 어떻게 되는가?\n```c\nstatic uint16_t ReadPotAdcIp(void)\n{\n    uint16_t hw_avg;\n\n    Adc_Sar_Ip_StartConversion(ADC_INSTANCE, ADC_SAR_IP_CONV_CHAIN_NORMAL);\n    while ((Adc_Sar_Ip_GetStatusFlags(ADC_INSTANCE)\n            & ADC_SAR_IP_STATUS_FLAG_NORMAL_ENDCHAIN) == 0U)\n    {\n    }\n    hw_avg = Adc_Sar_Ip_GetConvData(ADC_INSTANCE, ADC1_S10_CHANNEL_INDEX);\n    /* Adc_Sar_Ip_ClearStatusFlags(...) 를 빠뜨림 */\n    return hw_avg;\n}\n```", "answer": 3, "why": ["틀림: 함수 호출 한 줄을 지웠을 뿐 문법·타입 문제는 없어요.", "틀림: 첫 호출에서는 변환이 끝나면 flag가 서서 while을 빠져나와요.", "틀림: 두 번째 호출부터는 대기가 의미를 잃어요.", "맞음: 지난번에 선 flag가 남아 있어 while 조건이 처음부터 거짓이 될 수 있어요."], "outcomes": ["컴파일 오류가 난다", "첫 호출부터 while에서 영원히 멈춘다", "정상: 매 호출이 이번 변환의 결과를 돌려준다", "첫 호출은 정상이지만, 다음 호출부터는 flag가 이미 1이라 변환 완료를 기다리지 않고 읽을 수 있다"], "reasons": ["`Adc_Sar_Ip_StartConversion()`을 부르면 flag가 저절로 지워지므로 Clear 단계는 원래 필요 없다", "`Adc_Sar_Ip_GetConvData()`가 flag를 지워서 다음 while이 끝나지 않는다", "한 번 선 NORMAL_ENDCHAIN flag를 지우는 곳이 없어 다음 호출의 대기 조건이 처음부터 만족된다", "hw_avg가 지역 변수라 이전 호출의 값이 그대로 남는다"], "reason": 2, "rwhy": ["틀림: 슬라이드 순서에서 flag clear는 따로 있는 마지막 단계이고, 지우지 않으면 기다리지 않고 지나갈 수 있다고 설명해요.", "틀림: 그렇다면 오히려 영원히 멈춰야 하는데, 문제의 핵심은 flag가 **남는** 쪽이에요.", "맞음: `(flags & ENDCHAIN) == 0U`가 처음부터 거짓이면 while이 바로 끝나요.", "틀림: 지역 변수는 매 호출 새로 대입돼요. 문제는 대기 단계예요."], "explain": "IP Layer 읽기 순서는 **시작 → flag 대기 → 결과 읽기 → flag clear**예요. clear를 빼면 첫 호출 때 선 NORMAL_ENDCHAIN flag가 남아, 다음 호출의 while이 변환 완료를 **기다리지 않고 지나갈 수 있어요**. 그러면 이번 변환이 끝나기 전에 `GetConvData()`를 불러 이번 결과가 아닌 값을 읽을 수 있어요."}, {"id": "e6-n13", "ch": 6, "type": "mcq", "cat": "read", "level": 2, "sec": "8. 실습 A — adc_filter 원형 버퍼", "q": "`adc_filter.h`의 창 크기를 `#define ADC_FILTER_N 4U`로 바꾸고 다시 빌드했다(adc_filter.c는 수업 코드 그대로). 다음 코드의 출력은?\n```c\nAdcFilter_t f;\nuint16_t in[6] = {1000U, 1000U, 1000U, 1000U, 2000U, 2000U};\nuint8_t i;\n\nAdcFilter_Init(&f);\nfor (i = 0U; i < 6U; i++)\n{\n    printf(\"%u \", AdcFilter_Update(&f, in[i]));\n}\n```", "options": ["`1000 1000 1000 1000 1200 1333`", "`1000 1000 1000 1000 1250 1500`", "`250 500 750 1000 1250 1500`", "`1000 1000 1000 1000 2000 2000`"], "answer": [1], "pick": 1, "why": ["틀림: N이 8 그대로일 때의 출력이에요(6000/5, 8000/6).", "맞음: 5번째는 {2000,1000,1000,1000} → 5000/4 = 1250, 6번째는 {2000,2000,1000,1000} → 6000/4 = 1500이에요.", "틀림: count 없이 항상 N으로 나눴을 때의 출력이에요. 수업 코드는 차기 전엔 count로 나눠요.", "틀림: 창 안에 이전 1000이 남아 있어 바로 2000이 되지 않아요."], "explain": "`ADC_FILTER_N`을 바꾸면 **버퍼 크기와 평균 개수가 함께** 4로 바뀌어요. 처음 4번은 count(1~4)로 나눠 1000이고, 5번째부터는 index 0칸의 가장 오래된 1000을 빼고 2000을 더해 5000/4 = **1250**, 6번째는 6000/4 = **1500**이에요. N이 작을수록 새 값에 빨리 따라가요(4번)."}, {"id": "e6-n14", "ch": 6, "type": "err", "cat": "read", "level": 2, "sec": "8. 실습 A — adc_filter 원형 버퍼", "q": "`AdcFilter_Update()`에서 count 부분을 지우고 항상 N으로 나누게 바꿨다. 가변저항을 고정해 hw_avg가 계속 **2048**로 들어온다. 전원을 켠 직후부터 LCD 1행의 MA 표시는 어떻게 되는가? (`AdcFilter_Init()`은 루프 전에 한 번 호출)\n```c\nuint16_t AdcFilter_Update(AdcFilter_t *f, uint16_t sample)\n{\n    f->sum -= f->buf[f->index];\n    f->buf[f->index] = sample;\n    f->sum += sample;\n    f->index = (uint8_t)((f->index + 1U) % ADC_FILTER_N);\n    return (uint16_t)(f->sum / ADC_FILTER_N);   /* 항상 8로 나눔 */\n}\n```", "answer": 1, "why": ["틀림: 그건 수업 코드(count로 나눔)의 동작이에요.", "맞음: 반환값이 256, 512, 768, …, 1792, 2048로 올라가요.", "틀림: 값이 쌓이면서 sum이 커지므로 고정되지 않아요.", "틀림: 8번째 이후엔 buf가 모두 2048이라 계속 2048이에요."], "outcomes": ["처음부터 `MA:2048`로 HW와 같다", "`MA:0256`에서 시작해 256씩 커지다가, 8번째 읽기부터 `MA:2048`이 된다", "계속 `MA:0256`(HW의 1/8)으로 고정된다", "8번째 읽기 이후 `MA:0000`으로 떨어진다"], "reasons": ["Init이 0으로 채운 빈 칸까지 8개로 나눠, 버퍼가 다 찰 때까지 평균이 작게 나온다", "sum이 uint32_t라 처음 몇 번은 값이 넘친다", "index가 7 다음에 0으로 돌아가지 않는다", "sum에서 가장 오래된 값을 빼지 않는다"], "reason": 0, "rwhy": ["맞음: k번째 호출의 sum은 2048 × k인데 항상 8로 나눠 256 × k가 돼요.", "틀림: sum 최댓값은 8 × 2048 = 16384로 uint32_t에 한참 못 미쳐요.", "틀림: `% ADC_FILTER_N`이 그대로 있어 0→7→0으로 순환해요.", "틀림: 뺄셈 줄은 그대로 있어요. 처음 8번은 빼는 값이 0일 뿐이에요."], "explain": "count는 \"버퍼가 다 차기 전엔 **채운 개수로** 나눈다\"를 위한 필드예요(p.42). 지우면 0으로 초기화된 칸까지 평균에 들어가 첫 표시가 `MA:0256`처럼 작게 나오고, 8번 읽어 버퍼가 다 찬 뒤에야 HW와 같은 2048이 돼요. 수업 예(2040 → 255)와 같은 원리예요."}, {"id": "e6-n15", "ch": 6, "type": "err", "cat": "read", "level": 3, "sec": "8. 실습 A — adc_filter 원형 버퍼", "q": "`AdcFilter_t`의 `sum`을 `uint32_t`에서 **`uint16_t`**로 바꿨다(나머지는 수업 코드 그대로, 분해능은 RESOLUTION_12로 정상 설정). 가변저항을 끝까지 돌려 hw_avg가 계속 **4095**로 들어올 때 MA 표시는?\n```c\ntypedef struct\n{\n    uint16_t buf[ADC_FILTER_N];   /* ADC_FILTER_N = 8U */\n    uint16_t sum;                 /* uint32_t → uint16_t 로 변경 */\n    uint8_t  index;\n    uint8_t  count;\n} AdcFilter_t;\n```", "answer": 0, "why": ["맞음: 12-bit에서는 sum이 넘칠 수 없어 결과가 똑같아요.", "틀림: 그건 분해능이 기본 14-bit(16383)일 때 일어나는 일이에요(5 × 16383 > 65535).", "틀림: uint16_t 끼리의 연산과 대입이라 문법 문제는 없어요.", "틀림: sum은 4095씩 쌓여 최대 32760이 돼요."], "outcomes": ["정상: `MA:4095`로 uint32_t일 때와 같다", "5번째 읽기쯤부터 sum이 넘쳐 MA가 작은 값으로 틀어진다", "컴파일 오류가 난다", "MA가 0으로 고정된다"], "reasons": ["uint16_t로 선언해도 컴파일러가 구조체 멤버를 자동으로 32비트로 저장한다", "sum의 최댓값은 8 × 4095 = 32760이라 uint16_t 범위(0~65535) 안에 들어간다", "sum은 매 호출마다 0으로 초기화되므로 커지지 않는다", "uint16_t 덧셈은 넘치면 65535에서 멈추는(포화) 방식이라 안전하다"], "reason": 1, "rwhy": ["틀림: 멤버는 선언한 16비트로 저장돼요. 넘치면 잘려요.", "맞음: 노트의 \"sum 최댓값 8 × 4095 = 32760\" 그대로예요. 65535보다 작아요.", "틀림: sum은 Init 때만 0이 되고 계속 유지돼요(그래서 뺄셈·덧셈 두 번으로 갱신).", "틀림: C의 unsigned 연산은 포화가 아니라 2¹⁶으로 나눈 나머지로 감싸져요(wrap)."], "explain": "\"동작하나?\"를 범위로 판단하는 문제예요. 12-bit에서 sum 최댓값은 **8 × 4095 = 32760**이라 uint16_t(최대 65535)에도 들어가 결과가 그대로예요. 다만 분해능을 기본 14-bit로 두면 8 × 16383 = 131064라 5번째 호출부터 넘쳐 MA가 틀어지므로, 수업 코드의 `uint32_t`가 여유 있는 선택이에요."}, {"id": "e6-n16", "ch": 6, "type": "short", "cat": "read", "level": 2, "sec": "8. 실습 A — adc_filter 원형 버퍼", "q": "수업의 adc_filter(`ADC_FILTER_N` = 8U)를 사용한다. 다음 코드 실행 후 `f.index`의 값은? (숫자만)\n```c\nAdcFilter_t f;\nuint8_t i;\n\nAdcFilter_Init(&f);\nfor (i = 0U; i < 13U; i++)\n{\n    (void)AdcFilter_Update(&f, 100U);\n}\n/* f.index = ? */\n```", "accept": ["5"], "model": "5", "explain": "index는 Update마다 `(index + 1U) % ADC_FILTER_N`으로 0→1→…→7→0을 돌아요. 13번 호출하면 13 % 8 = **5**이고, 이 칸이 다음에 덮어쓸(가장 오래된) 자리예요. 이때 count는 최대치 8에서 멈춰 있고 sum은 800이에요."}, {"id": "e6-n17", "ch": 6, "type": "mcq", "cat": "read", "level": 1, "sec": "9. 실습 A — main 흐름과 LCD 표시", "q": "실습 A 루프에서 `hw_avg` = **98**, `filtered` = **102**일 때 LCD에 표시되는 두 줄로 옳은 것은?\n```c\nmv = ((uint32_t)filtered * 5000U) / 4095U;\n(void)snprintf(line, sizeof(line), \"HW:%04lu MA:%04lu\",\n    (unsigned long)hw_avg, (unsigned long)filtered);\nLcd1602_SetCursor(0U, 0U);\nLcd1602_Puts(line);\n(void)snprintf(line, sizeof(line), \"Voltage: %0lu.%03lu\",\n    (unsigned long)mv/1000, (unsigned long)mv%1000);\nLcd1602_SetCursor(1U, 0U);\nLcd1602_Puts(line);\n```", "options": ["`HW:98 MA:102` / `Voltage: 0.124`", "`HW:0098 MA:0102` / `Voltage: 0.125`", "`HW:0098 MA:0102` / `Voltage: 0.124`", "`HW:0098 MA:0102` / `Voltage: 0.102`"], "answer": [2], "pick": 1, "why": ["틀림: `%04lu`는 4자리로 맞추고 빈자리를 0으로 채워요(98 → 0098).", "틀림: 102 × 5000 / 4095 = 124.54…를 반올림한 값이에요. 정수 나눗셈은 버림이에요.", "맞음: 1행은 0 채움 4자리, mv = 124 → 몫 0, 나머지 124 → `0.124`예요.", "틀림: filtered를 mV로 환산하지 않고 그대로 찍은 모양이에요."], "explain": "1행 `%04lu`는 **4자리 0 채움**이라 `HW:0098 MA:0102`(15칸)이에요. 2행은 mv = 102 × 5000 / 4095 = 124.54… → **124**(버림)이고, 124 / 1000 = 0, 124 % 1000 = 124를 `%0lu.%03lu`로 찍어 `Voltage: 0.124`예요. `%0lu`의 0은 폭이 없어 효과가 없어요."}, {"id": "e6-n18", "ch": 6, "type": "mcq", "cat": "api", "level": 2, "sec": "10. 실습 B — MCAL 구조와 Config Tools 설정", "q": "실습 B(MCAL)의 **Adc Conversion Time Once** 옵션과 하드웨어 평균 설정에 대한 설명으로 **옳은 것**은?", "options": ["Time Once = false여도 평균은 hardware unit의 AdcNormalConvTimings 값이 Adc_Init() 때 한 번만 기록된다", "Time Once = true(기본값)이면 group의 Adc Group Hardware Average를 group마다 다르게 편집해 쓸 수 있다", "AdcNormalConvTimings는 기본으로 들어 있는 컨테이너라, 따로 추가하지 않아도 평균 8회가 적용된다", "Time Once = true이면 group이 필요 없으므로 AdcGroup_POT을 만들지 않아도 된다", "Time Once = true(기본값)이면 평균은 hardware unit의 AdcNormalConvTimings에서 정하고, Adc_Init() 때 한 번 기록된다"], "answer": [4], "pick": 1, "why": ["틀림: false면 group 쪽 설정(AdcGroupConversionConfiguration)이 쓰이고 group 변환 시작마다 기록돼요.", "틀림: true일 때 group의 Adc Group Hardware Average는 편집할 수 없어요.", "틀림: optional 컨테이너라 추가하지 않으면 평균이 꺼진 상태예요(p.57).", "틀림: 변환 API가 모두 group을 인자로 받고, group이 최소 1개 필요해요.", "맞음: 기본값 true는 hardware unit 단위로 초기화 때 한 번 레지스터에 써요."], "explain": "Time Once = **true(기본)** → hardware unit의 **AdcNormalConvTimings**가 **Adc_Init() 때 한 번** 기록되고, **false** → group별 설정이 **변환 시작마다** 기록돼요. 두 설정은 동시에 쓰이지 않아요. AdcNormalConvTimings는 optional이라 **추가하지 않으면 평균이 꺼져** 있고, Time Once와 상관없이 group은 최소 1개 있어야 해요."}, {"id": "e6-n19", "ch": 6, "type": "mcq", "cat": "api", "level": 2, "sec": "10. 실습 B — MCAL 구조와 Config Tools 설정", "q": "실습 B(MCAL) Config Tools 설정 중 **기본값에서 반드시 바꿔야 하는** 항목을 **2개** 고르면?", "options": ["AdcHwUnit > Conversion resolution → RESOLUTION_12", "AdcGeneral > Adc Result Alignment → ADC_ALIGN_RIGHT", "AdcHwConfiguration > Adc Normal Interrupt Enable → true", "AutosarExt > Adc Conversion Time Once → true", "AdcGeneral > Adc Notification Capability → true"], "answer": [0, 2], "pick": 2, "why": ["맞음: 기본값이 RESOLUTION_14라 바꾸지 않으면 0~16383, 전압 약 4배가 돼요.", "틀림: ADC_ALIGN_RIGHT가 이미 기본값이에요(WLSIDE=0).", "맞음: 기본값이 false라 바꾸지 않으면 normal 완료 ISR 처리 코드가 생성되지 않아요.", "틀림: true가 기본값이에요(hardware unit 단위 평균).", "틀림: true가 기본값이에요. false면 콜백 항목을 편집할 수 없어요."], "explain": "설정표의 기본값 함정은 **Conversion resolution 기본 RESOLUTION_14**와 **Adc Normal Interrupt Enable 기본 false**예요. Result Alignment(ADC_ALIGN_RIGHT), Time Once(true), Notification Capability(true)는 기본값 그대로 써요. 이 밖에 AdcNormalConvTimings 컨테이너 **추가**도 잊으면 안 돼요."}, {"id": "e6-n20", "ch": 6, "type": "err", "cat": "error", "level": 2, "sec": "10. 실습 B — MCAL 구조와 Config Tools 설정", "q": "실습 B(MCAL)에서 Group Notification = Adc1_Callback, Platform의 ADC1_IRQn → Adc_Sar_1_Isr(Enabled = true), main.c의 `Adc_EnableGroupNotification(AdcGroup_POT)` 호출은 모두 했다. 그런데 AdcHwConfiguration의 **Adc Normal Interrupt Enable**은 기본값 그대로 두었다. 실행하면 어떻게 되는가?", "answer": 2, "why": ["틀림: 콜백 고리 하나가 빠져 완료가 main에 전달되지 않아요.", "틀림: 링크 오류는 콜백 본체가 없거나 이름이 다를 때예요.", "맞음: 콜백이 불리지 않아 AdcConvDone이 계속 FALSE예요.", "틀림: 평균은 AdcNormalConvTimings 설정이 정하고, 이 문제는 완료 통지 쪽이에요."], "outcomes": ["정상: LCD에 HW·MA·전압이 갱신된다", "링크 오류: undefined reference to Adc1_Callback", "`ReadPotAdcMcal()`의 `while (FALSE == AdcConvDone)`에서 멈춰 LCD가 갱신되지 않는다", "값이 평균되지 않아 HW 값만 심하게 흔들린다"], "reasons": ["Normal Interrupt Enable 기본값이 false라 normal 변환 완료 ISR 처리 코드가 생성되지 않아 콜백이 불리지 않는다", "Normal Interrupt Enable이 꺼지면 AdcNormalConvTimings 평균 설정도 함께 꺼진다", "`Adc_EnableGroupNotification()`은 `Adc_Init()`보다 먼저 불러야 효과가 있다", "AdcConvDone이 volatile이라 콜백이 쓴 값이 무시된다"], "reason": 0, "rwhy": ["맞음: 콜백 고리 ② \"ISR 코드 생성\"이 빠진 경우예요(기본 false → true로).", "틀림: 평균과 인터럽트 설정은 별개 항목이에요.", "틀림: 슬라이드 초기화 순서는 Adc_Init → … → SetupResultBuffer → EnableGroupNotification이에요.", "틀림: volatile은 오히려 main이 매번 메모리를 다시 읽게 해 줘요."], "explain": "콜백이 불리려면 **Platform IRQ 등록 · Normal Interrupt Enable = true · Group Notification 이름 · Adc_EnableGroupNotification()** 네 고리가 모두 필요해요. Normal Interrupt Enable은 **기본값이 false**라 바꾸지 않으면 normal 완료 처리 코드가 생성되지 않고, main은 대기 while에서 멈춰요. p.71 확인 순서의 두 번째 항목이에요."}, {"id": "e6-n21", "ch": 6, "type": "short", "cat": "api", "level": 1, "sec": "10. 실습 B — MCAL 구조와 Config Tools 설정", "q": "실습 B(MCAL)에서 **Adc Conversion Time Once = true**(기본값)일 때, hardware unit 쪽에서 하드웨어 평균(Average Enable = true / Average Select = SAMPLES_8)을 설정하는 **optional 컨테이너**의 이름은? (추가하지 않으면 평균이 꺼진 상태다)", "accept": ["AdcNormalConvTimings", "AdcHwUnit>AdcNormalConvTimings"], "model": "AdcNormalConvTimings", "explain": "Time Once = true면 hardware unit의 **AdcNormalConvTimings** 값이 `Adc_Init()` 때 한 번 기록돼요. 이 컨테이너는 optional이라 Average Enable 항목을 못 찾으면 컨테이너부터 추가해야 해요. group 쪽 AdcGroupConversionConfiguration은 Time Once = false일 때 쓰여요."}, {"id": "e6-n22", "ch": 6, "type": "err", "cat": "error", "level": 1, "sec": "11. 실습 B — 콜백 경로와 MCAL 코드", "q": "실습 B에서 Config Tools의 Adc Group Notification은 `Adc1_Callback`으로 지정했다. main.c에는 콜백 본체를 다음처럼 썼다. 빌드하면 어떻게 되는가?\n```c\nstatic volatile boolean AdcConvDone = FALSE;\n\n/* Config Tools: Adc Group Notification = Adc1_Callback */\nvoid ADC1_Callback(void)\n{\n    AdcConvDone = TRUE;\n}\n```", "answer": 2, "why": ["틀림: C 식별자는 대소문자를 구분해요. ADC1_Callback과 Adc1_Callback은 다른 이름이에요.", "틀림: 실행까지 가지 못하고 링크 단계에서 멈춰요.", "맞음: 생성 코드가 부르는 Adc1_Callback의 본체가 어디에도 없어요.", "틀림: 분해능 문제와 무관해요."], "outcomes": ["정상: 대소문자는 구분하지 않으므로 콜백이 정상 호출된다", "빌드는 되지만 대기 while에서 영원히 멈춘다", "링크 오류(undefined reference to `Adc1_Callback`)로 빌드가 실패한다", "빌드는 되지만 값이 4095를 넘는다"], "reasons": ["생성 코드는 Config Tools에 적은 이름 Adc1_Callback을 부르는데, 철자(대소문자)가 다른 함수만 있어 그 이름의 본체가 없다", "콜백 안에서 LCD 출력을 하지 않았다", "콜백 형식은 `void 함수(void)`가 아니라 group 번호를 인자로 받아야 한다", "AdcConvDone을 volatile로 선언했다"], "reason": 0, "rwhy": ["맞음: 선언은 Adc_PBcfg.h에 자동 생성되고 본체는 main.c에 써야 하는데, 이름이 달라 정의가 없어요.", "틀림: 오히려 콜백 안의 LCD 출력은 금지예요(ISR 안).", "틀림: 콜백 형식은 `void 함수(void)`(Adc_NotifyType)가 맞아요.", "틀림: volatile은 ISR과 main이 공유하는 플래그에 필요한 선언이에요."], "explain": "콜백 **선언**은 `Adc_PBcfg.h`에 Config Tools 이름 그대로(`Adc1_Callback`) 자동 생성되고, **본체**는 main.c에 직접 써야 해요. 철자·대소문자가 다르면 그 이름의 정의가 없어 링크 오류 **undefined reference**가 나요. 문제 해결표의 \"undefined reference to Adc1_Callback → 본체 없음 / 이름 다름\"이에요."}, {"id": "e6-n23", "ch": 6, "type": "mcq", "cat": "concept", "level": 1, "sec": "12. 문제 해결과 IP vs MCAL 비교", "q": "ADC 실습 A(IP Layer)와 실습 B(MCAL)의 비교로 **옳은 것**은?", "options": ["실습 B로 옮길 때 adc_filter.c를 MCAL API에 맞게 고쳐야 한다", "실습 A의 생성 헤더는 `Adc_PBcfg.h`, 실습 B는 `Adc_Sar_Ip_PBcfg.h`다", "실습 B는 ADC1 config 객체와 channel index를 넘겨 변환을 시작한다", "실습 A는 ENDCHAIN flag 폴링이라 ADC 인터럽트를 쓰지 않고, 실습 B는 ADC1_IRQn → Adc_Sar_1_Isr 등록이 필수다", "한 프로젝트에서 `Adc_Sar_Ip_*` 호출과 `AdcGroup_POT`을 섞어 써도 된다"], "answer": [3], "pick": 1, "why": ["틀림: adc_filter는 ADC 드라이버를 호출하지 않아 **수정 없이** 재사용해요(p.66).", "틀림: 반대로 짝지었어요. IP = Adc_Sar_Ip_PBcfg.h, MCAL = Adc_PBcfg.h예요.", "틀림: 그건 IP Layer 방식이에요. MCAL은 group(AdcGroup_POT)이 단위예요.", "맞음: 완료 확인이 IP = flag 폴링, MCAL = group 콜백이고 콜백은 ADC1 ISR에서 불려요.", "틀림: 슬라이드 원칙은 한 프로젝트에 둘을 **섞지 않는다**예요(p.27)."], "explain": "두 실습의 화면은 같고 차이는 \"시작과 완료 확인\"이에요. IP = `Adc_Sar_Ip_*` + config 객체·channel index + **ENDCHAIN flag 폴링**(ADC 인터럽트 미사용), MCAL = `Adc_*` + **group** + **Adc1_Callback**(ADC1_IRQn → Adc_Sar_1_Isr 필수)이에요. adc_filter·lcd1602·환산식은 공통으로 재사용하고, 두 계층을 한 프로젝트에 섞지 않아요."}, {"id": "embedded-06-01", "ch": 6, "type": "mcq", "cat": "calc", "level": 1, "sec": "1. ADC의 역할 — 양자화·분해능·LSB", "q": "이 과목의 환산식 `V = code * Vref / 4095`를 쓰는 12-bit ADC에서 Vref가 **3.3 V**일 때 1 LSB의 크기로 가장 가까운 것은?", "options": ["약 0.806 mV", "약 0.806 V", "약 1.221 mV", "약 0.201 mV"], "answer": [0], "why": ["3.3 V / 4095 ≈ 0.000806 V = 0.806 mV.", "단위를 V로 바꿔 친 함정이에요(1000배).", "Vref 5.0 V(실습 코드 기준)일 때의 1 LSB예요.", "3.3 V / 16383(14-bit)일 때 값이에요."], "explain": "12-bit ADC의 code는 **0~4095**이고, 슬라이드 식 기준 1 LSB = **Vref / 4095**예요. 3.3 V면 약 **0.806 mV**, 실습 코드의 5.0 V면 약 1.221 mV예요. V ↔ mV 단위를 바꾼 보기에 주의해요.", "pick": 1}, {"id": "embedded-06-02", "ch": 6, "type": "short", "cat": "calc", "level": 2, "sec": "9. 실습 A — main 흐름과 LCD 표시", "q": "실습 A 루프의 환산·표시 코드다. `filtered`(uint16_t)가 **2047**일 때 LCD 2행에 표시되는 문자열은?\n```c\nmv = ((uint32_t)filtered * 5000U) / 4095U;\n(void)snprintf(line, sizeof(line), \"Voltage: %0lu.%03lu\",\n    (unsigned long)mv/1000, (unsigned long)mv%1000);\nLcd1602_SetCursor(1U, 0U);\nLcd1602_Puts(line);\n```", "accept": ["Voltage: 2.499", "Voltage:2.499", "2.499"], "model": "`Voltage: 2.499`", "explain": "2047 × 5000 = 10,235,000이고 ÷ 4095 = 2499.39…인데 **정수 나눗셈이라 2499**예요. 1000으로 나눈 몫 2와 나머지 499가 `%03lu`로 찍혀 `Voltage: 2.499`가 돼요. 반올림한 2.500은 오답이에요. (`%0lu`는 폭이 없어 `%lu`와 같아요.)"}, {"id": "embedded-06-03", "ch": 6, "type": "short", "cat": "calc", "level": 2, "sec": "9. 실습 A — main 흐름과 LCD 표시", "q": "실습 A의 환산 코드 `mv = ((uint32_t)filtered * 5000U) / 4095U;`와 표시 코드를 그대로 썼다. LCD 2행에 **`Voltage: 1.250`** 이 떴다면 그때의 `filtered` 값은? (숫자만)", "accept": ["1024"], "model": "`1024`", "explain": "mv = 1250이 되는 code를 찾으면 돼요. 1023 → 1023×5000/4095 = 1249.08 → 1249, **1024 → 1250.30 → 1250**, 1025 → 1251.5 → 1251이라 1250이 나오는 값은 1024 하나예요. 1250 × 4095 / 5000 = 1023.75를 그대로 내림한 1023은 오답이에요."}, {"id": "embedded-06-04", "ch": 6, "type": "err", "cat": "calc", "level": 2, "sec": "9. 실습 A — main 흐름과 LCD 표시", "q": "환산 줄을 다음처럼 바꿨다(`filtered`는 uint16_t, `mv`는 uint32_t). 가변저항을 가운데쯤(filtered ≈ 2047)에 두었을 때 LCD 2행은?\n```c\nmv = filtered / 4095U * 5000U;     /* 순서만 바꿈 */\n(void)snprintf(line, sizeof(line), \"Voltage: %0lu.%03lu\",\n    (unsigned long)mv/1000, (unsigned long)mv%1000);\n```", "answer": 2, "why": ["타입·문법 문제는 없어요.", "원래 식(곱셈 먼저)일 때의 결과예요.", "2047 / 4095 = 0(정수) → 0 × 5000 = 0. filtered가 4095일 때만 1 × 5000 = 5000.", "5000U / 4095U를 먼저 계산했을 때(=1)의 결과예요."], "outcomes": ["컴파일 오류", "`Voltage: 2.499` (정상)", "`Voltage: 0.000` — 끝까지 돌린 4095에서만 `5.000`", "`Voltage: 2.047`"], "reasons": ["uint16_t를 4095U로 나눌 수 없다", "정수 나눗셈은 소수점을 버리므로 4095보다 작은 값을 4095로 먼저 나누면 0이 된다", "uint32_t 곱셈이 넘쳐(overflow) 값이 0이 된다", "`%03lu` 형식이 0을 강제로 채운다"], "reason": 1, "rwhy": ["uint16_t는 unsigned int로 승격되어 문제없이 나눠져요.", "C 정수 나눗셈은 몫만 남겨요. 그래서 슬라이드 식은 **곱셈을 먼저** 하고 나중에 나눠요.", "2047 × 5000 = 10,235,000은 uint32_t 범위 안이고, 이 식에선 곱셈 전에 이미 0이에요.", "%03lu는 3자리 폭 채움일 뿐 값을 바꾸지 않아요."], "explain": "`filtered / 4095U`는 filtered < 4095이면 **0**이에요(정수 나눗셈). 그래서 가변저항을 어디에 두어도 `Voltage: 0.000`이고 끝까지 돌린 4095에서만 5.000이 돼요. 슬라이드 식 `((uint32_t)filtered * 5000U) / 4095U`는 **곱셈 먼저, 나눗셈 나중**이라 정밀도를 지켜요."}, {"id": "embedded-06-05", "ch": 6, "type": "err", "cat": "calc", "level": 3, "sec": "9. 실습 A — main 흐름과 LCD 표시", "q": "환산 줄을 '상수를 미리 계산하면 빠르다'며 다음처럼 바꿨다. filtered = **2047**일 때 LCD 2행은?\n```c\nmv = (uint32_t)filtered * (5000U / 4095U);\n(void)snprintf(line, sizeof(line), \"Voltage: %0lu.%03lu\",\n    (unsigned long)mv/1000, (unsigned long)mv%1000);\n```", "answer": 3, "why": ["filtered를 먼저 4095로 나눴을 때의 결과예요.", "실수로 계산해 반올림한 값이에요. 정수 연산엔 반올림이 없어요.", "원래 식의 결과예요.", "5000U / 4095U = 1 → mv = 2047 → 2.047."], "outcomes": ["`Voltage: 0.000`", "`Voltage: 2.500`", "`Voltage: 2.499`", "`Voltage: 2.047`"], "reasons": ["uint32_t로 형변환하면 값이 1/4로 줄어든다", "`%0lu` 형식 때문에 소수점 위치가 바뀐다", "`5000U / 4095U`가 정수 나눗셈이라 1이 되어 mv가 filtered와 같아진다", "괄호 안 계산이 1.221로 저장되지만 곱셈 결과가 잘린다"], "reason": 2, "rwhy": ["형변환은 값을 바꾸지 않아요.", "`%0lu`는 `%lu`와 같아 출력에 영향이 없어요.", "unsigned 정수끼리 나누면 몫 1만 남아요. 결국 mv = filtered × 1이에요.", "정수 상수식은 1.221 같은 실수를 만들지 않아요."], "explain": "`5000U / 4095U`는 **1**이에요. 그래서 mv가 filtered 그대로(2047)가 되어 `Voltage: 2.047`처럼 code가 전압인 척 표시돼요. 정수 연산에서는 **곱셈을 먼저** 해야 해요: `((uint32_t)filtered * 5000U) / 4095U` → 2499."}, {"id": "embedded-06-06", "ch": 6, "type": "mcq", "cat": "read", "level": 2, "sec": "9. 실습 A — main 흐름과 LCD 표시", "q": "표시 줄의 `%03lu`를 `%lu`로 바꿨다. `mv`가 **2005**일 때 LCD 2행은?\n```c\n(void)snprintf(line, sizeof(line), \"Voltage: %lu.%lu\",\n    (unsigned long)mv/1000, (unsigned long)mv%1000);\n```", "options": ["`Voltage: 2.0005`", "`Voltage: 2.005`", "`Voltage: 2.5`", "`Voltage: 2.50`"], "answer": [2], "why": ["나머지는 5 하나만 찍혀요.", "원래 `%03lu`일 때 결과예요(나머지 5를 `005`로 채움).", "몫 2, 나머지 5 → `%lu`는 0 채움이 없어 `2.5`로 찍혀요(실제는 2.005 V).", "%lu는 자릿수를 맞추지 않아요."], "explain": "mV를 '몫.나머지'로 찍을 때 나머지는 **3자리 0 채움(`%03lu`)** 이어야 해요. 그냥 `%lu`면 2005 mV가 `2.5`로 보여 2.5 V로 잘못 읽혀요. 반대로 슬라이드의 `%0lu`는 폭이 없어 `%lu`와 똑같아요.", "pick": 1}, {"id": "embedded-06-07", "ch": 6, "type": "err", "cat": "error", "level": 2, "sec": "6. 실습 준비와 실습 A 설정 — 분해능·정렬·평균", "q": "실습 A에서 Adc_Sar_Ip의 **Conversion resolution을 기본값 그대로** 두고 빌드했다. 코드는 수업 코드(`× 5000U / 4095U`) 그대로다. 가변저항을 가운데에 두어 code가 **8191**로 읽힐 때 LCD 2행은?", "answer": 1, "why": ["RESOLUTION_12로 바꿨을 때(code 2047)의 결과예요.", "8191 × 5000 / 4095 = 10001 → 약 4배로 표시돼요.", "1/4로 줄어드는 게 아니라 4배로 커져요.", "끝까지 돌린 정상(12-bit) 값이에요."], "outcomes": ["`Voltage: 2.499`", "`Voltage: 10.001`", "`Voltage: 0.624`", "`Voltage: 5.000`"], "reasons": ["데이터 정렬이 좌측(WLSIDE=1)으로 기본 설정되어 값이 2배가 된다", "하드웨어 평균이 8개 값을 더하기만 하고 나누지 않는다", "Vref가 기본 3.3 V라서 계산이 틀어진다", "분해능 기본값이 14-bit라 code가 0~16383으로 나오는데 환산식은 4095로 나눈다"], "reason": 3, "rwhy": ["정렬 기본은 우측(ADC_ALIGN_RIGHT, WLSIDE=0)이에요.", "하드웨어 평균은 평균 하나를 결과 레지스터에 써요.", "코드가 5000 고정이라 Vref 설정과 무관하게 같은 식으로 계산해요.", "슬라이드: 기본값 14-bit 그대로 → 0~16383, 전압 약 4배 → RESOLUTION_12로 바꿔요."], "explain": "Conversion resolution 기본값은 **14-bit(RESOLUTION_14)** 라서 code가 4배(0~16383)로 나와요. 그런데 main의 식은 `/ 4095U` 그대로라 표시 전압이 **약 4배**(8191 → 10001 mV)가 돼요. 증상 '4095 초과, 전압 약 4배' → **RESOLUTION_12** 확인이 문제 해결표의 정답이에요."}, {"id": "embedded-06-08", "ch": 6, "type": "mcq", "cat": "calc", "level": 2, "sec": "5. 두 가지 평균 — 이동 평균 필터와 하드웨어 묶음 평균", "q": "하드웨어 평균 횟수는 2^(2+MCR[AVGS])회다. 실습은 AVGS=01b(8회)와 소프트웨어 이동 평균 N=8을 써서 filtered 1개에 64회 변환이 들어간다. AVGS를 **10b**로 바꾸고 N은 8 그대로 두면 filtered 1개에 들어가는 변환 횟수는?", "options": ["24회", "64회", "128회", "256회"], "answer": [2], "why": ["16 + 8처럼 더한 값이에요. 두 평균은 곱으로 겹쳐요.", "AVGS=01b(8회)일 때 값이에요.", "AVGS=10b → 2^(2+2) = 16회, 16 × 8 = 128회.", "AVGS=11b(32회)일 때 32 × 8 값이에요."], "explain": "AVGS는 횟수 자체가 아니라 **코드**예요: 00b→4, 01b→8, **10b→16**, 11b→32회. filtered 1개 = 최근 N개 hw_avg의 평균이고, hw_avg 1개 = 2^(2+AVGS)회 변환이라 **16 × 8 = 128회**예요.", "pick": 1}, {"id": "embedded-06-09", "ch": 6, "type": "mcq", "cat": "concept", "level": 2, "sec": "5. 두 가지 평균 — 이동 평균 필터와 하드웨어 묶음 평균", "q": "S32K3 ADC의 하드웨어 평균과 소프트웨어 이동 평균(adc_filter)에 대한 설명으로 **옳은 것**은?", "options": ["하드웨어 평균은 순간 노이즈를, 이동 평균은 읽기와 읽기 사이의 흔들림을 줄인다", "이동 평균은 N을 키울수록 노이즈도 줄고 응답도 빨라진다", "하드웨어 평균은 이전 변환 결과를 기억하는 이동 평균이다", "하드웨어 평균을 쓰려면 `Adc_Sar_Ip_GetConvData()`를 8번 불러 직접 평균 내야 한다"], "answer": [0], "why": ["슬라이드 비교표 그대로예요.", "N이 크면 노이즈는 줄지만 응답은 느려져요(trade-off).", "하드웨어 평균은 변환마다 새로 모으는 **묶음 평균**이에요(교재 문장이 함정).", "GetConvData() 한 번이면 이미 8회 평균된 값이에요."], "explain": "하드웨어 평균은 `MCR[AVGEN]=1`일 때 변환 한 번에 같은 채널을 여러 번 변환해 **평균 하나**를 쓰고, 이전 값은 기억하지 않아요(**묶음 평균**, 순간 노이즈 감소). 이동 평균은 원형 버퍼로 **지난 N번 읽은 값**을 평균해 읽기 사이의 흔들림을 줄이지만 N번 읽어야 새 값에 다 따라가요.", "pick": 1}, {"id": "embedded-06-10", "ch": 6, "type": "mcq", "cat": "read", "level": 2, "sec": "8. 실습 A — adc_filter 원형 버퍼", "q": "수업의 adc_filter(N = 8)를 사용한다. 다음 코드의 출력은?\n```c\nAdcFilter_t f;\nAdcFilter_Init(&f);\nprintf(\"%u \", AdcFilter_Update(&f, 1000U));\nprintf(\"%u \", AdcFilter_Update(&f, 1000U));\nprintf(\"%u\\n\", AdcFilter_Update(&f, 4000U));\n```\n```c\nuint16_t AdcFilter_Update(AdcFilter_t *f, uint16_t sample)\n{\n    f->sum -= f->buf[f->index];\n    f->buf[f->index] = sample;\n    f->sum += sample;\n    f->index = (uint8_t)((f->index + 1U) % ADC_FILTER_N);\n    if (f->count < ADC_FILTER_N) { f->count++; }\n    return (uint16_t)(f->sum / f->count);\n}\n```", "options": ["`1000 1000 750`", "`1000 1000 2000`", "`125 250 750`", "`1000 1000 4000`"], "answer": [1], "why": ["앞 두 개는 count로, 마지막만 8로 나눈 섞인 값이에요.", "count가 1, 2, 3으로 늘며 채운 개수로 나눠요: 1000/1, 2000/2, 6000/3 = 2000.", "처음부터 N(8)으로 나눴을 때의 값이에요. count가 이를 막아요.", "마지막은 최근 3개(1000, 1000, 4000)의 평균이에요."], "explain": "`count`는 0에서 시작해 버퍼가 다 찰 때까지 1씩 늘어요. 그래서 **처음 8번은 채운 개수로 나눠** 0으로 채운 칸 때문에 값이 작게 나오지 않아요. 세 번째 호출은 sum = 6000, count = 3 → **2000**이에요.", "pick": 1}, {"id": "embedded-06-11", "ch": 6, "type": "mcq", "cat": "read", "level": 3, "sec": "8. 실습 A — adc_filter 원형 버퍼", "q": "adc_filter(N = 8)에 8개의 값이 들어가 현재 상태가 다음과 같다. 이때 `AdcFilter_Update(&f, 3000U)`의 반환값은?\n```c\n/* f.buf   = {2040, 2052, 2046, 2050,\n              2044, 2048, 2054, 2042}\n   f.sum   = 16376\n   f.index = 0\n   f.count = 8 */\n```", "options": ["3000", "2047", "2167", "2422"], "answer": [2], "why": ["이동 평균은 8번 더 읽어야 새 값에 다 도달해요.", "Update 전의 평균(16376 / 8)이에요.", "sum = 16376 − 2040(buf[0], 가장 오래된 값) + 3000 = 17336 → 17336 / 8 = 2167.", "가장 오래된 값을 빼지 않고 (16376 + 3000) / 8로 계산한 값이에요."], "explain": "`f->sum -= f->buf[f->index]`로 **index 칸의 가장 오래된 값(2040)을 빼고**, 그 칸을 3000으로 덮어쓴 뒤 더해요: 16376 − 2040 + 3000 = **17336**, ÷ 8 = **2167**(정수 나눗셈). index는 1로 넘어가요. 3000이 계속 들어오면 8번째 호출에야 3000이 돼요.", "pick": 1}, {"id": "embedded-06-12", "ch": 6, "type": "mcq", "cat": "error", "level": 2, "sec": "8. 실습 A — adc_filter 원형 버퍼", "q": "실습 A main()에서 `AdcFilter_Init(&AdcFilter);`를 루프 **안으로** 옮겼다. 실행하면 LCD 1행 `HW:xxxx MA:xxxx`는 어떻게 되는가?\n```c\nfor (;;)\n{\n    AdcFilter_Init(&AdcFilter);          /* 루프 안으로 이동 */\n    hw_avg   = ReadPotAdcIp();\n    filtered = AdcFilter_Update(&AdcFilter, hw_avg);\n    /* ... LCD 표시 ... */\n}\n```", "options": ["MA가 항상 HW의 1/8로 표시된다", "MA가 0000으로 고정된다", "정상: MA가 HW보다 덜 흔들린다", "MA가 항상 HW와 같은 값으로 표시된다(이동 평균 효과 없음)"], "answer": [3], "why": ["count로 나누므로 1/8이 되지 않아요.", "sample이 sum에 더해지므로 0이 아니에요.", "필터 상태가 매번 지워져 평균이 되지 않아요.", "매번 count=0·sum=0으로 초기화되어 sample 하나를 count 1로 나누니 hw_avg 그대로예요."], "explain": "슬라이드는 `AdcFilter_Init()`을 **루프에 들어가기 전에 한 번만** 호출하라고 해요. 루프 안에서 부르면 매번 count가 1로 돌아가 `sum / count = sample`이 되어 **MA = HW**, 즉 이동 평균이 전혀 걸리지 않아요.", "pick": 1}, {"id": "embedded-06-13", "ch": 6, "type": "mcq", "cat": "calc", "level": 2, "sec": "4. 샘플-홀드와 SAR", "q": "SAR ADC는 내부 DAC와 비교기로 MSB부터 비트를 하나씩 결정한다. 4-bit SAR(눈금 0~16, DAC 시험값 = code)에 **Vin = 5.6**이 들어왔다. '시험값 ≤ Vin이면 그 비트를 1로 확정'하는 규칙으로 변환한 결과는?", "options": ["`0101`", "`0110`", "`0100`", "`1010`"], "answer": [0], "why": ["1000(8)>5.6→0, 0100(4)≤5.6→1, 0110(6)>5.6→0, 0101(5)≤5.6→1 → 0101.", "세 번째 비교에서 6 > 5.6이라 그 비트는 0이에요.", "마지막 LSB 비교(5 ≤ 5.6)에서 1이 돼요.", "노트의 4-bit 예시(Vin = 10.3)의 결과예요. 5.6이면 1000(8)에서 이미 0이에요."], "explain": "SAR은 매 단계 후보 범위를 반으로 줄이는 **이진 탐색**이라 n비트면 비교를 n번 해요. 4비트면 4번, 12-bit ADC면 12번 비교로 0~4095 중 하나가 정해져요. 비교하는 동안 입력이 변하지 않도록 먼저 **샘플-홀드**로 잡아 둬요.", "pick": 1}, {"id": "embedded-06-14", "ch": 6, "type": "short", "cat": "api", "level": 2, "sec": "7. 실습 A — ReadPotAdcIp(), 폴링으로 한 번 읽기", "q": "실습 A의 `ReadPotAdcIp()`이다. normal chain 변환 완료를 폴링으로 기다리는 빈칸 (A)에 들어갈 상태 플래그 매크로는?\n```c\nstatic uint16_t ReadPotAdcIp(void)\n{\n    uint16_t hw_avg;\n\n    Adc_Sar_Ip_StartConversion(ADC_INSTANCE,\n                               ADC_SAR_IP_CONV_CHAIN_NORMAL);\n    while ((Adc_Sar_Ip_GetStatusFlags(ADC_INSTANCE)\n            & (A)) == 0U)\n    {\n    }\n    hw_avg = Adc_Sar_Ip_GetConvData(ADC_INSTANCE,\n                                    ADC1_S10_CHANNEL_INDEX);\n    Adc_Sar_Ip_ClearStatusFlags(ADC_INSTANCE, (A));\n    return hw_avg;\n}\n```", "accept": ["ADC_SAR_IP_STATUS_FLAG_NORMAL_ENDCHAIN"], "model": "`ADC_SAR_IP_STATUS_FLAG_NORMAL_ENDCHAIN`", "explain": "실습 A는 ADC 인터럽트를 쓰지 않고 **end-chain flag를 폴링**해요. 순서는 시작(StartConversion) → `NORMAL_ENDCHAIN` 대기 → 읽기(GetConvData) → 같은 flag clear(ClearStatusFlags)예요. clear를 해야 다음 호출의 대기가 의미가 있어요."}, {"id": "embedded-06-15", "ch": 6, "type": "err", "cat": "error", "level": 2, "sec": "7. 실습 A — ReadPotAdcIp(), 폴링으로 한 번 읽기", "q": "`ReadPotAdcIp()`의 읽기 줄을 대기 루프 **앞으로** 옮겼다. 빌드는 성공한다. 어떤 문제가 생기는가?\n```c\nAdc_Sar_Ip_StartConversion(ADC_INSTANCE,\n                           ADC_SAR_IP_CONV_CHAIN_NORMAL);\nhw_avg = Adc_Sar_Ip_GetConvData(ADC_INSTANCE,\n                                ADC1_S10_CHANNEL_INDEX);\nwhile ((Adc_Sar_Ip_GetStatusFlags(ADC_INSTANCE)\n        & ADC_SAR_IP_STATUS_FLAG_NORMAL_ENDCHAIN) == 0U)\n{\n}\nAdc_Sar_Ip_ClearStatusFlags(ADC_INSTANCE,\n        ADC_SAR_IP_STATUS_FLAG_NORMAL_ENDCHAIN);\nreturn hw_avg;\n```", "answer": 3, "why": ["호출 순서만 바뀌어 문법 문제는 없어요.", "읽는 시점이 완료 전이라 같은 값이 보장되지 않아요.", "변환이 끝나면 flag가 서므로 while은 빠져나와요.", "8회 변환·평균이 끝나 flag가 서기 전에 GetConvData()를 불렀어요."], "outcomes": ["컴파일 오류가 난다", "정상: 결과가 원래 코드와 같다", "while에서 영원히 멈춘다", "이번 변환이 끝나기 전에 읽어, 이번 변환 결과가 아닌 값을 돌려줄 수 있다"], "reasons": ["완료 flag(NORMAL_ENDCHAIN)를 기다린 뒤 결과를 읽어야 하는데 순서가 뒤바뀌었다", "GetConvData()가 flag를 지워서 while이 끝나지 않는다", "StartConversion 직후에는 반드시 ClearStatusFlags를 먼저 불러야 한다", "hw_avg가 uint16_t라 결과를 담을 수 없다"], "reason": 0, "rwhy": ["슬라이드 IP 읽기 순서: 시작 → **완료 flag 대기 → 결과 읽기** → flag clear.", "수업 자료에 그런 동작은 없어요. 대기 루프는 flag가 서면 끝나요.", "clear는 결과를 읽은 다음 단계예요.", "12-bit 결과(0~4095)는 uint16_t에 들어가요."], "explain": "IP Layer 읽기 순서는 **초기화 → normal chain 시작 → 완료 flag 대기 → 변환 결과 읽기 → flag clear**예요. 대기 전에 읽으면 하드웨어가 아직 8회 변환·평균을 끝내지 않은 시점이라 이번 변환 값이 아닌 것을 돌려줄 수 있어요(이전 값 등). while은 정상적으로 빠져나오므로 멈추지는 않아요."}, {"id": "embedded-06-16", "ch": 6, "type": "mcq", "cat": "api", "level": 1, "sec": "7. 실습 A — ReadPotAdcIp(), 폴링으로 한 번 읽기", "q": "IP Layer(Adc_Sar_Ip)로 ADC를 한 번 읽는 순서로 **옳은 것**은? (Init·보정은 main에서 이미 끝남)", "options": ["`GetConvData` → `StartConversion` → flag 대기 → `ClearStatusFlags`", "`StartConversion` → `ClearStatusFlags` → flag 대기 → `GetConvData`", "`StartConversion` → flag 대기 → `GetConvData` → `ClearStatusFlags`", "flag 대기 → `StartConversion` → `GetConvData` → `ClearStatusFlags`"], "answer": [2], "why": ["시작도 하기 전에 읽어요.", "읽기 전에 clear하는 순서는 슬라이드와 달라요.", "슬라이드 순서: normal chain 시작 → 완료 flag 대기 → 결과 읽기 → flag clear.", "시작 전에 대기하면 의미가 없어요."], "explain": "슬라이드 p.37: **초기화 → normal chain 시작 → 완료 flag 대기 → 변환 결과 읽기 → flag clear**. 함수로는 `Adc_Sar_Ip_StartConversion` → `GetStatusFlags & NORMAL_ENDCHAIN` 폴링 → `GetConvData` → `ClearStatusFlags`예요.", "pick": 1}, {"id": "embedded-06-17", "ch": 6, "type": "err", "cat": "error", "level": 2, "sec": "11. 실습 B — 콜백 경로와 MCAL 코드", "q": "실습 B(MCAL) main()의 초기화다. Config Tools 설정(Group Notification = Adc1_Callback, Normal Interrupt Enable = true, Platform의 ADC1_IRQn → Adc_Sar_1_Isr)은 모두 맞다. 실행하면 어떻게 되는가?\n```c\nPlatform_Init(NULL_PTR);\nPort_Init(NULL_PTR);\nAdc_Init(NULL_PTR);\nLcd1602_Init(LCD_ADDR);\nAdcFilter_Init(&AdcFilter);\n(void)Adc_SetupResultBuffer(AdcGroup_POT, AdcResultBuffer);\n/* Adc_EnableGroupNotification(AdcGroup_POT); 를 빠뜨림 */\nfor (;;) {\n    hw_avg = ReadPotAdcMcal();   /* while (FALSE == AdcConvDone) */\n    /* ... 필터, LCD 표시 ... */\n}\n```", "answer": 1, "why": ["콜백이 불리지 않아 AdcConvDone이 TRUE가 되지 않아요.", "Adc_Init() 직후 notification은 꺼져 있어 콜백이 불리지 않고, main은 플래그를 영원히 기다려요.", "콜백 본체·이름 문제가 아니에요.", "분해능(14-bit 기본값) 문제의 증상이에요."], "outcomes": ["정상: LCD에 HW·MA·전압이 갱신된다", "`ReadPotAdcMcal()`의 대기 while에서 멈춰 LCD가 갱신되지 않는다", "링크 오류(undefined reference to Adc1_Callback)", "값이 4095를 넘고 전압이 약 4배로 표시된다"], "reasons": ["AdcConvDone이 volatile로 선언되어 값이 바뀌지 않는다", "Adc_Init() 직후 group notification이 꺼져 있어 Adc1_Callback()이 호출되지 않는다", "Adc_SetupResultBuffer()를 부르면 notification이 자동으로 꺼진다", "Platform_Init()을 Adc_Init()보다 먼저 불렀다"], "reason": 1, "rwhy": ["volatile은 오히려 바뀐 값을 매번 다시 읽게 해요.", "슬라이드: Adc_Init() 직후 notification은 꺼져 있다 → Adc_EnableGroupNotification() 필요.", "SetupResultBuffer는 결과 버퍼를 group에 등록할 뿐이에요.", "슬라이드 p.67 코드도 Platform_Init이 맨 앞이에요."], "explain": "콜백 경로는 **ADC1_IRQn → Adc_Sar_1_Isr → RTD normal ISR → Adc1_Callback()** 이고, 마지막 고리는 코드의 **`Adc_EnableGroupNotification(AdcGroup_POT)`** 이에요. 이게 빠지면 콜백이 불리지 않아 `while (FALSE == AdcConvDone)`에서 멈춰요(문제 해결표: 대기 while에서 멈춤, LCD 갱신 안 됨)."}, {"id": "embedded-06-18", "ch": 6, "type": "err", "cat": "error", "level": 2, "sec": "11. 실습 B — 콜백 경로와 MCAL 코드", "q": "실습 B의 플래그 선언에서 `volatile`을 뺐다. 설정과 나머지 코드는 정상이다. 최적화 빌드로 실행했을 때 나타날 수 있는 증상은?\n```c\nstatic Adc_ValueGroupType AdcResultBuffer[1U];\nstatic boolean AdcConvDone = FALSE;    /* volatile 없음 */\n\nvoid Adc1_Callback(void) { AdcConvDone = TRUE; }\n\nstatic uint16_t ReadPotAdcMcal(void)\n{\n    AdcConvDone = FALSE;\n    Adc_StartGroupConversion(AdcGroup_POT);\n    while (FALSE == AdcConvDone) { }\n    (void)Adc_ReadGroup(AdcGroup_POT, AdcResultBuffer);\n    return (uint16_t)AdcResultBuffer[0U];\n}\n```", "answer": 2, "why": ["volatile은 ISR과 공유하는 변수에 필수예요.", "콜백 호출 경로(IRQ·Notification)는 그대로라 콜백은 불려요.", "슬라이드 문제 해결표: '콜백은 호출되는데 main이 계속 대기 → volatile 누락'.", "모든 심볼이 정의돼 있어요."], "outcomes": ["정상: volatile은 성능 최적화용이라 빼도 같다", "콜백이 아예 호출되지 않는다", "콜백은 호출되는데 main이 while에서 계속 대기할 수 있다", "링크 오류가 난다"], "reasons": ["static 변수는 콜백과 main이 공유할 수 없다", "Adc_StartGroupConversion()이 AdcConvDone을 FALSE로 고정한다", "컴파일러가 루프 안에서 AdcConvDone이 바뀌지 않는다고 보고 메모리를 다시 읽지 않을 수 있다", "boolean 형은 ISR에서 쓸 수 없다"], "reason": 2, "rwhy": ["같은 파일 안이라 공유 가능하고, 슬라이드 코드도 static volatile이에요.", "드라이버는 사용자 플래그를 건드리지 않아요.", "콜백(ISR)이 쓰는 것을 컴파일러는 몰라요. volatile이 '매번 메모리에서 읽어라'를 보장해요.", "boolean도 일반 변수예요."], "explain": "`AdcConvDone`은 **콜백(ISR)이 쓰고 main이 읽는** 변수라 `static volatile`이어야 해요. volatile이 없으면 최적화 시 while이 값을 한 번 읽고 재사용할 수 있어, 콜백이 TRUE로 바꿔도 main은 못 보고 계속 기다려요. breakpoint로 보면 콜백은 불리는데 루프를 못 빠져나오는 모습이에요."}, {"id": "embedded-06-19", "ch": 6, "type": "err", "cat": "error", "level": 3, "sec": "11. 실습 B — 콜백 경로와 MCAL 코드", "q": "`ReadPotAdcMcal()`에서 첫 줄 `AdcConvDone = FALSE;`를 지웠다(나머지는 정상, volatile 선언). 루프에서 이 함수를 계속 부르면 어떻게 되는가?\n```c\nstatic uint16_t ReadPotAdcMcal(void)\n{\n    /* AdcConvDone = FALSE;  ← 삭제 */\n    Adc_StartGroupConversion(AdcGroup_POT);\n    while (FALSE == AdcConvDone) { }\n    (void)Adc_ReadGroup(AdcGroup_POT, AdcResultBuffer);\n    return (uint16_t)AdcResultBuffer[0U];\n}\n```", "answer": 3, "why": ["TRUE로 '다시' 세우는 건 의미가 없어요. FALSE로 내리는 줄이 없어요.", "한 줄을 지웠을 뿐 문법 문제는 없어요.", "초기값이 FALSE라 첫 호출은 콜백이 TRUE로 바꿀 때까지 정상 대기해요.", "첫 콜백 이후 AdcConvDone이 계속 TRUE라 다음 호출의 while은 즉시 통과해요."], "outcomes": ["정상: 콜백이 매번 플래그를 다시 세우므로 문제없다", "컴파일 오류가 난다", "첫 호출부터 while에서 영원히 멈춘다", "첫 호출은 정상이지만, 두 번째 호출부터는 변환 완료를 기다리지 않고 바로 Adc_ReadGroup()을 부른다"], "reasons": ["Adc_StartGroupConversion()이 플래그를 TRUE로 만든다", "AdcConvDone의 초기값이 TRUE이다", "volatile 변수는 한 번 쓴 뒤 바꿀 수 없다", "TRUE로 바뀐 플래그를 다시 FALSE로 내리는 곳이 없어 이전 변환의 TRUE가 남는다"], "reason": 3, "rwhy": ["TRUE로 만드는 건 콜백뿐이에요.", "선언에서 FALSE로 초기화해요.", "volatile 변수도 몇 번이든 쓸 수 있어요.", "슬라이드 코드가 시작 전에 FALSE로 '먼저 내리는' 이유예요."], "explain": "콜백은 TRUE로 **올리기만** 하고, FALSE로 **내리는** 건 `ReadPotAdcMcal()` 첫 줄이에요. 이 줄이 없으면 첫 변환 뒤 TRUE가 남아, 두 번째 호출부터는 변환을 시작하자마자 while을 통과해 **변환 완료 전에 결과를 읽어요**. 대기 플래그는 '시작 전에 내리고, 완료 때 올린다'가 짝이에요."}, {"id": "embedded-06-20", "ch": 6, "type": "short", "cat": "api", "level": 2, "sec": "11. 실습 B — 콜백 경로와 MCAL 코드", "q": "실습 B(MCAL) main()의 초기화 부분이다. 빈칸 (A)에 들어갈 함수 이름은?\n```c\nPlatform_Init(NULL_PTR);\nPort_Init(NULL_PTR);\nAdc_Init(NULL_PTR);\nLcd1602_Init(LCD_ADDR);\nAdcFilter_Init(&AdcFilter);\n/* 결과 버퍼 등록 */\n(void)Adc_SetupResultBuffer(AdcGroup_POT, AdcResultBuffer);\n/* 콜백 허용: Adc_Init() 직후에는 notification이 꺼져 있다 */\n(A)(AdcGroup_POT);\n```", "accept": ["Adc_EnableGroupNotification", "Adc_EnableGroupNotification()"], "model": "`Adc_EnableGroupNotification`", "explain": "`Adc_SetupResultBuffer()`로 결과 버퍼를 group에 등록하고, **`Adc_EnableGroupNotification()`** 으로 꺼져 있던 group notification을 켜야 변환 완료 때 `Adc1_Callback()`이 불려요. MCAL의 변환 API는 모두 **group(AdcGroup_POT)** 을 인자로 받아요."}, {"id": "embedded-06-21", "ch": 6, "type": "mcq", "cat": "concept", "level": 1, "sec": "3. 핀이 곧 채널 — PTA11 = ADC1_S10", "q": "S32K312EVB의 보드 가변저항(ADC_POT0)을 읽을 때 사용하는 ADC 입력과, MCAL Adc 채널 설정의 Physical Channel Id 조합으로 **옳은 것**은?", "options": ["ADC0_S11 / 34", "ADC0_S10 / 10", "ADC1_S10 / 34", "ADC1_S10 / 10"], "answer": [2], "why": ["모듈과 채널 이름이 모두 틀렸어요.", "ADC0이 아니에요. 슬라이드가 'ADC0이 아니다'라고 강조해요.", "PTA11 = ADC1_S10, MCAL 채널 이름 S10_ChanNum34 → Physical Channel Id 34.", "S10은 이름이고 MCAL Physical Channel Id는 34예요."], "explain": "채널은 고르는 게 아니라 **핀이 정해요**: ADC_POT0 → R353(0Ω) → **PTA11** → IOMUX상 **ADC1_S10**. MCAL 설정에서는 같은 입력이 **S10_ChanNum34 / Id 34**로 표시돼요. '채널 10'과 'Id 34'를 섞지 않는 게 포인트예요.", "pick": 1}, {"id": "embedded-06-22", "ch": 6, "type": "mcq", "cat": "error", "level": 2, "sec": "12. 문제 해결과 IP vs MCAL 비교", "q": "ADC 실습의 문제 해결표에서 증상과 원인의 연결로 **옳지 않은 것**은?", "options": ["값이 0 또는 최대값에 고정 — 하드웨어 평균(AvgEn)을 켜지 않음", "대기 while에서 멈춤, LCD 갱신 안 됨 — 콜백이 호출되지 않음", "값이 4095를 넘고 전압이 약 4배 — 분해능이 기본값 14-bit로 남음", "undefined reference to Adc1_Callback — 콜백 본체가 없거나 이름이 다름", "콜백은 호출되는데 main이 계속 대기 — AdcConvDone의 volatile 누락"], "answer": [0], "why": ["틀린 연결이라 정답이에요. 0/최대값 고정은 PTA11·ADC1_S10 설정이나 가변저항 연결 문제이고, 평균 미적용은 '값이 심하게 흔들림'의 원인이에요.", "슬라이드 표 그대로예요(EnableGroupNotification → Normal Interrupt Enable → Group Notification → Platform IRQ 순서로 확인).", "슬라이드 표 그대로예요(RESOLUTION_12 확인).", "슬라이드 표 그대로예요(main.c 정의와 Config Tools 이름 확인).", "슬라이드 표 그대로예요(static volatile로 선언)."], "explain": "증상 → 원인 짝: **0/최대값 고정 → 핀·채널(PTA11/ADC1_S10) 설정**, **심하게 흔들림 → 하드웨어 평균 미적용·Vref·배선 노이즈**, **4095 초과·약 4배 → 14-bit 기본값**, **while에서 멈춤 → 콜백 미호출**, **콜백은 되는데 대기 → volatile 누락**.", "pick": 1}, {"id": "embedded-06-23", "ch": 6, "type": "mcq", "cat": "read", "level": 2, "sec": "9. 실습 A — main 흐름과 LCD 표시", "q": "실습 A main()의 앞부분이다. 이 코드에 대한 설명으로 **옳은 것**은?\n```c\nstatus = (StatusType)Adc_Sar_Ip_Init(ADCHWUNIT_0_INSTANCE,\n                                     &AdcHwUnit_0);\nwhile (status != E_OK);\n\nfor (Index = 0; Index <= 5; Index++)\n{\n    status = (StatusType)Adc_Sar_Ip_DoCalibration(\n                             ADCHWUNIT_0_INSTANCE);\n    if (status == E_OK) { break; }\n}\n```", "options": ["Init이 실패하면 그 자리에서 멈추고, 보정은 성공할 때까지 최대 6번 시도한다", "보정은 성공 여부와 상관없이 항상 6번 실행된다", "보정은 최대 5번 시도한다", "Init이 실패하면 while이 Init을 다시 호출해 성공할 때까지 재시도한다"], "answer": [0], "why": ["status가 바뀌지 않으니 실패 시 영원히 멈추고, Index 0~5 → 최대 6번, 성공하면 break.", "성공하면 break로 바로 빠져나와요.", "`Index <= 5`라 0,1,2,3,4,5 → 6번이에요.", "while 본문이 비어 있고 Init 호출은 루프 밖이라 다시 부르지 않아요."], "explain": "`while (status != E_OK);`는 **본문이 빈 루프**예요. 안에서 status가 바뀌지 않으므로 Init이 실패하면 **그 자리에서 영원히 멈춰요**(일부러 진행을 막는 용도). 보정 루프는 `Index = 0 ~ 5`라 **최대 6번**, 성공하면 `break`로 빠져요.", "pick": 1}];
window.EMB_CONCEPTS = [{"ch": 1, "title": "임베디드 시스템 개요와 S32K3 UART 디버깅 환경", "summary": "임베디드 시스템의 특성과 S32K312(Cortex-M7, 메모리 맵, 클럭·부팅)의 구조를 익히고, printf 한 줄이 _write → LPUART6(PTA16) → OpenSDA VCOM → PC 터미널로 나오게 만드는 장이에요.", "sections": [{"id": "c1-embedded", "title": "임베디드 시스템의 정의와 네 가지 특성", "sec": ["1. 임베디드 시스템이란: 정의와 네 가지 특성"], "tags": ["임베디드 시스템", "자원 제약", "실시간성", "전용성", "하드웨어 의존성", "ECU"], "body": "**임베디드 시스템** = 더 큰 기계나 제품 안에 **내장**되어 **특정 기능**을 수행하는 컴퓨터 시스템이에요. PC는 사용자가 **임의의 프로그램**을 설치해 실행하지만, 임베디드는 만들 때 정해진 프로그램이 **정해진 입력을 읽고 정해진 출력을 제어**해요.\n\n| 구분 | 범용 컴퓨터(PC) | 임베디드 시스템 |\n|---|---|---|\n| 프로그램 | 사용자가 마음대로 설치 | 제품에 맞춘 전용 프로그램 |\n| 실행 | OS 위에서 바로 실행 | ELF를 Flash에 넣은 뒤 실행 |\n| 자원 | 넉넉함 | CPU·메모리·전력이 제한 |\n| 예 | 노트북, 데스크톱 | ECU, 세탁기 제어기, 드론 |\n\n### 네 가지 특성 — 특성·의미·예시 짝이 시험 포인트\n\n| 특성 | 의미 | 예시 |\n|---|---|---|\n| **자원 제약** | CPU·메모리·전력 예산이 제한됨 | MCU는 PC보다 작은 SRAM/Flash |\n| **실시간성** | 결과뿐 아니라 **마감시간 준수** | 에어백 판단은 수 ms 이내 |\n| **전용성** | 목적에 맞춘 HW/SW 구성 | 세탁기 제어기는 세탁만 제어 |\n| **하드웨어 의존성** | 핀·클럭·레지스터를 직접 제어 | TX 핀 설정 오류 시 출력 없음 |\n\n문장만 보고 특성을 구별하는 요령이에요.\n- \"SRAM이 작다\", \"전력 예산이 빠듯하다\"처럼 **양이 모자란** 이야기 → 자원 제약\n- \"수 ms 안에 끝나야 한다\"처럼 **마감시간**이 붙은 이야기 → 실시간성\n- \"세탁기 제어기는 세탁만 한다\"처럼 **목적이 하나**인 이야기 → 전용성\n- \"TX 핀 설정이 틀리면 출력이 없다\"처럼 **핀·클럭·레지스터를 직접** 다루는 이야기 → 하드웨어 의존성 (1장에서 LPUART6 핀을 잘못 고르면 터미널이 비는 게 바로 이거예요)\n\n**실시간성 ≠ 빠르다**예요. 마감이 1초면 1초 걸려도 괜찮고, 에어백은 결과가 맞아도 **늦게 터지면 실패**예요.\n\n### 사례와 응용 분야\n- 자동차 한 대에 엔진·제동·조향·인포테인먼트용 **ECU가 수십~100개 이상** 들어가고, 하나하나가 임베디드 시스템이에요. S32K3가 이런 ECU용 MCU예요.\n- 응용 분류: 자동차(엔진 제어, **ABS**, 조향, **BMS**) · 산업(**PLC**, 모터 드라이브, 로봇) · 소비자(스마트워치, 드론, 가전)\n- 이 과목 최종 프로젝트 흐름: 센서 입력 → MCU 처리(S32K312) → 모터 제어·CAN 송수신 → LCD 상태 표시. 개발 내내 보드 속 상태를 보여 주는 창구가 1장의 **printf → PC 터미널**이에요.", "tip": "\"TX 핀 설정 오류 → 출력 없음\"은 **하드웨어 의존성**, \"결과는 맞지만 마감 초과\"는 **실시간성** 위반이에요. 실시간성을 \"빠른 처리\"로 쓴 보기는 함정이에요."}, {"id": "c1-cortex", "title": "Cortex-M7 레지스터와 벡터 테이블", "sec": ["2. Cortex-M7 코어: 레지스터·예외·벡터 테이블"], "tags": ["Cortex-M7", "SP", "LR", "PC", "MSP/PSP", "벡터 테이블", "NVIC", "Thumb-2"], "body": "S32K312의 CPU 코어는 **Arm Cortex-M7** — MCU용 **32비트** 코어(**ARMv7-M**)예요. 명령어는 **Thumb-2**(16·32비트 혼용)라서 코드 밀도와 성능의 균형을 맞춰요. OS 없이도 부팅하고 인터럽트에 빠르게 반응해요.\n\n| 레지스터 | 역할 | 비유 |\n|---|---|---|\n| R0 ~ R12 | 범용 연산, 임시 데이터 | 작업대 |\n| **R13 / SP** | 스택 맨 위 주소, **MSP / PSP**로 나뉨 | 접시 더미 맨 위 |\n| **R14 / LR** | 함수 호출 후 **복귀 주소** | 책갈피 |\n| **R15 / PC** | **다음 실행 명령어 주소** | 읽는 줄 짚는 손가락 |\n| xPSR | 조건 플래그 + 예외 상태 | 상태판 |\n\n- **MSP**(Main SP): 리셋 직후·예외/인터럽트 처리 / **PSP**(Process SP): FreeRTOS 등에서 **태스크별 스택 분리**\n- 하드웨어 이벤트(핀 변화, 타이머 만료, UART 수신…)는 **예외**로 처리하고, **NVIC**가 enable·pending·우선순위·중첩을 관리해요(5장).\n\n### 함수 호출 한 번으로 보기\n1. PC는 `main()` 안의 호출 줄을 가리켜요.\n2. `BL func`가 실행되면 **돌아올 주소가 LR**에 저장되고, PC는 `func`의 첫 명령으로 바뀌어요.\n3. `func`의 지역 변수는 **스택**에 잡히고, 스택 맨 위를 **SP**가 가리켜요.\n4. `func`가 끝나면 LR의 주소로 돌아가 `main()`의 다음 줄을 실행해요.\n\n### 벡터 테이블과 리셋 흐름\n**벡터 테이블** = 예외별 핸들러 주소 배열이에요. 맨 앞 두 칸은 리셋 때 특별하게 쓰여요.\n\n```svg 벡터 테이블 — 리셋 직후 코어가 0번·1번을 꺼내 SP·PC에 넣어요\n<svg viewBox=\"0 0 680 206\" xmlns=\"http://www.w3.org/2000/svg\">\n  <text x=\"10\" y=\"22\" class=\"t-b\">벡터 테이블 = 예외별 핸들러 주소 배열<\/text>\n  <rect x=\"10\" y=\"36\" width=\"300\" height=\"34\" class=\"box-a\"/>\n  <text x=\"24\" y=\"58\" class=\"t-b\">0번<\/text>\n  <text x=\"76\" y=\"58\" class=\"t\">초기 스택 포인터 값<\/text>\n  <rect x=\"10\" y=\"70\" width=\"300\" height=\"34\" class=\"box-b\"/>\n  <text x=\"24\" y=\"92\" class=\"t-b\">1번<\/text>\n  <text x=\"76\" y=\"92\" class=\"t\">Reset handler 주소<\/text>\n  <rect x=\"10\" y=\"104\" width=\"300\" height=\"34\" class=\"box\"/>\n  <text x=\"24\" y=\"126\" class=\"t-s\">2·3번<\/text>\n  <text x=\"76\" y=\"126\" class=\"t-s\">NMI · HardFault … (참고)<\/text>\n  <rect x=\"10\" y=\"138\" width=\"300\" height=\"34\" class=\"box\"/>\n  <text x=\"24\" y=\"160\" class=\"t-s\">16번~<\/text>\n  <text x=\"76\" y=\"160\" class=\"t-s\">외부 인터럽트 IRQ · NVIC (참고)<\/text>\n  <line x1=\"312\" y1=\"53\" x2=\"458\" y2=\"53\" class=\"ln-a\" marker-end=\"url(#ah-a)\"/>\n  <text x=\"385\" y=\"46\" text-anchor=\"middle\" class=\"t-a\">리셋 시 적재<\/text>\n  <line x1=\"312\" y1=\"87\" x2=\"458\" y2=\"87\" class=\"ln-b\" marker-end=\"url(#ah-b)\"/>\n  <text x=\"385\" y=\"81\" text-anchor=\"middle\" class=\"t-a\">리셋 시 적재<\/text>\n  <rect x=\"462\" y=\"38\" width=\"210\" height=\"30\" rx=\"8\" class=\"box-a\"/>\n  <text x=\"567\" y=\"58\" text-anchor=\"middle\" class=\"t\">R13 / SP ← 스택 시작<\/text>\n  <rect x=\"462\" y=\"72\" width=\"210\" height=\"30\" rx=\"8\" class=\"box-b\"/>\n  <text x=\"567\" y=\"92\" text-anchor=\"middle\" class=\"t\">R15 / PC ← 첫 명령<\/text>\n  <text x=\"567\" y=\"130\" text-anchor=\"middle\" class=\"t-s\">→ Reset handler부터 실행<\/text>\n  <text x=\"340\" y=\"196\" text-anchor=\"middle\" class=\"t-s\">함정: 0번은 \"주소\"가 아니라 SP 초기값이에요. Reset handler는 1번!<\/text>\n<\/svg>\n```\n\n| 항목 | 들어 있는 것 | 비고 |\n|---|---|---|\n| **0번** | **초기 스택 포인터 값** | 핸들러 주소 아님 |\n| **1번** | **Reset handler 주소** | 리셋 시 PC로 |\n| 3번 | HardFault 핸들러 | 잘못된 접근 등 (5장) |\n| 16번~ | 외부 인터럽트(IRQ) | NVIC가 관리 |\n\n리셋 흐름: **Reset → Vector Table**(0번 → SP, 1번 → PC) **→ Reset Handler → Runtime Init**(startup 코드가 C 실행 환경 준비) **→ main()**. SP를 가장 먼저 정하는 이유는 C 함수가 돌려면 **스택이 바로 필요**하기 때문이에요. (2번 NMI·3번 HardFault·16번~ IRQ는 표준 Cortex-M 배치로, 슬라이드에는 0번·1번만 나와요.)", "tip": "벡터 테이블 **0번 = 초기 SP 값, 1번 = Reset handler**예요(\"0번 = Reset\"은 함정). \"LR = 다음 실행 명령어 주소\"(그건 PC), \"PSP는 리셋 직후 사용\"(그건 MSP)도 자주 나오는 오답이에요."}, {"id": "c1-s32k3", "title": "S32K3·S32K312와 차량용 안전(ASIL)", "sec": ["3. NXP S32K3와 S32K312: 차량용 MCU"], "tags": ["S32K3", "S32K312", "ECC", "Lockstep", "ASIL", "ISO 26262", "TCM"], "body": "**S32K3** = NXP의 **차량용 32비트 MCU 패밀리**로, **기능 안전(functional safety)** 요구를 고려해 설계됐어요. **MCU**는 CPU 코어·메모리·주변장치를 **칩 하나에 모두 넣은** 컴퓨터예요.\n\n```svg S32K312 안을 그림으로 — 코어·메모리·주변장치가 한 버스(한 주소 공간)에 붙어 있어요\n<svg viewBox=\"0 0 680 286\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"6\" y=\"6\" width=\"668\" height=\"232\" rx=\"14\" class=\"box-0 dash\"/>\n  <text x=\"20\" y=\"26\" class=\"t-s\">S32K312 (핵심 사양 표를 그림으로)<\/text>\n  <rect x=\"20\" y=\"36\" width=\"170\" height=\"72\" rx=\"10\" class=\"box-a\"/>\n  <text x=\"105\" y=\"60\" text-anchor=\"middle\" class=\"t-b\">Cortex-M7<\/text>\n  <text x=\"105\" y=\"80\" text-anchor=\"middle\" class=\"t-s\">최대 120 MHz 수준<\/text>\n  <text x=\"105\" y=\"97\" text-anchor=\"middle\" class=\"t-s\">ARMv7-M · Thumb-2<\/text>\n  <rect x=\"206\" y=\"36\" width=\"100\" height=\"72\" rx=\"10\" class=\"box-d\"/>\n  <text x=\"256\" y=\"60\" text-anchor=\"middle\" class=\"t-b\">TCM<\/text>\n  <text x=\"256\" y=\"80\" text-anchor=\"middle\" class=\"t-s\">저지연<\/text>\n  <text x=\"256\" y=\"97\" text-anchor=\"middle\" class=\"t-s\">코어 가까이<\/text>\n  <line x1=\"192\" y1=\"72\" x2=\"204\" y2=\"72\" class=\"ln-d\"/>\n  <rect x=\"326\" y=\"36\" width=\"108\" height=\"72\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"380\" y=\"62\" text-anchor=\"middle\" class=\"t-b\">Code Flash<\/text>\n  <text x=\"380\" y=\"84\" text-anchor=\"middle\" class=\"t-s\">프로그램 코드<\/text>\n  <rect x=\"444\" y=\"36\" width=\"108\" height=\"72\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"498\" y=\"62\" text-anchor=\"middle\" class=\"t-b\">Data Flash<\/text>\n  <text x=\"498\" y=\"84\" text-anchor=\"middle\" class=\"t-s\">설정값(비휘발)<\/text>\n  <rect x=\"562\" y=\"36\" width=\"100\" height=\"72\" rx=\"10\" class=\"box-c\"/>\n  <text x=\"612\" y=\"62\" text-anchor=\"middle\" class=\"t-b\">SRAM<\/text>\n  <text x=\"612\" y=\"84\" text-anchor=\"middle\" class=\"t-s\">변수·스택·힙<\/text>\n  <line x1=\"105\" y1=\"108\" x2=\"105\" y2=\"128\" class=\"ln\"/>\n  <line x1=\"380\" y1=\"108\" x2=\"380\" y2=\"128\" class=\"ln\"/>\n  <line x1=\"498\" y1=\"108\" x2=\"498\" y2=\"128\" class=\"ln\"/>\n  <line x1=\"612\" y1=\"108\" x2=\"612\" y2=\"128\" class=\"ln\"/>\n  <rect x=\"20\" y=\"128\" width=\"642\" height=\"20\" rx=\"6\" class=\"solid-a\"/>\n  <text x=\"341\" y=\"142\" text-anchor=\"middle\" class=\"t-w\" font-size=\"11.5\">버스 · 하나의 주소 공간 (메모리 + 주변장치 레지스터)<\/text>\n  <line x1=\"341\" y1=\"148\" x2=\"341\" y2=\"166\" class=\"ln\"/>\n  <rect x=\"20\" y=\"166\" width=\"642\" height=\"60\" rx=\"10\" class=\"box-e\"/>\n  <text x=\"36\" y=\"192\" class=\"t-b\">주변장치<\/text>\n  <text x=\"36\" y=\"210\" class=\"t-s\">제어 레지스터<\/text>\n  <rect x=\"210\" y=\"178\" width=\"66\" height=\"36\" rx=\"8\" class=\"box\"/>\n  <text x=\"243\" y=\"201\" text-anchor=\"middle\" class=\"t-s\">UART<\/text>\n  <rect x=\"284\" y=\"178\" width=\"66\" height=\"36\" rx=\"8\" class=\"box\"/>\n  <text x=\"317\" y=\"201\" text-anchor=\"middle\" class=\"t-s\">SPI<\/text>\n  <rect x=\"358\" y=\"178\" width=\"66\" height=\"36\" rx=\"8\" class=\"box\"/>\n  <text x=\"391\" y=\"201\" text-anchor=\"middle\" class=\"t-s\">I2C<\/text>\n  <rect x=\"432\" y=\"178\" width=\"66\" height=\"36\" rx=\"8\" class=\"box\"/>\n  <text x=\"465\" y=\"201\" text-anchor=\"middle\" class=\"t-s\">CAN<\/text>\n  <rect x=\"506\" y=\"178\" width=\"66\" height=\"36\" rx=\"8\" class=\"box\"/>\n  <text x=\"539\" y=\"201\" text-anchor=\"middle\" class=\"t-s\">타이머<\/text>\n  <rect x=\"580\" y=\"178\" width=\"66\" height=\"36\" rx=\"8\" class=\"box\"/>\n  <text x=\"613\" y=\"201\" text-anchor=\"middle\" class=\"t-s\">ADC<\/text>\n  <text x=\"10\" y=\"268\" class=\"t-a\">안전 장치<\/text>\n  <rect x=\"84\" y=\"250\" width=\"140\" height=\"28\" rx=\"14\" class=\"box-e\"/>\n  <text x=\"154\" y=\"269\" text-anchor=\"middle\" class=\"t-s\">메모리 ECC<\/text>\n  <rect x=\"234\" y=\"250\" width=\"200\" height=\"28\" rx=\"14\" class=\"box-e\"/>\n  <text x=\"334\" y=\"269\" text-anchor=\"middle\" class=\"t-s\">Lockstep (해당 변종)<\/text>\n  <rect x=\"444\" y=\"250\" width=\"230\" height=\"28\" rx=\"14\" class=\"box-e\"/>\n  <text x=\"559\" y=\"269\" text-anchor=\"middle\" class=\"t-s\">전압·온도·클럭 감시<\/text>\n<\/svg>\n```\n\n| 블록 | 역할 | 전원을 끄면 |\n|---|---|---|\n| Code Flash | 프로그램 코드 저장 | 유지 |\n| Data Flash | 설정값 등 비휘발성 데이터 | 유지 |\n| SRAM | 전역 변수·스택·힙 | 사라짐 |\n| TCM | 코어 가까이 있는 저지연 메모리 | 사라짐 |\n\n- CPU = Cortex-M7, **최대 120 MHz** 수준. 주변장치는 UART·SPI·I2C·CAN·타이머·ADC.\n- 메모리와 주변장치가 **같은 버스, 같은 주소 공간**에 붙어 있어요 → 4절 memory-mapped I/O.\n\n### 차량용 MCU = 안전 메커니즘\n범용 MCU와 차량용 MCU의 차이는 성능이 아니라 **안전 메커니즘**이에요. 범용 MCU에는 이런 장치가 선택적이거나 없어요.\n- **메모리 ECC**: 저장된 비트 오류를 검출·정정\n- **Lockstep**(해당 변종): 두 코어가 **같은 연산**을 수행해 결과를 **대조** (일을 나눠 빠르게 하는 게 아니에요)\n- **전압·온도·클럭 감시**: 동작 환경의 이상 검출\n\n목적은 고장을 **검출하고 안전 상태로 전환**하는 거예요. (참고: 실습용 S32K312는 코어가 하나라 Lockstep은 S32K344 같은 다른 변종 이야기예요.)\n\n### ASIL\n**ASIL**(Automotive Safety Integrity Level) = **ISO 26262**가 정한 자동차 안전 무결성 등급이에요.\n\n```svg ASIL — ISO 26262의 자동차 안전 무결성 등급\n<svg viewBox=\"0 0 680 112\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"6\" y=\"8\" width=\"150\" height=\"56\" rx=\"10\" class=\"box-c\"/>\n  <text x=\"81\" y=\"32\" text-anchor=\"middle\" class=\"t-b\">ASIL A<\/text>\n  <text x=\"81\" y=\"52\" text-anchor=\"middle\" class=\"t-s\">낮음<\/text>\n  <rect x=\"172\" y=\"8\" width=\"150\" height=\"56\" rx=\"10\" class=\"box-a\"/>\n  <text x=\"247\" y=\"42\" text-anchor=\"middle\" class=\"t-b\">ASIL B<\/text>\n  <rect x=\"338\" y=\"8\" width=\"150\" height=\"56\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"413\" y=\"42\" text-anchor=\"middle\" class=\"t-b\">ASIL C<\/text>\n  <rect x=\"504\" y=\"8\" width=\"170\" height=\"56\" rx=\"10\" class=\"box-e\"/>\n  <text x=\"589\" y=\"32\" text-anchor=\"middle\" class=\"t-b\">ASIL D<\/text>\n  <text x=\"589\" y=\"52\" text-anchor=\"middle\" class=\"t-s\">가장 엄격 · 제동·조향<\/text>\n  <line x1=\"20\" y1=\"80\" x2=\"660\" y2=\"80\" class=\"ln-e\" marker-end=\"url(#ah-e)\"/>\n  <text x=\"340\" y=\"102\" text-anchor=\"middle\" class=\"t-a\">고장 시 인명 피해가 큰 기능일수록 높은 등급 (ASIL-D 요구)<\/text>\n<\/svg>\n```\n\n- **A(낮음) ~ D(가장 엄격)** 네 단계. 제동·조향처럼 고장 시 **인명 피해**가 큰 기능은 **ASIL-D**를 요구해요.\n- 등급이 높을수록 고장 검출·대응 수단을 더 엄격하게 갖춰야 하고, S32K3는 이런 **안전 등급 달성을 지원**하도록 설계됐어요.", "tip": "**ASIL-D가 가장 엄격**(A가 가장 낮음), 표준은 **ISO 26262**예요. 차량용 vs 범용 MCU의 차이를 \"클럭 속도·성능\"이라고 한 보기는 틀려요 — 답은 **ECC·Lockstep·전압/온도/클럭 감시**."}, {"id": "c1-memmap", "title": "메모리 맵과 Memory-Mapped I/O", "sec": ["4. 메모리 맵과 Memory-Mapped I/O"], "tags": ["메모리 맵", "Code Flash", "Data Flash", "SRAM", "TCM", "Peripheral", "memory-mapped I/O"], "body": "MCU에서 **메모리 주소는 RAM만 뜻하지 않아요.** 코드·비휘발 데이터·SRAM·주변장치 레지스터가 **하나의 주소 공간**에 구역을 나눠 들어가 있고, 이 배치도가 **메모리 맵**이에요.\n\n| 영역 | 들어가는 것 | C 코드 예 |\n|---|---|---|\n| **Code Flash** | 실행 코드와 읽기 전용 데이터 | `main()`의 기계어, 읽기 전용 상수 |\n| **Data Flash** | 전원 차단 후에도 유지할 설정값 | 저장해 둘 설정값 |\n| **SRAM** | 전역 변수, 지역 변수 스택, 런타임 데이터 | 전역 변수, 지역 변수(스택) |\n| **TCM** | 빠르고 **지연이 예측 가능한** 코드/데이터 | 빠르고 일정하게 돌아야 할 코드 |\n| **Peripheral** | UART, GPIO, CAN 등의 **제어 레지스터** | LPUART6·SIUL2 레지스터 |\n\nFlash는 **전원이 꺼져도 유지**되고, SRAM은 실행 중 자유롭게 읽고 쓰지만 **전원이 꺼지면 사라져요**. 1장 슬라이드에는 영역별 구체 주소가 없어요. 2장에서 **SIUL2 블록이 `0x40290000`부터** 시작한다는 걸 직접 쓰는데, 이게 Peripheral 영역 주소의 한 예예요.\n\n### 같은 `*ptr = value;`가 다른 일을 하는 이유\n\n```svg 같은 *ptr = value; 가 주소에 따라 다르게 동작해요\n<svg viewBox=\"0 0 680 232\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"6\" y=\"78\" width=\"150\" height=\"60\" rx=\"10\" class=\"box-d\"/>\n  <text x=\"81\" y=\"104\" text-anchor=\"middle\" class=\"t-b\">*ptr = value;<\/text>\n  <text x=\"81\" y=\"124\" text-anchor=\"middle\" class=\"t-s\">같은 C 문장<\/text>\n  <path d=\"M158,100 C240,100 240,56 326,56\" class=\"ln-c\" marker-end=\"url(#ah-c)\"/>\n  <path d=\"M158,116 C240,116 240,166 326,166\" class=\"ln-e\" marker-end=\"url(#ah-e)\"/>\n  <text x=\"236\" y=\"68\" text-anchor=\"middle\" class=\"t-a\">SRAM 주소<\/text>\n  <text x=\"236\" y=\"160\" text-anchor=\"middle\" class=\"t-a\">Peripheral 주소<\/text>\n  <rect x=\"330\" y=\"14\" width=\"344\" height=\"84\" rx=\"10\" class=\"box-c\"/>\n  <text x=\"346\" y=\"40\" class=\"t-b\">SRAM 한 칸<\/text>\n  <text x=\"346\" y=\"62\" class=\"t-s\">메모리 한 칸에 값을 저장<\/text>\n  <text x=\"346\" y=\"84\" class=\"t-a\">→ 변수 값 변경<\/text>\n  <rect x=\"330\" y=\"124\" width=\"344\" height=\"84\" rx=\"10\" class=\"box-e\"/>\n  <text x=\"346\" y=\"150\" class=\"t-b\">주변장치 레지스터<\/text>\n  <text x=\"346\" y=\"172\" class=\"t-s\">하드웨어 레지스터에 값을 씀<\/text>\n  <text x=\"346\" y=\"194\" class=\"t-a\">→ 핀 전압, 송수신·인터럽트 상태가 바뀔 수 있음<\/text>\n  <text x=\"340\" y=\"226\" text-anchor=\"middle\" class=\"t-s\">CPU는 같은 load/store 명령으로 변수와 하드웨어 모두에 접근 = memory-mapped I/O<\/text>\n<\/svg>\n```\n\nCPU 입장에서 `*ptr = value;`는 **store 명령 하나**예요. 주소 뒤에 무엇이 있느냐에 따라 결과가 달라져요.\n1. `ptr`이 **SRAM 주소**면 → 메모리 한 칸에 값이 저장되어 **변수 값**이 바뀌어요.\n2. `ptr`이 **Peripheral 주소**면 → 값이 하드웨어 **레지스터**로 들어가 **핀 전압, 송수신·인터럽트 상태**가 바뀔 수 있어요.\n\n이렇게 주변장치 레지스터를 **메모리 주소처럼** 읽고 쓰는 구조가 **memory-mapped I/O**예요. 전용 I/O 명령 없이 **C 포인터만으로** 하드웨어를 제어할 수 있고, peripheral 주소에 대입하는 순간 **하드웨어 동작이 즉시** 바뀌어요. (2장: `0x4029131E`(GPDO29)에 1을 써서 D13 LED를 켜고, 이런 주소에 `volatile`이 필요한 이유를 배워요.)\n\n비유하면 아파트 호수예요. 어떤 호는 사람이 살고(메모리), 어떤 호는 기계실(주변장치)이라, 같은 \"택배 넣기\"라도 기계실에 넣으면 기계가 움직여요.", "tip": "영역–용도 바꿔치기가 단골이에요: 지역 변수 스택 = **SRAM**(Data Flash ✗), 전원이 꺼져도 남길 설정값 = **Data Flash**(TCM ✗), 읽기 전용 데이터 = **Code Flash**(Peripheral ✗)."}, {"id": "c1-clock-boot", "title": "클럭 트리와 부팅 흐름", "sec": ["5. 클럭 트리와 부팅 흐름"], "tags": ["FIRC", "SIRC", "FXOSC", "PLL", "Clock_Ip_GetClockFrequency", "BAF", "IVT"], "body": "CPU·버스·UART 등 **모든 주변장치는 클럭을 기준으로** 동작해요. 클럭이 안 들어간 모듈은 **아무 일도 하지 않아요**.\n\n```svg 클럭 트리 — 발진기 → PLL(체배) → 각 클럭\n<svg viewBox=\"0 0 680 206\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"6\" y=\"10\" width=\"186\" height=\"50\" rx=\"10\" class=\"box-a\"/>\n  <text x=\"99\" y=\"32\" text-anchor=\"middle\" class=\"t-b\">FIRC<\/text>\n  <text x=\"99\" y=\"50\" text-anchor=\"middle\" class=\"t-s\">내부 고속 RC<\/text>\n  <rect x=\"6\" y=\"70\" width=\"186\" height=\"50\" rx=\"10\" class=\"box-c\"/>\n  <text x=\"99\" y=\"92\" text-anchor=\"middle\" class=\"t-b\">SIRC<\/text>\n  <text x=\"99\" y=\"110\" text-anchor=\"middle\" class=\"t-s\">내부 저속·저전력 RC<\/text>\n  <rect x=\"6\" y=\"130\" width=\"186\" height=\"50\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"99\" y=\"152\" text-anchor=\"middle\" class=\"t-b\">FXOSC<\/text>\n  <text x=\"99\" y=\"170\" text-anchor=\"middle\" class=\"t-s\">외부 크리스털 · 정밀<\/text>\n  <rect x=\"246\" y=\"64\" width=\"130\" height=\"62\" rx=\"10\" class=\"box-d\"/>\n  <text x=\"311\" y=\"90\" text-anchor=\"middle\" class=\"t-b\">PLL<\/text>\n  <text x=\"311\" y=\"110\" text-anchor=\"middle\" class=\"t-s\">체배 → 고속 클럭<\/text>\n  <line x1=\"194\" y1=\"35\" x2=\"242\" y2=\"82\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"194\" y1=\"95\" x2=\"242\" y2=\"95\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"194\" y1=\"155\" x2=\"242\" y2=\"108\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <rect x=\"430\" y=\"10\" width=\"244\" height=\"50\" rx=\"10\" class=\"box\"/>\n  <text x=\"446\" y=\"32\" class=\"t-b\">System Clock<\/text>\n  <text x=\"446\" y=\"50\" class=\"t-s\">CM7 코어: 기준 설정 120 MHz<\/text>\n  <rect x=\"430\" y=\"70\" width=\"244\" height=\"50\" rx=\"10\" class=\"box\"/>\n  <text x=\"446\" y=\"92\" class=\"t-b\">Bus Clock<\/text>\n  <text x=\"446\" y=\"110\" class=\"t-s\">버스<\/text>\n  <rect x=\"430\" y=\"130\" width=\"244\" height=\"50\" rx=\"10\" class=\"box\"/>\n  <text x=\"446\" y=\"152\" class=\"t-b\">Peripheral Clock<\/text>\n  <text x=\"446\" y=\"170\" class=\"t-s\">예: LPUART6_CLK 30 MHz (화면)<\/text>\n  <line x1=\"378\" y1=\"82\" x2=\"426\" y2=\"35\" class=\"ln-d\" marker-end=\"url(#ah-d)\"/>\n  <line x1=\"378\" y1=\"95\" x2=\"426\" y2=\"95\" class=\"ln-d\" marker-end=\"url(#ah-d)\"/>\n  <line x1=\"378\" y1=\"108\" x2=\"426\" y2=\"155\" class=\"ln-d\" marker-end=\"url(#ah-d)\"/>\n  <text x=\"340\" y=\"200\" text-anchor=\"middle\" class=\"t-s\">슬라이드 표기: FIRC / SIRC / FXOSC → PLL → System / Bus / Peripheral Clock<\/text>\n<\/svg>\n```\n\n| 이름 | 위치 | 특징 |\n|---|---|---|\n| **FIRC** | 칩 내부 | 고속 RC 발진기 |\n| **SIRC** | 칩 내부 | 저속·저전력 RC 발진기 |\n| **FXOSC** | 외부 크리스털 | 정밀 발진기 |\n| **PLL** | 소스 뒤 단계 | 입력 클럭을 **체배**해 고속 클럭 생성 (발진기 자체가 아님) |\n\n발진기 → PLL → **System**(CM7 코어)·**Bus**·**Peripheral**(예: LPUART6_CLK) 클럭으로 나눠 공급해요.\n- CM7 코어 클럭은 RTD API로 읽어요: `Clock_
