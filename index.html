fig Tools: Pins에서 PTA11 = ADC 입력, PTC6/PTC7 = LPI2C1. Peripherals에 **Mcu · Port · Adc · Platform · I2c**를 추가하고 ADC1에 normal group **AdcGroup_POT**을 만들어요.\n\n| 설정 | 값 | 의미 · 함정 |\n|---|---|---|\n| AdcHwUnit > Conversion resolution | **RESOLUTION_12** | 기본 RESOLUTION_14 → 약 4배 |\n| AdcHwUnit > Bypass resolution processing | false (기본) | 12-bit 값으로 변환 |\n| Channel > Physical Channel Name / Id | S10_ChanNum34 / **34** | 10 ✗ |\n| Channel > Adc Channel Resolution | 비워 둠 (기본) | NXP에선 미사용 |\n| AdcGeneral > Adc Result Alignment | ADC_ALIGN_RIGHT (기본) | WLSIDE=0, 드라이버 전체에 하나 |\n| Group > Conversion Mode / Trigger | ONESHOT / TRIGG_SRC_SW | 한 번 시작 → 결과 1개 |\n| Group > Adc Group Notification | **Adc1_Callback** | 완료 때 ISR이 부를 콜백 |\n| AdcHwUnit > AdcNormalConvTimings | **컨테이너 추가** | optional — 없으면 평균 꺼짐 |\n| AdcNormalConvTimings > Average | true / SAMPLES_8 | AVGEN=1, AVGS=01b |\n| AdcGeneral > Adc Notification Capability | true (기본) | false면 콜백 항목 편집 불가 |\n| Adc Normal Interrupt Enable | **true (기본 false)** | normal 완료 ISR 코드 생성 |\n| Platform > PlatformIsrConfig | ADC1_IRQn · Enabled · Adc_Sar_1_Isr | 완료 IRQ를 RTD ISR로 |\n| Mcu > McuPeripheral > ADC_1 | Peripheral Clock Enable | ADC1에 클럭 공급 |\n\n`ConfigTimeSupport = VARIANT-PRE-COMPILE`이라 `Adc_Init(NULL_PTR)`처럼 간소화돼요.\n\n### Adc Conversion Time Once — 평균은 어디에?\n| AutosarExt > Time Once | ✅ true (기본값) | 🔁 false |\n|---|---|---|\n| 쓰이는 설정 | hardware unit의 **AdcNormalConvTimings** | group의 **AdcGroupConversionConfiguration** |\n| 설정 단위 | hardware unit에 한 값 | group마다 다른 값 |\n| 기록 시점 | **Adc_Init() 때 한 번** | **group 변환 시작마다** |\n| 장점 | 레지스터를 다시 안 씀 | group별 평균 횟수 |\n\n- true일 때 group의 Adc Group Hardware Average는 **편집할 수 없어요**. 이 실습은 기본값(true)을 유지하고 hardware unit 쪽에 평균 8회를 켜요.\n- Time Once = true여도 **group은 필요해요**. 변환 API가 모두 group을 인자로 받고(`Adc_StartGroupConversion(AdcGroup_POT)`), 설정에도 group이 **최소 1개** 있어야 해요.\n- p.61 주의(코드 분석 결과): Time Once = false에서 평균을 끈 group은 평균을 **끄지 않아서**, 평균을 켠 group을 실행한 뒤엔 평균을 끈 group도 평균된 값을 읽을 수 있어요.\n\n슬라이드 p.51의 `MCU_Init()` 표기는 오타이고 실제 API는 `Mcu_Init()`처럼 **Mcu_** 표기예요. 슬라이드 하단 번호는 58 다음이 60이라 그 뒤는 PDF 쪽수보다 1 커요.", "tip": "구조 순서 **하드웨어 유닛 → 채널 → 그룹**. Time Once = true(기본) → 평균은 **AdcNormalConvTimings**, **Adc_Init() 때 한 번**. 기본값 함정: 분해능 **RESOLUTION_14**, Normal Interrupt Enable **false**, AdcNormalConvTimings **없으면 평균 꺼짐**."}, {"id": "c6-mcalcb", "title": "실습 B — 콜백 경로와 MCAL 코드", "sec": ["11. 실습 B — 콜백 경로와 MCAL 코드"], "tags": ["ADC1_IRQn", "Adc_Sar_1_Isr", "Adc1_Callback", "Adc_EnableGroupNotification", "Adc_SetupResultBuffer", "volatile", "ADC_STREAM_COMPLETED"], "body": "변환 한 번의 흐름 — main은 플래그만 기다리고, 완료는 ISR → 콜백이 알려 줘요.\n1. main: `AdcConvDone = FALSE` → `Adc_StartGroupConversion(AdcGroup_POT)` → ADC1이 8회 평균 변환\n2. main은 `while (FALSE == AdcConvDone)`에서 대기\n3. 완료 → **ADC1_IRQn → Adc_Sar_1_Isr** → RTD normal ISR이 결과 저장, group 상태 = **ADC_STREAM_COMPLETED**\n4. ISR이 Group Notification **Adc1_Callback()** 호출 → `AdcConvDone = TRUE`\n5. main: `Adc_ReadGroup(AdcGroup_POT, AdcResultBuffer)` → `AdcResultBuffer[0]` = hw_avg\n\n```c\nstatic Adc_ValueGroupType AdcResultBuffer[1U];\nstatic volatile boolean AdcConvDone = FALSE;   /* 콜백(ISR)과 main이 함께 씀 */\n\nvoid Adc1_Callback(void)          /* AdcGroup_POT 완료 시 ADC1 ISR 안에서 호출 */\n{\n    AdcConvDone = TRUE;           /* 플래그만 세우고 바로 끝낸다 */\n}\n\nstatic uint16_t ReadPotAdcMcal(void)\n{\n    AdcConvDone = FALSE;\n    Adc_StartGroupConversion(AdcGroup_POT);\n    while (FALSE == AdcConvDone) { }\n    (void)Adc_ReadGroup(AdcGroup_POT, AdcResultBuffer);\n    return (uint16_t)AdcResultBuffer[0U];\n}\n```\n\n### 콜백이 불리려면 고리 네 개가 모두 필요\n| 고리 | 어디서 | 하는 일 |\n|---|---|---|\n| ① 인터럽트 등록 | Platform: ADC1_IRQn → Adc_Sar_1_Isr | 완료 IRQ를 RTD ISR로 연결 |\n| ② ISR 코드 생성 | Adc Normal Interrupt Enable = true | normal 완료 처리 코드 생성 |\n| ③ 콜백 이름 | Adc Group Notification = Adc1_Callback | ISR이 부를 함수 지정 |\n| ④ 허용 호출 | `Adc_EnableGroupNotification()` | Init 직후 꺼진 알림 켜기 |\n\n하나라도 빠지면 콜백이 안 불리고 main은 while에서 **영원히 멈춰요**. ④는 코드라서 놓치기 쉬워요.\n\n### 콜백 작성 규칙 (p.63)\n- 형식은 **`void 함수(void)`**(Adc_NotifyType). 선언은 `Adc_PBcfg.h`에 **자동 생성**, 본체는 **main.c**에 직접 써요.\n- 이름이 Config Tools의 Notification과 **철자가 다르면** 링크 오류 **undefined reference**예요.\n- 콜백은 **ISR 안**에서 돌아요. 플래그만 세우고 끝내고, LCD 출력처럼 오래 걸리는 일은 금지예요.\n\n### volatile과 FALSE 먼저\n- `volatile`이 없으면 컴파일러가 while 안에서 `AdcConvDone`을 한 번만 읽고 재사용할 수 있어요 → 콜백은 불리는데 main이 계속 대기.\n- 시작 전에 `AdcConvDone = FALSE;`로 먼저 내려야 지난번 TRUE로 while을 그냥 통과하지 않아요.\n- `AdcResultBuffer[1U]`는 group에 채널이 하나라 원소 1개, 값은 이미 HW 8회 평균이에요.\n\n### 초기화 순서 (p.67)\n```c\nPlatform_Init(NULL_PTR);\nPort_Init(NULL_PTR);\nAdc_Init(NULL_PTR);\nLcd1602_Init(LCD_ADDR);\nAdcFilter_Init(&AdcFilter);\n(void)Adc_SetupResultBuffer(AdcGroup_POT, AdcResultBuffer);  /* 결과 버퍼 등록 */\nAdc_EnableGroupNotification(AdcGroup_POT);                   /* 콜백 허용 */\n```\n루프 본문은 실습 A와 같고 `ReadPotAdcIp()` 자리만 `ReadPotAdcMcal()`로 바뀌어요. 실행 확인 때는 `Adc1_Callback()`에 breakpoint를 걸어 콜백이 불리는지 먼저 봐요.\n\n교재(101–102쪽)는 notification을 끄고 `while (ADC_STREAM_COMPLETED != Adc_GetGroupStatus(ADC_GROUP_POT))`로 **폴링**해요(심볼 `ADC_GROUP_POT`). 두 방식 모두 ISR이 group 상태를 바꾸므로 **ADC1_IRQn · Adc_Sar_1_Isr 등록이 필요**해요. 시험은 **슬라이드(콜백)** 기준이에요.", "tip": "경로 **ADC1_IRQn → Adc_Sar_1_Isr → RTD normal ISR(결과 저장, ADC_STREAM_COMPLETED) → Adc1_Callback**. \"Adc_Init()만 하면 콜백이 불린다\" ✗ → **Adc_EnableGroupNotification(AdcGroup_POT)**. undefined reference = 본체 없음·이름 다름, 콜백은 되는데 대기 = **volatile 누락**."}, {"id": "c6-compare", "title": "문제 해결과 IP vs MCAL 비교", "sec": ["12. 문제 해결과 IP vs MCAL 비교"], "tags": ["ENDCHAIN 폴링", "group 콜백", "Adc_Sar_Ip_PBcfg.h", "Adc_PBcfg.h", "증상 → 원인", "섞지 않기"], "body": "두 실습의 LCD 화면은 **똑같아요**. 차이는 \"변환을 어떻게 시작하고, 끝난 걸 어떻게 아느냐\"뿐이에요.\n\n| 비교 | 🔩 실습 A — IP Layer | 🚗 실습 B — MCAL |\n|---|---|---|\n| API | `Adc_Sar_Ip_*` 직접 호출 | `Adc_StartGroupConversion` · `Adc_ReadGroup` |\n| 단위 | ADC1 **config 객체 + channel index** | **group** `AdcGroup_POT` |\n| 완료 확인 | **ENDCHAIN flag 폴링** | **Adc1_Callback** + volatile 플래그 |\n| ADC 인터럽트 | **사용 안 함** | **ADC1_IRQn → Adc_Sar_1_Isr** 필수 |\n| 생성 헤더 | `Adc_Sar_Ip_PBcfg.h` | `Adc_PBcfg.h` |\n\n| 공통으로 쓰는 것 | 값 |\n|---|---|\n| 입력 · 분해능 | PTA11 = ADC1_S10, 12-bit (기본 14-bit 주의) |\n| 하드웨어 평균 | 8회 (AVGEN=1, AVGS=01b) |\n| 소프트웨어 필터 | `adc_filter.h/.c` 수정 없이 재사용 |\n| 표시 | `lcd1602` (4장), `× 5000 / 4095` 환산 |\n\n한 프로젝트 안에서 둘을 **섞지 않아요**. 실습 A에 `AdcGroup_POT`·`Adc_*`를, 실습 B에 `Adc_Sar_Ip_*` 호출과 IP config 객체를 넣으면 안 돼요(p.27).\n\n### 증상으로 원인 찾기 (p.48 · 70 · 71)\n| 증상 | 가능한 원인 | 확인 · 조치 |\n|---|---|---|\n| 값이 0 또는 최대값에 고정 | PTA11 / ADC1_S10 설정, 가변저항 연결 | Pins 입력 설정, 채널 |\n| 값이 심하게 흔들림 | HW 평균 미적용, Vref · 배선 노이즈 | AvgEn / AdcNormalConvTimings, 전원 · GND |\n| 4095 초과, 전압 약 4배 | 분해능이 기본 14-bit | RESOLUTION_12 |\n| 심볼 미정의 | 생성 심볼 이름 불일치 | 생성 헤더의 실제 심볼 |\n| while에서 멈춤, LCD 갱신 안 됨 | 콜백이 호출되지 않음 | 아래 4단계 차례로 |\n| 콜백은 되는데 main 대기 | volatile 누락 | `static volatile`로 선언 |\n\n대기 while에서 멈출 때 확인 순서(p.71):\n1. **Adc_EnableGroupNotification**을 main.c에서 호출했나\n2. **Adc Normal Interrupt Enable**을 true로 바꿨나 (기본 false)\n3. **Adc Group Notification**을 Adc1_Callback으로 지정했나\n4. **Platform IRQ** ADC1_IRQn → Adc_Sar_1_Isr, Enabled인가\n\n\"흔들림\" 조치는 실습 A는 **AvgEn = TRUE 확인, N 늘리기, 전원·GND 확인**, 실습 B는 **AdcNormalConvTimings 확인, HW와 MA를 함께 기록해 비교**예요.\n\n6.10 정리(p.72): 이 장의 핵심은 ADC 값을 읽는 것이 아니라 **raw 값을 관찰하고, 필터를 적용하고, 표시값의 의미를 해석하는 것**이에요. 숫자는 센서·회로·기준전압·샘플링 조건·필터링의 결과예요.", "tip": "완료 확인 IP = **flag 폴링**(ADC IRQ 없음), MCAL = **group 콜백**(ADC1_IRQn 필수) — 짝을 바꾼 보기 ✗. \"4095 초과·약 4배\" → **분해능 14-bit**, \"0 또는 최대값 고정\" → **PTA11 / ADC1_S10 설정**."}]}];</script>
<script>/* 공용: 이스케이프 · 인라인 마크다운 · C 코드 색(줄 번호) · C 정수식 계산기 · 레지스터 비트/타이밍 그림 */
window.EMBLIB = (function () {
  'use strict';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function inl(s) {

  const num = (s, d) => { try { return evalC(s); } catch (e) { return d; } };
  const h2 = v => '0x' + (v >>> 0).toString(16).toUpperCase().padStart(2, '0');
  const kv = rows => `<dl class="kvs">${rows.map(([k, v, note]) => `<div><dt>${k}</dt><dd>${v}${note ? `<small>${note}</small>` : ''}</dd></div>`).join('')}</dl>`;
  const wave = src => { const r = renderWave(src); return `<figure class="fig">${r.svg}</figure>`; };

  /* 1. 비트 연산기 (2장) */
  function bits(el) {
    const S = { v: 0xF3, w: 32, log: [] };
    el.innerHTML = `<div class="tl-row"><label class="fld">레지스터 값<input data-k="val" value="0x000000F3" spellcheck="false" autocomplete="off"></label>
      <label class="fld sm">폭<select data-k="w"><option>8</option><option>16</option><option selected>32</option></select></label></div>
      <div data-o="grid"></div>
      <div class="tl-row ops"><label class="fld sm">n<input data-k="n" value="4" inputmode="numeric"></label>
        <button class="btn" data-op="set">set <code>|= (1u&lt;&lt;n)</code></button><button class="btn" data-op="clear">clear <code>&amp;= ~(1u&lt;&lt;n)</code></button><button class="btn" data-op="toggle">toggle <code>^= (1u&lt;&lt;n)</code></button></div>
      <div class="tl-row ops"><label class="fld">필드 mask<input data-k="mask" value="0xF" spellcheck="false"></label><label class="fld">새 값<input data-k="fv" value="0x0" spellcheck="false"></label>
        <button class="btn" data-op="field">필드 쓰기 <code>(reg &amp; ~mask) | val</code></button></div>
      <div class="term" data-o="log"></div><p class="hint">비트 칸을 눌러도 바뀌어요. 값 칸에는 <code>0xF3 &amp; ~(1u&lt;&lt;4)</code> 같은 C 식도 돼요.</p>`;
    const q = s => el.querySelector(s);
    function draw(prev) {
      const m = S.w === 32 ? 0xFFFFFFFF : (1 << S.w) - 1; S.v = (S.v & m) >>> 0;
      q('[data-o="grid"]').innerHTML = bitGrid(S.v, S.w, prev, true) + kv([['16진수', `<code>${hex(S.v, S.w / 4)}</code>`], ['10진수', `<code>${S.v}</code>`], ['2진수', `<code>${(S.v >>> 0).toString(2).padStart(S.w, '0').replace(/(.{4})(?=.)/g, '$1 ')}</code>`]]);
      q('[data-o="log"]').innerHTML = S.log.slice(-6).map(l => `<div>${l}</div>`).join('') || '<div class="mut">// 연산을 누르면 C 코드와 결과가 여기 쌓여요</div>';
    }
    function apply(code, nv) { const prev = S.v; S.log.push(`<span class="c">${esc(code)}</span>  <span class="mut">// ${hex(prev, S.w / 4)} → </span><b>${hex(nv, S.w / 4)}</b>`); S.v = nv >>> 0; q('[data-k="val"]').value = hex(S.v, S.w / 4); draw(prev); }
    el.addEventListener('input', e => { const k = e.target.dataset.k; if (k === 'val') { const v = num(e.target.value, null); e.target.classList.toggle('bad', v == null); if (v != null) { S.v = v; draw(); } } });
    el.addEventListener('change', e => { if (e.target.dataset.k === 'w') { S.w = +e.target.value; draw(); } });
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-bit]'); if (b) { const n = +b.dataset.bit; apply(`reg ^= (1u << ${n});`, S.v ^ (1 << n)); return; }
      const o = e.target.closest('[data-op]'); if (!o) return;
      const n = Math.min(S.w - 1, Math.max(0, num(q('[data-k="n"]').value, 0)));
      if (o.dataset.op === 'set') apply(`reg |= (1u << ${n});`, S.v | (1 << n));
      if (o.dataset.op === 'clear') apply(`reg &= ~(1u << ${n});`, S.v & ~(1 << n));
      if (o.dataset.op === 'toggle') apply(`reg ^= (1u << ${n});`, S.v ^ (1 << n));
      if (o.dataset.op === 'field') { const mk = num(q('[data-k="mask"]').value, 0), fv = num(q('[data-k="fv"]').value, 0); apply(`reg = (reg & ~${hex(mk, 1)}u) | ${hex(fv, 1)}u;`, (S.v & ~mk) | (fv & mk)); }
    });
    draw();
  }

  /* 2. SIUL2 주소 계산기 (2장 · 3장) */
  function siul2(el) {
    el.innerHTML = `<div class="tl-row"><label class="fld sm">포트<select data-k="p"><option>A</option><option>B</option><option>C</option><option>D</option></select></label><label class="fld sm">핀 (0~31)<input data-k="pin" value="29" inputmode="numeric"></label></div><div data-o="out"></div>`;
    const q = s => el.querySelector(s);
    function draw() {
      const p = 'ABCD'.indexOf(q('[data-k="p"]').value), pin = Math.min(31, Math.max(0, parseInt(q('[data-k="pin"]').value, 10) || 0));
      const n = p * 32 + pin, name = 'PT' + 'ABCD'[p] + pin;
      const mscr = 0x40290240 + 4 * n, off = 0x1300 + (n & ~3) + (3 - (n & 3)), wrong = 0x1300 + n;
      const wrongN = (wrong - 0x1300 & ~3) + (3 - ((wrong - 0x1300) & 3));
      const base = 0x1300 + (n & ~3);
      const cells = [0, 1, 2, 3].map(k => { const gi = (n & ~3) + (3 - k); return `<div class="cell${gi === n ? ' hit' : ''}"><small>${hex(base + k, 4).replace('0x', '0x')}</small><b>GPDO${gi}</b></div>`; }).join('');
      const half = pin < 16 ? `PT${'ABCD'[p]}_L_HALF` : `PT${'ABCD'[p]}_H_HALF`;
      q('[data-o="out"]').innerHTML = kv([
        ['핀', `<b>${name}</b>`, `MSCR/GPDO 인덱스 n = 포트×32 + 핀 = ${p}×32 + ${pin}`],
        ['인덱스 n', `<code>${n}</code>`],
        ['MSCR n 주소', `<code>${hex(mscr)}</code>`, `0x40290000 + 0x240 + 4×${n}  (32비트 레지스터)`],
        ['GPDO n 오프셋', `<code>${hex(off, 4)}</code> → <code>${hex(0x40290000 + off)}</code>`, `0x1300 + (n & ~3) + (3 − (n & 3)) · 8비트(uint8_t) 접근`],
        ['흔한 오답', `<code>0x1300 + n = ${hex(wrong, 4)}</code>`, `그 칸은 실제로 GPDO${wrongN} 이에요`],
        ['IPL (3장)', `<code>Siul2_Dio_Ip_WritePin(${half}, ${pin % 16}U, 1U)</code>`, `16핀씩 나눈 half + 그 안의 번호(${pin} ${pin >= 16 ? '− 16 = ' + (pin - 16) : ''})`],
      ]) + `<div class="sub-h">GPDO는 4바이트 묶음 안에서 거꾸로 놓여요 (${hex(base, 4)} ~ ${hex(base + 3, 4)})</div><div class="cells">${cells}</div>`;
    }
    el.addEventListener('input', draw); el.addEventListener('change', draw); draw();
  }

  /* 3. UART 프레임 (1장) */
  function uart(el) {
    el.innerHTML = `<div class="tl-row"><label class="fld">보낼 문자열<input data-k="s" value="K" spellcheck="false"></label><label class="fld sm">baud<select data-k="b"><option>9600</option><option selected>115200</option></select></label><label class="chk"><input type="checkbox" data-k="crlf"> 끝에 \\r\\n</label></div><div data-o="out"></div>`;
    const q = s => el.querySelector(s);
    function draw() {
      const s = q('[data-k="s"]').value || 'K', b = +q('[data-k="b"]').value, crlf = q('[data-k="crlf"]').checked;
      const c = s.charCodeAt(0) & 0xFF, bitsL = [...Array(8)].map((_, i) => (c >> i) & 1);
      const len = [...new TextEncoder().encode(s)].length + (crlf ? 2 : 0);
      const tb = 1e6 / b, tc = tb * 10, total = tc * len;
      const src = `TX: 10${bitsL.join('')}11\n구간: x${'='.repeat(10)}x | Start,D0,D1,D2,D3,D4,D5,D6,D7,Stop\n@span 1-1 0(Low)\n@span 10-10 1(High)`;
      q('[data-o="out"]').innerHTML = kv([
        [`'${esc(s[0])}'`, `<code>${h2(c)}</code> = <code>${c.toString(2).padStart(8, '0')}</code>`, '보통 쓰는 순서(MSB → LSB)'],
        ['선에 나가는 순서', `<code>0 ${bitsL.join('')} 1</code>`, 'Start(0) → 데이터 LSB 먼저 → Stop(1) · 8N1 = 1문자 10비트'],
      ]) + wave(src) + kv([
        ['1비트', `${tb.toFixed(2)} µs`, `1 / ${b}`],
        ['1문자', `${tc.toFixed(1)} µs`, '10비트 (8비트만 세면 오답)'],
        ['초당 문자', `${(b / 10).toLocaleString()} 자`],
        [`전체 ${len}바이트`, `<b>${total >= 1000 ? (total / 1000).toFixed(2) + ' ms' : total.toFixed(1) + ' µs'}</b>`, `${len} × 10비트 / ${b}`],
      ]);
    }
    el.addEventListener('input', draw); el.addEventListener('change', draw); draw();
  }

  /* 4. I2C · LCD 바이트 (4장) */
  function i2c(el) {
    el.innerHTML = `<div class="sub-h">① 7-bit 주소 → 버스 첫 바이트</div><div class="tl-row"><label class="fld sm">7-bit 주소<input data-k="a" value="0x27" spellcheck="false"></label></div><div data-o="a"></div>
      <div class="sub-h">② PCF8574로 보내는 바이트 (IPL <code>Lcd1602_Putc</code> / <code>WriteCommand</code>)</div>
      <div class="tl-row"><label class="fld sm">종류<select data-k="m"><option value="d">문자 (RS=1)</option><option value="c">명령 (RS=0)</option></select></label><label class="fld sm">값<input data-k="v" value="S" spellcheck="false"></label><label class="chk"><input type="checkbox" data-k="bl" checked> 백라이트(BL)</label></div><div data-o="b"></div>
      <div class="sub-h">③ <code>Lcd1602_SetCursor(row, col)</code></div><div class="tl-row"><label class="fld sm">row<select data-k="r"><option>0</option><option>1</option></select></label><label class="fld sm">col<input data-k="c" value="3" inputmode="numeric"></label></div><div data-o="c"></div>`;
    const q = s => el.querySelector(s);
    const P = ['RS', 'RW', 'E', 'BL', 'D4', 'D5', 'D6', 'D7'];
    const row = (v, label) => `<tr><td><code>${h2(v)}</code></td>${[7, 6, 5, 4, 3, 2, 1, 0].map(b => `<td class="${(v >> b) & 1 ? 'on' : ''}">${(v >> b) & 1}</td>`).join('')}<td>${label}</td></tr>`;
    function draw() {
      const a = num(q('[data-k="a"]').value, 0x27) & 0x7F;
      q('[data-o="a"]').innerHTML = kv([['쓰기 (W=0)', `<code>${h2(a << 1)}</code>`, `(${h2(a)} &lt;&lt; 1) | 0`], ['읽기 (R=1)', `<code>${h2((a << 1) | 1)}</code>`, `(${h2(a)} &lt;&lt; 1) | 1`], ['API에 넣는 값', `<code>Lpi2c_Ip_MasterSetSlaveAddr(1U, ${h2(a)}U, FALSE)</code>`, '7-bit 그대로 · 밀기와 R/W는 하드웨어가 붙여요' + (a < 3 || a > 0x77 ? ' · 스캐너 범위(0x03~0x77) 밖' : '')]]);
      const mode = q('[data-k="m"]').value, raw = q('[data-k="v"]').value;
      const v = mode === 'd' ? (raw.charCodeAt(0) || 0) & 0xFF : num(raw, 0x01) & 0xFF;
      const rs = mode === 'd' ? 1 : 0, bl = q('[data-k="bl"]').checked ? 0x08 : 0;
      const hi = v & 0xF0, lo = (v << 4) & 0xF0, base = bl | rs;
      const seq = [[hi | base | 0x04, '상위 니블 · E=1'], [hi | base, '상위 니블 · E=0 (하강 에지에 LCD가 읽음)'], [lo | base | 0x04, '하위 니블 · E=1'], [lo | base, '하위 니블 · E=0']];
      q('[data-o="b"]').innerHTML = `<p class="hint">${mode === 'd' ? `'${esc(raw[0] || '')}' = <code>${h2(v)}</code>` : `명령 <code>${h2(v)}</code>`} → 상위 니블 <code>${h2(hi)}</code>, 하위 니블 <code>${h2(lo)}</code> · 핀 배치 P0=RS, P1=R/W, P2=E, P3=BL, P4~P7=D4~D7</p>
        <div class="tbl"><table class="bt"><tr><th>바이트</th>${[7, 6, 5, 4, 3, 2, 1, 0].map(b => `<th>P${b}<small>${P[b]}</small></th>`).join('')}<th>의미</th></tr>${seq.map(s => row(s[0], s[1])).join('')}</table></div>
        <p class="hint">IPL 버전은 글자 1개에 I2C write <b>4번</b>이에요. 수업의 MCAL 버전은 니블마다 한 번 더 써서 <b>6번</b>이에요.</p>`;
      const r = +q('[data-k="r"]').value, c0 = parseInt(q('[data-k="c"]').value, 10) || 0, c = Math.min(15, Math.max(0, c0));
      q('[data-o="c"]').innerHTML = kv([['명령', `<code>${h2(0x80 | (r ? 0x40 : 0) | c)}</code>`, `0x80 | ${r ? '0x40' : '0x00'} | ${c}${c0 > 15 ? ' (col ≥ 16 → 15)' : ''} · 2행 DDRAM은 0x40부터`]]);
    }
    el.addEventListener('input', draw); el.addEventListener('change', draw); draw();
  }

  /* 5. 인터럽트 번호 (5장) */
  function irq(el) {
    el.innerHTML = `<div class="sub-h">① IRQ 번호 → 벡터 테이블</div><div class="tl-row"><label class="fld sm">IRQ n<input data-k="n" value="53" inputmode="numeric"></label></div><div data-o="a"></div>
      <div class="sub-h">② EIRQ → NVIC 벡터 묶음 (SIUL2)</div><div class="tl-row"><label class="fld sm">EIRQ (0~31)<input data-k="e" value="13" inputmode="numeric"></label></div><div data-o="b"></div>
      <div class="sub-h">③ 우선순위 비교 (Cortex-M)</div><div class="tl-row"><label class="fld sm">A 우선순위<input data-k="pa" value="10" inputmode="numeric"></label><label class="fld sm">B 우선순위<input data-k="pb" value="3" inputmode="numeric"></label></div><div data-o="c"></div>`;
    const q = s => el.querySelector(s); const iv = k => Math.max(0, parseInt(q(`[data-k="${k}"]`).value, 10) || 0);
    function draw() {
      const n = iv('n'), vec = 16 + n;
      q('[data-o="a"]').innerHTML = kv([['벡터 번호', `<code>${vec}</code>`, `16 + ${n} · 0~15는 코어 예외(0 = 초기 MSP, 1 = Reset, 2 = NMI, 3 = HardFault)`], ['테이블 위치', `<code>${hex(vec * 4, 4)}</code>`, `벡터 1개 = 4바이트 → ${vec} × 4`]]);
      const e = Math.min(31, iv('e')), g = e >> 3;
      q('[data-o="b"]').innerHTML = kv([['묶음', `EIRQ ${g * 8} ~ ${g * 8 + 7}`, '32개 EIRQ가 8개씩 OR 되어 NVIC 벡터 4개(IRQ 53~56)로 들어가요'], ['NVIC 소스', `<code>SIUL_${g}_IRQn</code>`], ['핸들러', `<code>SIUL2_EXT_IRQ_${g * 8}_${g * 8 + 7}_ISR</code>`, g === 1 ? '수업 실습: PTB26 = EIRQ13 → 이 핸들러' : '같은 규칙으로 붙은 이름 (수업 실습은 8_15)']]);
      const a = iv('pa'), b = iv('pb');
      q('[data-o="c"]').innerHTML = `<p class="res-line">${a === b ? '우선순위가 같으면 서로 끼어들지 못해요 (먼저 들어온 쪽이 끝난 뒤 처리, 동시에 오면 IRQ 번호가 작은 쪽 먼저)' : `<b>${a < b ? 'A' : 'B'}</b>가 더 높아요 — Cortex-M은 <b>숫자가 작을수록</b> 높은 우선순위. ${a < b ? 'A' : 'B'} 실행 중엔 ${a < b ? 'B' : 'A'}가 기다리고, ${a < b ? 'B' : 'A'} 실행 중에 ${a < b ? 'A' : 'B'}가 오면 끼어들어요(선점).`}</p>`;
    }
    el.addEventListener('input', draw); draw();
  }

  /* 6. ADC 계산기 + 이동 평균 (6장) */
  function adc(el) {
    el.innerHTML = `<div class="sub-h">① 코드 ↔ 전압 (수업 코드: 정수 계산)</div>
      <div class="tl-row"><label class="fld sm">분해능<select data-k="r"><option>8</option><option>10</option><option selected>12</option><option>14</option></select></label><label class="fld sm">Vref (mV)<select data-k="vr"><option selected>5000</option><option>3300</option></select></label><label class="fld sm">ADC 코드<input data-k="code" value="2047" inputmode="numeric"></label><label class="fld sm">전압 (mV)<input data-k="mv" value="1250" inputmode="numeric"></label></div><div data-o="a"></div>
      <div class="sub-h">② 평균 횟수</div><div class="tl-row"><label class="fld sm">MCR[AVGS]<select data-k="avgs"><option value="0">00b</option><option value="1" selected>01b</option><option value="2">10b</option><option value="3">11b</option></select></label><label class="fld sm">SW 이동 평균 N<input data-k="n" value="8" inputmode="numeric"></label></div><div data-o="b"></div>
      <div class="sub-h">③ <code>AdcFilter_Update()</code> 따라가기</div><div class="tl-row"><label class="fld wide">들어오는 값 (쉼표로)<input data-k="xs" value="1000, 1000, 1000, 3000, 3000" spellcheck="false"></label></div><div data-o="c"></div>`;
    const q = s => el.querySelector(s); const iv = k => Math.max(0, parseInt(q(`[data-k="${k}"]`).value, 10) || 0);
    function draw() {
      const r = +q('[data-k="r"]').value, vr = +q('[data-k="vr"]').value, max = (1 << r) - 1;
      const code = Math.min(max, iv('code')), mvIn = iv('mv');
      const mv = Math.floor(code * vr / max), back = Math.min(max, Math.floor(mvIn * max / vr));
      q('[data-o="a"]').innerHTML = kv([
        ['코드 범위', `0 ~ <code>${max}</code>`, `${1 << r}단계 (최댓값은 2^${r} − 1)`],
        ['1 LSB', `${(vr / max).toFixed(3)} mV`, `Vref / ${max}`],
        [`코드 ${code} →`, `<b>${mv} mV</b> → LCD <code>Voltage: ${Math.floor(mv / 1000)}.${String(mv % 1000).padStart(3, '0')}</code>`, `mv = (code × ${vr}U) / ${max}U · 정수 나눗셈이라 버림`],
        [`${mvIn} mV →`, `코드 <code>${back}</code>`, `mV × ${max} / ${vr} (버림)`],
      ]);
      const hw = 1 << (2 + +q('[data-k="avgs"]').value), n = Math.max(1, iv('n'));
      q('[data-o="b"]').innerHTML = kv([['HW 묶음 평균', `<b>${hw}</b>회`, '2^(2 + AVGS) · AVGS는 횟수가 아니라 코드'], ['SW 이동 평균', `최근 <b>${n}</b>개`], ['filtered 값 1개에 든 변환', `<b>${hw * n}</b>회`, `${hw} × ${n}`]]);
      const xs = q('[data-k="xs"]').value.split(/[,\s]+/).filter(Boolean).map(x => Math.min(65535, Math.max(0, parseInt(x, 10) || 0))).slice(0, 40);
      const buf = new Array(n).fill(0); let sum = 0, idx = 0, cnt = 0; const rows = [];
      xs.forEach((x, k) => { sum -= buf[idx]; buf[idx] = x; sum += x; const at = idx; idx = (idx + 1) % n; if (cnt < n) cnt++; rows.push(`<tr><td>${k + 1}</td><td>${x}</td><td>buf[${at}]</td><td>${sum}</td><td>${cnt}</td><td><b>${Math.floor(sum / cnt) & 0xFFFF}</b></td></tr>`); });
      q('[data-o="c"]').innerHTML = `<div class="tbl"><table class="bt"><tr><th>#</th><th>sample</th><th>넣은 칸</th><th>sum</th><th>count</th><th>반환</th></tr>${rows.join('')}</table></div><p class="hint">sum = sum − 가장 오래된 값 + 새 값, 처음 N번은 채운 개수(count)로만 나눠요. 값이 갑자기 바뀌면 N번을 더 읽어야 따라가요.</p>`;
    }
    el.addEventListener('input', draw); el.addEventListener('change', draw); draw();
  }

  /* 7. IPL ↔ MCAL 짝 (3~6장) */
  const PAIRS = [
    [3, 'LED 핀 설정', '`Siul2_Port_Ip_Init(NUM_OF_CONFIGURED_PINS_…, g_pin_mux_InitConfigArr_…)`', '`Port_Init(NULL_PTR)`', '인자 순서: 개수 → 배열 · MCAL은 생성 설정 사용'],

    }
    el.addEventListener('click', e => {
      const c = e.target.closest('[data-ch]'); if (c) { ch = c.dataset.ch; q('[data-o="ch"]').querySelectorAll('button').forEach(b => b.classList.toggle('on', b === c)); draw(); return; }
