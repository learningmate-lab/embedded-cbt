=\"242.5\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box\"/>\n  <text x=\"252.25\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">11<\/text>\n  <rect x=\"262\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box\"/>\n  <text x=\"271.75\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">12<\/text>\n  <rect x=\"281.5\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box\"/>\n  <text x=\"291.25\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">13<\/text>\n  <rect x=\"301\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box\"/>\n  <text x=\"310.75\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">14<\/text>\n  <rect x=\"320.5\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box\"/>\n  <text x=\"330.25\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">15<\/text>\n  <rect x=\"340\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box-b\"/>\n  <text x=\"349.75\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">16<\/text>\n  <rect x=\"359.5\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box-b\"/>\n  <text x=\"369.25\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">17<\/text>\n  <rect x=\"379\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box-b\"/>\n  <text x=\"388.75\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">18<\/text>\n  <rect x=\"398.5\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box-b\"/>\n  <text x=\"408.25\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">19<\/text>\n  <rect x=\"418\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box-b\"/>\n  <text x=\"427.75\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">20<\/text>\n  <rect x=\"437.5\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box-b\"/>\n  <text x=\"447.25\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">21<\/text>\n  <rect x=\"457\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box-b\"/>\n  <text x=\"466.75\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">22<\/text>\n  <rect x=\"476.5\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box-b\"/>\n  <text x=\"486.25\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">23<\/text>\n  <rect x=\"496\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box-b\"/>\n  <text x=\"505.75\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">24<\/text>\n  <rect x=\"515.5\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box-b\"/>\n  <text x=\"525.25\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">25<\/text>\n  <rect x=\"535\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box-b\"/>\n  <text x=\"544.75\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">26<\/text>\n  <rect x=\"554.5\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box-b\"/>\n  <text x=\"564.25\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">27<\/text>\n  <rect x=\"574\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box-b\"/>\n  <text x=\"583.75\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">28<\/text>\n  <rect x=\"593.5\" y=\"40\" width=\"19.5\" height=\"28\" class=\"solid-e\"/>\n  <text x=\"603.25\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" class=\"t-w\">29<\/text>\n  <rect x=\"613\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box-b\"/>\n  <text x=\"622.75\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">30<\/text>\n  <rect x=\"632.5\" y=\"40\" width=\"19.5\" height=\"28\" class=\"box-b\"/>\n  <text x=\"642.25\" y=\"58\" text-anchor=\"middle\" font-size=\"11\">31<\/text>\n  <text x=\"349.75\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">0<\/text>\n  <text x=\"369.25\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">1<\/text>\n  <text x=\"388.75\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">2<\/text>\n  <text x=\"408.25\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">3<\/text>\n  <text x=\"427.75\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">4<\/text>\n  <text x=\"447.25\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">5<\/text>\n  <text x=\"466.75\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">6<\/text>\n  <text x=\"486.25\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">7<\/text>\n  <text x=\"505.75\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">8<\/text>\n  <text x=\"525.25\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">9<\/text>\n  <text x=\"544.75\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">10<\/text>\n  <text x=\"564.25\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">11<\/text>\n  <text x=\"583.75\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">12<\/text>\n  <text x=\"603.25\" y=\"88\" text-anchor=\"middle\" class=\"t-a\">13<\/text>\n  <text x=\"622.75\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">14<\/text>\n  <text x=\"642.25\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">15<\/text>\n  <text x=\"330\" y=\"88\" text-anchor=\"end\" class=\"t-s\">half 안의 핀 번호 →<\/text>\n  <line x1=\"603\" y1=\"94\" x2=\"603\" y2=\"122\" class=\"ln-e\" marker-end=\"url(#ah-e)\"/>\n  <rect x=\"8\" y=\"126\" width=\"168\" height=\"62\" rx=\"10\" class=\"box\"/>\n  <text x=\"92\" y=\"146\" text-anchor=\"middle\" class=\"t-b\">2장<\/text>\n  <text x=\"92\" y=\"164\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"12\">SIUL2_GPDO(29U)<\/text>\n  <text x=\"92\" y=\"181\" text-anchor=\"middle\" class=\"t-s\">29를 그대로 사용<\/text>\n  <rect x=\"190\" y=\"126\" width=\"482\" height=\"62\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"431\" y=\"152\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"13\" font-weight=\"700\">Siul2_Dio_Ip_WritePin(PTA_H_HALF, 13U, 1U);<\/text>\n  <text x=\"431\" y=\"175\" text-anchor=\"middle\" class=\"t-s\">PTA29는 high half → pin 인수 = 29 − 16 = 13U<\/text>\n<\/svg>\n```\n\n### `Siul2_Dio_Ip_WritePin(PTA_H_HALF, 13U, 1U)` 인수\n| 인수 | 값 | 뜻 |\n|---|---|---|\n| port | `PTA_H_HALF` | PTA 포트의 **high half** (PTA16~PTA31) |\n| pin | `13U` | half **안의** 핀 번호 = 29 − 16 |\n| value | `1U` | 출력 High → **D13 켜짐** (Active High) |\n\n규칙: 핀 번호 n이 **0~15면 `_L_HALF, n`**, **16~31이면 `_H_HALF, n − 16`**이에요.\n\n| 핀 | IPL 인수 |\n|---|---|\n| PTA29 | `PTA_H_HALF, 13U` |\n| PTA20 | `PTA_H_HALF, 4U` |\n| PTA16 | `PTA_H_HALF, 0U` (경계값) |\n| PTA15 | `PTA_L_HALF, 15U` |\n| PTA5 | `PTA_L_HALF, 5U` |\n| PTB26 (11장) | `PTB_H_HALF, 10U` |\n\n2장 습관대로 `29U`를 넣으면 오답이에요. 대신 **주소는 사라져요**: GPDO의 바이트 역순 배치(GPDO29 = `0x4029131E`)와 접근 폭은 RTD `Siul2_Dio_Ip` 구현이 처리하고, `PTA_H_HALF`도 **RTD 생성 헤더가 제공**해요.\n\n### IPL의 두 묶음 (MCAL Port/Dio와 같은 모양)\n| IPL 묶음 | 하는 일 | 이 장에서 쓰는 함수 |\n|---|---|---|\n| `Siul2_Port_Ip` | 핀 설정 (mux·방향·초기값) | `Siul2_Port_Ip_Init()` |\n| `Siul2_Dio_Ip` | 핀 값 쓰기·읽기 | `Siul2_Dio_Ip_WritePin()` |\n\n이 장에선 별도 GPIO 래퍼 없이 이 API를 **그대로** 써요.\n\n### 좋은 점과 대가\n- 👍 레지스터 **주소 계산·접근 폭**이 드라이버 안에 있고, 직접 만든 HAL보다 **RTD의 구현·검증을 재사용**해요.\n- 👎 `Siul2_…`, `PTA_H_HALF`처럼 **IP 이름과 자료형이 코드에 드러나요**. SIUL2가 없는 MCU로 옮기면 **호출 API 자체가 바뀔 수 있어요** → 이식성은 **같은 SIUL2 IP 계열 안**에서만 유리해요.", "tip": "빈칸 `WritePin(` **PTA_H_HALF** `,` **13U** `, 1U)` — 경계값 16(PTA16 → H, 0U)과 PTA15(→ L, 15U)를 노려요. \"IPL API는 다른 MCU로 옮겨도 **절대** 안 바뀐다\"는 ✗, `Siul2_Port_Ip`(설정)·`Siul2_Dio_Ip`(쓰기) 짝을 바꾼 보기도 ✗."}, {"id": "c3-mcal", "title": "MCAL — AUTOSAR 표준 계층, Port와 Dio", "sec": ["4. MCAL — AUTOSAR 표준 계층, Port와 Dio"], "tags": ["MCAL", "AUTOSAR Classic", "BSW", "NXP RTD", "Port_Init", "Dio_WriteChannel", "Port_ConfigType"], "body": "**MCAL**(Microcontroller Abstraction Layer)은 **AUTOSAR Classic Platform**이 정의한 표준 추상화 계층이에요. BSW(Basic Software)는 **Services · ECU Abstraction Layer · Complex Driver · MCAL**로 되어 있고, MCAL은 그중 **가장 아래**, 마이크로컨트롤러 바로 위에 있어요. 모듈은 **Port · Dio · Gpt · Adc · Can** 등이에요.\n\n| 이름 | 정체 |\n|---|---|\n| AUTOSAR Classic Platform | 자동차 SW 표준 규격 |\n| BSW | 표준이 정한 기본 SW 묶음 (4개 층) |\n| MCAL | BSW의 맨 아래 층 — Port·Dio·Gpt·Adc·Can |\n| NXP RTD (Real-Time Drivers) | S32K3용 MCAL **구현체** (+ IPL) |\n\n표준은 \"GPIO 출력은 `Dio` 모듈, 함수 이름은 `Dio_WriteChannel`\" 같은 **약속**만 정하고, S32K3에서 동작하게 만든 코드가 RTD예요. 그래서 MCU 회사가 달라도 응용이 부르는 **함수 이름은 같은 표준**을 따라요(IPL의 `Siul2_…`과 정반대).\n\n### 설정과 코드의 분리\n1. **Config Tools**에서 \"PTA29 = GPIO, 출력, 초기 Low\"를 정해요 — 핀 방향·기능은 C 코드에 쓰지 않아요.\n2. 도구가 **초기화 구조체** `Port_ConfigType`, `Dio_ConfigType`을 생성해요.\n3. `main.c`는 `Port_Init()`으로 그 구조체를 **적용**만 해요.\n4. 그 뒤로 `Dio_WriteChannel()`로 **동작만** 호출해요.\n\n```c\nPort_Init(NULL_PTR);                      // 생성된 Port 설정 적용 → PTA29 = GPIO 출력, Low\nDio_WriteChannel(LED_CHANNEL, STD_HIGH);  // 동작만: D13 켜짐\n```\n`main.c`에는 \"출력\"이라는 단어도, PTA29라는 숫자도 없어요.\n\n### Port vs Dio — \"준비냐, 동작이냐\"\n| 하는 일 | 담당 |\n|---|---|\n| PTA29를 GPIO **출력**으로 설정 (모드·방향·전기적 속성) | **Port** — `Port_Init(NULL_PTR)`, 시작 시 한 번 |\n| 시작 레벨을 Low로 (초기 상태) | **Port** |\n| 그 채널에 `STD_HIGH` / `STD_LOW` 쓰기 | **Dio** — 루프에서 반복 |\n| 현재 값을 읽어 반대로 뒤집기 | **Dio** (`Dio_FlipChannel`) |\n\n`STD_HIGH`·`STD_LOW`는 AUTOSAR **표준 레벨 값**이에요(IPL의 `1U`·`0U` 자리).\n\n### 왜 자동차는 이 형식성을 감수하나\n차량 SW는 **ASIL 등급 인증·검증**을 받아야 해요. 표준 MCAL이면 **한 번 인증한 드라이버를 여러 차종·MCU에 재사용**할 수 있어, 도구·구조체·생성 단계의 번거로움보다 **검증 비용 절감**이 훨씬 커요.", "tip": "\"GPIO 출력 설정 / STD_HIGH 쓰기\" 담당은 **Port – Dio**(뒤집은 Dio – Port가 오답). 빈칸: AUTOSAR **Classic**, BSW의 가장 **아래**, 구현체 **NXP RTD**, 생성 구조체 **`Port_ConfigType`·`Dio_ConfigType`**, 적용 함수 **`Port_Init()`**."}, {"id": "c3-compare", "title": "세 방식 비교 — 직접 · IPL · MCAL", "sec": ["5. 세 방식 비교 — 직접 · IPL · MCAL"], "tags": ["SIUL2_GPDO", "Siul2_Dio_Ip_WritePin", "Dio_WriteChannel", "channel ID", "pin-mux", "이식성"], "body": "세 줄 모두 **PTA29를 High로 만들어 D13을 켜는** 같은 일을 해요. 다른 건 `main.c`가 **얼마나 많은 하드웨어 정보를 아느냐**예요.\n\n| 방식 | 코드 | 응용이 아는 것 |\n|---|---|---|\n| ① 2장 직접 | `SIUL2_GPDO(29U) = 1U;` | 주소·비트·오프셋 |\n| ② 3장 IPL | `Siul2_Dio_Ip_WritePin(PTA_H_HALF, 13U, 1U);` | IP 이름·포트 half·핀 |\n| ③ 3장 MCAL | `Dio_WriteChannel(LED_CHANNEL, STD_HIGH);` | 논리 채널 이름만 |\n\n```svg 호출이 내려가는 길 (개념도) — 세 방식 모두 결국 같은 SIUL2 출력 레지스터에 닿아요\n<svg viewBox=\"0 0 680 240\" xmlns=\"http://www.w3.org/2000/svg\">\n  <text x=\"93\" y=\"20\" text-anchor=\"middle\" class=\"t-s\">응용 (main.c)<\/text>\n  <text x=\"250\" y=\"20\" text-anchor=\"middle\" class=\"t-s\">MCAL<\/text>\n  <text x=\"379\" y=\"20\" text-anchor=\"middle\" class=\"t-s\">IPL<\/text>\n  <text x=\"509\" y=\"20\" text-anchor=\"middle\" class=\"t-s\">레지스터<\/text>\n  <text x=\"627\" y=\"20\" text-anchor=\"middle\" class=\"t-s\">핀 · LED<\/text>\n  <rect x=\"8\" y=\"30\" width=\"170\" height=\"60\" rx=\"10\" class=\"box\"/>\n  <text x=\"16\" y=\"52\" class=\"t-b\">① 2장 직접<\/text>\n  <text x=\"16\" y=\"74\" font-family=\"monospace\" font-size=\"11\">SIUL2_GPDO(29U) = 1U;<\/text>\n  <rect x=\"8\" y=\"100\" width=\"170\" height=\"60\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"16\" y=\"120\" class=\"t-b\">② IPL<\/text>\n  <text x=\"16\" y=\"138\" font-family=\"monospace\" font-size=\"11\">Siul2_Dio_Ip_WritePin(<\/text>\n  <text x=\"16\" y=\"153\" font-family=\"monospace\" font-size=\"11\">PTA_H_HALF, 13U, 1U);<\/text>\n  <rect x=\"8\" y=\"170\" width=\"170\" height=\"60\" rx=\"10\" class=\"box-a\"/>\n  <text x=\"16\" y=\"190\" class=\"t-b\">③ MCAL<\/text>\n  <text x=\"16\" y=\"208\" font-family=\"monospace\" font-size=\"11\">Dio_WriteChannel(<\/text>\n  <text x=\"16\" y=\"223\" font-family=\"monospace\" font-size=\"11\">LED_CHANNEL, STD_HIGH);<\/text>\n  <rect x=\"194\" y=\"170\" width=\"112\" height=\"60\" rx=\"10\" class=\"box-a\"/>\n  <text x=\"250\" y=\"192\" text-anchor=\"middle\" class=\"t-b\">Dio (HLD)<\/text>\n  <text x=\"250\" y=\"209\" text-anchor=\"middle\" class=\"t-s\">채널 이름 →<\/text>\n  <text x=\"250\" y=\"224\" text-anchor=\"middle\" class=\"t-s\">포트·핀<\/text>\n  <rect x=\"322\" y=\"100\" width=\"114\" height=\"130\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"379\" y=\"142\" text-anchor=\"middle\" class=\"t-b\">IPL<\/text>\n  <text x=\"379\" y=\"162\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\">Siul2_Dio_Ip<\/text>\n  <text x=\"379\" y=\"184\" text-anchor=\"middle\" class=\"t-s\">GPDO 배치·<\/text>\n  <text x=\"379\" y=\"200\" text-anchor=\"middle\" class=\"t-s\">접근 폭 처리<\/text>\n  <rect x=\"452\" y=\"30\" width=\"114\" height=\"200\" rx=\"10\" class=\"box-c\"/>\n  <text x=\"509\" y=\"114\" text-anchor=\"middle\" class=\"t-b\">SIUL2<\/text>\n  <text x=\"509\" y=\"136\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"12\">GPDO<\/text>\n  <text x=\"509\" y=\"158\" text-anchor=\"middle\" class=\"t-s\">PTA29 출력 = 1<\/text>\n  <rect x=\"582\" y=\"30\" width=\"90\" height=\"200\" rx=\"10\" class=\"box-e\"/>\n  <text x=\"627\" y=\"114\" text-anchor=\"middle\" class=\"t-b\">PTA29<\/text>\n  <text x=\"627\" y=\"136\" text-anchor=\"middle\" class=\"t-s\">High<\/text>\n  <text x=\"627\" y=\"160\" text-anchor=\"middle\" class=\"t-b\">D13 켜짐<\/text>\n  <text x=\"315\" y=\"52\" text-anchor=\"middle\" class=\"t-s\">주소·비트를 응용이 직접<\/text>\n  <line x1=\"179\" y1=\"62\" x2=\"448\" y2=\"62\" class=\"ln dash\" marker-end=\"url(#ah)\"/>\n  <text x=\"250\" y=\"124\" text-anchor=\"middle\" class=\"t-s\">포트 half + 핀<\/text>\n  <line x1=\"179\" y1=\"132\" x2=\"318\" y2=\"132\" class=\"ln-b\" marker-end=\"url(#ah-b)\"/>\n  <line x1=\"179\" y1=\"200\" x2=\"191\" y2=\"200\" class=\"ln-a\" marker-end=\"url(#ah-a)\"/>\n  <line x1=\"307\" y1=\"200\" x2=\"319\" y2=\"200\" class=\"ln-a\" marker-end=\"url(#ah-a)\"/>\n  <line x1=\"437\" y1=\"165\" x2=\"449\" y2=\"165\" class=\"ln-b\" marker-end=\"url(#ah-b)\"/>\n  <line x1=\"567\" y1=\"130\" x2=\"579\" y2=\"130\" class=\"ln-c\" marker-end=\"url(#ah-c)\"/>\n<\/svg>\n```\n\n### 핀이 바뀔 때 (LED를 PTA30으로)\n| 방식 | 수정할 곳 |\n|---|---|\n| ① 직접 | 코드의 인덱스·주소 계산 수정 |\n| ② IPL | Pins 설정 재생성 + `main.c`의 `13U` → `14U` |\n| ③ MCAL | 설정(.mex)만 고쳐 재생성, `main.c` 그대로 |\n\n### IPL vs MCAL 비교표 (슬라이드 17–18 + 교재)\n| 관점 | RTD IPL 스타일 | RTD MCAL 스타일 |\n|---|---|---|\n| API의 출처 | RTD의 **SIUL2 IP driver** | RTD의 **AUTOSAR MCAL driver** |\n| 설정 위치 | **Pins 설정**과 생성된 **pin-mux 구조체** | Config Tools의 **Port/Dio 설정** |\n| 호출 단위 | SIUL2 **포트 half와 핀 번호** | AUTOSAR **Dio channel ID** |\n| 초기 학습 비용 | 낮음 ~ 중간 | 높음 |\n| 검증 단위 | SIUL2 IP API와 pin-mux 생성 코드 | Port/Dio API, 설정 파일, 생성 코드 |\n| 이식성 | **같은 SIUL2 IP 계열 안**에서 유리 | **지원 MCU/보드 범위 안**에서 유리 |\n\n### 언제 무엇을 쓰나\n- **IPL**: MCU의 IP를 공부하거나 **벤더 예제를 빠르게 구성**할 때.\n- 핀 수·MCU 파생 제품·팀원이 늘면 \"**설정을 어디에 기록하고 어떻게 재생성할 것인가**\"가 중요해져요 → 자동차가 **MCAL + 코드 생성 도구**를 선호하는 이유예요.\n- 이식성은 **둘 다 \"범위 안에서\"** 유리해요. \"MCAL이면 어떤 MCU로든 그대로 옮겨진다\"는 과장이에요.", "tip": "호출 단위 IPL = **포트 half + 핀 번호**, MCAL = **Dio channel ID** — 두 칸을 맞바꾼 보기에 주의. \"MCAL이 IPL보다 학습 비용이 낮다\"는 ✗(IPL 낮음~중간, MCAL 높음)."}, {"id": "c3-lab", "title": "실습 개요 — 기준 하드웨어·도구·비교 지표", "sec": ["6. 실습 개요 — 기준 하드웨어와 도구"], "tags": ["S32K312EVB-Q172", "PTA29", "RGBLED0_RED", "Active High", "chap03_gpio_ipl", "chap03_gpio_mcal"], "body": "이 장의 목적은 **소프트웨어 계층만 바꿔서 비교**하는 거예요. 그래서 하드웨어는 2장과 완전히 같아요 — 변수를 하나로 줄여야 IPL과 MCAL의 차이만 깨끗하게 보여요.\n\n```svg 이번 장의 기준 하드웨어 — 2장과 같은 보드 내장 LED\n<svg viewBox=\"0 0 680 118\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"8\" y=\"16\" width=\"250\" height=\"86\" rx=\"12\" class=\"box\"/>\n  <text x=\"133\" y=\"42\" text-anchor=\"middle\" class=\"t-b\">S32K312 (SIUL2)<\/text>\n  <text x=\"133\" y=\"66\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"12\">SIUL_MSCR29 · GPIO[29]<\/text>\n  <text x=\"133\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">보드 S32K312EVB-Q172<\/text>\n  <line x1=\"259\" y1=\"59\" x2=\"282\" y2=\"59\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <rect x=\"286\" y=\"34\" width=\"110\" height=\"50\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"341\" y=\"56\" text-anchor=\"middle\" class=\"t-b\">PTA29<\/text>\n  <text x=\"341\" y=\"74\" text-anchor=\"middle\" class=\"t-s\">MCU 핀<\/text>\n  <line x1=\"397\" y1=\"59\" x2=\"420\" y2=\"59\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <rect x=\"424\" y=\"16\" width=\"248\" height=\"86\" rx=\"12\" class=\"box-e\"/>\n  <text x=\"548\" y=\"42\" text-anchor=\"middle\" class=\"t-b\">D13 LED<\/text>\n  <text x=\"548\" y=\"66\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"12\">RGBLED0_RED<\/text>\n  <text x=\"548\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">Active High: 1을 쓰면 켜짐<\/text>\n<\/svg>\n```\n\n| 값 | 무엇인가 | 3장에서 다시 보는 곳 |\n|---|---|---|\n| PTA29 / GPIO[29] | MCU 핀 / GPIO 번호 | Pins 탭에서 선택 |\n| SIUL_MSCR29 | 핀 설정 레지스터 | Siul2_Port / Port가 생성 |\n| RGBLED0_RED | LED 이름 | IPL Label, MCAL Dio 이름 |\n| Active High | 1이면 켜짐 | `1U` / `STD_HIGH` = ON |\n\n2장에선 MSCR29 `0x402902B4`, GPDO29 `0x4029131E`를 직접 계산했지만, 3장 IPL 예제의 응용 코드엔 **이 주소들이 한 번도 나오지 않아요**. `Siul2_Dio_Ip` 구현이 GPDO 배치와 접근 폭을 처리해요.\n\n### 두 프로젝트, 세 가지 비교 지표\n- `chap03_gpio_ipl` — `Siul2_Port_Ip` / `Siul2_Dio_Ip` 직접 사용\n- `chap03_gpio_mcal` — RTD **Port/Dio** 드라이버 사용\n\n한 프로젝트에 섞지 않고 **따로** 만들어 비교해요(교재 이름은 `week03_…`, 답은 슬라이드 기준). 둘 다 빌드·실행한 뒤 비교하는 건 이 세 가지예요.\n1. **코드량** — 직접 수정한 파일 수, `main.c` 줄 수\n2. **`.text` 크기** — 빌드 후 Console의 Flash 코드 크기\n3. **설정 변경 위치** — 핀을 바꾸거나 추가할 때 어디를 고치나\n\n### 도구 버전 (숫자를 바꿔 내기 쉬워요)\n| 도구 | 버전 |\n|---|---|\n| S32DS | **3.6.7** |\n| S32K3 RTD | **7.0.1** |\n| GCC | Design Studio GCC **10.2** |\n| PEmicro | **12.7.0** |\n| FreeRTOS | **7.0.0** |\n\nRTD 7.0.1의 Port·Dio 드라이버 이름은 `Port_TS_T40D34M70I1R0`, `Dio_TS_T40D34M70I1R0`이에요. 표준 버전과 다르면 Config Tools 화면·생성 코드가 달라질 수 있으니 **강사에게 확인한 뒤** 진행해요.", "tip": "비교 지표 = **코드량 · `.text` 크기 · 설정 변경 위치** — \"실행 속도\"·\"소비 전력\"은 슬라이드에 없어요. \"Active High이므로 `STD_LOW`면 켜진다\"는 ✗."}, {"id": "c3-ipl-lab", "title": "실습 A — IPL 프로젝트와 생성 식별자", "sec": ["7. 실습 A — IPL 프로젝트 (chap03_gpio_ipl)"], "tags": ["Pins 탭", "Functional group", "Siul2_Port_Ip_Cfg.h", "g_pin_mux_InitConfigArr", "NUM_OF_CONFIGURED_PINS", "board/"], "body": "### 진행 순서\n1. **Pins 탭** — Pin `PTA29` · Signal `SIUL2:gpio, 29` · Direction **Output** · Level **Low** · Label `RGBLED0_RED`.\n2. **Peripherals** — Drivers에 `Siul2_Dio`를 **component만** 추가(채널 설정 없음, `Siul2_Dio_Ip.h`를 쓸 수 있게 됨).\n3. **Update / Generate Code** — `board/`에 두 파일 생성.\n4. **main.c** — 생성 이름으로 Init → WritePin.\n5. **Build** — Console의 **text** 값 기록(`arm-none-eabi-size` 출력).\n\n프로젝트 생성 값: MCU **S32K312** · Toolchain **NXP GCC 10.2 for Arm 32-bit Bare-Metal** · Probe **OpenSDA / PEmicro** · SDK **PlatformSDK_S32K3_S32K312_M7 v7.0.1**.\n\n| 파일 | 주인 | 내용 |\n|---|---|---|\n| `chap03_gpio_ipl.mex` | 학생 (Config Tools로) | Pins 설정 |\n| `board/Siul2_Port_Ip_Cfg.h` | **Config Tools** (생성) | 설정 선언 · 핀 개수 |\n| `board/Siul2_Port_Ip_Cfg.c` | **Config Tools** (생성) | PTA29 설정 구조체 |\n| `src/main.c` | 학생 | Init + WritePin |\n\nPins 설정 확인: Mode = GPIO(Id = 1, Mscr = 29) → MSCR 생성 · Direction = Output → 2장의 **output buffer enable**(MSCR OBE, bit 21) · Level = Low → 초기 LED OFF.\n\n```svg Functional group 이름이 생성 식별자 두 개에 그대로 들어가요 → main.c는 그 이름을 그대로 써요\n<svg viewBox=\"0 0 680 230\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"8\" y=\"34\" width=\"196\" height=\"104\" rx=\"12\" class=\"box-b\"/>\n  <text x=\"106\" y=\"56\" text-anchor=\"middle\" class=\"t-s\">Pins 설정<\/text>\n  <text x=\"106\" y=\"78\" text-anchor=\"middle\" class=\"t-b\">Functional group<\/text>\n  <text x=\"106\" y=\"100\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\" font-weight=\"700\">BOARD_InitPeripherals<\/text>\n  <text x=\"106\" y=\"124\" text-anchor=\"middle\" class=\"t-s\">바꾸면 두 이름도 바뀜<\/text>\n  <rect x=\"228\" y=\"8\" width=\"444\" height=\"58\" rx=\"10\" class=\"box\"/>\n  <text x=\"240\" y=\"28\" class=\"t-s\">핀 설정 배열 · board/Siul2_Port_Ip_Cfg.h<\/text>\n  <text x=\"240\" y=\"52\" font-family=\"monospace\" font-size=\"11\">g_pin_mux_InitConfigArr_PortContainer_0_<tspan font-weight=\"700\">BOARD_InitPeripherals<\/tspan><\/text>\n  <rect x=\"228\" y=\"78\" width=\"444\" height=\"58\" rx=\"10\" class=\"box\"/>\n  <text x=\"240\" y=\"98\" class=\"t-s\">핀 개수 매크로<\/text>\n  <text x=\"240\" y=\"122\" font-family=\"monospace\" font-size=\"11\">NUM_OF_CONFIGURED_PINS_PortContainer_0_<tspan font-weight=\"700\">BOARD_InitPeripherals<\/tspan><\/text>\n  <line x1=\"205\" y1=\"74\" x2=\"224\" y2=\"40\" class=\"ln-b\" marker-end=\"url(#ah-b)\"/>\n  <line x1=\"205\" y1=\"102\" x2=\"224\" y2=\"108\" class=\"ln-b\" marker-end=\"url(#ah-b)\"/>\n  <line x1=\"450\" y1=\"137\" x2=\"450\" y2=\"156\" class=\"ln-a\" marker-end=\"url(#ah-a)\"/>\n  <rect x=\"8\" y=\"160\" width=\"664\" height=\"62\" rx=\"12\" class=\"box-a\"/>\n  <text x=\"20\" y=\"184\" font-family=\"monospace\" font-size=\"11\">(void)Siul2_Port_Ip_Init(NUM_OF_CONFIGURED_PINS_…, g_pin_mux_InitConfigArr_…);<\/text>\n  <text x=\"20\" y=\"208\" class=\"t-s\">main.c — 생성된 개수와 배열을 그대로 전달 → PTA29 MSCR(GPIO·Output)·초기 Low 적용<\/text>\n<\/svg>\n```\n\n두 생성 식별자의 끝부분 **`BOARD_InitPeripherals`**는 Pins 설정의 **Functional group** 이름이에요. 그룹 이름을 바꾸면 두 식별자도 바뀌고, `main.c`가 옛 이름이면 **\"생성 식별자 미정의\" 빌드 오류**가 나요.\n\n```c\n#include \"Siul2_Port_Ip.h\"\n#include \"Siul2_Dio_Ip.h\"\n#include \"Siul2_Port_Ip_Cfg.h\"          // 생성된 pin-mux 배열·개수 매크로\n\n#define RGBLED0_RED_PORT     (PTA_H_HALF)   /* PTA29 = high half pin (29 - 16) */\n#define RGBLED0_RED_PIN      (13U)\n\nstatic void Delay(volatile uint32 count)   // uint32: AUTOSAR 표준 자료형\n{\n    while (count > 0U) { count--; }\n}\n\nint main(void)\n{\n    (void)Siul2_Port_Ip_Init(               // 순서: 개수 → 배열\n        NUM_OF_CONFIGURED_PINS_PortContainer_0_BOARD_InitPeripherals,\n        g_pin_mux_InitConfigArr_PortContainer_0_BOARD_InitPeripherals);\n    for (;;)\n    {\n        Siul2_Dio_Ip_WritePin(RGBLED0_RED_PORT, RGBLED0_RED_PIN, 1U);  // LED ON\n        Delay(4000000U);\n        Siul2_Dio_Ip_WritePin(RGBLED0_RED_PORT, RGBLED0_RED_PIN, 0U);  // LED OFF\n        Delay(4000000U);\n    }\n}\n```\n- 루프는 **켜기부터** 시작해요(MCAL 예제는 끄기부터).\n- `(void)` — Init의 반환값(상태)을 **일부러 쓰지 않는다**는 표시예요.\n- `volatile` — 컴파일러가 빈 루프를 **지우지 못하게** 해요. `Delay(4000000U)`는 시간이 아니라 **반복 횟수**예요.\n- `Siul2_Dio_Ip`는 MCAL DioChannel처럼 **논리 채널을 만들지 않아요**. Pins Tool이 방향·mux를 만들고, 앱은 **IP port/pin 번호**를 써요.\n- `board/`의 두 파일은 **Config Tools가 소유** — 이름이 안 맞으면 설정을 고치고 다시 생성해요.", "tip": "빈칸 `Siul2_Port_Ip_Init(` **NUM_OF_CONFIGURED_PINS_**`…,` **g_pin_mux_InitConfigArr_**`…)` — **개수 → 배열** 순서를 뒤집은 보기에 주의. 생성 폴더는 IPL = **`board/`**, MCAL = **`generate/`**."}, {"id": "c3-mcal-lab", "title": "실습 B — MCAL 프로젝트와 symbolic name", "sec": ["8. 실습 B — MCAL 프로젝트 (chap03_gpio_mcal)"], "tags": ["DioConf_DioChannel_RGBLED0_RED", "Dio_Cfg.h", "Port_Init(NULL_PTR)", "STD_LOW", "STD_HIGH", "generate/"], "body": "프로젝트 생성 값과 Pins 탭의 PTA29 설정(GPIO 29 · Output · Initial Low)은 IPL과 같아요. Pins 탭 Label/Symbol은 **없어도 돼요**. 달라지는 건 **Peripherals**와 **생성 파일**이에요.\n\n| 구분 | IPL 프로젝트 | MCAL 프로젝트 |\n|---|---|---|\n| Peripherals | `Siul2_Dio` 추가 | MCAL **Port·Dio** 추가, Drivers 밑 `Siul2_Port` **제거** |\n| MCAL만의 작업 | — | **Dio channel**에 PTA29 추가 · Symbolic Name `RGBLED0_RED` |\n| 생성 폴더 | `board/` | `generate/` (include·src) |\n| 생성 파일 | `Siul2_Port_Ip_Cfg.h/.c` | `Port_Cfg.h/.c`, `Dio_Cfg.h/.c` (4개) |\n| 코드에 쓰는 이름 | Functional group 기반 배열 | Dio **symbolic name** |\n\n학생이 고치는 파일은 여전히 **`.mex`와 `main.c` 두 개**예요.\n\n```svg 이름이 이어지는 길 — Config Tools의 Symbolic Name이 main.c의 채널이 되기까지\n<svg viewBox=\"0 0 680 236\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"8\" y=\"8\" width=\"130\" height=\"46\" rx=\"10\" class=\"box-d\"/>\n  <text x=\"73\" y=\"27\" text-anchor=\"middle\" class=\"t-b\">① Config Tools<\/text>\n  <text x=\"73\" y=\"45\" text-anchor=\"middle\" class=\"t-s\">Peripherals › Dio<\/text>\n  <rect x=\"150\" y=\"8\" width=\"522\" height=\"46\" rx=\"10\" class=\"box\"/>\n  <text x=\"164\" y=\"36\" font-family=\"monospace\" font-size=\"12\">DioChannel short name (Symbolic Name) = <tspan font-weight=\"700\">RGBLED0_RED<\/tspan><\/text>\n  <rect x=\"8\" y=\"66\" width=\"130\" height=\"46\" rx=\"10\" class=\"box-c\"/>\n  <text x=\"73\" y=\"85\" text-anchor=\"middle\" class=\"t-b\">② 생성 파일<\/text>\n  <text x=\"73\" y=\"103\" text-anchor=\"middle\" class=\"t-s\">Dio_Cfg.h<\/text>\n  <rect x=\"150\" y=\"66\" width=\"522\" height=\"46\" rx=\"10\" class=\"box\"/>\n  <text x=\"164\" y=\"85\" font-family=\"monospace\" font-size=\"12\">#define DioConf_DioChannel_<tspan font-weight=\"700\">RGBLED0_RED<\/tspan>  ...<\/text>\n  <text x=\"164\" y=\"104\" class=\"t-s\">채널 값은 도구가 생성 — 학생이 직접 편집하지 않음<\/text>\n  <rect x=\"8\" y=\"124\" width=\"130\" height=\"46\" rx=\"10\" class=\"box-a\"/>\n  <text x=\"73\" y=\"143\" text-anchor=\"middle\" class=\"t-b\">③ main.c<\/text>\n  <text x=\"73\" y=\"161\" text-anchor=\"middle\" class=\"t-s\">별칭 매크로<\/text>\n  <rect x=\"150\" y=\"124\" width=\"522\" height=\"46\" rx=\"10\" class=\"box\"/>\n  <text x=\"164\" y=\"152\" font-family=\"monospace\" font-size=\"12\">#define LED_CHANNEL  (DioConf_DioChannel_<tspan font-weight=\"700\">RGBLED0_RED<\/tspan>)<\/text>\n  <rect x=\"8\" y=\"182\" width=\"130\" height=\"46\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"73\" y=\"201\" text-anchor=\"middle\" class=\"t-b\">④ 호출<\/text>\n  <text x=\"73\" y=\"219\" text-anchor=\"middle\" class=\"t-s\">동작만<\/text>\n  <rect x=\"150\" y=\"182\" width=\"522\" height=\"46\" rx=\"10\" class=\"box\"/>\n  <text x=\"164\" y=\"210\" font-family=\"monospace\" font-size=\"12\">Dio_WriteChannel(LED_CHANNEL, STD_HIGH);<\/text>\n  <line x1=\"411\" y1=\"55\" x2=\"411\" y2=\"64\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"411\" y1=\"113\" x2=\"411\" y2=\"122\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"411\" y1=\"171\" x2=\"411\" y2=\"180\" class=\"ln\" marker-end=\"url(#ah)\"/>\n<\/svg>\n```\n\n이름이 한 글자라도 다르면(예: `RGBLED0_Red`) 매크로가 그 이름으로 안 생겨서 `DioConf_DioChannel_RGBLED0_RED` **미정의** 빌드 오류가 나요. 교재는 `#ifndef DioConf_DioChannel_RGBLED0_RED` → `#error \"...Check the Dio symbolic name in Config Tools.\"` 가드로 바로 알려 줘요.\n\n### 설정 확인표 (슬라이드 42–43 + 교재)\n| 필드 | 설정값 | 의미 |\n|---|---|---|\n| PortPinMode | GPIO | PTA29 GPIO mux |\n| PortPinDirection | PORT_PIN_OUT | 출력 방향 |\n| PortPinLevelValue | PORT_PIN_LEVEL_LOW | 초기 LED OFF |\n| PortPinDirection/ModeChangeable | false | runtime 변경 안 함 |\n| Dio Port Id | 1 | PTA[31:16] (high half) |\n| DioChannelId | 13 | 그 안의 13번 (29 − 16) |\n| DioWriteChannelApi | true (STD_ON) | `Dio_WriteChannel()` 사용 |\n| DioFlipChannelApi | false | 이 실습에선 안 씀 |\n\nDioChannelId는 슬라이드 = `13`, 교재 = **Calculate Value**로 자동 배정이에요. 어느 쪽이든 코드에는 **symbolic name만** 써요.\n\n```c\n#include <stdint.h>\n#include \"Mcal.h\"\n#include \"Port.h\"\n#include \"Dio.h\"\n\n#define LED_CHANNEL  (DioConf_DioChannel_RGBLED0_RED)   // Dio_Cfg.h가 생성한 채널 이름\n\nint main(void)\n{\n    Port_Init(NULL_PTR);                       // 생성된(사전 컴파일) Port 설정 적용\n    Dio_WriteChannel(LED_CHANNEL, STD_LOW);    // 초기 OFF\n    for (;;)\n    {\n        Dio_WriteChannel(LED_CHANNEL, STD_LOW);    // 첫 반주기: 꺼짐\n        Delay(4000000UL);\n        Dio_WriteChannel(LED_CHANNEL, STD_HIGH);   // 둘째 반주기: 켜짐\n        Delay(4000000UL);\n    }\n}\n```\n- `Port_Init(NULL_PTR)` — 설정 포인터를 넘기지 않고 **생성된 사전 컴파일 설정**을 써요(IPL은 배열·개수를 직접 넘김).\n- MCAL `Delay`는 `<stdint.h>`의 `uint32_t`, IPL `Delay`는 RTD의 `uint32` — 둘 다 32비트라 동작은 같아요.", "tip": "빈칸 `#define LED_CHANNEL (` **DioConf_DioChannel_**`RGBLED0_RED)` + 생성 위치 **`Dio_Cfg.h`**. MCAL 루프 첫 반주기 = **꺼짐**, IPL = **켜짐**. Dio Port Id **1** = PTA[31:16], ChannelId **13** = 29 − 16."}, {"id": "c3-flip", "title": "Dio_FlipChannel()과 WriteChannel", "sec": ["9. Dio_FlipChannel()과 WriteChannel을 쓰는 이유"], "tags": ["Dio_FlipChannel", "DioFlipChannelApi", "STD_ON", "Generate Code", "미정의 빌드 오류"], "body": "`Dio_FlipChannel()`은 채널의 **현재 값을 읽어서 반대로 뒤집는** API예요. 루프 안에 LOW·HIGH 두 줄 대신 **Flip 한 줄 + Delay**면 깜빡여요.\n\n```c\nfor (;;)\n{\n    (void)Dio_FlipChannel(LED_CHANNEL);   // 현재 레벨 반전\n    Delay(4000000UL);\n}\n```\n\n```wave 두 루프의 LED 파형 — 큰 상자 하나 = 호출 + Delay 한 번, 맨 앞 칸은 Delay 없는 초기 STD_LOW. 간격은 같지만 Flip은 켜짐부터 시작해요\n@mark 1 for(;;) 시작\nWrite 호출: = = . = . = . = . = . | 초기,LOW,HIGH,LOW,HIGH,LOW\nLED (Write): 0 0 . 1 . 0 . 1 . 0 .\nFlip 호출: = = . = . = . = . = . | 초기,Flip,Flip,Flip,Flip,Flip\nLED (Flip): 0 1 . 0 . 1 . 0 . 1 .\n@span 1-2 Delay(4000000UL)\n```\n\n- 두 버전 모두 루프 전에 `Port_Init()`과 초기 `STD_LOW`를 실행해요(Delay 없음).\n- **Write 버전**: 루프가 `STD_LOW`부터 → 첫 Delay 동안 **꺼짐**.\n- **Flip 버전**: 첫 Flip이 Low를 뒤집어 → 첫 Delay 동안 **켜짐**.\n- 깜빡이는 **간격은 같아요**. 다만 Flip 코드만 봐서는 지금 LED가 켜졌는지 알 수 없어요 — \"**상태가 코드에 드러나지 않는다**\".\n- `(void)`는 Flip이 돌려주는 값을 쓰지 않는다는 표시예요.\n\n### 쓰려면: 설정 → 재생성 → 루프 축소\nDio API 중 일부는 **설정 스위치가 켜져 있을 때만 생성 코드에 포함**돼요. 기본 실습은 `DioWriteChannelApi = true(STD_ON)`, `DioFlipChannelApi = false`예요.\n\n| DioFlipChannelApi | 재생성 | `Dio_FlipChannel()` 호출 결과 |\n|---|---|---|\n| false (기본) | — | **빌드 미정의 오류** |\n| true (STD_ON) | 안 함 | 생성 코드가 옛날 그대로 → 여전히 오류 |\n| true (STD_ON) | **Generate Code** | 정상 빌드, LED 점멸 |\n\n이 오류는 **빌드 단계**에서 나요(런타임 문제 ✗). 기본 실습에서 이 오류가 났다면 **정상**이에요 — 원래 안 쓰는 API니까요.\n\n### 기본 실습이 WriteChannel을 쓰는 이유\n| ✍️ Dio_WriteChannel (기본) | 🔁 Dio_FlipChannel (선택) |\n|---|---|\n| LOW/HIGH를 **명시** → 초기 학습에 유리 | 현재 값을 읽어 **반대로** |\n| 설정 항목이 **하나 줄어요** | API를 켜고 **재생성**해야 씀 |\n| 여러 곳에서 같은 채널을 건드릴 때 **상태 추적이 쉬움** | 코드는 짧지만 현재 상태가 안 드러남 |", "tip": "`Dio_FlipChannel` 미정의 원인 = **DioFlipChannelApi = false** → **true(STD_ON) + Generate Code**. 런타임 오류가 아니라 **빌드 단계** 오류예요. Flip 루프 첫 Delay = 초기 Low를 뒤집어 **켜짐**."}, {"id": "c3-size", "title": "빌드 크기 · 실행 확인 · 비교 보고서", "sec": ["10. 빌드 크기 · 실행 확인 · 비교 보고서"], "tags": ["arm-none-eabi-size", ".text", "GDB PEMicro Interface Debugging", "Resume", "ASIL", "검증 비용"], "body": "### Console의 크기 표\nProject > Build Project 후 Console 맨 아래에 `arm-none-eabi-size`가 `.elf` 크기를 찍어요. 기록하는 건 **text 열**이에요.\n\n| 열 | 뜻 |\n|---|---|\n| **text** | Flash에 들어가는 **코드 + 읽기 전용 데이터** (슬라이드) |\n| data | 초기값 있는 전역·static 변수 |\n| bss | 0으로 시작하는 전역·static 변수 |\n| dec / hex | text + data + bss 합계 (10진 / 16진) |\n\ndata·bss·dec/hex는 GNU size 도구의 일반적인 의미예요(강의 범위 밖 참고).\n\nMCAL 프로젝트의 `.text`가 **더 클 수 있어요** — 층이 하나 더 있고 생성 설정 데이터·표준 API 코드가 들어가니까요(추상화의 대가). 하지만 **크기만으로 우열을 판단하면 안 돼요**. MCAL은 **설정 추적 · 표준 API · 생성 코드 · 검증 가능한 구조**를 함께 제공해요(4개 모두 외우기).\n\n### 실행 확인 순서\n1. 보드를 USB로 연결 → Project Explorer에서 프로젝트 선택\n2. Run > **Debug Configurations…** → **GDB PEMicro Interface Debugging**\n3. Device가 **S32K312 계열**인지 확인 → Debug\n4. 프로그램이 **`main()`에서 멈춘 상태**로 기다려요 → **Resume**을 눌러야 루프가 돌아요\n5. 성공: D13 / RGBLED0_RED가 켜짐·꺼짐 반복\n\nIPL·MCAL 두 프로젝트를 **각각 선택해서** 반복해요. 연결 자체가 실패하면 USB 케이블·보드 전원·probe 선택을 확인해요.\n\n### 비교 보고서\n보고서는 **동작 확인**(빌드·플래시 성공, LED 점멸, 주기 관찰) → **코드와 크기**(수정 파일 수, main.c 줄 수, `.text`) → **설정 변경**(수정 위치, 핀 한 개 추가 시 작업) → **분석 질문** 순서예요.\n\n| 분석 질문 | 답의 방향 |\n|---|---|\n| 1. IPL의 편한 점 | 설정이 적고 SIUL2 함수를 바로 호출 |\n| 2. MCAL의 불편한 점 | 설정 단계가 많고 생성 이름·API 스위치를 맞춰야 함 |\n| 3. 규모가 커지면? | 설정이 .mex에 남아 재생성, main.c는 이름만 |\n| 4. 왜 자동차는? | 아래 모범 답안 |\n\n**모범 답안(4번)**: 차량 SW는 ASIL 인증·검증이 필요한데, 표준 MCAL을 쓰면 **한 번 인증한 드라이버와 설정 구조를 여러 차종·MCU에 재사용**할 수 있다. 설정이 도구·생성 코드로 추적되므로 **보드 파생·코드 리뷰·검증 비용**이 줄어든다.", "tip": "`arm-none-eabi-size`의 **text** 열 = Flash의 코드 + 읽기 전용 데이터(data·bss와 바꾼 보기 주의). \"`.text`가 크니 IPL이 더 좋다\"는 ✗. Debug 후 `main()`에서 멈추면 **Resume**."}, {"id": "c3-trouble", "title": "문제 해결과 공통 원칙", "sec": ["11. 문제 해결과 공통 원칙"], "tags": ["생성 식별자 미정의", "symbolic name 불일치", "DioFlipChannelApi", "half/pin 인수", "OpenSDA/PEmicro", "재생성"], "body": "```svg 고칠 곳은 언제나 설정 — 생성 파일을 손으로 고치는 길은 막혀 있어요\n<svg viewBox=\"0 0 680 190\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"8\" y=\"14\" width=\"116\" height=\"58\" rx=\"10\" class=\"box-d\"/>\n  <text x=\"66\" y=\"38\" text-anchor=\"middle\" class=\"t-b\">① 설정 수정<\/text>\n  <text x=\"66\" y=\"58\" text-anchor=\"middle\" class=\"t-s\">.mex · Config Tools<\/text>\n  <rect x=\"144\" y=\"14\" width=\"116\" height=\"58\" rx=\"10\" class=\"box-d\"/>\n  <text x=\"202\" y=\"38\" text-anchor=\"middle\" class=\"t-b\">② 코드 생성<\/text>\n  <text x=\"202\" y=\"58\" text-anchor=\"middle\" class=\"t-s\">Generate Code<\/text>\n  <rect x=\"280\" y=\"14\" width=\"116\" height=\"58\" rx=\"10\" class=\"box-c\"/>\n  <text x=\"338\" y=\"38\" text-anchor=\"middle\" class=\"t-b\">③ 생성 파일<\/text>\n  <text x=\"338\" y=\"58\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"11\">*_Cfg.h / .c<\/text>\n  <rect x=\"416\" y=\"14\" width=\"116\" height=\"58\" rx=\"10\" class=\"box-a\"/>\n  <text x=\"474\" y=\"38\" text-anchor=\"middle\" class=\"t-b\">④ main.c<\/text>\n  <text x=\"474\" y=\"58\" text-anchor=\"middle\" class=\"t-s\">생성 이름만 사용<\/text>\n  <rect x=\"552\" y=\"14\" width=\"116\" height=\"58\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"610\" y=\"38\" text-anchor=\"middle\" class=\"t-b\">⑤ 빌드·실행<\/text>\n  <text x=\"610\" y=\"58\" text-anchor=\"middle\" class=\"t-s\">LED 점멸 확인<\/text>\n  <line x1=\"125\" y1=\"43\" x2=\"140\" y2=\"43\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"261\" y1=\"43\" x2=\"276\" y2=\"43\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"397\" y1=\"43\" x2=\"412\" y2=\"43\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"533\" y1=\"43\" x2=\"548\" y2=\"43\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <path d=\"M610,73 L610,106 L66,106 L66,77\" class=\"ln-a\" marker-end=\"url(#ah-a)\"/>\n  <text x=\"474\" y=\"96\" text-anchor=\"middle\" class=\"t-a\">문제 발생 → 설정으로 돌아가 재생성<\/text>\n  <rect x=\"170\" y=\"128\" width=\"336\" height=\"52\" rx=\"10\" class=\"box-e dash\"/>\n  <text x=\"338\" y=\"150\" text-anchor=\"middle\" class=\"t-b\">✕ 생성 파일을 손으로 고치기<\/text>\n  <text x=\"338\" y=\"170\" text-anchor=\"middle\" class=\"t-s\">다음 재생성 때 덮어써지고 .mex와 어긋나요<\/text>\n  <line x1=\"338\" y1=\"127\" x2=\"338\" y2=\"77\" class=\"ln-e dash\" marker-end=\"url(#ah-e)\"/>\n<\/svg>\n```\n\n정상 흐름은 ① `.mex` 설정 → ② Generate Code → ③ `*_Cfg.h/.c` 생성 → ④ `main.c`는 생성 이름만 사용 → ⑤ 빌드·실행이에요. 생성 파일을 손으로 고치면 안 되는 이유는 두 가지예요.\n1. 생성 파일은 **Config Tools가 소유** — 다음 Generate Code 때 **덮어써져** 사라져요.\n2. 고친 내용이 `.mex`에 없으니 **설정과 코드가 어긋나요**.\n\n**공통 원칙: 생성 파일을 손으로 고쳐 문제를 덮지 않는다. 설정을 고치고 다시 생성한다.**\n\n### 증상 → 원인 → 조치 (슬라이드 56–58)\n| 구분 | 증상 | 가능한 원인 | 조치 |\n|---|---|---|---|\n| IPL | 생성 식별자 미정의 | Pins 설정 미생성 / **Functional group 이름 불일치** | PTA29 설정 저장 후 Update Code, 생성 이름을 main.c에 반영 |\n| IPL | 빌드되지만 LED 안 켜짐 | pin-mux가 GPIO output 아님 / **half·pin 인수 오류** | PTA29·GPIO[29]·Output·Initial Low, `PTA_H_HALF`·`13U` 확인 |\n| MCAL | `DioConf_DioChannel_RGBLED0_RED` 미정의 | Dio **symbolic name 불일치** | 채널 이름을 RGBLED0_RED로 맞추고 재생성 |\n| MCAL | `Dio_FlipChannel` 미정의 | **DioFlipChannelApi = false** (기본 실습에선 정상) | 선택 과제라면 true로 바꾸고 Generate Code |\n| MCAL | 빌드되지만 LED 안 켜짐 | PTA29가 GPIO Output이 아님 | Pins 탭 설정 확인 |\n| 디버거 | 디버그 연결 실패 | OpenSDA/PEmicro 설정 문제 | USB 케이블, 보드 전원, probe 선택 확인 |\n\n### \"언제 터졌나\"로 먼저 나눠요\n- **빌드 중** 오류는 대부분 **이름이 안 맞는** 문제 — Functional group, Dio symbolic name, 또는 API 스위치(DioFlipChannelApi).\n- **빌드는 되는데 LED가 안 켜지면** 이름은 맞고 **값이 틀린** 것 — PTA29가 GPIO 출력이 아니거나, IPL에서 `29U`처럼 half/pin 인수를 잘못 넣은 경우.\n- **연결 시** 실패는 USB·전원·probe.\n\n### 정리\n- RTD **IPL**: 주소·offset·접근 폭 계산 없이 SIUL2 전용 API를 호출해요.\n- RTD **MCAL**: 처음엔 설정 단계가 많지만 핀 설정과 드라이버 사용을 **AUTOSAR Port/Dio 구조** 안에 배치해요. 작은 예제에선 과해 보여도 ECU 환경에선 **비용을 줄이는 장치**예요.", "tip": "원칙 빈칸: 생성 파일을 ( **손으로 고쳐** ) 문제를 덮지 않는다, ( **설정** )을 고치고 ( **다시 생성** )한다. 이름 문제 = **빌드 오류**, 값 문제 = **빌드는 되지만 LED 안 켜짐**."}]}, {"ch": 4, "title": "I2C 기초와 캐릭터 LCD 구동", "summary": "SDA·SCL 두 선과 7-bit 주소로 장치를 부르는 I2C 버스로 PCF8574 백팩 16×2 LCD에 \"Hello S32K3\"를 띄워요. 한 글자는 4-bit 모드로 니블 2번 × E 펄스로 가고, 전송 함수는 IPL(`Lpi2c_Ip_*`, instance 1U)과 MCAL(`I2c_*`, channel 0U) 중 하나로 바꿔 끼워요.", "sections": [{"id": "c4-bus", "title": "I2C 버스 — 오픈 드레인과 풀업", "sec": ["1. I2C 버스와 오픈 드레인·풀업"], "tags": ["I2C", "SDA", "SCL", "오픈 드레인", "풀업 저항", "4.7 kΩ", "100 kHz"], "body": "**I2C**(Inter-Integrated Circuit)는 **SDA(데이터)·SCL(클럭)** 두 선에 LCD·센서·EEPROM 같은 여러 장치를 매달고, 장치마다 고유한 **주소**로 상대를 구분하는 직렬 버스예요. 마스터(우리 MCU)가 주소를 부르면 그 장치만 대답해요.\n\n| 구분 | UART (1장) | I2C (4장) |\n|---|---|---|\n| 신호선 | TX·RX (1:1) | SDA·SCL (1:N 버스) |\n| 클럭 | 없음 → 비동기 | SCL을 마스터가 만듦 → **동기** |\n| 상대 지정 | 선으로 직접 연결 | 7-bit 주소 |\n| 비트 순서 | LSB 먼저 | **MSB 먼저** |\n\n```svg 오픈 드레인 버스 — 장치는 LOW만 당기고, HIGH는 풀업 저항이 만들어요\n<svg viewBox=\"0 0 680 250\" xmlns=\"http://www.w3.org/2000/svg\">\n  <line x1=\"150\" y1=\"20\" x2=\"300\" y2=\"20\" class=\"ln-e\"/>\n  <text x=\"142\" y=\"25\" text-anchor=\"end\" class=\"t-a\">VDD<\/text>\n  <line x1=\"200\" y1=\"20\" x2=\"200\" y2=\"32\" class=\"ln\"/>\n  <rect x=\"193\" y=\"32\" width=\"14\" height=\"30\" rx=\"2\" class=\"box-e\"/>\n  <line x1=\"200\" y1=\"62\" x2=\"200\" y2=\"96\" class=\"ln-a\"/>\n  <circle cx=\"200\" cy=\"96\" r=\"4\" class=\"solid-a\"/>\n  <text x=\"186\" y=\"52\" text-anchor=\"end\" class=\"t-s\">Rp<\/text>\n  <line x1=\"250\" y1=\"20\" x2=\"250\" y2=\"32\" class=\"ln\"/>\n  <rect x=\"243\" y=\"32\" width=\"14\" height=\"30\" rx=\"2\" class=\"box-e\"/>\n  <line x1=\"250\" y1=\"62\" x2=\"250\" y2=\"126\" class=\"ln-b\"/>\n  <circle cx=\"250\" cy=\"126\" r=\"4\" class=\"solid-b\"/>\n  <text x=\"264\" y=\"52\" class=\"t-s\">Rp<\/text>\n  <text x=\"330\" y=\"30\" class=\"t-s\">풀업 저항 Rp (보통 4.7 kΩ)<\/text>\n  <text x=\"330\" y=\"50\" class=\"t-s\">아무도 안 당기면 → 선이 HIGH<\/text>\n  <text x=\"330\" y=\"70\" class=\"t-s\">누구든 LOW로 당기면 → 선 전체 LOW<\/text>\n  <rect x=\"10\" y=\"70\" width=\"90\" height=\"86\" rx=\"10\" class=\"solid-a\"/>\n  <text x=\"55\" y=\"106\" text-anchor=\"middle\" class=\"t-w\">MCU<\/text>\n  <text x=\"55\" y=\"126\" text-anchor=\"middle\" class=\"t-w\" font-size=\"12\">마스터<\/text>\n  <line x1=\"100\" y1=\"96\" x2=\"668\" y2=\"96\" class=\"ln-a\"/>\n  <line x1=\"100\" y1=\"126\" x2=\"668\" y2=\"126\" class=\"ln-b\"/>\n  <text x=\"108\" y=\"90\" class=\"t-a\">SDA<\/text>\n  <text x=\"108\" y=\"120\" class=\"t-a\">SCL<\/text>\n  <rect x=\"300\" y=\"170\" width=\"110\" height=\"50\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"355\" y=\"191\" text-anchor=\"middle\" class=\"t-b\">LCD 백팩<\/text>\n  <text x=\"355\" y=\"209\" text-anchor=\"middle\" class=\"t-s\">주소 0x27<\/text>\n  <rect x=\"430\" y=\"170\" width=\"110\" height=\"50\" rx=\"10\" class=\"box\"/>\n  <text x=\"485\" y=\"191\" text-anchor=\"middle\" class=\"t-b\">센서<\/text>\n  <text x=\"485\" y=\"209\" text-anchor=\"middle\" class=\"t-s\">고유 주소<\/text>\n  <rect x=\"560\" y=\"170\" width=\"110\" height=\"50\" rx=\"10\" class=\"box\"/>\n  <text x=\"615\" y=\"191\" text-anchor=\"middle\" class=\"t-b\">EEPROM<\/text>\n  <text x=\"615\" y=\"209\" text-anchor=\"middle\" class=\"t-s\">고유 주소<\/text>\n  <line x1=\"335\" y1=\"96\" x2=\"335\" y2=\"170\" class=\"ln-a\"/>\n  <circle cx=\"335\" cy=\"96\" r=\"4\" class=\"solid-a\"/>\n  <line x1=\"375\" y1=\"126\" x2=\"375\" y2=\"170\" class=\"ln-b\"/>\n  <circle cx=\"375\" cy=\"126\" r=\"4\" class=\"solid-b\"/>\n  <line x1=\"465\" y1=\"96\" x2=\"465\" y2=\"170\" class=\"ln-a\"/>\n  <circle cx=\"465\" cy=\"96\" r=\"4\" class=\"solid-a\"/>\n  <line x1=\"505\" y1=\"126\" x2=\"505\" y2=\"170\" class=\"ln-b\"/>\n  <circle cx=\"505\" cy=\"126\" r=\"4\" class=\"solid-b\"/>\n  <line x1=\"595\" y1=\"96\" x2=\"595\" y2=\"170\" class=\"ln-a\"/>\n  <circle cx=\"595\" cy=\"96\" r=\"4\" class=\"solid-a\"/>\n  <line x1=\"635\" y1=\"126\" x2=\"635\" y2=\"170\" class=\"ln-b\"/>\n  <circle cx=\"635\" cy=\"126\" r=\"4\" class=\"solid-b\"/>\n  <text x=\"340\" y=\"242\" text-anchor=\"middle\" class=\"t-s\">SDA = 데이터, SCL = 클럭(마스터가 만듦) → UART와 달리 동기식<\/text>\n<\/svg>\n```\n\n### 오픈 드레인 + 풀업\n- 장치는 선을 **LOW로 당기기 / 손 놓기** 두 가지만 해요. HIGH는 **풀업 저항 Rp**(보통 **4.7 kΩ**)가 VDD 쪽으로 끌어올려 만들어요.\n- 아무도 안 당기면 선은 **HIGH(idle)**, 하나라도 당기면 선 **전체가 LOW** → \"누구든 0을 내면 0\"이라 여러 장치가 **충돌 없이 공존**해요. 수신 측이 SDA를 LOW로 당겨 \"받았다\"를 알리는 **ACK**도 이 원리 덕분이에요.\n- **push-pull**(UART TX, LED용 GPIO)은 HIGH·LOW를 모두 트랜지스터가 강하게 밀어요. 두 출력을 한 선에 묶고 다른 값을 내면 VDD와 GND가 이어져 **합선(충돌)**이 나서 1:1 연결에만 써요.\n\n| 구분 | push-pull | 오픈 드레인 (I2C) |\n|---|---|---|\n| HIGH를 만드는 것 | 출력 트랜지스터 | **풀업 저항** |\n| LOW를 만드는 것 | 출력 트랜지스터 | 출력 트랜지스터 |\n| 한 선에 여러 장치 | 충돌 위험 | 안전하게 공유 |\n\n### 풀업이 빠지면 · 전압 · 속도\n- 풀업이 없으면 선을 HIGH로 올려 줄 것이 없어 **idle도, START·ACK도 판단할 수 없어요**. \"속도만 느려진다\", \"주소가 8-bit로 바뀐다\"는 오답이에요.\n- **idle 전압 = 풀업 전압**이에요. 5 V에 풀업된 백팩을 붙이면 MCU 핀에도 5 V가 걸리니, 실습 전 SDA/SCL idle 전압을 꼭 재요.\n- 저항이 선을 올리는 속도는 트랜지스터보다 느려서 속도 모드는 **100 kHz / 400 kHz / 1 MHz** 정도예요. 수업 LCD는 **100 kHz**를 써요.\n- 주소는 7-bit 또는 10-bit예요 (예: LCD 백팩 0x27, RTC 0x68).", "tip": "\"I2C 선은 push-pull로 HIGH·LOW를 모두 구동한다\"는 ✗ — **LOW만 당기고 HIGH는 풀업**(보통 4.7 kΩ)이 만들어요. UART와 비교하면 I2C는 **SCL이 있는 동기식 · SDA·SCL 2선 · MSB 먼저**예요."}, {"id": "c4-frame", "title": "I2C 프레임 — START·ACK·STOP", "sec": ["2. I2C 프레임: START에서 STOP까지"], "tags": ["START", "STOP", "ACK", "NACK", "Repeated START", "MSB 먼저", "9클럭"], "body": "I2C 프레임 규칙은 한 문장이에요. **\"데이터는 SCL이 LOW일 때만 바뀌고 HIGH일 때 읽힌다. SCL이 HIGH인데 SDA가 바뀌면 그건 데이터가 아니라 특별 신호(START/STOP)다.\"**\n\n```wave LCD(0x27)에 1바이트 쓰기 — 주소 7bit + W, ACK, 데이터 8bit, ACK\n@mark 1 START\n@mark 21 STOP\nSCL: 1 1 n n n n n n n n n n n n n n n n n n 1 1\nSDA: 1 0 2 2 2 2 2 2 2 3 0 4 4 4 4 4 4 4 4 0 0 1 | A6,A5,A4,A3,A2,A1,A0,W,D7,D6,D5,D4,D3,D2,D1,D0\n@span 2-9 주소 7bit + R/W\n@span 10-10 ACK\n@span 11-18 데이터 8bit\n@span 19-19 ACK\n```\n\n1. **START** — SCL HIGH인 채로 SDA **1→0**. \"지금부터 말할게요\".\n2. **주소 7비트** A6→A0을 **MSB부터**, 이어서 **R/W 1비트**(0 = 쓰기, 1 = 읽기). 둘이 합쳐 첫 바이트예요.\n3. **ACK** — **9번째 클럭**에 **받는 쪽**(쓰기라면 PCF8574)이 SDA를 LOW로 당겨요.\n4. **데이터 8비트** D7→D0 + ACK 한 번 더.\n5. **STOP** — SCL HIGH인 채로 SDA **0→1**. 버스가 다시 idle이 돼요.\n\n| 요소 | SCL | SDA | 뜻 |\n|---|---|---|---|\n| START | HIGH 유지 | 1 → 0 | 통신 시작 |\n| 데이터 비트 | LOW일 때 변경 | HIGH일 때 읽힘 | 0/1 값 |\n| ACK | 9번째 클럭 | 수신 측이 LOW | 받았다 |\n| NACK | 9번째 클럭 | HIGH로 남음 | 응답 없음 (장치 없음 등) |\n| STOP | HIGH 유지 | 0 → 1 | 통신 종료 |\n| Repeated START | — | STOP 없이 다시 START | 쓰기 후 바로 읽기로 전환 |\n\n### ACK를 누가 보내나\n- 송신 측이 8비트를 보낸 뒤 SDA를 놓으면 풀업 때문에 선은 원래 HIGH예요. 받는 쪽이 LOW로 당겨 주면 **ACK**, 아무도 안 당기면 **NACK**이에요. 그래서 **없는 주소를 부르면 자연스럽게 NACK** — 스캐너가 이 원리를 써요.\n- ACK는 항상 \"**받는 쪽**\"이 보내요. MCU가 쓰기를 하면 PCF8574가, MCU가 읽기를 하면 MCU가 ACK를 보내요.\n\n### 수업 코드의 1바이트 쓰기\n- 수업 LCD 코드는 **쓰기만** 하므로 매 전송 끝에 **STOP**을 붙여요 (IPL `sendStop = TRUE`, MCAL `RepeatedStart = FALSE`).\n- 1바이트 쓰기 한 번 = **START + 9클럭(주소+W+ACK) + 9클럭(데이터+ACK) + STOP**. 한 바이트 = 8비트 + ACK = **9클럭** 단위예요.\n- 100 kHz면 클럭 하나가 10 µs라 1바이트 쓰기 한 번에 대략 0.2 ms 정도 걸려요 (참고 계산).", "tip": "SCL HIGH 동안 SDA **1→0 = START**, **0→1 = STOP**. 데이터는 **LOW일 때 바뀌고 HIGH일 때 읽혀요**. ACK는 수신 측이 **9번째** 클럭에 SDA를 **LOW**로 유지하는 것이고, 비트 순서는 I2C **MSB 먼저**(UART는 LSB 먼저)예요."}, {"id": "c4-addr", "title": "7-bit 주소와 I2C 스캐너", "sec": ["3. 7-bit 주소와 I2C 스캐너"], "tags": ["7-bit 주소", "0x27", "0x4E", "Lpi2c_Ip_MasterSetSlaveAddr", "I2c_Probe", "I2c_Scan"], "body": "수업 코드의 **0x27, 0x3F는 7-bit 주소**예요. 버스에 실제로 나가는 첫 바이트는 주소를 한 칸 밀고 빈 bit0에 R/W를 붙인 값이에요. 공식은 **첫 바이트 = (주소 << 1) | R/W** (0 쓰기, 1 읽기).\n\n```svg 7-bit 주소 0x27 → 버스의 첫 바이트 (주소 << 1) | R/W\n<svg viewBox=\"0 0 680 206\" xmlns=\"http://www.w3.org/2000/svg\">\n  <text x=\"10\" y=\"56\" class=\"t-b\">7-bit 주소<\/text>\n  <text x=\"10\" y=\"74\" class=\"t-s\">API에 넣는 값<\/text>\n  <text x=\"190\" y=\"32\" text-anchor=\"middle\" class=\"t-s\">A6<\/text>\n  <text x=\"234\" y=\"32\" text-anchor=\"middle\" class=\"t-s\">A5<\/text>\n  <text x=\"278\" y=\"32\" text-anchor=\"middle\" class=\"t-s\">A4<\/text>\n  <text x=\"322\" y=\"32\" text-anchor=\"middle\" class=\"t-s\">A3<\/text>\n  <text x=\"366\" y=\"32\" text-anchor=\"middle\" class=\"t-s\">A2<\/text>\n  <text x=\"410\" y=\"32\" text-anchor=\"middle\" class=\"t-s\">A1<\/text>\n  <text x=\"454\" y=\"32\" text-anchor=\"middle\" class=\"t-s\">A0<\/text>\n  <rect x=\"170\" y=\"40\" width=\"40\" height=\"36\" rx=\"6\" class=\"box-a\"/>\n  <rect x=\"214\" y=\"40\" width=\"40\" height=\"36\" rx=\"6\" class=\"box-a\"/>\n  <rect x=\"258\" y=\"40\" width=\"40\" height=\"36\" rx=\"6\" class=\"box-a\"/>\n  <rect x=\"302\" y=\"40\" width=\"40\" height=\"36\" rx=\"6\" class=\"box-a\"/>\n  <rect x=\"346\" y=\"40\" width=\"40\" height=\"36\" rx=\"6\" class=\"box-a\"/>\n  <rect x=\"390\" y=\"40\" width=\"40\" height=\"36\" rx=\"6\" class=\"box-a\"/>\n  <rect x=\"434\" y=\"40\" width=\"40\" height=\"36\" rx=\"6\" class=\"box-a\"/>\n  <text x=\"190\" y=\"63\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <text x=\"234\" y=\"63\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <text x=\"278\" y=\"63\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <text x=\"322\" y=\"63\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <text x=\"366\" y=\"63\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <text x=\"410\" y=\"63\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <text x=\"454\" y=\"63\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <text x=\"494\" y=\"63\" class=\"t-a\">= 0x27<\/text>\n  <line x1=\"190\" y1=\"78\" x2=\"148\" y2=\"114\" class=\"ln dash\" marker-end=\"url(#ah)\"/>\n  <line x1=\"234\" y1=\"78\" x2=\"192\" y2=\"114\" class=\"ln dash\" marker-end=\"url(#ah)\"/>\n  <line x1=\"278\" y1=\"78\" x2=\"236\" y2=\"114\" class=\"ln dash\" marker-end=\"url(#ah)\"/>\n  <line x1=\"322\" y1=\"78\" x2=\"280\" y2=\"114\" class=\"ln dash\" marker-end=\"url(#ah)\"/>\n  <line x1=\"366\" y1=\"78\" x2=\"324\" y2=\"114\" class=\"ln dash\" marker-end=\"url(#ah)\"/>\n  <line x1=\"410\" y1=\"78\" x2=\"368\" y2=\"114\" class=\"ln dash\" marker-end=\"url(#ah)\"/>\n  <line x1=\"454\" y1=\"78\" x2=\"412\" y2=\"114\" class=\"ln dash\" marker-end=\"url(#ah)\"/>\n  <text x=\"494\" y=\"102\" class=\"t-s\">왼쪽으로 1칸 (&lt;&lt; 1)<\/text>\n  <text x=\"10\" y=\"136\" class=\"t-b\">첫 바이트<\/text>\n  <text x=\"10\" y=\"154\" class=\"t-s\">버스에 실림<\/text>\n  <rect x=\"126\" y=\"118\" width=\"40\" height=\"36\" rx=\"6\" class=\"box-a\"/>\n  <rect x=\"170\" y=\"118\" width=\"40\" height=\"36\" rx=\"6\" class=\"box-a\"/>\n  <rect x=\"214\" y=\"118\" width=\"40\" height=\"36\" rx=\"6\" class=\"box-a\"/>\n  <rect x=\"258\" y=\"118\" width=\"40\" height=\"36\" rx=\"6\" class=\"box-a\"/>\n  <rect x=\"302\" y=\"118\" width=\"40\" height=\"36\" rx=\"6\" class=\"box-a\"/>\n  <rect x=\"346\" y=\"118\" width=\"40\" height=\"36\" rx=\"6\" class=\"box-a\"/>\n  <rect x=\"390\" y=\"118\" width=\"40\" height=\"36\" rx=\"6\" class=\"box-a\"/>\n  <rect x=\"434\" y=\"118\" width=\"40\" height=\"36\" rx=\"6\" class=\"box-b\"/>\n  <text x=\"146\" y=\"141\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <text x=\"190\" y=\"141\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <text x=\"234\" y=\"141\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <text x=\"278\" y=\"141\" text-anchor=\"middle\" class=\"t-b\">0<\/text>\n  <text x=\"322\" y=\"141\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <text x=\"366\" y=\"141\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <text x=\"410\" y=\"141\" text-anchor=\"middle\" class=\"t-b\">1<\/text>\n  <text x=\"454\" y=\"141\" text-anchor=\"middle\" class=\"t-b\" font-size=\"12\">R/W<\/text>\n  <text x=\"454\" y=\"172\" text-anchor=\"middle\" class=\"t-s\">0 쓰기 · 1 읽기<\/text>\n  <text x=\"494\" y=\"134\" class=\"t-a\">W=0 → 0x4E<\/text>\n  <text x=\"494\" y=\"154\" class=\"t-a\">R=1 → 0x4F<\/text>\n  <text x=\"340\" y=\"198\" text-anchor=\"middle\" class=\"t-s\">같은 계산: 0x3F → 0x7E / 0x7F · 0x68 → 0xD0 / 0xD1<\/text>\n<\/svg>\n```\n\n| 7-bit 주소 | 쓰기 첫 바이트 | 읽기 첫 바이트 |\n|---|---|---|\n| 0x27 (LCD 백팩) | 0x4E | 0x4F |\n| 0x3F (다른 백팩) | 0x7E | 0x7F |\n| 0x68 (RTC 예) | 0xD0 | 0xD1 |\n\n### API에는 7-bit 값을 넣어요\n```c\nLpi2c_Ip_MasterSetSlaveAddr(1U, 0x27U, FALSE); // FALSE = 7-bit 주소\n```\n- 밀기와 R/W 붙이기는 **LPI2C 하드웨어**가 해 줘요. 데이터시트의 \"8-bit 주소 0x4E\"는 `>> 1` 해서 0x27로 바꿔 생각해요.\n- 흔한 실수: API에 0x4E를 넣으면 하드웨어가 한 번 더 밀어 **0x9C**를 보내고, 아무도 대답하지 않아 NACK만 돌아와요.\n\n### I2C 스캐너\n백팩 주소는 제품마다 달라서(보통 **0x27 또는 0x3F**) 먼저 스캐너로 찾아요. 가능한 주소를 차례로 불러 보고 **ACK가 오는 주소에 장치가 있다**고 판단해요.\n```c\nstatic uint8_t I2c_Probe(uint8_t addr)\n{\n    uint8_t probe = 0U;\n    Lpi2c_Ip_StatusType status;\n    Lpi2c_Ip_MasterSetSlaveAddr(1U, addr, FALSE);\n    status = Lpi2c_Ip_MasterSendDataBlocking(1U, &probe, 1U, TRUE, 20U);\n    return (status == LPI2C_IP_SUCCESS_STATUS) ? 1U : 0U;\n}\n/* I2c_Scan(): for (addr = 0x03U; addr <= 0x77U; addr++) 마다 Probe,\n   찾으면 printf(\"I2C device found at 0x%02X\\r\\n\", ...), 하나도 없으면 \"No I2C device found\" */\n```\n- 범위 **0x03~0x77**(117개 주소)에 **0x00 한 바이트**를 STOP까지 붙여 보내고, 타임아웃은 짧게 **20U**예요.\n- `%02X`라서 `I2C device found at 0x27`처럼 두 자리 대문자 16진수로 찍혀요.\n- 스캐너가 0x27에도 **0x00을 써 버리면** PCF8574 출력이 전부 0 → 백라이트(P3)가 꺼지고 제어선도 흔들려요. 그래서 **스캔 후에는 LCD를 다시 초기화**해요.\n- IPL 버전 Probe는 `MasterSetSlaveAddr()`로 **대상 주소를 계속 바꿔 놓아요** → `Lcd1602_Init()`이 주소를 다시 설정해야 LCD로 전송돼요. 그래서 `I2c_Scan()`은 `Lcd1602_Init()` **앞**에 둬요.\n- `printf()` 출력은 1장의 디버그 UART 경로로 확인해요.", "tip": "계산: 0x27 쓰기 **0x4E**·읽기 0x4F, 0x3F 쓰기 0x7E·읽기 **0x7F**. RTD API에는 **7-bit(0x27)**을 넣고 세 번째 인수 **FALSE = 7-bit**예요. 스캐너는 **0x03~0x77**에 0x00을 써서 ACK면 장치 있음, 스캔 뒤엔 **LCD 재초기화**."}, {"id": "c4-hd44780", "title": "HD44780 LCD — RS·E와 DDRAM 주소", "sec": ["4. HD44780과 1602 LCD"], "tags": ["HD44780", "RS", "E 하강 에지", "DDRAM", "CGRAM", "0x40", "Lcd1602_SetCursor"], "body": "**HD44780**은 16×2 캐릭터 LCD의 표준 컨트롤러예요. MCU는 픽셀을 그리지 않고 \"이 칸에 문자 코드 0x41('A')\"처럼 **문자 코드만** 보내면, 컨트롤러가 내장 글꼴로 그려 줘요. 수업의 **GDM1602K**는 **KS0066U 또는 동등**(HD44780 호환) 컨트롤러를 써요.\n\n- MCU가 RS·R/W·E와 데이터선으로 값을 보내면 → **RS = 0**이면 **IR(명령 레지스터)** 로(\"화면 지워\", \"커서를 2행으로\"), **RS = 1**이면 **DR(데이터 레지스터)** 로 가서 **AC(주소 카운터)** 가 가리키는 **DDRAM** 칸에 문자 코드가 저장돼요.\n- **DDRAM**(80바이트) = 표시할 문자 코드, **CGROM** = 내장 글꼴, **CGRAM** = 사용자 정의 문자.\n- **E(enable)** 는 \"지금 값을 가져가\" 신호예요. **E가 1→0으로 떨어지는 하강 에지**에서 RS와 데이터선을 래치해요.\n- **BF(busy flag)** 를 읽으려면 R/W=1이 필요한데, 수업 코드는 R/W를 **항상 0**으로 둬서 BF 대신 **Delay로 충분히 기다려요**.\n\n| RS | R/W | 동작 |\n|---|---|---|\n| 0 | 0 | 명령 쓰기 (IR) |\n| 1 | 0 | 데이터 쓰기 (DDRAM 등) |\n| 0 | 1 | BF·AC 읽기 (수업 코드는 안 씀) |\n\n### DDRAM 주소와 커서 이동\n16×2 화면의 칸마다 DDRAM 주소가 있어요. 1행은 0x00~0x0F, **2행은 0x10이 아니라 0x40부터**예요.\n\n```svg 16×2 DDRAM 주소 지도 — 커서 이동 명령 = 0x80 | 주소\n<svg viewBox=\"0 0 680 158\" xmlns=\"http://www.w3.org/2000/svg\">\n  <text x=\"79\" y=\"22\" text-anchor=\"middle\" class=\"t-s\">0<\/text>\n  <text x=\"117\" y=\"22\" text-anchor=\"middle\" class=\"t-s\">1<\/text>\n  <text x=\"155\" y=\"22\" text-anchor=\"middle\" class=\"t-s\">2<\/text>\n  <text x=\"193\" y=\"22\" text-anchor=\"middle\" class=\"t-s\">3<\/text>\n  <text x=\"231\" y=\"22\" text-anchor=\"middle\" class=\"t-s\">4<\/text>\n  <text x=\"269\" y=\"22\" text-anchor=\"middle\" class=\"t-s\">5<\/text>\n  <text x=\"307\" y=\"22\" text-anchor=\"middle\" class=\"t-s\">6<\/text>\n  <text x=\"345\" y=\"22\" text-anchor=\"middle\" class=\"t-s\">7<\/text>\n  <text x=\"383\" y=\"22\" text-anchor=\"middle\" class=\"t-s\">8<\/text>\n  <text x=\"421\" y=\"22\" text-anchor=\"middle\" class=\"t-s\">9<\/text>\n  <text x=\"459\" y=\"22\" text-anchor=\"middle\" class=\"t-s\">10<\/text>\n  <text x=\"497\" y=\"22\" text-anchor=\"middle\" class=\"t-s\">11<\/text>\n  <text x=\"535\" y=\"22\" text-anchor=\"middle\" class=\"t-s\">12<\/text>\n  <text x=\"573\" y=\"22\" text-anchor=\"middle\" class=\"t-s\">13<\/text>\n  <text x=\"611\" y=\"22\" text-anchor=\"middle\" class=\"t-s\">14<\/text>\n  <text x=\"649\" y=\"22\" text-anchor=\"middle\" class=\"t-s\">15<\/text>\n  <text x=\"10\" y=\"53\" class=\"t-b\">1행<\/text>\n  <text x=\"10\" y=\"93\" class=\"t-b\">2행<\/text>\n  <rect x=\"62\" y=\"30\" width=\"34\" height=\"36\" rx=\"4\" class=\"box-a\"/>\n  <rect x=\"100\" y=\"30\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"138\" y=\"30\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"176\" y=\"30\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"214\" y=\"30\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"252\" y=\"30\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"290\" y=\"30\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"328\" y=\"30\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"366\" y=\"30\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"404\" y=\"30\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"442\" y=\"30\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"480\" y=\"30\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"518\" y=\"30\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"556\" y=\"30\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"594\" y=\"30\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"632\" y=\"30\" width=\"34\" height=\"36\" rx=\"4\" class=\"box-a\"/>\n  <rect x=\"62\" y=\"70\" width=\"34\" height=\"36\" rx=\"4\" class=\"box-d\"/>\n  <rect x=\"100\" y=\"70\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"138\" y=\"70\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"176\" y=\"70\" width=\"34\" height=\"36\" rx=\"4\" class=\"box-b\"/>\n  <rect x=\"214\" y=\"70\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"252\" y=\"70\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"290\" y=\"70\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"328\" y=\"70\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"366\" y=\"70\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"404\" y=\"70\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"442\" y=\"70\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"480\" y=\"70\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"518\" y=\"70\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"556\" y=\"70\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"594\" y=\"70\" width=\"34\" height=\"36\" rx=\"4\" class=\"box\"/>\n  <rect x=\"632\" y=\"70\" width=\"34\" height=\"36\" rx=\"4\" class=\"box-d\"/>\n  <text x=\"79\" y=\"52\" text-anchor=\"middle\" class=\"t-b\" font-size=\"12\">00<\/text>\n  <text x=\"117\" y=\"52\" text-anchor=\"middle\" class=\"t-s\">01<\/text>\n  <text x=\"155\" y=\"52\" text-anchor=\"middle\" class=\"t-s\">02<\/text>\n  <text x=\"193\" y=\"52\" text-anchor=\"middle\" class=\"t-s\">03<\/text>\n  <text x=\"231\" y=\"52\" text-anchor=\"middle\" class=\"t-s\">04<\/text>\n  <text x=\"269\" y=\"52\" text-anchor=\"middle\" class=\"t-s\">05<\/text>\n  <text x=\"307\" y=\"52\" text-anchor=\"middle\" class=\"t-s\">06<\/text>\n  <text x=\"345\" y=\"52\" text-anchor=\"middle\" class=\"t-s\">07<\/text>\n  <text x=\"383\" y=\"52\" text-anchor=\"middle\" class=\"t-s\">08<\/text>\n  <text x=\"421\" y=\"52\" text-anchor=\"middle\" class=\"t-s\">09<\/text>\n  <text x=\"459\" y=\"52\" text-anchor=\"middle\" class=\"t-s\">0A<\/text>\n  <text x=\"497\" y=\"52\" text-anchor=\"middle\" class=\"t-s\">0B<\/text>\n  <text x=\"535\" y=\"52\" text-anchor=\"middle\" class=\"t-s\">0C<\/text>\n  <text x=\"573\" y=\"52\" text-anchor=\"middle\" class=\"t-s\">0D<\/text>\n  <text x=\"611\" y=\"52\" text-anchor=\"middle\" class=\"t-s\">0E<\/text>\n  <text x=\"649\" y=\"52\" text-anchor=\"middle\" class=\"t-b\" font-size=\"12\">0F<\/text>\n  <text x=\"79\" y=\"92\" text-anchor=\"middle\" class=\"t-b\" font-size=\"12\">40<\/text>\n  <text x=\"117\" y=\"92\" text-anchor=\"middle\" class=\"t-s\">41<\/text>\n  <text x=\"155\" y=\"92\" text-anchor=\"middle\" class=\"t-s\">42<\/text>\n  <text x=\"193\" y=\"92\" text-anchor=\"middle\" class=\"t-b\" font-size=\"12\">43<\/text>\n  <text x=\"231\" y=\"92\" text-anchor=\"middle\" class=\"t-s\">44<\/text>\n  <text x=\"269\" y=\"92\" text-anchor=\"middle\" class=\"t-s\">45<\/text>\n  <text x=\"307\" y=\"92\" text-anchor=\"middle\" class=\"t-s\">46<\/text>\n  <text x=\"345\" y=\"92\" text-anchor=\"middle\" class=\"t-s\">47<\/text>\n  <text x=\"383\" y=\"92\" text-anchor=\"middle\" class=\"t-s\">48<\/text>\n  <text x=\"421\" y=\"92\" text-anchor=\"middle\" class=\"t-s\">49<\/text>\n  <text x=\"459\" y=\"92\" text-anchor=\"middle\" class=\"t-s\">4A<\/text>\n  <text x=\"497\" y=\"92\" text-anchor=\"middle\" class=\"t-s\">4B<\/text>\n  <text x=\"535\" y=\"92\" text-anchor=\"middle\" class=\"t-s\">4C<\/text>\n  <text x=\"573\" y=\"92\" text-anchor=\"middle\" class=\"t-s\">4D<\/text>\n  <text x=\"611\" y=\"92\" text-anchor=\"middle\" class=\"t-s\">4E<\/text>\n  <text x=\"649\" y=\"92\" text-anchor=\"middle\" class=\"t-b\" font-size=\"12\">4F<\/text>\n  <text x=\"10\" y=\"130\" class=\"t-a\">SetCursor(0, 0) → 0x80 | 0x00 = 0x80<\/text>\n  <text x=\"360\" y=\"130\" class=\"t-a\">SetCursor(1, 3) → 0x80 | 0x40 | 3 = 0xC3<\/text>\n  <text x=\"340\" y=\"152\" text-anchor=\"middle\" class=\"t-s\">주소는 16진수 (1행 0x00~0x0F, 2행 0x40~0x4F)<\/text>\n<\/svg>\n```\n\n커서 이동 명령(Set DDRAM address)은 최상위 비트 0x80을 켜고 아래 7비트에 주소를 넣어요 → **명령 = 0x80 | 행 시작 주소 | 열**.\n```c\nif (col >= LCD_COLUMN_COUNT) { col = LCD_COLUMN_COUNT - 1U; } // 16 이상 → 15\nddramAddress = (row == 0U) ? LCD_DDRAM_ROW0 : LCD_DDRAM_ROW1; // 0x00 / 0x40\nLcd1602_WriteCommand((uint8_t)(LCD_CMD_SET_DDRAM | ddramAddress | col)); // RS=0\n```\n\n| 호출 | 계산 | 명령 바이트 |\n|---|---|---|\n| `SetCursor(0, 0)` | 0x80 \\| 0x00 \\| 0 | **0x80** |\n| `SetCursor(1, 0)` | 0x80 \\| 0x40 \\| 0 | **0xC0** |\n| `SetCursor(1, 3)` | 0x80 \\| 0x40 \\| 3 | **0xC3** |\n| `SetCursor(0, 20)` | col → 15 | **0x8F** |\n\n커서를 놓은 뒤 문자를 쓰면 Entry mode(0x06) 덕분에 주소가 **자동으로 1씩 증가**해요. 그래서 `Puts(\"Hello\")`는 SetCursor 한 번으로 다섯 칸에 이어 써져요.\n\n**GDM1602K 자체는 병렬 LCD 모듈이고 I2C 장치가 아니에요.** I2C로 다룰 수 있는 건 PCF8574 백팩 덕분이에요.", "tip": "**RS 0 = 명령, 1 = 데이터**, **R/W 0 = 쓰기**, E는 **하강 에지(1→0)**에서 래치. `SetCursor(1, 3)` = **0xC3** — 2행을 0x10으로 계산한 0x93은 함정이에요. 표시 문자는 **DDRAM**, 사용자 정의 문자는 **CGRAM**."}, {"id": "c4-pcf8574", "title": "PCF8574 백팩과 4-bit 전송", "sec": ["5. PCF8574 백팩과 4-bit 전송"], "tags": ["PCF8574", "LCD_RS 0x01", "LCD_E 0x04", "LCD_BACKLIGHT 0x08", "LCD_DATA_MASK 0xF0", "4-bit 모드", "니블"], "body": "**PCF8574**는 I2C로 받은 1바이트를 그대로 8개 핀 P0~P7에 출력하는 **8비트 I/O 익스팬더**예요. 백팩 안에서 이 핀들이 LCD의 RS·R/W·E·백라이트·D4~D7에 연결돼 있어서 **I2C 데이터 바이트의 각 비트 = LCD 핀 하나의 HIGH/LOW**예요.\n\n```bits PCF8574에 쓰는 1바이트 = LCD 핀 8개 (코드 매크로 값 포함)\n@bits 8\n7: D7 | P7 — 데이터 (LCD_DATA_MASK 0xF0) | a\n6: D6 | P6 — 데이터 | a\n5: D5 | P5 — 데이터 | a\n4: D4 | P4 — 데이터 | a\n3: BL | P3 — 백라이트 (LCD_BACKLIGHT 0x08) | b\n2: E | P2 — enable (LCD_E 0x04), 1→0에서 래치 | c\n1: R/W | P1 — 항상 0 = 쓰기 | d\n0: RS | P0 — register select (LCD_RS 0x01), 0 명령·1 데이터 | e\n```\n\n| PCF8574 비트 | LCD 핀 | 코드 매크로 | 1이면 |\n|---|---|---|---|\n| P7~P4 | D7~D4 | `LCD_DATA_MASK` 0xF0 | 데이터 니블 |\n| P3 | BL | `LCD_BACKLIGHT` 0x08 | 백라이트 켜짐 |\n| P2 | E | `LCD_E` 0x04 | enable HIGH |\n| P1 | R/W | (매크로 없음, 0x02) | 읽기 — 안 씀 |\n| P0 | RS | `LCD_RS` 0x01 | 데이터 레지스터 |\n\n예: **0x4D = `0100 1101`** → D7~D4 = 0100, BL=1, E=1, R/W=0, RS=1. 이 매핑은 **백팩 회로가 정한 것**이라 백팩이 다르면 바뀔 수 있어요(글자가 깨지면 `LCD_RS`, `LCD_E`, 데이터 비트 매핑부터 의심).\n\n### 왜 4-bit 모드?\n핀 8개 중 RS·R/W·E·BL에 4개를 쓰면 데이터선은 **D4~D7 4개뿐**이에요. 그래서 8비트 값을 **상위 니블 → 하위 니블** 두 번에 나눠 보내고, 니블마다 **E를 1→0**으로 떨어뜨려 래치시켜요. 8-bit 모드(D0~D7, E 펄스 1번)보다 핀은 아끼고 **전송은 2배**예요.\n\n```wave 'A'(0x41) 한 글자 = PCF8574에 4번 쓰기 (IPL)\n@mark 2 래치↓\n@mark 6 래치↓\n보내는 바이트: 2 . 3 . 2 . 3 . | 0x4D,0x49,0x1D,0x19\nD7~D4: 4 . . . 5 . . . | 0100 (상위 니블),0001 (하위 니블)\nE (P2): 1 . 0 . 1 . 0 .\nRS (P0): 1 . . . . . . .\n@span 0-3 상위 니블 → E=1 0x4D, E=0 0x49\n@span 4-7 하위 니블 → E=1 0x1D, E=0 0x19\n```\n\n'A' = 0x41 = `0100 0001`, 데이터라 RS=1, BL=1:\n1. 상위: `(0x41 & 0xF0) | 0x08 | 0x01` = **0x49** → E=1 바이트 **0x4D**, E=0 바이트 **0x49** (이 하강 에지에 `0100` 래치).\n2. 하위: `(uint8_t)(0x41 << 4)` = 0x10 → OR 하면 **0x19** → **0x1D**, **0x19** (`0001` 래치).\n\n| 순서 | 바이트 | D7~D4 · BL E RW RS | 뜻 |\n|---|---|---|---|\n| 1 | 0x4D | 0100 · 1 1 0 1 | 상위 니블, E=1 |\n| 2 | 0x49 | 0100 · 1 0 0 1 | E↓ → 0100 래치 |\n| 3 | 0x1D | 0001 · 1 1 0 1 | 하위 니블, E=1 |\n| 4 | 0x19 | 0001 · 1 0 0 1 | E↓ → 0001 래치 |\n\n- **명령**이면 RS 비트만 빠져요. Clear(0x01) → **0x0C, 0x08, 0x1C, 0x18**.\n- IPL 버전은 **한 글자에 I2C write 4번**이고, 각 write가 START~STOP 한 프레임이라 생각보다 느려요 (5장 \"LCD 출력은 ISR 금지\"로 이어져요).\n- 백라이트 비트(0x08)를 빼면 백라이트가 꺼져요.", "tip": "계산 공식: 상위 `(c & 0xF0) | 0x08 | RS`, 하위 `((c << 4) & 0xF0) | 0x08 | RS`, E=1 바이트는 +0x04. 'S'(0x53) 상위 E=1 = **0x5D** (E 빠뜨린 0x59, 하위 니블 0x3D가 오답 보기). 매핑 **P0=RS, P1=R/W, P2=E, P3=BL, P4~P7=D4~D7**."}, {"id": "c4-hw", "title": "기준 하드웨어·배선·IPL 설정", "sec": ["6. 기준 하드웨어·배선·IPL 설정"], "tags": ["LPI2C1", "open-drain", "LPI2C1_CLK", "ALPS_SLOW_CLK", "100000 bit/s", "레벨시프터", "Lpi2c_Ip_PBcfg.h"], "body": "실습 목표: **LPI2C1 master 100 kHz** → `lcd1602.c/.h` 작성 → **1행 \"Hello S32K3\", 2행 카운터**. 실습 A는 IPL(`Lpi2c_Ip_*`), 실습 B는 MCAL(CDD I2c)이에요.\n\n```svg 배선 (슬라이드 p18 배선표 기준) — 4가닥이면 끝\n<svg viewBox=\"0 0 680 252\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"10\" y=\"10\" width=\"170\" height=\"200\" rx=\"12\" class=\"box-b\"/>\n  <text x=\"95\" y=\"36\" text-anchor=\"middle\" class=\"t-b\">LCD 백팩<\/text>\n  <text x=\"95\" y=\"54\" text-anchor=\"middle\" class=\"t-s\">PCF8574 · 0x27<\/text>\n  <text x=\"166\" y=\"85\" text-anchor=\"end\" class=\"t-b\">GND<\/text>\n  <text x=\"166\" y=\"117\" text-anchor=\"end\" class=\"t-b\">VCC<\/text>\n  <text x=\"166\" y=\"149\" text-anchor=\"end\" class=\"t-b\">SDA<\/text>\n  <text x=\"166\" y=\"181\" text-anchor=\"end\" class=\"t-b\">SCL<\/text>\n  <rect x=\"400\" y=\"10\" width=\"270\" height=\"200\" rx=\"12\" class=\"box-a\"/>\n  <text x=\"535\" y=\"36\" text-anchor=\"middle\" class=\"t-b\">S32K312EVB-Q172<\/text>\n  <text x=\"535\" y=\"54\" text-anchor=\"middle\" class=\"t-s\">헤더 핀<\/text>\n  <text x=\"412\" y=\"85\" class=\"t-b\">J39 18번<\/text>\n  <text x=\"496\" y=\"85\" class=\"t-s\">GND<\/text>\n  <text x=\"412\" y=\"117\" class=\"t-b\">J39 4번<\/text>\n  <text x=\"496\" y=\"117\" class=\"t-s\">강사 지정 전원 (5 V)<\/text>\n  <text x=\"412\" y=\"149\" class=\"t-b\">J4 25번<\/text>\n  <text x=\"496\" y=\"149\" class=\"t-s\">LPI2C1_SDA<\/text>\n  <text x=\"412\" y=\"181\" class=\"t-b\">J4 28번<\/text>\n  <text x=\"496\" y=\"181\" class=\"t-s\">LPI2C1_SCL<\/text>\n  <line x1=\"180\" y1=\"80\" x2=\"400\" y2=\"80\" class=\"ln\"/>\n  <line x1=\"180\" y1=\"112\" x2=\"400\" y2=\"112\" class=\"ln-e\"/>\n  <line x1=\"180\" y1=\"144\" x2=\"400\" y2=\"144\" class=\"ln-a\"/>\n  <line x1=\"180\" y1=\"176\" x2=\"400\" y2=\"176\" class=\"ln-b\"/>\n  <text x=\"290\" y=\"106\" text-anchor=\"middle\" class=\"t-s\">5 V<\/text>\n  <text x=\"290\" y=\"138\" text-anchor=\"middle\" class=\"t-s\">PTC6 ↔ PTD8 ?<\/text>\n  <text x=\"290\" y=\"170\" text-anchor=\"middle\" class=\"t-s\">PTC7 ↔ PTD9 ?<\/text>\n  <text x=\"340\" y=\"236\" text-anchor=\"middle\" class=\"t-s\">실습 전 SDA/SCL idle 전압 측정 → 3.3 V를 넘으면 레벨시프터<\/text>\n<\/svg>\n```\n\n### 배선과 전압\n- 백팩은 **GND·VCC·SDA·SCL 네 가닥**: GND ↔ J39 18번, VCC ↔ J39 4번(5 V), SDA ↔ J4 25번, SCL ↔ J4 28번. GND가 공통이 아니면 HIGH/LOW 판단 자체가 안 돼요.\n- **백팩 안에 SDA/SCL 풀업이 이미 들어 있어요.** 백팩 VCC가 5 V면 idle 전압도 5 V예요 → 멀티미터로 **idle 전압을 재고, 3.3 V를 넘으면 레벨시프터**. 단, 이 보드(S32K312EVB)는 I/O 핀 전압이 **5 V로 설정**돼 있다고 슬라이드 p19가 적어요.\n- 핀 이름은 자료마다 섞여 있어요: p18·21·53·54는 **PTC6/PTC7**, p15·24·79·80과 교재는 **PTD8/PTD9**. 둘 다 **LPI2C1_SDA/SCL**이니 강사가 지정한 핀을 Pins 탭과 보고서에 똑같이 적어요.\n\n### IPL Config Tools → 코드\n| 설정 | 값 | 코드에서 보이는 곳 |\n|---|---|---|\n| Pins | SDA/SCL, **open-drain** (외부 5 V 풀업) | `Siul2_Port_Ip_Init(…)` |\n| 클럭 참조점 | Name **LPI2C1_CLK** = **ALPS_SLOW_CLK** | LPI2C 모듈의 clock source |\n| LPI2C channel | **LPI2C1** | API 첫 인수 **1U** |\n| mode / 속도 | **Master** / Prescaler로 **100000** bit/s | `I2c_Lpi2cMaster_HwChannel1_Channel0` |\n| 슬레이브 주소 | (설정 안 함) | `MasterSetSlaveAddr(1U, 0x27U, FALSE)` |\n\n- 클럭 참조점의 reference frequency가 **0 Hz**면 LPI2C에 클럭이 안 들어가 SCL을 만들 수 없어요 → \"0 Hz가 아님\" 확인.\n- **Prescaler**는 입력 클럭을 나눠 SCL이 100 kHz가 되게 맞추는 값이에요.\n- `I2cAsyncMethod = LPI2C_USING_INTERRUPTS`여도 이 실습은 **blocking API**만 써서 내부적으로 끝날 때까지 polling하고, master callback은 `NULL_PTR`이에요(DMA 미사용).\n- 코드 생성 후 `Lpi2c_Ip_PBcfg.h`에서 **master config 객체 이름**을 확인해요. 생성 파일: `Lpi2c_Ip_Cfg.h`, `Lpi2c_Ip_PBcfg.h`, `Lpi2c_Ip_PBcfg.c` / 작성: `lcd1602.h`, `lcd1602.c`, `main.c`.\n- 내부 Pull Up Enable: 교재(IPL)는 켜라고, MCAL 슬라이드(p54)는 켜지 말라고 해요. 외부 풀업이 이미 있으니 내부 풀업은 보조일 뿐이고, 켰다면 idle 전압만 다시 확인해요.\n\n기준 환경: S32DS 3.6.7 / S32K3 RTD 7.0.1, 보드 S32K312EVB-Q172, LPI2C1 · 100 kHz · 7-bit.", "tip": "LCD 주소 0x27과 7-bit 여부는 master config가 아니라 **코드 인수**(`MasterSetSlaveAddr(1U, address, FALSE)`)예요. Config의 **LPI2C1 ↔ API instance 1U**(0U는 MCAL 논리 채널), SDA/SCL은 **open-drain**, 클럭 참조점은 **0 Hz가 아니어야** 해요."}, {"id": "c4-driver", "title": "lcd1602 드라이버 — 계층과 4-bit 초기화", "sec": ["7. lcd1602 드라이버 — 호출 계층과 초기화"], "tags": ["Lcd1602_Init", "Lcd1602_PulseEnable", "Lcd1602_WriteNibble", "Lcd1602_WriteByte", "I2c_Lcd1602_Write", "0x28", "0x0C", "0x06"], "body": "공개 API는 `Lcd1602_Init(address)`, `Clear()`, `SetCursor(row, col)`, `Putc(c)`, `Puts(s)` **5개**뿐이고, 나머지는 **`static`** 내부 함수로 숨겨요. 그래서 I2C 세부사항이 `main.c`로 새지 않아요.\n\n```svg 4장 전체 지도 — 문자열이 LCD 글자가 되기까지\n<svg viewBox=\"0 0 680 150\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"4\" y=\"8\" width=\"400\" height=\"108\" rx=\"14\" class=\"box-0 dash\"/>\n  <text x=\"16\" y=\"27\" class=\"t-s\">S32K312 MCU 안 (소프트웨어 + LPI2C1)<\/text>\n  <rect x=\"412\" y=\"8\" width=\"264\" height=\"108\" rx=\"14\" class=\"box-0 dash\"/>\n  <text x=\"424\" y=\"27\" class=\"t-s\">LCD 모듈 (백팩 + LCD)<\/text>\n  <rect x=\"12\" y=\"40\" width=\"116\" height=\"66\" rx=\"10\" class=\"box\"/>\n  <text x=\"70\" y=\"66\" text-anchor=\"middle\" class=\"t-b\">main.c<\/text>\n  <text x=\"70\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">Lcd1602_Puts()<\/text>\n  <rect x=\"146\" y=\"40\" width=\"116\" height=\"66\" rx=\"10\" class=\"box-c\"/>\n  <text x=\"204\" y=\"66\" text-anchor=\"middle\" class=\"t-b\">lcd1602.c<\/text>\n  <text x=\"204\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">니블 · E 펄스<\/text>\n  <rect x=\"280\" y=\"40\" width=\"116\" height=\"66\" rx=\"10\" class=\"box-a\"/>\n  <text x=\"338\" y=\"66\" text-anchor=\"middle\" class=\"t-b\">LPI2C1<\/text>\n  <text x=\"338\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">IPL 또는 MCAL<\/text>\n  <rect x=\"420\" y=\"40\" width=\"116\" height=\"66\" rx=\"10\" class=\"box-b\"/>\n  <text x=\"478\" y=\"66\" text-anchor=\"middle\" class=\"t-b\">PCF8574<\/text>\n  <text x=\"478\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">0x27 · P0~P7<\/text>\n  <rect x=\"554\" y=\"40\" width=\"116\" height=\"66\" rx=\"10\" class=\"box-d\"/>\n  <text x=\"612\" y=\"66\" text-anchor=\"middle\" class=\"t-b\">HD44780<\/text>\n  <text x=\"612\" y=\"88\" text-anchor=\"middle\" class=\"t-s\">16×2 LCD<\/text>\n  <line x1=\"129\" y1=\"73\" x2=\"143\" y2=\"73\" class=\"ln-a\" marker-end=\"url(#ah-a)\"/>\n  <line x1=\"263\" y1=\"73\" x2=\"277\" y2=\"73\" class=\"ln-a\" marker-end=\"url(#ah-a)\"/>\n  <line x1=\"397\" y1=\"73\" x2=\"417\" y2=\"73\" class=\"ln-a\" marker-end=\"url(#ah-a)\"/>\n  <line x1=\"537\" y1=\"73\" x2=\"551\" y2=\"73\" class=\"ln-a\" marker-end=\"url(#ah-a)\"/>\n  <text x=\"137\" y=\"138\" text-anchor=\"middle\" class=\"t-a\">문자열<\/text>\n  <text x=\"271\" y=\"138\" text-anchor=\"middle\" class=\"t-a\">1바이트씩<\/text>\n  <text x=\"408\" y=\"138\" text-anchor=\"middle\" class=\"t-a\">SDA·SCL<\/text>\n  <text x=\"545\" y=\"138\" text-anchor=\"middle\" class=\"t-a\">RS·E·D4~D7<\/text>\n<\/svg>\n```\n\n| 층 | 하는 일 |\n|---|---|\n| `Puts` / `Putc` | 널 종단까지 한 글자씩 → `WriteByte(c, 1U)` (1U = 데이터, RS=1) |\n| `WriteCommand` | `WriteByte(cmd, 0U)` (0U = 명령, RS=0) |\n| `WriteByte` | 상위 니블 → `(uint8_t)(value << 4U)` 하위 니블, 끝에 Delay(5000U) |\n| `WriteNibble` | `(nibble & LCD_DATA_MASK)` OR `LCD_BACKLIGHT` (+ 데이터면 OR `LCD_RS`) |\n| `PulseEnable` | `value` OR `LCD_E` 쓰고 → `value & ~LCD_E` 쓰기 (E 1→0) |\n| `I2c_Lcd1602_Write` | `Lpi2c_Ip_MasterSendDataBlocking(1U, &tx, 1U, TRUE, 100U)` — 이것만 바꾸면 MCAL |\n\n```c\nstatic void Lcd1602_PulseEnable(uint8_t value)\n{\n    I2c_Lcd1602_Write(value | LCD_E);                // E=1\n    Lcd1602_Delay(2000U);\n    I2c_Lcd1602_Write(value & (uint8_t)(~LCD_E));    // E=0 → 하강 에지에서 래치\n    Lcd1602_Delay(2000U);\n}\n```\n- `Puts(\"Hi\")` → 'H'(0x48): 0x4D, 0x49, 0x8D, 0x89 / 'i'(0x69): 0x6D, 0x69, 0x9D, 0x99 → **write 8번**. 전송이 **blocking**이라 각 write가 끝나야 돌아와요.\n- **R/W(P1)는 한 번도 안 세워요** → busy flag를 못 읽고 **Delay로 기다려요**. Delay 횟수는 busy-wait 실습용이고, 제품 코드에선 타이머 기반 지연으로 바꿔요.\n\n### 4-bit 초기화 — `Lcd1602_Init(address)`\n1. `g_lcd_addr` 보관, `MasterSetSlaveAddr(1U, address, FALSE)`, `Delay(400000U)`로 전원 안정 대기.\n2. **`WriteNibble(0x30)` × 3** (실제 바이트 0x3C → 0x38) — 상대가 8-bit든 4-bit 중간이든 **8-bit로 동기화**.\n3. **`WriteNibble(0x20)`** (0x2C → 0x28) — 이 한 니블로 **4-bit 모드** 진입. 여기까지는 니블 1개씩.\n4. 이제 `WriteCommand()`(니블 2번): **0x28 → 0x0C → 0x06**.\n5. **Clear 0x01** + `Delay(200000U)` — Clear는 처리 시간이 길어요.\n\n| 명령 | 매크로 | 의미 |\n|---|---|---|\n| 0x28 | `LCD_CMD_FUNCTION_4BIT` | Function set: 4-bit, 2줄, 5×8 도트 |\n| 0x0C | `LCD_CMD_DISPLAY_ON` | 화면 ON, 커서 OFF |\n| 0x06 | `LCD_CMD_ENTRY_INCREMENT` | 쓸 때마다 주소 +1 |\n| 0x01 | `LCD_CMD_CLEAR` | 화면 지움, 주소 0 |\n| 0x80 \\| 주소 | `LCD_CMD_SET_DDRAM` | 다음 글자 위치 |\n\n**슬라이드 p31(및 p61)의 주석 위치는 오타예요.** `/* 4-bit, 2-line, 5x8 dots */`가 0x0C 줄에 붙어 있지만, 이건 **0x28(Function set)** 의 설명이에요. 교재는 1바이트 전송 함수를 `Lcd1602_WriteExpander()`로 적어요(슬라이드 `I2c_Lcd1602_Write()`, 역할 같음).", "tip": "초기화 순서 **0x30 ×3 → 0x20 → 0x28 → 0x0C → 0x06 → 0x01** (앞 4개는 `WriteNibble`, 뒤 4개는 `WriteCommand`). 0x0C를 \"4-bit, 2-line\"으로 고르면 슬라이드 주석 오타에 속은 거예요. `Putc` = `WriteByte(c, 1U)`, `WriteCommand` = `WriteByte(cmd, 0U)`."}, {"id": "c4-main", "title": "main 흐름 — IPL vs MCAL API", "sec": ["8. main 흐름 — IPL vs MCAL API"], "tags": ["Lpi2c_Ip_MasterInit", "Lpi2c_Ip_MasterSendDataBlocking", "I2c_Init", "I2c_SyncTransmit", "instance 1U", "channel 0U", "CDD", "snprintf"], "body": "두 방식 모두 **클럭 → 핀 → I2C 초기화 → (백라이트 끄기/스캔) → LCD 초기화 → 주기 출력** 순서예요. 아래 단계가 위 단계에 기대므로 순서를 바꾸면 안 돼요(클럭이 없으면 SCL을 못 만들고, 핀 mux가 없으면 신호가 밖으로 안 나가요).\n\n```svg IPL과 MCAL의 I2C 호출 사슬 — 같은 LCD, 다른 API\n<svg viewBox=\"0 0 680 330\" xmlns=\"http://www.w3.org/2000/svg\">\n  <text x=\"170\" y=\"22\" text-anchor=\"middle\" class=\"t-b\">IPL (실습 A)<\/text>\n  <text x=\"510\" y=\"22\" text-anchor=\"middle\" class=\"t-b\">MCAL · CDD I2c (실습 B)<\/text>\n  <rect x=\"10\" y=\"34\" width=\"320\" height=\"46\" rx=\"10\" class=\"box\"/>\n  <text x=\"170\" y=\"54\" text-anchor=\"middle\" class=\"t-b\" font-size=\"13\">Clock_Ip_Init(…)<\/text>\n  <text x=\"170\" y=\"71\" text-anchor=\"middle\" class=\"t-s\">클럭<\/text>\n  <rect x=\"10\" y=\"94\" width=\"320\" height=\"46\" rx=\"10\" class=\"box\"/>\n  <text x=\"170\" y=\"114\" text-anchor=\"middle\" class=\"t-b\" font-size=\"13\">Siul2_Port_Ip_Init(…)<\/text>\n  <text x=\"170\" y=\"131\" text-anchor=\"middle\" class=\"t-s\">핀 (SDA/SCL mux, open-drain)<\/text>\n  <rect x=\"10\" y=\"154\" width=\"320\" height=\"46\" rx=\"10\" class=\"box-a\"/>\n  <text x=\"170\" y=\"174\" text-anchor=\"middle\" class=\"t-b\" font-size=\"13\">Lpi2c_Ip_MasterInit(1U, &amp;cfg)<\/text>\n  <text x=\"170\" y=\"191\" text-anchor=\"middle\" class=\"t-s\">물리 instance 1U = LPI2C1<\/text>\n  <rect x=\"10\" y=\"214\" width=\"320\" height=\"46\" rx=\"10\" class=\"box-a\"/>\n  <text x=\"170\" y=\"234\" text-anchor=\"middle\" class=\"t-b\" font-size=\"13\">Lpi2c_Ip_MasterSetSlaveAddr(1U, 0x27, FALSE)<\/text>\n  <text x=\"170\" y=\"251\" text-anchor=\"middle\" class=\"t-s\">Lcd1602_Init() 안에서 한 번 (FALSE = 7-bit)<\/text>\n  <rect x=\"10\" y=\"274\" width=\"320\" height=\"46\" rx=\"10\" class=\"box-a\"/>\n  <text x=\"170\" y=\"294\" text-anchor=\"middle\" class=\"t-b\" font-size=\"13\">Lpi2c_Ip_MasterSendDataBlocking()<\/text>\n  <text x=\"170\" y=\"311\" text-anchor=\"middle\" class=\"t-s\">(1U, &amp;tx, 1U, TRUE, 100U)<\/text>\n  <rect x=\"350\" y=\"34\" width=\"320\" height=\"46\" rx=\"10\" class=\"box\"/>\n  <text x=\"510\" y=\"54\" text-anchor=\"middle\" class=\"t-b\" font-size=\"13\">Mcu_Init · Mcu_InitClock · …<\/text>\n  <text x=\"510\" y=\"71\" text-anchor=\"middle\" class=\"t-s\">PLL 잠금 대기 · Mcu_SetMode(0U)<\/text>\n  <rect x=\"350\" y=\"94\" width=\"320\" height=\"46\" rx=\"10\" class=\"box\"/>\n  <text x=\"510\" y=\"114\" text-anchor=\"middle\" class=\"t-b\" font-size=\"13\">Port_Init(NULL_PTR)<\/text>\n  <text x=\"510\" y=\"131\" text-anchor=\"middle\" class=\"t-s\">핀<\/text>\n  <rect x=\"350\" y=\"154\" width=\"320\" height=\"46\" rx=\"10\" class=\"box-d\"/>\n  <text x=\"510\" y=\"174\" text-anchor=\"middle\" class=\"t-b\" font-size=\"13\">I2c_Init(NULL_PTR)<\/text>\n  <text x=\"510\" y=\"191\" text-anchor=\"middle\" class=\"t-s\">논리 channel 0U → LPI2C1<\/text>\n  <rect x=\"350\" y=\"214\" width=\"320\" height=\"46\" rx=\"10\" class=\"box-d\"/>\n  <text x=\"510\" y=\"234\" text-anchor=\"middle\" class=\"t-b\" font-size=\"13\">I2c_RequestType request<\/text>\n  <text x=\"510\" y=\"251\" text-anchor=\"middle\" class=\"t-s\">SlaveAddress = 0x27 · 요청마다 주소 전달<\/text>\n  <rect x=\"350\" y=\"274\" width=\"320\" height=\"46\" rx=\"10\" class=\"box-d\"/>\n  <text x=\"510\" y=\"294\" text-anchor=\"middle\" class=\"t-b\" font-size=\"13\">I2c_SyncTransmit(0U, &amp;request)<\/text>\n  <text x=\"510\" y=\"311\" text-anchor=\"middle\" class=\"t-s\">동기(blocking) 전송<\/text>\n  <line x1=\"170\" y1=\"81\" x2=\"170\" y2=\"92\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"170\" y1=\"141\" x2=\"170\" y2=\"152\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"170\" y1=\"201\" x2=\"170\" y2=\"212\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"170\" y1=\"261\" x2=\"170\" y2=\"272\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"510\" y1=\"81\" x2=\"510\" y2=\"92\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"510\" y1=\"141\" x2=\"510\" y2=\"152\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"510\" y1=\"201\" x2=\"510\" y2=\"212\" class=\"ln\" marker-end=\"url(#ah)\"/>\n  <line x1=\"510\" y1=\"261\" x2=\"510\" y2=\"272\" class=\"ln\" marker-end=\"url(#ah)\"/>\n<\/svg>\n```\n\n```c\nClock_Ip_Init(&Clock_Ip_aClockConfig[0]);\nSiul2_Port_Ip_Init(NUM_OF_CONFIGURED_PINS_PortContainer_0_BOARD_InitPeripherals,\n                   g_pin_mux_InitConfigArr_PortContainer_0_BOARD_InitPeripherals);\nLpi2c_Ip_MasterInit(1U, &I2c_Lpi2cMaster_HwChannel1_Channel0);\nI2c_Probe(0x27U);   /* 백라이트를 끈다: 0x00 → P3(BL)=0 */\nLcd1602_Init(0x27U);\nLcd1602_SetCursor(0U, 0U);\nLcd1602_Puts(\"Hello S32K3\");\nfor (;;)\n{\n    (void)snprintf(line, sizeof(line), \"Count: %04lu\", (unsigned long)count);\n    Lcd1602_SetCursor(1U, 0U);\n    Lcd1602_Puts(\"                \");   // 2행을 공백 16칸으로 지움\n    Lcd1602_SetCursor(1U, 0U);\n    Lcd1602_Puts(line);\n    count++;\n    Delay(4000000UL);                   // 약 1초 busy-wait\n}\n```\n- `char line[17]` = LCD 한 줄 **16글자 + `'\\0'`**. `%04lu`는 \"4자리, 빈자리는 0\" → 첫 반복 `Count: 0000`, 8번째 `Count: 0007`(11글자).\n- 2행을 공백으로 먼저 지우는 건 이전에 더 긴 문자열이 있었을 때 **뒤 글자가 남지 않게** 하려는 거예요.\n- `I2c_Probe(0x27U)`는 0x00을 써서 **백라이트를 꺼요**. `Lcd1602_Init()`부터는 `LCD_BACKLIGHT`가 OR돼 다시 켜져요. 스캐너를 쓸 땐 `I2c_Scan()`을 이 자리(`Lcd1602_Init()` **앞**)에 둬요.\n- 생성된 master config 이름이 예제와 다르면 `Lpi2c_Ip_PBcfg.h`의 **실제 심볼명**을 써요.\n\n| 구분 | IPL 방식 | MCAL 방식 |\n|---|---|---|\n| 초기화 | `Lpi2c_Ip_MasterInit()` | `I2c_Init(NULL_PTR)` |\n| 1바이트 쓰기 | `Lpi2c_Ip_MasterSendDataBlocking()` | `I2c_SyncTransmit()` |\n| 번호 기준 | LPI2C IP **인스턴스 번호** | Config Tools가 만든 **논리 채널 번호** |\n| LCD 채널 | **instance 1U** | **channel 0U** (LPI2C1에 매핑) |\n| 주소 | Init에서 한 번 설정 | **요청마다** 구조체로 |\n\n- IPL은 하드웨어를 직접 다뤄 **물리** 번호(LPI2C**1** → 1U), MCAL은 첫 번째(유일한) 채널이라 **논리** 0번이 LPI2C1에 매핑돼요 (1장 LPUART6 = MCAL 채널 0과 같은 개념).\n- MCAL로 바꾸면 클럭도 `Clock_Ip_Init` 대신 `Mcu_Init` 계열이 돼요. lcd1602 공개 API와 출력 루프는 **그대로**예요.\n- 두 방식은 **대체 관계** → 한 빌드에서 `Lpi2c_Ip_MasterInit()`과 `I2c_Init()`을 함께 부르지 않아요.\n- I2C 드라이버는 AUTOSAR 정식 표준이 아니라 **CDD(Complex Device Driver)** 예요. 슬라이드 p50 그림의 `MCU_Init()`, `MCU_InitClock()` 대문자 표기는 **오타**이고, 실제 코드는 **`Mcu_Init()`, `Mcu_InitClock()`** 이에요.", "tip": "짝 바꾸기 함정: **IPL = 물리 instance 1U**, **MCAL = 논리 channel 0U**. count 7 → **`Count: 0007`**(11글자). `I2c_Probe(0x27U)`의 효과는 **백라이트 끄기**, I2C는 **CDD**라 AUTOSAR 정식 표준에 없어요."}, {"id": "c4-mcal", "title": "MCAL 설정과 요청 구조체", "sec": ["9. MCAL 설정과 코드 변화"], "tags": ["CDD_I2c.h", "I2c_RequestType", "RepeatedStart", "BitsSlaveAddressSize", "LCD_I2C_MCAL_CHANNEL", "E_OK", "Timeout Duration"], "body": "MCAL 버전은 Config Tools에 **CDD I2c(MCAL)** 드라이버를 추가하고, LPI2C1을 **master 논리 channel 0**(100 kHz)으로 만들어요. Pins는 IPL과 같고(open-drain), 외부 풀업이 있으니 **Pullup Enable은 켜지 않아요**. 생성 확인: `CDD_I2c.h`, `CDD_I2c_Cfg.h`, `CDD_I2c_PBcfg.h`.\n\n### 요청 구조체 한 장 = 전송 한 번\n```c\n#define LCD_I2C_MCAL_CHANNEL    (0U)   /* 물리 번호가 아니라 논리 번호 */\n\nStd_ReturnType I2cMcal_SyncWrite(uint8 slaveAddress, uint8 *data, uint16 length)\n{\n    I2c_RequestType request =\n    {\n        .SlaveAddress         = (I2c_AddressType)slaveAddress,\n        .BitsSlaveAddressSize = FALSE,   /* 7-bit */\n        .ExpectNack           = FALSE,   // ACK를 기대\n        .RepeatedStart        = FALSE,   /* STOP */\n        .BufferSize           = length,\n        .DataDirection        = I2C_SEND_DATA,\n        .DataBuffer           = data\n    };\n    return I2c_SyncTransmit(LCD_I2C_MCAL_CHANNEL, &request);\n}\n```\n\n| 의미 | IPL 표현 | MCAL 표현 |\n|---|---|---|\n| 대상 주소 | `MasterSetSlaveAddr(1U, addr, …)` (Init에서 한 번) | `.SlaveAddress` (요청마다) |\n| 7-bit 주소 | 세 번째 인수 `FALSE` | `.BitsSlaveAddressSize = FALSE` |\n| 끝에 STOP | `sendStop = TRUE` | `.RepeatedStart = FALSE` |\n| 채널 | instance `1U` | `LCD_I2C_MCAL_CHANNEL` = `0U` |\n| 성공 | `LPI2C_IP_SUCCESS_STATUS` | `E_OK` (실패 `E_NOT_OK`) |\n\n- **STOP 표현이 반대**예요: IPL은 \"STOP을 보낼래?\" → `TRUE`, MCAL은 \"Repeated START로 이어갈래?\" → `FALSE`. 결과는 둘 다 \"전송 끝에 STOP\".\n- `I2c_Lcd1602_Write()`는 `I2cMcal_SyncWrite(g_lcd_addr, &tx, 1U)` → 주소를 **요청마다** 전달해서 `g_lcd_addr`가 실제로 쓰여요. MCAL `Lcd1602_Init()`에는 `MasterSetSlaveAddr` 호출이 없고, Init의 Delay가 더 커요(500000U / 100000U).\n- MCAL `I2c_Probe()`는 `I2cMcal_SyncWrite(addr, &probe, 1U) == E_OK`로 ACK를 판단해요. `I2c_Scan()`은 Probe만 부르므로 그대로 두고 **Probe만 교체**해요.\n\n### PulseEnable — 니블당 write 3번\n```c\nstatic void Lcd1602_PulseEnable(uint8_t value)   // MCAL\n{\n    I2c_Lcd1602_Write(value);                     // E=0으로 데이터 먼저 세팅\n    I2c_Lcd1602_Write(value | LCD_E);\n    Lcd1602_Delay(2000U);\n    I2c_Lcd1602_Write(value & (uint8_t)(~LCD_E));\n    Lcd1602_Delay(2000U);\n}\n```\n| 니블 ('A' 0x41) | IPL (4번) | MCAL (6번) |\n|---|---|---|\n| 상위 | 0x4D, 0x49 | 0x49, 0x4D, 0x49 |\n| 하위 | 0x1D, 0x19 | 0x19, 0x1D, 0x19 |\n\nLCD가 값을 가져가는 순간은 어느 쪽이든 **E가 1→0으로 떨어질 때**라 화면 결과는 같고, MCAL 쪽이 I2C 트래픽만 더 많아요. 교재 p76은 \"그대로 재사용\"이라 적지만, 횟수를 묻는다면 **슬라이드 기준(IPL 4번 / MCAL 6번)** 으로 답해요.\n\n### Config Tools에서 꼭 볼 것\n- **I2c Channel ID = 0** ↔ C 코드 `LCD_I2C_MCAL_CHANNEL (0U)`, hardware channel = LPI2C_1.\n- **Timeout Duration**: 기본값 1은 너무 짧아 **10000**으로.\n- **Disable Production Error Reporting**을 체크하지 않으면 **컴파일 오류**.\n- Mcu: VARIANT-PRE-COMPILE(→ `Mcu_Init(NULL_PTR)`), McuPeripheral LPI2C_1 Peripheral Clock Enable, LPI2C1_CLK = ALPS_SLOW_CLK.\n- 전환 시 IPL `Lpi2c_Ip_MasterInit()`과 IPL 기반 `I2c_Probe()`는 **제거**해요.\n- 슬라이드 표기 주의: p54 \"SDA와 **SDL**\"은 SCL의 오타, p58 `LPIC2_MASTER_PRESC_DIV_16`은 슬라이드 표기 그대로(실제 이름은 드롭다운으로 확인), p76 \"`I2cMcal_Init()` 호출 전 Scan/LCD Init 금지\"는 실제 코드상 **`I2c_Init(NULL_PTR)`** — 핵심은 \"I2C 초기화가 먼저\".", "tip": "빈칸 단골: `.RepeatedStart = FALSE`(끝에 STOP), `.BitsSlaveAddressSize = FALSE`(7-bit) — IPL `sendStop`은 **TRUE**. MCAL 'A' = write **6번**(첫 바이트 E=0인 0x49). `I2c_SyncTransmit()`이 계속 **E_NOT_OK**면 논리 채널 번호·I2c_Init 순서·Timeout 1을 의심해요."}, {"id": "c4-debug", "title": "실행 확인과 문제 해결", "sec": ["10. 실행 확인·문제 해결"], "tags": ["스캐너", "contrast", "핀 매핑", "레벨시프터", "백팩 주소 0x3F", "E_NOT_OK"], "body": "### 성공 기준\n- 1행에 **Hello S32K3**, 2행에 **카운터가 주기적으로 갱신**.\n- 글자가 깨지거나 한 줄이 밀리지 않음.\n- SDA/SCL **idle 전압**이 보드 I/O 전압 범위 안.\n\n### 증상 → 원인 → 조치\n| 증상 | 의심할 층 | 먼저 확인할 것 |\n|---|---|---|\n| 스캐너가 아무것도 못 찾음 | 전기·배선 | SDA/SCL 핀 설정, **GND 공통**, 풀업·idle 전압 |\n| 0x27은 안 되고 0x3F는 됨 | 주소 | 고장이 아니라 **백팩 주소 차이** → 스캐너 결과를 `Lcd1602_Init()` 주소에 |\n| 백라이트만 켜지고 글자 없음 | LCD 초기화 | **contrast 가변저항**, 4-bit 초기화 순서 |\n| 글자가 깨짐 | 핀 매핑 | PCF8574-LCD 매핑 차이 → `LCD_RS`, `LCD_E`, 데이터 비트 위치 |\n| 통신 중 보드 불안정 | 전압 레벨 | 5 V 풀업 직접 연결 → **레벨시프터** 또는 3.3 V 풀업 |\n| `CDD_I2c.h` 못 찾음 (MCAL) | 빌드 | CDD I2c 설정·생성 누락 → 추가 후 재생성, include 경로 |\n| `I2c_SyncTransmit()`이 계속 `E_NOT_OK` | MCAL 설정 | 논리 channel 번호 불일치·초기화 순서 → 매크로 반영, Init이 먼저인지 |\n\n### 아래층부터 좁혀 가기\nLCD 출력은 \"**전기 → 버스 → 주소 → LCD 초기화 → 핀 매핑**\" 순으로 쌓여 있어서, 아래층이 안 되면 위층 증상은 볼 수조차 없어요.\n1. 스캐너가 `I2C device found at 0x27`을 찍으면 → 배선·풀업·주소는 통과.\n2. 백라이트가 켜지면 → PCF8574까지 바이트가 가고 있다는 뜻(BL 비트 0x08이 P3에 출력).\n3. 그래도 글자가 없으면 → 이제 LCD 쪽: 초기화 순서와 contrast를 봐요.\n\n스캐너(버스·주소)와 `I2c_Probe()`(1바이트 쓰기)는 각 층을 따로 시험하는 도구예요. 그래서 4장 정리 문장이 \"**좋은 드라이버 = 주소 설정 → I2C write → enable 펄스 → 니블 전송 → LCD 명령 시퀀스 층을 숨기되, 문제가 생기면 각 층을 따로 확인할 수 있게** 작성한 것\"이에요.\n\n### 보고서 (reports/chap04_i2c_lcd_check.md)\n- 결과: I2C scan 성공 · LCD 초기화 성공 · 1행 문자열 표시 · 2행 카운터 갱신 · 깨진 글자 여부.\n- 함께 기록: 이름/학번 · 사용한 SDA/SCL 핀 · I2C 경로(IPL 또는 MCAL) · scanner로 찾은 LCD 주소 · SDA/SCL idle
